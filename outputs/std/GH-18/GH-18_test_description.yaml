  - scenario_id: "002a"
    test_id: "TS-GH-18-002a"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-18"
    requirement_ref: 2

    test_objective:
      title: "Verify input pipeline normalizes then scans"
      what: |
        Tests that InputPipeline chains scanners in the correct order:
        UnicodeNormalizer first, then ContextInjectionScanner. This
        ordering ensures that invisible characters are stripped before
        injection pattern matching occurs.
      why: |
        Scanner ordering is security-critical. If injection scanning
        occurs before normalization, attackers can use invisible Unicode
        characters to bypass injection detection.
      acceptance_criteria:
        - "InputPipeline returns a Pipeline with 2 scanners"
        - "First scanner is UnicodeNormalizer"
        - "Second scanner is ContextInjectionScanner"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      target_file: "internal/security/scanner.go"
      target_function: "InputPipeline"

    specific_preconditions: []

    test_steps:
      setup:
