          action: "Create input pipeline"
          command: "pipeline := security.InputPipeline()"
          validation: "Pipeline created"
      test_execution:
        - step_id: "TEST-01"
          action: "Verify pipeline has 2 scanners"
          command: "Assert len(pipeline.Scanners) == 2"
          validation: "Pipeline has exactly 2 scanners"
        - step_id: "TEST-02"
          action: "Verify first scanner is UnicodeNormalizer"
          command: "Assert type of pipeline.Scanners[0] is *UnicodeNormalizer"
          validation: "First scanner is normalizer"
        - step_id: "TEST-03"
          action: "Verify second scanner is ContextInjectionScanner"
          command: "Assert type of pipeline.Scanners[1] is *ContextInjectionScanner"
          validation: "Second scanner is injection detector"
      cleanup: []

    assertions:
