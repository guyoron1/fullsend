    test_objective:
      title: "Verify invisible Unicode stripped before injection scan"
      what: |
        Tests that the input pipeline correctly strips invisible Unicode
        characters (zero-width spaces, direction overrides, etc.) before
        the injection scanner processes the text.
      why: |
        Invisible Unicode is a known injection evasion technique. Attackers
        embed zero-width characters within injection patterns to bypass
        regex-based detection.
      acceptance_criteria:
        - "Input with invisible Unicode characters is normalized"
        - "Injection patterns hidden by Unicode are detected after normalization"

    classification:
      test_type: "Functional"
