---
# Software Test Description (STD) — GH-57
# Generated: 2026-06-21
# Single comprehensive file for ALL scenarios

document_metadata:
  std_version: "2.1-enhanced"
  generated_date: "2026-06-21"
  jira_issue: "GH-57"
  jira_summary: "Review latent.space Article on Code Reviews Being Dead"
  source_bugs: []
  stp_reference:
    file: "outputs/stp/GH-57/GH-57_test_plan.md"
    version: "v1"
    sections_covered: "Section III - Requirements-to-Tests Mapping"
  related_prs: []
  total_scenarios: 5
  tier_1_count: 5
  tier_2_count: 0
  p0_count: 0
  p1_count: 0
  p2_count: 5

code_generation_config:
  std_version: "2.1-enhanced"
  framework: "testing"
  assertion_library: "testify"
  language: "go"
  package_name: "tests"
  context_init: "context.Background()"
  imports:
    standard:
      - "context"
      - "testing"
      - "os"
      - "strings"
      - "path/filepath"
    test_framework:
      - path: "github.com/stretchr/testify/assert"
      - path: "github.com/stretchr/testify/require"
    project:
      - "github.com/fullsend-ai/fullsend/internal/config"
  timeout_constants:
    default: "30s"
    setup: "60s"
  helper_library_imports: []

common_preconditions:
  infrastructure:
    - name: "GitHub Actions environment"
      requirement: "Standard GitHub Actions runner"
      validation: "gh --version"
    - name: "FullSend CLI"
      requirement: "fullsend CLI available in PATH"
      validation: "fullsend --version"
    - name: "Go toolchain"
      requirement: "Go 1.23+"
      validation: "go version"

  operators: []

  cluster_configuration:
    topology: "None"
    cpu_features: "Standard"
    storage: "N/A"
    network: "Standard internet access"

  rbac_requirements: []

  research_deliverables:
    - name: "Research summary document"
      requirement: "Markdown document with structured findings from latent.space article"
      validation: "Document exists and contains 3+ applicable insights"
    - name: "Follow-up GitHub issues"
      requirement: "Issues filed for each actionable recommendation"
      validation: "gh issue list --label research-followup"

scenarios:
  - scenario_id: "001"
    test_id: "TS-GH-57-001"
    tier: "Tier 1"
    priority: "P2"
    mvp: false
    requirement_id: "GH-57"

    patterns:
      primary: "documentation-validation"
      secondary:
        - "file-existence-check"
        - "content-structure-validation"
      helpers_required:
        - name: "file_helpers"
          functions: ["FileExists", "ReadFileContent", "CountMatches"]
          purpose: "Validate research output file existence and content structure"
      decorators:
        - "tier1"

    variables:
      closure_scope:
        - name: "researchDocPath"
          type: "string"
          initialized_in: "TestSetup"
          used_in: ["TestSetup", "TestExecution"]
          comment: "Path to the research summary document"
        - name: "docContent"
          type: "string"
          initialized_in: "TestExecution"
          used_in: ["TestExecution"]
          comment: "Content of the research summary document"
        - name: "insightCount"
          type: "int"
          initialized_in: "TestExecution"
          used_in: ["TestExecution"]
          comment: "Number of applicable insights found in document"

    test_structure:
      type: "single"
      describe:
        description: "GH-57 Research Output Validation"
        decorators: []
      context:
        description: "Research summary document produced with applicable insights"
        decorators: []
      it:
        description: "should contain a research summary with 3+ applicable insights"
        test_id_format: "[test_id:TS-GH-57-001]"

    code_structure: |
      func TestResearchSummaryProducedWithInsights(t *testing.T) {
        // Setup: locate research summary document
        // Test: verify document exists and contains 3+ applicable insights
        // Validate: each insight is substantive and references the article
      }

    test_objective:
      title: "Verify research summary document is produced with applicable insights"
      what: |
        Validates that the research task produces a summary document containing
        applicable insights extracted from the latent.space "Are Code Reviews Dead?"
        article. The document must contain at least 3 distinct insights that are
        relevant to FullSend's code review automation capabilities.
      why: |
        The primary deliverable of GH-57 is a research summary. Without validating
        that insights are captured in a structured format, the research task has
        no measurable outcome. This ensures the research effort produces tangible,
        reusable knowledge for the team.
      acceptance_criteria:
        - "Research summary document exists at the expected output path"
        - "Document contains at least 3 distinct applicable insights"
        - "Each insight is clearly articulated with a title and description"
        - "Insights reference specific concepts from the latent.space article"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with file validation"

    specific_preconditions:
      - name: "Research task completed"
        requirement: "GH-57 research task has been performed and output document created"
        validation: "Research summary document exists at expected path"

    test_data:
      resource_definitions:
        - name: "research_summary"
          type: "Markdown document"
          yaml: |
            # Research Summary: Are Code Reviews Dead?
            ## Source: latent.space article
            ## Applicable Insights:
            1. [Insight title]
               - Description: ...
               - Applicability to FullSend: ...

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Identify research output document path"
          command: "Locate research summary markdown file in expected output directory"
          validation: "File path is resolved and accessible"

      test_execution:
        - step_id: "TEST-01"
          action: "Verify research summary document exists"
          command: "require.FileExists(t, researchDocPath); stat, _ := os.Stat(researchDocPath); require.Greater(t, stat.Size(), int64(0))"
          validation: "File exists and is non-empty"

        - step_id: "TEST-02"
          action: "Parse document for applicable insights"
          command: "docContent = ReadFileContent(researchDocPath); insightCount = CountMatches(docContent, `(?m)^##\\s+Insight|^\\d+\\.\\s+\\[`)"
          validation: "assert.GreaterOrEqual(t, insightCount, 3)"

        - step_id: "TEST-03"
          action: "Verify insights reference the source article"
          command: "assert.Contains(t, docContent, \"latent.space\") or assert.Contains(t, docContent, \"Are Code Reviews Dead\")"
          validation: "Each insight traces back to article content"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "Research summary document exists"
        condition: "File exists at expected output path and is non-empty"
        failure_impact: "Research task produced no output — deliverable missing"

      - assertion_id: "ASSERT-02"
        priority: "P2"
        description: "Document contains minimum required insights"
        condition: "At least 3 distinct applicable insights are present"
        failure_impact: "Research output lacks sufficient depth for actionable follow-up"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "gh CLI"
      scenario_specific_rbac: []

  - scenario_id: "002"
    test_id: "TS-GH-57-002"
    tier: "Tier 1"
    priority: "P2"
    mvp: false
    requirement_id: "GH-57"

    patterns:
      primary: "content-reference-validation"
      secondary:
        - "content-structure-validation"
        - "keyword-matching"
      helpers_required:
        - name: "content_helpers"
          functions: ["ContainsComponentReference", "ExtractInsights"]
          purpose: "Validate insights reference specific FullSend components"
      decorators:
        - "tier1"

    variables:
      closure_scope:
        - name: "docContent"
          type: "string"
          initialized_in: "TestSetup"
          used_in: ["TestSetup", "TestExecution"]
          comment: "Content of the research summary document"
        - name: "componentRefs"
          type: "[]string"
          initialized_in: "TestExecution"
          used_in: ["TestExecution"]
          comment: "FullSend components referenced in insights"

    test_structure:
      type: "single"
      describe:
        description: "GH-57 Research Output Validation"
        decorators: []
      context:
        description: "Insights reference specific FullSend components"
        decorators: []
      it:
        description: "should reference specific FullSend components in each insight"
        test_id_format: "[test_id:TS-GH-57-002]"

    code_structure: |
      func TestInsightsReferenceFullSendComponents(t *testing.T) {
        // Setup: read research summary document
        // Test: verify insights reference specific FullSend components
        // Validate: component references are specific (harness, skills, dispatch, etc.)
      }

    test_objective:
      title: "Verify insights reference specific FullSend components where applicable"
      what: |
        Validates that each applicable insight in the research summary references
        specific FullSend components (harness, skills, dispatch, pr-review agent,
        code-review skill, scaffold, mint, forge) rather than making generic
        recommendations. This ensures insights are actionable within the FullSend
        architecture.
      why: |
        Generic insights without component-specific context are difficult to act on.
        By requiring references to specific FullSend components, the research output
        becomes directly mappable to engineering work items, improving the ROI of
        the research effort.
      acceptance_criteria:
        - "Each insight references at least one specific FullSend component"
        - "Component references use correct FullSend terminology (harness, skills, dispatch, scaffold, mint, forge, agent, sandbox)"
        - "The connection between the article insight and the FullSend component is explained"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with content validation"

    specific_preconditions:
      - name: "Research summary document exists"
        requirement: "TS-GH-57-001 passes — research summary document is available"
        validation: "Research summary document is readable"

    test_data:
      resource_definitions:
        - name: "known_components"
          type: "Reference list"
          yaml: |
            components:
              - harness
              - skills
              - dispatch
              - pr-review agent
              - code-review skill
              - scaffold
              - mint
              - forge
              - sandbox
              - agent
              - workflow
              - plugin

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Read research summary document"
          command: "Load research summary content for analysis"
          validation: "Document content loaded successfully"

        - step_id: "SETUP-02"
          action: "Define known FullSend components list"
          command: "Initialize reference list of valid FullSend component names"
          validation: "Component list initialized"

      test_execution:
        - step_id: "TEST-01"
          action: "Extract insights from document"
          command: "Parse document to identify individual insight sections"
          validation: "Insights parsed successfully"

        - step_id: "TEST-02"
          action: "Check each insight for FullSend component references"
          command: "For each insight, search for mentions of known FullSend components"
          validation: "Each insight references at least one known component"

        - step_id: "TEST-03"
          action: "Verify component references use correct terminology"
          command: "Match component mentions against official FullSend vocabulary"
          validation: "All component references use correct FullSend terms"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "Insights reference FullSend components"
        condition: "Each insight mentions at least one specific FullSend component from the known components list"
        failure_impact: "Insights are too generic to be actionable within FullSend architecture"

      - assertion_id: "ASSERT-02"
        priority: "P2"
        description: "Component references use correct terminology"
        condition: "Component names match FullSend's domain vocabulary (harness, skills, dispatch, etc.)"
        failure_impact: "Incorrect terminology may cause confusion when creating follow-up issues"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  - scenario_id: "003"
    test_id: "TS-GH-57-003"
    tier: "Tier 1"
    priority: "P2"
    mvp: false
    requirement_id: "GH-57"

    patterns:
      primary: "issue-tracking-validation"
      secondary:
        - "github-api-check"
        - "cross-reference-validation"
      helpers_required:
        - name: "github_helpers"
          functions: ["ListIssuesByLabel", "IssueReferencesParent"]
          purpose: "Validate follow-up GitHub issues are filed"
      decorators:
        - "tier1"

    variables:
      closure_scope:
        - name: "followUpIssues"
          type: "[]Issue"
          initialized_in: "TestExecution"
          used_in: ["TestExecution"]
          comment: "Follow-up issues filed for actionable recommendations"
        - name: "insightCount"
          type: "int"
          initialized_in: "TestSetup"
          used_in: ["TestExecution"]
          comment: "Number of actionable insights requiring follow-up issues"

    test_structure:
      type: "single"
      describe:
        description: "GH-57 Research Output Validation"
        decorators: []
      context:
        description: "Follow-up issues filed for actionable recommendations"
        decorators: []
      it:
        description: "should have follow-up GitHub issues for each actionable recommendation"
        test_id_format: "[test_id:TS-GH-57-003]"

    code_structure: |
      func TestFollowUpIssuesFiledForRecommendations(t *testing.T) {
        // Setup: count actionable recommendations from research summary
        // Test: verify GitHub issues filed for each recommendation
        // Validate: each issue references GH-57 and describes the recommendation
      }

    test_objective:
      title: "Verify follow-up issues are filed for actionable recommendations"
      what: |
        Validates that for each actionable recommendation identified in the
        research summary, a corresponding GitHub issue has been filed in the
        FullSend repository. Each follow-up issue should reference GH-57 as the
        parent and clearly describe the recommended change.
      why: |
        Research without follow-through loses value. Filing GitHub issues for
        each actionable recommendation ensures the research insights are tracked
        in the project backlog and can be prioritized, assigned, and implemented.
        Without this step, the research deliverable becomes a static document
        with no engineering impact.
      acceptance_criteria:
        - "At least one follow-up GitHub issue exists for each actionable recommendation"
        - "Each follow-up issue references GH-57 as the originating research task"
        - "Each follow-up issue describes the specific recommended change"
        - "Follow-up issues are filed in the correct repository (fullsend-ai/fullsend)"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with gh CLI validation"

    specific_preconditions:
      - name: "Research summary with actionable recommendations"
        requirement: "TS-GH-57-001 and TS-GH-57-002 pass — research summary exists with component-specific insights"
        validation: "Research summary is available with identified recommendations"
      - name: "GitHub API access"
        requirement: "gh CLI authenticated with access to fullsend-ai/fullsend"
        validation: "gh auth status"

    test_data:
      resource_definitions: []
      api_endpoints:
        - operation: "list_issues"
          method: "GET"
          path: "/repos/fullsend-ai/fullsend/issues"
          expected_status: 200

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Read research summary to count actionable recommendations"
          command: "Parse research summary for recommendations requiring follow-up"
          validation: "Actionable recommendation count determined"

        - step_id: "SETUP-02"
          action: "Authenticate gh CLI"
          command: "gh auth status"
          validation: "gh CLI authenticated with repository access"

      test_execution:
        - step_id: "TEST-01"
          action: "List follow-up issues referencing GH-57"
          command: "out, err := exec.Command(\"gh\", \"issue\", \"list\", \"--repo\", \"fullsend-ai/fullsend\", \"--search\", \"GH-57\", \"--json\", \"number,title,body\").Output()"
          validation: "require.NoError(t, err); followUpIssues = parseIssueJSON(out)"

        - step_id: "TEST-02"
          action: "Verify issue count matches recommendation count"
          command: "assert.GreaterOrEqual(t, len(followUpIssues), insightCount)"
          validation: "At least one issue per actionable recommendation"

        - step_id: "TEST-03"
          action: "Verify each issue references GH-57"
          command: "for _, issue := range followUpIssues { assert.Contains(t, issue.Title+issue.Body, \"GH-57\") }"
          validation: "All follow-up issues trace back to GH-57"

        - step_id: "TEST-04"
          action: "Verify each issue describes a specific recommendation"
          command: "for _, issue := range followUpIssues { assert.Greater(t, len(issue.Body), 50) }"
          validation: "Issues are not empty stubs — each describes a concrete change"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "Follow-up issues exist for recommendations"
        condition: "Number of follow-up issues >= number of actionable recommendations"
        failure_impact: "Actionable insights are not tracked and may be lost"

      - assertion_id: "ASSERT-02"
        priority: "P2"
        description: "Follow-up issues reference parent task"
        condition: "Each follow-up issue references GH-57 in title or body"
        failure_impact: "Traceability between research and follow-up work is broken"

      - assertion_id: "ASSERT-03"
        priority: "P2"
        description: "Follow-up issues contain substantive descriptions"
        condition: "Each issue body is non-empty and describes a specific recommended change"
        failure_impact: "Issues without context cannot be prioritized or implemented effectively"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "gh CLI"
      scenario_specific_rbac: []

  - scenario_id: "004"
    test_id: "TS-GH-57-004"
    tier: "Tier 1"
    priority: "P2"
    mvp: false
    requirement_id: "GH-57"

    patterns:
      primary: "negative-content-validation"
      secondary:
        - "capability-deduplication-check"
        - "content-analysis"
      helpers_required:
        - name: "content_helpers"
          functions: ["ExtractRecommendations", "CheckDuplicateCapability"]
          purpose: "Validate recommendations don't duplicate existing FullSend capabilities"
      decorators:
        - "tier1"

    variables:
      closure_scope:
        - name: "recommendations"
          type: "[]string"
          initialized_in: "TestSetup"
          used_in: ["TestSetup", "TestExecution"]
          comment: "Recommendations extracted from research summary"
        - name: "existingCapabilities"
          type: "[]string"
          initialized_in: "TestSetup"
          used_in: ["TestExecution"]
          comment: "Known existing FullSend capabilities for dedup check"

    test_structure:
      type: "single"
      describe:
        description: "GH-57 Research Output Validation"
        decorators: []
      context:
        description: "[NEGATIVE] Research output does not duplicate existing capabilities"
        decorators: []
      it:
        description: "should not recommend capabilities that already exist in FullSend"
        test_id_format: "[test_id:TS-GH-57-004]"

    code_structure: |
      func TestResearchOutputNoExistingCapabilityDuplication(t *testing.T) {
        // Setup: load existing FullSend capabilities and research recommendations
        // Test: verify no recommendation duplicates an existing capability
        // Validate: each recommendation addresses a gap, not an existing feature
      }

    test_objective:
      title: "Verify research output does not include recommendations that duplicate existing FullSend capabilities"
      what: |
        Validates that the research recommendations do not suggest implementing
        capabilities that FullSend already provides. This negative test ensures
        the researcher has sufficient familiarity with FullSend's existing feature
        set (pr-review agent, code-review skill, harness, dispatch) to avoid
        redundant recommendations.
      why: |
        Recommendations that duplicate existing capabilities waste engineering
        time on evaluation and triage. They also indicate insufficient understanding
        of the current system, which undermines confidence in the research quality.
        This negative test provides a quality gate for the research deliverable.
      acceptance_criteria:
        - "No recommendation proposes a feature that FullSend already implements"
        - "Recommendations that touch existing features propose enhancements, not re-implementations"
        - "Each recommendation acknowledges related existing FullSend functionality where applicable"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with content analysis"

    specific_preconditions:
      - name: "Research summary with recommendations"
        requirement: "TS-GH-57-001 passes — research summary document available"
        validation: "Research summary is readable"
      - name: "Existing capabilities inventory"
        requirement: "List of current FullSend capabilities is available for comparison"
        validation: "Capabilities list can be derived from AGENTS.md or project documentation"

    test_data:
      resource_definitions:
        - name: "existing_capabilities"
          type: "Reference list"
          yaml: |
            capabilities:
              - name: "pr-review agent"
                description: "Automated PR review orchestration with sub-agent dispatch"
              - name: "code-review skill"
                description: "Standalone code review procedure across six dimensions"
              - name: "agent dispatch"
                description: "Agent lifecycle management via GitHub Actions"
              - name: "harness configuration"
                description: "Claude Code harness with skills, hooks, and AGENTS.md"
              - name: "scaffold"
                description: "Repository scaffolding and agent enrollment"
              - name: "mint"
                description: "Token management for GitHub org/repo authentication"
              - name: "forge"
                description: "Sandbox image building and caching"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Read research summary document"
          command: "Load research summary and extract recommendations section"
          validation: "Recommendations extracted from document"

        - step_id: "SETUP-02"
          action: "Load existing FullSend capabilities inventory"
          command: "Read AGENTS.md and project documentation to build capabilities list"
          validation: "Capabilities inventory initialized"

      test_execution:
        - step_id: "TEST-01"
          action: "Extract individual recommendations from research summary"
          command: "Parse recommendations section into individual recommendation items"
          validation: "Recommendations parsed into discrete items"

        - step_id: "TEST-02"
          action: "Compare each recommendation against existing capabilities"
          command: "For each recommendation, check if it proposes a feature that already exists"
          validation: "No recommendation fully duplicates an existing capability"

        - step_id: "TEST-03"
          action: "Verify enhancement recommendations acknowledge existing features"
          command: "For recommendations that touch existing features, verify they propose enhancements rather than re-implementations"
          validation: "Enhancement recommendations reference the existing feature being improved"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "[NEGATIVE] No duplicate capability recommendations"
        condition: "No recommendation proposes implementing a feature that FullSend already provides"
        failure_impact: "Research quality is questionable — researcher may lack familiarity with existing system"

      - assertion_id: "ASSERT-02"
        priority: "P2"
        description: "Enhancement recommendations acknowledge existing features"
        condition: "Recommendations touching existing capabilities explicitly note the existing feature and describe the enhancement"
        failure_impact: "Unclear whether recommendation is for a new feature or an enhancement to existing functionality"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  - scenario_id: "005"
    test_id: "TS-GH-57-005"
    tier: "Tier 1"
    priority: "P2"
    mvp: false
    requirement_id: "GH-57"

    patterns:
      primary: "boundary-validation"
      secondary:
        - "threshold-check"
        - "negative-content-validation"
      helpers_required:
        - name: "file_helpers"
          functions: ["ReadFileContent", "CountMatches"]
          purpose: "Validate boundary condition when fewer than 3 insights are present"
      decorators:
        - "tier1"

    variables:
      closure_scope:
        - name: "researchDocPath"
          type: "string"
          initialized_in: "TestSetup"
          used_in: ["TestSetup", "TestExecution"]
          comment: "Path to the research summary document"
        - name: "docContent"
          type: "string"
          initialized_in: "TestExecution"
          used_in: ["TestExecution"]
          comment: "Content of the research summary document"
        - name: "insightCount"
          type: "int"
          initialized_in: "TestExecution"
          used_in: ["TestExecution"]
          comment: "Number of applicable insights found in document"

    test_structure:
      type: "single"
      describe:
        description: "GH-57 Research Output Validation"
        decorators: []
      context:
        description: "[NEGATIVE] Research summary with fewer than 3 insights fails quality gate"
        decorators: []
      it:
        description: "should reject a research summary that contains fewer than 3 applicable insights"
        test_id_format: "[test_id:TS-GH-57-005]"

    code_structure: |
      func TestResearchSummaryRejectsInsufficientInsights(t *testing.T) {
        // Setup: create a minimal research document with only 1-2 insights
        // Test: run the insight count validation against the threshold
        // Validate: validation correctly rejects documents below the 3-insight minimum
      }

    test_objective:
      title: "Verify research summary quality gate rejects documents with fewer than 3 insights"
      what: |
        Tests the boundary condition of the 3-insight minimum threshold defined
        in the acceptance criteria. A research summary containing fewer than 3
        applicable insights should be flagged as insufficient, ensuring the
        quality gate is effective at preventing low-effort research outputs.
      why: |
        Without testing the boundary condition, the insight count threshold
        in TS-GH-57-001 could silently accept documents with 0, 1, or 2 insights
        due to implementation errors. This negative test verifies the threshold
        logic works correctly at the boundary.
      acceptance_criteria:
        - "A document with 0 insights is rejected by the quality gate"
        - "A document with 1 or 2 insights is rejected by the quality gate"
        - "The rejection message clearly states the minimum threshold of 3"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with boundary condition validation"

    specific_preconditions:
      - name: "Quality gate function available"
        requirement: "Insight count validation logic is testable in isolation"
        validation: "CountMatches helper function is available"

    test_data:
      resource_definitions:
        - name: "insufficient_doc"
          type: "Markdown document (test fixture)"
          yaml: |
            # Research Summary: Are Code Reviews Dead?
            ## Source: latent.space article
            ## Applicable Insights:
            1. Single insight only
               - Description: One finding from the article
               - Applicability to FullSend: Limited

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create test fixture with fewer than 3 insights"
          command: "insufficientDoc := createTempDoc(t, 2) // fixture with only 2 insight sections"
          validation: "Test fixture created with known insight count < 3"

      test_execution:
        - step_id: "TEST-01"
          action: "Count insights in insufficient document"
          command: "insightCount = CountMatches(docContent, insightPattern)"
          validation: "assert.Less(t, insightCount, 3)"

        - step_id: "TEST-02"
