  - scenario_id: "004"
    test_id: "TS-GH-15-004"
    tier: "Unit Tests"
    priority: "P0"
    mvp: true
    requirement_id: "GH-15"
    requirement_summary: "Provider recreation uses current credentials, not stale ones"

    test_objective:
      title: "Verify recreated provider uses current credentials and environment"
      what: |
        This test validates that when a provider is deleted and recreated, the
        recreate call uses the current credentials passed to EnsureProvider,
        not stale credentials from the original provider. This ensures
        environment variables are re-expanded on recreate.
      why: |
        Using stale credentials after recreate would leave the provider in a
        broken state, defeating the purpose of idempotent recreation. Fresh
        credentials ensure the provider works with current auth tokens.
      acceptance_criteria:
        - "Retry create command receives the current credential values"
        - "Environment variables in credentials are freshly expanded"
        - "Provider arguments match those from the original create call"

    variables:
      closure_scope:
        - name: "tmpDir"
          type: "string"
          initialized_in: "TestSetup"
          used_in: ["TestSetup"]
