scenarios:
  # ============================================================
  # IDEMPOTENT PROVIDER CREATION — AlreadyExists Path (P0)
  # ============================================================

  - scenario_id: "001"
    test_id: "TS-GH-15-001"
    tier: "Unit Tests"
    priority: "P0"
    mvp: true
    requirement_id: "GH-15"
    requirement_summary: "Provider creation is idempotent across repeated agent runs"

    test_objective:
      title: "Verify provider recreated when AlreadyExists returned"
      what: |
        This test validates that when EnsureProvider encounters an AlreadyExists
        error from the openshell provider create command, it automatically deletes
        the existing provider and recreates it. The test uses a fake openshell
        binary that returns AlreadyExists on first create, succeeds on delete,
        and succeeds on retry create.
      why: |
        Idempotent provider creation is critical for autonomous agent iteration.
        Without this, a pre-existing provider from a prior run causes a hard
        failure, requiring manual cleanup between agent invocations.
      acceptance_criteria:
        - "EnsureProvider returns nil error when provider already exists"
        - "openshell provider delete is called with the correct provider name"
        - "openshell provider create is retried after successful delete"

    variables:
      closure_scope:
        - name: "tmpDir"
          type: "string"
          initialized_in: "TestSetup"
          used_in: ["TestSetup", "TestExecution"]
          comment: "Temporary directory for fake openshell binary"
        - name: "fakeOpenshell"
          type: "string"
          initialized_in: "TestSetup"
          used_in: ["TestSetup"]
          comment: "Path to fake openshell script"
        - name: "err"
          type: "error"
          initialized_in: "TestExecution"
          used_in: ["TestExecution", "Assertion"]
          comment: "Error from EnsureProvider call"

    test_structure:
      type: "single"
      function_name: "TestEnsureProvider_AlreadyExists_RecreatesProvider"
      subtests: []

    patterns:
      primary: "cli-idempotency"
      helpers_required:
        - "writeScript"
        - "testify-assert"
    code_structure:
      type: "flat"
      framework_hint: "TestFunction"
      subtest_style: "none"
    test_data:
      resources:
        - name: "provider"
          type: "ProviderDefinition"
          description: "Provider definition struct with name, type, and config fields"
        - name: "credentials"
          type: "Credentials"
          description: "Credentials struct containing auth token and optional password"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create temporary directory for fake openshell binary"
          code_template: |
            tmpDir = t.TempDir()
        - step_id: "SETUP-02"
          action: "Write fake openshell script that returns AlreadyExists on first create, succeeds on delete and retry"
          code_template: |
            fakeOpenshell = filepath.Join(tmpDir, "openshell")
            // Script: first 'provider create' returns "AlreadyExists",
            // 'provider delete' succeeds, second 'provider create' succeeds
            writeScript(t, fakeOpenshell, alreadyExistsScript)
        - step_id: "SETUP-03"
          action: "Prepend tmpDir to PATH so fake openshell is found"
          code_template: |
            t.Setenv("PATH", tmpDir + ":" + os.Getenv("PATH"))

      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureProvider with a provider definition and credentials"
          code_template: |
            err = EnsureProvider(provider, credentials)

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Temporary directory cleaned up by t.TempDir()"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "EnsureProvider succeeds (no error returned)"
        condition: "err == nil"
        failure_impact: "Idempotent provider creation is broken; agent runs will fail on pre-existing providers"
        code_template: |
          require.NoError(t, err)

  - scenario_id: "002"
    test_id: "TS-GH-15-002"
    tier: "Unit Tests"
    priority: "P0"
    mvp: true
    requirement_id: "GH-15"
    requirement_summary: "Provider creation is idempotent across repeated agent runs"

    test_objective:
