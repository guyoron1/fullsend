          action: "Create fake openshell that captures args on retry create and returns success"
          code_template: |
            tmpDir = t.TempDir()
            writeScript(t, filepath.Join(tmpDir, "openshell"), captureArgsScript)
            t.Setenv("PATH", tmpDir + ":" + os.Getenv("PATH"))

      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureProvider with specific credentials"
          code_template: |
            err = EnsureProvider(provider, freshCredentials)

      cleanup:
