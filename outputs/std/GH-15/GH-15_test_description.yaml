    - name: "writeScript"
      signature: "writeScript(t *testing.T, path string, content string)"
      description: "Writes a shell script to the given path with executable permissions (0755)"
      code_template: |
        func writeScript(t *testing.T, path string, content string) {
            t.Helper()
            err := os.WriteFile(path, []byte(content), 0755)
            require.NoError(t, err)
        }
    - name: "alreadyExistsScript"
      type: "const"
      description: "Fake openshell script: returns AlreadyExists on first 'provider create', succeeds on 'provider delete' and retry 'provider create'"
      code_template: |
        const alreadyExistsScript = `#!/bin/bash
        STATE_FILE="/tmp/openshell_state_$$"
        if [[ "$1" == "provider" && "$2" == "create" ]]; then
            if [ ! -f "$STATE_FILE" ]; then
                touch "$STATE_FILE"; echo "AlreadyExists" >&2; exit 1
            fi; exit 0
        elif [[ "$1" == "provider" && "$2" == "delete" ]]; then
            exit 0
        fi`
    - name: "deleteFailsScript"
      type: "const"
      description: "Fake openshell script: returns AlreadyExists on create, fails on delete"
      code_template: |
        const deleteFailsScript = `#!/bin/bash
        if [[ "$1" == "provider" && "$2" == "create" ]]; then
            echo "AlreadyExists" >&2; exit 1
        elif [[ "$1" == "provider" && "$2" == "delete" ]]; then
            echo "delete failed: internal error" >&2; exit 1
        fi`
    - name: "retryCreateFailsScript"
      type: "const"
      description: "Fake openshell script: AlreadyExists on create, delete succeeds, retry create fails"
      code_template: |
        const retryCreateFailsScript = `#!/bin/bash
        STATE_FILE="/tmp/openshell_state_$$"
        if [[ "$1" == "provider" && "$2" == "create" ]]; then
            if [ ! -f "$STATE_FILE" ]; then
                touch "$STATE_FILE"; echo "AlreadyExists" >&2; exit 1
            fi; echo "retry create failed" >&2; exit 1
        elif [[ "$1" == "provider" && "$2" == "delete" ]]; then
            exit 0
        fi`
    - name: "captureArgsScript"
      type: "const"
      description: "Fake openshell script: AlreadyExists on first create, captures args on retry create"
      code_template: |
        const captureArgsScript = `#!/bin/bash
        STATE_FILE="/tmp/openshell_state_$$"
        ARGS_FILE="/tmp/openshell_args_$$"
        if [[ "$1" == "provider" && "$2" == "create" ]]; then
            if [ ! -f "$STATE_FILE" ]; then
                touch "$STATE_FILE"; echo "AlreadyExists" >&2; exit 1
            fi; echo "$@" > "$ARGS_FILE"; exit 0
        elif [[ "$1" == "provider" && "$2" == "delete" ]]; then
            exit 0
        fi`
    - name: "genericErrorScript"
      type: "const"
      description: "Fake openshell script: fails with a generic error (not AlreadyExists)"
      code_template: |
        const genericErrorScript = `#!/bin/bash
        if [[ "$1" == "provider" && "$2" == "create" ]]; then
            echo "connection refused" >&2; exit 1
        fi`
    - name: "specificErrorScript"
      type: "const"
      description: "Fake openshell script: fails with a specific known error message"
      code_template: |
        const specificErrorScript = `#!/bin/bash
        if [[ "$1" == "provider" && "$2" == "create" ]]; then
            echo "specific error from openshell" >&2; exit 1
        fi`
    - name: "deleteFailsWithSecretScript"
      type: "const"
      description: "Fake openshell script: AlreadyExists on create, delete fails echoing credentials"
    - name: "retryCreateFailsWithSecretScript"
      type: "const"
      description: "Fake openshell script: AlreadyExists, delete OK, retry fails echoing credentials"
    - name: "genericErrorWithSecretScript"
      type: "const"
      description: "Fake openshell script: generic error that echoes credentials in output"
