          action: "Temporary directory cleaned up by t.TempDir()"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "EnsureProvider returns an error"
        condition: "err != nil"
        failure_impact: "Delete failures silently ignored, leaving stale providers"
        code_template: |
          require.Error(t, err)
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Error message does not contain any credential values"
        condition: "error message does not contain raw secret values"
        failure_impact: "Credential leakage in error output"
        code_template: |
          assert.NotContains(t, err.Error(), secretValue)

