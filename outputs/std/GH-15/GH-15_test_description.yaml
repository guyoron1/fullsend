      what: |
        This test validates that when EnsureProvider detects AlreadyExists and
        attempts to delete the existing provider, but the delete command fails,
        the error is properly returned with redacted credentials.
      why: |
        Delete failures during the recreate path must surface clearly so
        operators can diagnose infrastructure issues without credential leakage.
      acceptance_criteria:
        - "EnsureProvider returns a non-nil error when delete fails"
        - "Error message indicates delete failure"
        - "No credential values appear in the error message"

