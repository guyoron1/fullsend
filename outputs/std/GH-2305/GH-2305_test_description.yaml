        requirement: "A repository where the app lacks issues:write permission"
        validation: "gh api repos/{owner}/{repo}/installation returns permissions without issues:write"
      - name: "Retro workflow enabled"
        requirement: "Retro workflow is configured and can be triggered"
        validation: "Workflow file exists in .github/workflows/"

    test_data:
      resource_definitions:
        - name: "target_repo"
          type: "GitHub repository"
          yaml: |
            owner: "konflux-ci"
            repo: "caching"
            pr_number: 816
            expected_permission_gap: "issues:write"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Identify target repo with restricted permissions"
          command: "gh api repos/konflux-ci/caching/installation"
          validation: "Installation exists without issues:write"

      test_execution:
        - step_id: "TEST-01"
          action: "Trigger retro workflow run on target repo"
          command: "gh workflow run retro.yml -R {repo} --field pr_number=816"
          validation: "Workflow run starts"
        - step_id: "TEST-02"
          action: "Wait for workflow run to complete"
          command: "gh run watch {run_id} --exit-status"
          validation: "Run completes within timeout"
        - step_id: "TEST-03"
          action: "Check workflow conclusion"
          command: "gh run view {run_id} --json conclusion"
          validation: "conclusion == 'success'"

      cleanup:
        - step_id: "CLEANUP-01"
          action: "No cleanup needed (workflow is idempotent)"
          command: "N/A"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Workflow run conclusion is 'success'"
        condition: "conclusion == 'success'"
        failure_impact: "Retro runs still failing on restricted-permission repos"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Retro agent completed successfully"
        condition: "Agent step exit code is 0"
        failure_impact: "Agent failure masking the fix"

