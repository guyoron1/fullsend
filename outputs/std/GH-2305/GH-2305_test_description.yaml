        - name: "stderr"
          type: "string"
          initialized_in: "test_execution"
          used_in: ["test_execution"]
          comment: "Captured stderr output from script"

    test_structure:
      type: "single"
      describe:
        description: "post-retro.sh non-fatal error handling"
      context:
        description: "when gh api returns HTTP 403 on comment posting"
      it:
        description: "should exit 0 and emit a warning annotation"
        test_id_format: "[test_id:TS-GH-2305-001]"

    test_objective:
      title: "Verify 403 error on comment posting exits 0 with warning"
      what: |
        Execute post-retro.sh with a mock gh binary that returns HTTP 403
        when posting a comment to the GitHub Issues API. Validate that the
        script exits with code 0 and emits a ::warning:: annotation instead
        of failing the workflow run.
      why: |
        When the GitHub App token lacks issues:write permission on the source
        repo, gh api returns 403. This should not cause the entire retro
        workflow to fail since the retro agent already succeeded and proposals
        were filed. Platform operators need accurate failure rates.
      acceptance_criteria:
        - "Script exits with code 0"
        - "Stderr contains ::warning:: annotation"
        - "Warning message indicates comment posting was skipped due to permissions"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with exec.Command running shell script"

    specific_preconditions:
      - name: "Mock gh binary"
        requirement: "Mock that returns HTTP 403 for repos/*/issues/*/comments endpoint"
        validation: "Mock binary is executable and on PATH"

    test_data:
      resource_definitions:
        - name: "mock_gh_403"
          type: "Shell script"
          yaml: |
            #!/bin/bash
            if [[ "$*" == *"issues"*"comments"* ]]; then
              echo "HTTP 403" >&2
              exit 1
            fi
            echo '{}'

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create temporary directory for test fixtures"
          command: "mktemp -d"
          validation: "Directory exists"
        - step_id: "SETUP-02"
          action: "Create mock gh binary that returns 403 on comment posting"
          command: "Write mock script to tmpDir/gh and chmod +x"
          validation: "Mock binary is executable"
        - step_id: "SETUP-03"
          action: "Create minimal retro result fixtures"
          command: "Create proposal JSON files in result directory"
          validation: "Result directory contains expected files"

      test_execution:
        - step_id: "TEST-01"
          action: "Execute post-retro.sh with mock gh on PATH"
          command: "PATH=tmpDir:$PATH bash post-retro.sh"
          validation: "Script completes without hanging"
        - step_id: "TEST-02"
          action: "Capture exit code and stderr"
          command: "Store $? and stderr output"
          validation: "Exit code and stderr are captured"

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary directory"
          command: "rm -rf tmpDir"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Script exits with code 0"
        condition: "exitCode == 0"
        failure_impact: "Workflow would fail despite successful retro agent execution"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Stderr contains ::warning:: annotation"
        condition: "strings.Contains(stderr, '::warning::')"
        failure_impact: "Operators would have no visibility into skipped comment"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "bash 4+"
        - "jq"
      scenario_specific_rbac: []

