      why: |
        This is the core production validation from GH-2305. Previous runs
        (26291574658, 26915715367) on konflux-ci/caching#816 failed due to
        403 on comment posting. After the fix, these should succeed.
      acceptance_criteria:
        - "Workflow run conclusion is 'success'"
        - "Retro agent exit code is 0"
