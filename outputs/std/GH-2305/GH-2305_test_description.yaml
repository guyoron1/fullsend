    test_id: "TS-GH-2305-001"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2305"

    variables:
      closure_scope:
        - name: "tmpDir"
          type: "string"
          initialized_in: "setup"
          used_in: ["setup", "test_execution", "cleanup"]
          comment: "Temporary directory for mock gh and test fixtures"
        - name: "exitCode"
