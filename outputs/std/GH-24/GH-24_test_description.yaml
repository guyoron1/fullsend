  requirement_id: GH-24
  test_objective:
    title: Verify isRetryable returns true for HTTP 500 (Internal Server Error)
    what: 'Tests that isRetryable correctly identifies HTTP 500 Internal Server Error

      as a retryable status code and returns (true, nil).

      '
    why: 'HTTP 500 is the most common server error. The retry logic must handle it

      to prevent transient failures from causing permanent operation failures.

      '
    acceptance_criteria:
    - isRetryable returns true when response status is 500
    - isRetryable returns nil error for 500 responses
  test_steps:
    setup:
    - step_id: SETUP-01
      action: Create HTTP response with status 500
      command: Construct *http.Response with StatusCode 500 and empty body
    test_execution:
    - step_id: TEST-01
      action: Call isRetryable with the 500 response
      command: retryable, err := isRetryable(resp)
      validation: retryable == true && err == nil
    cleanup: []
  assertions:
  - assertion_id: ASSERT-01
    priority: P0
    description: isRetryable returns true for 500
    condition: retryable == true
    failure_impact: 500 errors would not be retried, causing transient failures to propagate
  - assertion_id: ASSERT-02
    priority: P0
    description: No error returned
    condition: err == nil
    failure_impact: Error would prevent retry logic from executing
