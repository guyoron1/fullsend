          expected_retryable: false
        - code: 511
          name: "Network Authentication Required"
          expected_retryable: false

    test_steps:
      setup: []
      test_execution:
        - step_id: "TEST-01"
          action: "Call isRetryable with non-retryable status codes"
          command: "isRetryable(resp)"
          validation: "Returns false for each code"
          code_template: |
            resp := &http.Response{StatusCode: tc.statusCode}
            result = isRetryable(resp, nil)
            assert.False(t, result, "expected isRetryable to return false for %d", tc.statusCode)
      cleanup: []

    assertions:
