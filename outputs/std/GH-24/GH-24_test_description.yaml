- scenario_id: '6'
  test_id: TS-GH-24-006
  tier: Unit Tests
  priority: P0
  requirement_id: GH-24
  test_objective:
    title: Verify isRetryable drains response body on 5xx
    what: 'Tests that when isRetryable encounters a 5xx response, it properly drains

      the response body using io.Copy(io.Discard, resp.Body) before returning.

      This prevents connection leaks from undrained response bodies.

      '
    why: 'Undrained response bodies prevent HTTP connection reuse and can cause

      resource leaks. The retry logic must drain bodies before retrying.

      '
    acceptance_criteria:
    - Response body is fully read/drained after isRetryable returns for 5xx
    - Subsequent Read on body returns io.EOF
  test_steps:
    setup:
    - step_id: SETUP-01
      action: Create HTTP response with status 502 and non-empty body
      command: Construct *http.Response with body containing test data
    test_execution:
    - step_id: TEST-01
      action: Call isRetryable with the response
      command: retryable, err := isRetryable(resp)
      validation: retryable == true
    - step_id: TEST-02
      action: Attempt to read response body after isRetryable returns
      command: n, err := resp.Body.Read(buf)
      validation: n == 0 && err == io.EOF
    cleanup: []
  assertions:
  - assertion_id: ASSERT-01
    priority: P0
    description: Response body is drained
    condition: Reading body after isRetryable returns 0 bytes and io.EOF
    failure_impact: Connection leaks from undrained response bodies
  patterns:
    primary: unit-function-side-effect
    helpers_required: []
    decorators: []
  test_data:
    mock_response:
      status_code: 502
      body: test-body-data
  variables:
    closure_scope:
    - name: resp
