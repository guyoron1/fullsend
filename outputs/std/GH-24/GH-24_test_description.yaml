  - scenario_id: "11"
    test_id: "TS-GH-24-011"
    tier: "Functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-24"
    requirement_summary: "No double-retry of 5xx across do() and retryOnRepoRace layers"

    variables:
      closure_scope:
        - name: "t"
          type: "*testing.T"
          initialized_in: "TestFunction"
          used_in: ["TestFunction"]
          comment: "Test context"
        - name: "callCount"
          type: "int"
          initialized_in: "Subtest"
          used_in: ["Subtest"]
          comment: "Tracks all HTTP calls (GET + PUT)"
        - name: "err"
          type: "error"
          initialized_in: "Subtest"
          used_in: ["Subtest"]
          comment: "Error from CreateOrUpdateFile"

    test_structure:
      type: "single"
      function: "TestCreateOrUpdateFileNoDoubleRetry504"

    test_objective:
      title: "Verify CreateOrUpdateFile with 504 on PUT results in exactly 3 HTTP calls"
      what: |
        This test validates the call count for CreateOrUpdateFile when the PUT request
        returns 504. The expected flow is: GET (success to fetch SHA) → PUT (504 fail)
        → PUT (200 success via do() retry). Total: 3 HTTP calls, not 4+.
      why: |
        CreateOrUpdateFile first GETs the file SHA, then PUTs the update. If both do()
        and retryOnRepoRace retry 5xx, the GET would be re-executed unnecessarily,
        increasing call count and causing confusion.
      acceptance_criteria:
        - "Exactly 3 HTTP calls: GET (200) + PUT (504) + PUT retry (200)"
        - "CreateOrUpdateFile returns success"
        - "File SHA from GET is used in PUT (not re-fetched)"

    classification:
      test_type: "Functional"
      scope: "Multi-function"
      automation_approach: "Go test with httptest mock server"

    specific_preconditions: []

    test_data:
      mock_sequence:
        - call: 1
          method: "GET"
          path: "/repos/org/repo/contents/file.txt"
          status: 200
          body: '{"sha": "abc123", "content": "base64content"}'
        - call: 2
          method: "PUT"
          path: "/repos/org/repo/contents/file.txt"
          status: 504
        - call: 3
          method: "PUT"
          path: "/repos/org/repo/contents/file.txt"
          status: 200

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock server with GET→200, PUT→504, PUT→200 sequence"
          command: "httptest.NewServer with method-aware call counting"
          validation: "Server handles GET and PUT differently"
          code_template: |
            callCount = 0
            putCount := 0
            server = httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                callCount++
                if r.Method == http.MethodGet {
                    w.WriteHeader(http.StatusOK)
                    fmt.Fprint(w, `{"sha": "abc123", "content": "Y29udGVudA=="}`)
                    return
                }
                putCount++
                if putCount == 1 {
                    w.WriteHeader(http.StatusGatewayTimeout)
                    return
                }
                w.WriteHeader(http.StatusOK)
            }))
            defer server.Close()

      test_execution:
        - step_id: "TEST-01"
          action: "Call CreateOrUpdateFile and verify call count"
          command: "client.CreateOrUpdateFile(ctx, org, repo, path, branch, content, message)"
          validation: "Succeeds with exactly 3 HTTP calls"
          code_template: |
            client = newTestClient(server.URL)
            err = client.CreateOrUpdateFile(context.Background(), "org", "repo", "file.txt", "main", []byte("content"), "update file")
            require.NoError(t, err)
            assert.Equal(t, 3, callCount, "expected GET + PUT(504) + PUT(200) = 3 calls")

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "CreateOrUpdateFile succeeds after PUT retry"
        condition: "err == nil"
        failure_impact: "File update fails despite server recovering"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Exactly 3 HTTP calls made (no double retry)"
        condition: "callCount == 3"
        failure_impact: "Double-retry causes 4+ calls; GET re-executed unnecessarily"

    dependencies:
      external_tools:
        - "Go 1.23+"
        - "testify/assert"
        - "testify/require"

