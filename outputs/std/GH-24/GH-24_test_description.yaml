      why: |
        The retry scope is deliberately limited to 500-504 (common transient errors).
        Codes like 505 (HTTP Version Not Supported) are not transient and should not be retried.
      acceptance_criteria:
        - "isRetryable returns false for HTTP 505"
        - "isRetryable returns false for HTTP 511"

