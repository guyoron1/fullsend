  tier: Unit Tests
  priority: P0
  requirement_id: GH-24
  test_objective:
    title: Verify CreateOrUpdateFile with 504 retries only at do() level
    what: 'Tests that when CreateOrUpdateFile encounters a 504 during the PUT request,

      the retry happens only at the do() level. The wrapping retryOnRepoRace

      does not add additional 5xx retry attempts. Total call sequence should be:

      GET (fetch SHA), PUT (504 fail), PUT (200 success) = 3 total calls.

      '
    why: 'Double-retry would cause excessive retries (retryOnRepoRace retries *

      do() retries) and mask the true failure count, making debugging harder.

      '
    acceptance_criteria:
    - 'Mock server receives exactly 3 requests: 1 GET + 1 PUT (504) + 1 PUT (200)'
    - CreateOrUpdateFile returns success
    - retryOnRepoRace does not re-invoke the operation for 5xx
  test_steps:
    setup:
    - step_id: SETUP-01
      action: Create mock HTTP server tracking request sequence
      command: httptest.NewServer that returns 200 for GET, 504 for first PUT, 200 for second PUT
    test_execution:
    - step_id: TEST-01
      action: Call CreateOrUpdateFile
      validation: err == nil
    - step_id: TEST-02
      action: Verify request sequence
      validation: requests == [GET, PUT(504), PUT(200)]
    cleanup:
    - step_id: CLEANUP-01
      action: Close mock server
      command: server.Close()
  assertions:
  - assertion_id: ASSERT-01
    priority: P0
    description: Exactly 3 requests made (no double-retry)
    condition: callCount == 3
    failure_impact: Double-retry causes excessive server load and incorrect retry counts
  - assertion_id: ASSERT-02
    priority: P0
    description: Operation succeeds after single-level retry
    condition: err == nil
    failure_impact: CreateOrUpdateFile fails despite server recovery
