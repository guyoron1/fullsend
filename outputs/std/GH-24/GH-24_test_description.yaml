  - scenario_id: "1"
    test_id: "TS-GH-24-001"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-24"
    requirement_summary: "do() retries on 5xx server errors (500-504) automatically for all GitHub API calls"

    variables:
      closure_scope:
        - name: "t"
          type: "*testing.T"
          initialized_in: "TestFunction"
          used_in: ["TestFunction", "Subtest"]
          comment: "Test context"
        - name: "server"
          type: "*httptest.Server"
          initialized_in: "Subtest"
          used_in: ["Subtest"]
          comment: "Mock HTTP server returning specific status codes"
        - name: "result"
          type: "bool"
          initialized_in: "Subtest"
          used_in: ["Subtest"]
          comment: "Return value from isRetryable"

    test_structure:
      type: "table-driven"
      function: "TestIsRetryableReturnsTrue5xx"
      subtests:
        - name: "500 Internal Server Error"
          status_code: 500
        - name: "501 Not Implemented"
          status_code: 501
        - name: "502 Bad Gateway"
          status_code: 502
        - name: "503 Service Unavailable"
          status_code: 503
        - name: "504 Gateway Timeout"
          status_code: 504

    test_objective:
      title: "Verify isRetryable returns true for 500, 501, 502, 503, 504"
      what: |
        This test validates that the isRetryable() function correctly identifies
        all 5xx status codes in the range 500-504 as retryable, including 501 Not
        Implemented. Each status code is tested individually to ensure comprehensive
        coverage of the retry decision logic.
      why: |
        The core change moves 5xx retry from the wrapper level to do(). If isRetryable
        fails to recognize any 5xx code, that code path loses retry coverage entirely,
        leading to production failures like the original 502 Bad Gateway issue.
      acceptance_criteria:
        - "isRetryable returns true for HTTP 500"
        - "isRetryable returns true for HTTP 501"
        - "isRetryable returns true for HTTP 502"
        - "isRetryable returns true for HTTP 503"
        - "isRetryable returns true for HTTP 504"

    classification:
      test_type: "Functional"
      scope: "Single-function"
      automation_approach: "Go test with testify assertions"

    specific_preconditions: []

    test_data:
      status_codes:
        - code: 500
          name: "Internal Server Error"
          expected_retryable: true
        - code: 501
          name: "Not Implemented"
          expected_retryable: true
        - code: 502
          name: "Bad Gateway"
          expected_retryable: true
        - code: 503
          name: "Service Unavailable"
          expected_retryable: true
        - code: 504
          name: "Gateway Timeout"
          expected_retryable: true

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock HTTP response with target status code"
          command: "httptest.NewServer returning specific status code"
          validation: "Server starts successfully"
          code_template: |
            server = httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                w.WriteHeader(tc.statusCode)
            }))
            defer server.Close()

      test_execution:
        - step_id: "TEST-01"
          action: "Call isRetryable with mock response"
          command: "isRetryable(resp)"
          validation: "Returns true for each 5xx code"
          code_template: |
            resp := &http.Response{StatusCode: tc.statusCode}
            result = isRetryable(resp, nil)
            assert.True(t, result, "expected isRetryable to return true for %d", tc.statusCode)

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "isRetryable returns true for each 5xx status code (500-504)"
        condition: "isRetryable(resp) == true for status codes 500, 501, 502, 503, 504"
        failure_impact: "5xx errors would not be retried, causing production failures"

    dependencies:
      external_tools:
        - "Go 1.23+"
        - "testify/assert"

  - scenario_id: "2"
    test_id: "TS-GH-24-002"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-24"
    requirement_summary: "do() retries on 5xx server errors (500-504) automatically for all GitHub API calls"

    variables:
      closure_scope:
        - name: "t"
          type: "*testing.T"
          initialized_in: "TestFunction"
          used_in: ["TestFunction"]
          comment: "Test context"
        - name: "callCount"
          type: "int"
          initialized_in: "Subtest"
          used_in: ["Subtest"]
          comment: "Tracks number of HTTP calls made"
        - name: "err"
          type: "error"
          initialized_in: "Subtest"
          used_in: ["Subtest"]
          comment: "Error from do() call"

    test_structure:
      type: "single"
      function: "TestDoRetries502AndSucceeds"

    test_objective:
      title: "Verify do() retries a 502 and succeeds on next attempt"
      what: |
        This test validates the end-to-end retry flow: do() receives a 502 Bad Gateway
        on the first attempt, retries the request, and succeeds on the second attempt.
        This directly validates the fix for the production failure scenario.
      why: |
        The original production failure was a 502 Bad Gateway on GetPullRequestHeadSHA
        with no retry coverage. This test proves the fix works for the exact failure mode.
      acceptance_criteria:
        - "First HTTP call returns 502"
        - "do() automatically retries the request"
        - "Second HTTP call returns 200"
        - "do() returns success (no error)"
        - "Exactly 2 HTTP calls are made"

    classification:
      test_type: "Functional"
      scope: "Single-function"
      automation_approach: "Go test with httptest mock server"

    specific_preconditions: []

    test_data:
      mock_sequence:
        - attempt: 1
          status: 502
          body: "Bad Gateway"
        - attempt: 2
          status: 200
          body: '{"sha": "abc123"}'

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock server that returns 502 on first call, 200 on second"
          command: "httptest.NewServer with call counter"
          validation: "Server starts and tracks call count"
          code_template: |
            callCount = 0
            server = httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                callCount++
                if callCount == 1 {
                    w.WriteHeader(http.StatusBadGateway)
                    return
                }
                w.WriteHeader(http.StatusOK)
                fmt.Fprint(w, `{"sha": "abc123"}`)
            }))
            defer server.Close()

      test_execution:
        - step_id: "TEST-01"
          action: "Call do() with GET request to mock server"
          command: "client.do(ctx, http.MethodGet, path, nil)"
          validation: "Returns success after retry"
          code_template: |
            client = newTestClient(server.URL)
            _, err = client.do(context.Background(), http.MethodGet, "/repos/org/repo/pulls/1", nil)
            require.NoError(t, err)
            assert.Equal(t, 2, callCount, "expected exactly 2 HTTP calls (1 fail + 1 success)")

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "do() returns no error after successful retry"
        condition: "err == nil"
        failure_impact: "Retry mechanism is broken; 502 errors propagate as failures"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Exactly 2 HTTP calls are made"
        condition: "callCount == 2"
        failure_impact: "Retry not happening (1 call) or infinite retry (>2 calls)"

    dependencies:
      external_tools:
        - "Go 1.23+"
        - "testify/assert"
        - "testify/require"

  - scenario_id: "3"
    test_id: "TS-GH-24-003"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-24"
    requirement_summary: "do() retries on 5xx server errors (500-504) automatically for all GitHub API calls"

    variables:
      closure_scope:
        - name: "t"
          type: "*testing.T"
          initialized_in: "TestFunction"
          used_in: ["TestFunction"]
          comment: "Test context"
        - name: "callCount"
          type: "int"
          initialized_in: "Subtest"
          used_in: ["Subtest"]
          comment: "Tracks total HTTP calls"
        - name: "err"
          type: "error"
          initialized_in: "Subtest"
          used_in: ["Subtest"]
          comment: "Error from do() after retry exhaustion"

    test_structure:
      type: "single"
      function: "TestDoExhaustsRetriesOnPersistent5xx"

    test_objective:
      title: "Verify do() exhausts retries on persistent 5xx and returns descriptive error"
      what: |
        This test validates that when a server returns 5xx on every attempt, do()
        retries up to maxRetries (3) times and then returns an error containing
        "retryable error after 3 attempts". This ensures bounded retry behavior.
      why: |
        Unbounded retries would cause infinite loops. This test proves do() respects
        the maxRetries=3 limit and produces a clear error message for debugging.
      acceptance_criteria:
        - "do() makes exactly 4 HTTP calls (1 initial + 3 retries)"
        - "do() returns a non-nil error"
        - "Error message contains 'retryable error after 3 attempts'"

    classification:
      test_type: "Functional"
      scope: "Single-function"
      automation_approach: "Go test with httptest mock server"

    specific_preconditions: []

    test_data:
      mock_behavior: "Return 503 on every request"
      max_retries: 3
      expected_calls: 4

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock server that always returns 503"
          command: "httptest.NewServer returning 503 on every request"
          validation: "Server starts and counts calls"
          code_template: |
            callCount = 0
            server = httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                callCount++
                w.WriteHeader(http.StatusServiceUnavailable)
            }))
            defer server.Close()

      test_execution:
        - step_id: "TEST-01"
          action: "Call do() and verify retry exhaustion"
          command: "client.do(ctx, http.MethodGet, path, nil)"
          validation: "Returns error after exhausting retries"
          code_template: |
            client = newTestClient(server.URL)
            _, err = client.do(context.Background(), http.MethodGet, "/repos/org/repo/pulls/1", nil)
            require.Error(t, err)
            assert.Contains(t, err.Error(), "retryable error after 3 attempts")
            assert.Equal(t, 4, callCount, "expected 1 initial + 3 retries = 4 total calls")

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "do() returns error after retry exhaustion"
        condition: "err != nil"
        failure_impact: "Retry exhaustion silently succeeds or panics"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Error message describes retry exhaustion"
        condition: "err.Error() contains 'retryable error after 3 attempts'"
        failure_impact: "Error messages are unclear for debugging production failures"
      - assertion_id: "ASSERT-03"
        priority: "P0"
        description: "Exactly 4 HTTP calls made (1 initial + 3 retries)"
        condition: "callCount == 4"
        failure_impact: "Retry count is incorrect"

    dependencies:
      external_tools:
        - "Go 1.23+"
        - "testify/assert"
        - "testify/require"

  - scenario_id: "4"
    test_id: "TS-GH-24-004"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-24"
