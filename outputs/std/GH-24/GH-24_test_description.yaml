- scenario_id: '8'
  test_id: TS-GH-24-008
  tier: Unit Tests
  priority: P0
  requirement_id: GH-24
  test_objective:
    title: Verify do() retries and succeeds after transient 502
    what: 'Tests that the do() function retries an HTTP request after receiving a 502

      Bad Gateway response and succeeds when the subsequent attempt returns 200.

      Uses httptest.NewServer to simulate a server that fails once then succeeds.

      '
    why: 'This is the core functionality being introduced: do() must automatically

      retry on 5xx errors so all 19+ callers benefit without code changes.

      '
    acceptance_criteria:
    - do() returns successful response after initial 502 failure
    - Mock server receives exactly 2 requests (1 failure + 1 success)
  test_steps:
    setup:
    - step_id: SETUP-01
      action: Create mock HTTP server that returns 502 on first call, 200 on second
      command: httptest.NewServer with atomic counter tracking call count
    test_execution:
    - step_id: TEST-01
      action: Call do() with request to mock server
      command: resp, err := client.do(ctx, req)
      validation: err == nil && resp.StatusCode == 200
    - step_id: TEST-02
      action: Verify call count on mock server
      command: assert callCount == 2
      validation: Server received exactly 2 requests
    cleanup:
    - step_id: CLEANUP-01
      action: Close mock server
      command: server.Close()
  assertions:
  - assertion_id: ASSERT-01
    priority: P0
    description: do() returns successful response after retry
    condition: err == nil && resp.StatusCode == 200
    failure_impact: Transient 502 errors would not be retried at the HTTP client level
  - assertion_id: ASSERT-02
    priority: P0
    description: Exactly 2 requests were made
    condition: callCount == 2
    failure_impact: Retry count is incorrect — either no retry or too many retries
  variables:
    closure_scope:
    - name: callCount
      type: '*atomic.Int32'
      initialized_in: setup
      used_in:
      - setup
      - test
      comment: Tracks number of HTTP requests received by mock server
    - name: server
      type: '*httptest.Server'
      initialized_in: setup
      used_in:
      - setup
      - test
      - cleanup
      comment: Mock HTTP server
  patterns:
    primary: unit-httptest-retry
    helpers_required: []
    decorators: []
  test_data:
    mock_server:
      responses:
      - status: 502
        count: 1
      - status: 200
        count: 1
