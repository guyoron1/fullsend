  # ============================================================

  - scenario_id: "21"
    test_id: "TS-GH-24-021"
    tier: "Functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-24"
    requirement_summary: "File operations (CreateOrUpdateFile, DeleteFile) handle 5xx at do() level without re-running preceding GET"

    variables:
      closure_scope:
        - name: "t"
          type: "*testing.T"
          initialized_in: "TestFunction"
          used_in: ["TestFunction"]
          comment: "Test context"
        - name: "getCount"
          type: "int"
          initialized_in: "Subtest"
          used_in: ["Subtest"]
          comment: "Tracks GET calls specifically"
        - name: "putCount"
          type: "int"
          initialized_in: "Subtest"
          used_in: ["Subtest"]
          comment: "Tracks PUT calls specifically"
        - name: "err"
          type: "error"
          initialized_in: "Subtest"
          used_in: ["Subtest"]
          comment: "Error from CreateOrUpdateFile"

    test_structure:
      type: "single"
      function: "TestCreateOrUpdateFileRetriesPUTNotGET"

    test_objective:
      title: "Verify CreateOrUpdateFile retries PUT at do() level without re-executing the GET for file SHA"
      what: |
        This test validates that when CreateOrUpdateFile's PUT request fails with 5xx,
        only the PUT is retried by do(). The preceding GET (to fetch file SHA) is NOT
        re-executed because retry happens at the do() level, not the operation level.
      why: |
        Re-executing the GET on every PUT retry would be wasteful and could introduce
        race conditions if the file SHA changes between retries.
      acceptance_criteria:
        - "Exactly 1 GET call (SHA fetch)"
        - "2 PUT calls (1 fail + 1 success via do() retry)"
        - "GET is not re-executed during PUT retry"

    classification:
      test_type: "Functional"
      scope: "Multi-function"
      automation_approach: "Go test with httptest mock server"

    specific_preconditions: []

    test_data:
      mock_sequence:
        - method: "GET"
          status: 200
          count: 1
        - method: "PUT"
          status: 502
          count: 1
        - method: "PUT"
          status: 200
          count: 1

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock server tracking GET and PUT counts separately"
          command: "httptest.NewServer with method-specific counters"
          validation: "Server distinguishes GET from PUT"
          code_template: |
            getCount = 0
            putCount = 0
            server = httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                switch r.Method {
                case http.MethodGet:
                    getCount++
                    w.WriteHeader(http.StatusOK)
                    fmt.Fprint(w, `{"sha": "abc123", "content": "Y29udGVudA=="}`)
                case http.MethodPut:
                    putCount++
                    if putCount == 1 {
                        w.WriteHeader(http.StatusBadGateway)
                        return
                    }
                    w.WriteHeader(http.StatusOK)
                }
            }))
            defer server.Close()

      test_execution:
        - step_id: "TEST-01"
          action: "Call CreateOrUpdateFile and verify GET/PUT counts"
          command: "client.CreateOrUpdateFile(...)"
          validation: "1 GET, 2 PUTs"
          code_template: |
            client = newTestClient(server.URL)
            err = client.CreateOrUpdateFile(context.Background(), "org", "repo", "file.txt", "main", []byte("content"), "update")
            require.NoError(t, err)
            assert.Equal(t, 1, getCount, "GET should be called exactly once")
            assert.Equal(t, 2, putCount, "PUT should be called twice (1 fail + 1 retry)")

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "GET called exactly once (no re-fetch)"
        condition: "getCount == 1"
        failure_impact: "SHA re-fetched on retry; race condition risk"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "PUT called twice (initial + retry)"
        condition: "putCount == 2"
        failure_impact: "Retry not happening or excessive retries"

    dependencies:
      external_tools:
        - "Go 1.23+"
        - "testify/assert"
        - "testify/require"

