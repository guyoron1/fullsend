- scenario_id: '12'
  test_id: TS-GH-24-012
  tier: Unit Tests
  priority: P0
  requirement_id: GH-24
  test_objective:
    title: Verify do() respects context cancellation during retry backoff
    what: 'Tests that do() stops retrying and returns a context error when the

      context is cancelled during the backoff sleep between retries.

      '
    why: 'Retry loops must respect context cancellation to prevent goroutine leaks

      and ensure graceful shutdown when callers cancel operations.

      '
    acceptance_criteria:
    - do() returns context.Canceled error when context is cancelled during backoff
    - do() does not make additional requests after context cancellation
  test_steps:
    setup:
    - step_id: SETUP-01
      action: Create mock HTTP server that always returns 502
      command: httptest.NewServer always returning 502
    - step_id: SETUP-02
      action: Create cancellable context
      command: ctx, cancel := context.WithCancel(context.Background())
    test_execution:
    - step_id: TEST-01
      action: Cancel context after first request received
      command: In server handler, call cancel() on first request
    - step_id: TEST-02
      action: Verify do() returns context error
      validation: errors.Is(err, context.Canceled)
    cleanup:
    - step_id: CLEANUP-01
      action: Close mock server and call cancel()
      command: server.Close(); cancel()
  assertions:
  - assertion_id: ASSERT-01
    priority: P0
    description: '[NEGATIVE] do() returns context error on cancellation'
    condition: errors.Is(err, context.Canceled)
    failure_impact: Retry loop ignores context cancellation, causing goroutine leaks
  patterns:
    primary: unit-httptest-context-cancellation
    helpers_required: []
    decorators: []
  test_data:
    mock_server:
      responses:
      - status: 502
        count: always
  variables:
    closure_scope:
    - name: callCount
      type: '*atomic.Int32'
      initialized_in: setup
      used_in:
      - setup
      - test
      comment: Tracks number of HTTP requests received by mock server
    - name: server
      type: '*httptest.Server'
      initialized_in: setup
      used_in:
      - setup
      - test
      - cleanup
      comment: Mock HTTP server
    - name: ctx
