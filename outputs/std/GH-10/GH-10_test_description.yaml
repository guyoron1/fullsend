      title: "Error from failed recreate (create after delete fails) includes redacted output"
      what: |
        Tests the scenario where AlreadyExists triggers delete (succeeds), but
        the second create attempt fails. The error message should contain
        "failed after delete" context AND must not contain any secret values.
      why: |
        This is the intersection of error clarity and security. The user needs
        to know the failure happened after a successful delete (provider is now
        gone), and the error must never leak credentials.
      acceptance_criteria:
        - "EnsureProvider returns a non-nil error"
        - "Error message contains 'failed after delete' or equivalent context"
        - "Error message does not contain any secret values"

    classification:
      test_type: "Unit"
      scope: "Single-function"
      automation_approach: "go test with testify assertions"

    specific_preconditions:
      - name: "Fake openshell with complex failure sequence"
        requirement: "First create fails AlreadyExists, delete succeeds, second create fails with secret in output"
        validation: "Script behavior verified"

    test_data:
      resource_definitions:
        - name: "fake_openshell"
          type: "shell script"
          yaml: |
            #!/bin/bash
            COUNTER_FILE="$TMPDIR/openshell_call_count"
            COUNT=$(cat "$COUNTER_FILE" 2>/dev/null || echo 0)
            echo $((COUNT+1)) > "$COUNTER_FILE"
            if [ "$1" = "provider" ] && [ "$2" = "create" ]; then
              if [ "$COUNT" -eq 0 ]; then
                echo "AlreadyExists" >&2; exit 1
              else
                echo "auth failed with token=s3cr3t" >&2; exit 1
              fi
            fi
            exit 0  # delete succeeds

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fake openshell: first create=AlreadyExists, delete=ok, second create=fail with secret"
          command: "Write script to t.TempDir(), chmod +x, prepend to PATH"
          validation: "Script is executable"
        - step_id: "SETUP-02"
          action: "Set up credentials with known secret value"
          command: "credentials = map[string]string{'token': 's3cr3t'}"
          validation: "Secret value is known for assertion"
      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureProvider with provider name and credentials containing secret"
          command: "sb.EnsureProvider(ctx, providerName, credentials)"
          validation: "Returns error"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Automatic cleanup via t.TempDir()"
          command: "Handled by testing framework"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "EnsureProvider returns an error"
        condition: "err != nil"
        failure_impact: "Second create failure is silently swallowed"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Error does not contain the secret value"
        condition: "!strings.Contains(err.Error(), 's3cr3t')"
        failure_impact: "Secret values leak in error messages"

    dependencies:
      external_tools:
        - "Fake openshell script with complex failure sequence (test-only)"

