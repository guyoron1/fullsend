        Tests that EnsureProvider successfully creates a new provider when no
        provider with the same name exists. The openshell CLI should be called
        exactly once with the correct arguments and return success.
      why: |
        This is the happy-path baseline. If first-time provider creation fails,
        no agent can run. This test ensures the core create path is intact.
      acceptance_criteria:
        - "EnsureProvider returns nil error"
        - "openshell is called exactly once with 'provider create' arguments"
        - "Provider name and credentials are passed correctly"

