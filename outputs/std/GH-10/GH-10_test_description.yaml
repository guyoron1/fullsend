    test_objective:
      title: "EnsureProvider returns error for non-AlreadyExists create failure"
      what: |
        Tests that when openshell create fails with an error that is NOT
        AlreadyExists, EnsureProvider returns the original error without
        attempting delete-and-recreate. The error message should contain
        "provider create" and the original error text.
      why: |
        Non-AlreadyExists errors (e.g., network failures, auth errors) should
        not trigger the recovery path. The original behavior must be preserved
        for these cases.
      acceptance_criteria:
        - "EnsureProvider returns a non-nil error"
        - "Error message contains 'provider create'"
        - "Error message contains the original error text"
        - "openshell is called exactly once (no delete attempt)"

    classification:
      test_type: "Unit"
      scope: "Single-function"
      automation_approach: "go test with testify assertions"

    specific_preconditions:
      - name: "Fake openshell script that fails with non-AlreadyExists error"
        requirement: "Script returns a generic error on provider create"
        validation: "Script behavior verified"

    test_data:
      resource_definitions:
        - name: "fake_openshell"
          type: "shell script"
          yaml: |
            #!/bin/bash
            if [ "$1" = "provider" ] && [ "$2" = "create" ]; then
              echo "connection refused: cannot reach gateway" >&2; exit 1
            fi
            exit 0

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fake openshell that fails create with non-AlreadyExists error"
          command: "Write script to t.TempDir(), chmod +x, prepend to PATH"
          validation: "Script is executable"
      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureProvider with provider name and credentials"
          command: "sb.EnsureProvider(ctx, providerName, credentials)"
          validation: "Returns error with original message"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Automatic cleanup via t.TempDir()"
          command: "Handled by testing framework"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "EnsureProvider returns an error"
        condition: "err != nil"
        failure_impact: "Create failures are silently swallowed"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Error message contains 'provider create'"
        condition: "strings.Contains(err.Error(), 'provider create')"
        failure_impact: "Error origin is unclear"
      - assertion_id: "ASSERT-03"
        priority: "P0"
        description: "No delete attempt was made"
        condition: "openshell called exactly once"
        failure_impact: "Recovery path triggered for non-recoverable errors"

    dependencies:
      external_tools:
        - "Fake openshell script (test-only)"

  - scenario_id: "005"
