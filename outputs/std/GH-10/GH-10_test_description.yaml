        description: "Output contains '***' in place of secret"
        condition: "strings.Contains(result, '***')"
        failure_impact: "Secrets are not redacted"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Output does not contain original secret value"
        condition: "!strings.Contains(result, 's3cr3t-t0k3n')"
        failure_impact: "Secret values leak to user"

    dependencies: {}

