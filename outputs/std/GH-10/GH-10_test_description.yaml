        condition: "err == nil"
        failure_impact: "Provider creation is broken — no agents can run"

    dependencies:
      external_tools:
        - "Fake openshell script (test-only)"

  - scenario_id: "002"
    test_id: "TS-GH-10-002"
    tier: "Unit"
    priority: "P0"
    mvp: true
    requirement_id: "REQ-001, REQ-002"

    variables:
      closure_scope:
        - name: "sb"
          type: "*sandbox.Sandbox"
          initialized_in: "test setup"
          used_in: ["test"]
          comment: "Sandbox instance under test"
        - name: "callLog"
          type: "[]string"
          initialized_in: "test setup"
          used_in: ["test", "assertion"]
          comment: "Records openshell invocations in order"
        - name: "err"
          type: "error"
          initialized_in: "test execution"
          used_in: ["assertion"]
          comment: "Error returned by EnsureProvider"

    patterns:
      primary: "idempotent-operation"
      helpers_required: ["stateful-mock"]

    code_structure:
      type: "function"
      function_name: "TestEnsureProvider_AlreadyExists_DeleteAndRecreate"
      body: "flat"

    test_structure:
      type: "single"
      function_name: "TestEnsureProvider_AlreadyExists_DeleteAndRecreate"
      subtest: false

    test_objective:
      title: "EnsureProvider detects AlreadyExists, deletes, and recreates successfully"
      what: |
        Tests the idempotent recovery path: when openshell returns an AlreadyExists
        error on the first create attempt, EnsureProvider should delete the stale
        provider and recreate it with current credentials. The openshell CLI
        should be called exactly 3 times (create → delete → create).
      why: |
        This is the primary bug fix. Without this path, a stale provider from a
        previous run blocks all subsequent agent runs until manual cleanup. This
        test validates the core fix for issue #2294.
      acceptance_criteria:
        - "EnsureProvider returns nil error"
        - "openshell is called 3 times: create (fails with AlreadyExists), delete, create (succeeds)"
        - "Final provider uses current credentials (not stale ones)"

    classification:
      test_type: "Unit"
      scope: "Single-function"
      automation_approach: "go test with testify assertions"

    specific_preconditions:
      - name: "Fake openshell script with stateful behavior"
        requirement: "Script that returns AlreadyExists on first create, succeeds on delete and second create"
        validation: "Script tracks call count via temp file"

    test_data:
      resource_definitions:
        - name: "fake_openshell"
          type: "shell script"
          yaml: |
            #!/bin/bash
            # First 'provider create' returns AlreadyExists
            # 'provider delete' succeeds
            # Second 'provider create' succeeds
            COUNTER_FILE="$TMPDIR/openshell_call_count"
            if [ "$1" = "provider" ] && [ "$2" = "create" ]; then
              COUNT=$(cat "$COUNTER_FILE" 2>/dev/null || echo 0)
              if [ "$COUNT" -eq 0 ]; then
                echo $((COUNT+1)) > "$COUNTER_FILE"
                echo "AlreadyExists: provider already exists" >&2
                exit 1
              fi
            fi
            exit 0

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create stateful fake openshell that fails first create with AlreadyExists"
          command: "Write script to t.TempDir(), chmod +x, prepend to PATH"
          validation: "Script is executable and tracks call state"
      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureProvider with provider name and credentials"
          command: "sb.EnsureProvider(ctx, providerName, credentials)"
          validation: "Returns nil after delete-and-recreate sequence"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Automatic cleanup via t.TempDir()"
          command: "Handled by testing framework"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "EnsureProvider returns no error after recovery"
        condition: "err == nil"
        failure_impact: "Idempotent recovery is broken — stale providers block runs"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "openshell called exactly 3 times (create, delete, create)"
        condition: "len(callLog) == 3"
        failure_impact: "Recovery sequence is incomplete or has extra calls"

    dependencies:
      external_tools:
        - "Fake openshell script with stateful behavior (test-only)"

  - scenario_id: "003"
    test_id: "TS-GH-10-003"
    tier: "Unit"
    priority: "P0"
    mvp: true
