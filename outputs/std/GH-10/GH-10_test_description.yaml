    test_objective:
      title: "redactSecrets replaces all known secret values with '***'"
      what: |
        Tests that the redactSecrets helper function finds all occurrences of
        known secret values in a string and replaces each with "***". Ensures
        no secret values remain in the output.
      why: |
        Secret leakage in error messages is a security risk. The redactSecrets
        function is the last line of defense before error messages reach the user.
      acceptance_criteria:
        - "All secret values in the input are replaced with '***'"
        - "No secret values remain in the output"
        - "Non-secret text is preserved unchanged"

    classification:
      test_type: "Unit"
      scope: "Single-function"
      automation_approach: "go test with testify assertions"

    specific_preconditions: []

    test_data:
      resource_definitions:
        - name: "test_input"
          type: "string constant"
          yaml: |
            input: "error: auth failed with token=s3cr3t-t0k3n for user admin"
            secrets: ["s3cr3t-t0k3n"]

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Prepare input string containing secret values and secrets list"
          command: "Inline test data"
          validation: "Input contains secret values"
      test_execution:
        - step_id: "TEST-01"
          action: "Call redactSecrets with input and secrets"
          command: "result = redactSecrets(input, secrets)"
          validation: "Returns redacted string"
