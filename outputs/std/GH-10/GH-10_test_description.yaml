      type: "function"
      function_name: "TestEnsureProvider_AlreadyExists_DeleteFails"
      body: "flat"

    test_structure:
      type: "single"
      function_name: "TestEnsureProvider_AlreadyExists_DeleteFails"
      subtest: false

    test_objective:
      title: "EnsureProvider returns error when delete fails during recreate"
      what: |
        Tests that when a provider already exists and the delete step fails,
        EnsureProvider returns a clear error message containing both
        "provider delete" and "during recreate" for debuggability.
      why: |
        If delete fails during the recovery path, the user must understand
        that the failure occurred mid-recovery (not during initial creation).
        Clear error messages are critical for debugging provider issues.
      acceptance_criteria:
        - "EnsureProvider returns a non-nil error"
        - "Error message contains 'provider delete'"
        - "Error message contains 'during recreate'"

    classification:
      test_type: "Unit"
      scope: "Single-function"
      automation_approach: "go test with testify assertions"

    specific_preconditions:
      - name: "Fake openshell script that fails on delete"
        requirement: "Script returns AlreadyExists on create, then fails on delete"
        validation: "Script behavior verified"

    test_data:
      resource_definitions:
        - name: "fake_openshell"
          type: "shell script"
          yaml: |
            #!/bin/bash
            if [ "$1" = "provider" ] && [ "$2" = "create" ]; then
              echo "AlreadyExists" >&2; exit 1
            fi
            if [ "$1" = "provider" ] && [ "$2" = "delete" ]; then
              echo "delete failed: permission denied" >&2; exit 1
            fi
            exit 0

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fake openshell that returns AlreadyExists on create, fails on delete"
          command: "Write script to t.TempDir(), chmod +x, prepend to PATH"
          validation: "Script is executable"
      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureProvider with provider name and credentials"
          command: "sb.EnsureProvider(ctx, providerName, credentials)"
          validation: "Returns error"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Automatic cleanup via t.TempDir()"
          command: "Handled by testing framework"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "EnsureProvider returns an error"
        condition: "err != nil"
        failure_impact: "Delete failures are silently swallowed"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Error message contains 'provider delete'"
        condition: "strings.Contains(err.Error(), 'provider delete')"
        failure_impact: "Error origin is unclear to the user"
      - assertion_id: "ASSERT-03"
        priority: "P0"
        description: "Error message contains 'during recreate'"
        condition: "strings.Contains(err.Error(), 'during recreate')"
        failure_impact: "User cannot distinguish mid-recovery failure from initial failure"

    dependencies:
      external_tools:
        - "Fake openshell script (test-only)"

