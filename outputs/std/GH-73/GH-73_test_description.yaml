  # ---------------------------------------------------------------------------
  # Requirement Group 8: GCF provisioner
  # ---------------------------------------------------------------------------
  - id: "RG-08"
    requirement: "GCF provisioner and fake client correctly provision and manage cloud functions"
    jira_id: "GH-73"
    scenarios:

      - id: "GH-73-TC-032"
        title: "Verify cloud function creation and deployment"
        test_type: "functional"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that the GCF provisioner creates a new cloud function
          with the correct configuration and deploys it.
        common_preconditions:
          - "Fake GCF client configured"
          - "Valid project ID and function configuration"
        test_steps:
          - step: 1
            action: "Configure fake GCF client"
            expected: "Client ready"
          - step: 2
            action: "Call Provision with a valid function spec"
            expected: "Function is created and deployed"
          - step: 3
            action: "Verify the function exists in the fake client state"
            expected: "Function present with correct configuration"
        assertions:
          - "Provision returns nil error"
          - "Function exists in fake client with correct name"
          - "Function configuration matches the provided spec"
        classification:
          component: "cli"
          function_under_test: "Provision"

      - id: "GH-73-TC-033"
        title: "Verify environment variable updates on function"
        test_type: "functional"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that updating environment variables on an existing cloud
          function merges new values with existing ones.
        common_preconditions:
          - "Fake GCF client with an existing function"
          - "Function has existing env vars"
        test_steps:
          - step: 1
            action: "Create a function with env vars {KEY1: val1}"
            expected: "Function created"
          - step: 2
            action: "Update function with env vars {KEY2: val2}"
            expected: "Update completes"
          - step: 3
            action: "Retrieve function configuration"
            expected: "Both KEY1 and KEY2 present"
        assertions:
          - "Function env vars contain both KEY1 and KEY2"
          - "Existing env var values are not overwritten"
        classification:
          component: "cli"
          function_under_test: "Provision"

      - id: "GH-73-TC-034"
        title: "Verify error handling for invalid project ID"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that the GCF provisioner returns an error when given
          an invalid or nonexistent project ID.
        common_preconditions:
          - "Fake GCF client configured to reject invalid project IDs"
        test_steps:
          - step: 1
            action: "Call Provision with project ID 'invalid-project-!!'"
            expected: "Function returns an error"
        assertions:
          - "Provision returns a non-nil error"
          - "Error message references invalid project ID"
        classification:
          component: "cli"
          function_under_test: "Provision"

      - id: "GH-73-TC-035"
        title: "Verify fake client simulates API behavior"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that the fake GCF client correctly simulates the real
          GCF API behavior including create, get, update, and delete operations.
        common_preconditions:
          - "Fake GCF client instantiated"
        test_steps:
          - step: 1
            action: "Create a function via fake client"
            expected: "Function stored in fake state"
          - step: 2
            action: "Get the function by name"
            expected: "Returns the created function"
          - step: 3
            action: "Update the function"
            expected: "Changes reflected in state"
          - step: 4
            action: "Delete the function"
            expected: "Function removed from state"
          - step: 5
            action: "Get the deleted function"
            expected: "Returns not-found error"
        assertions:
          - "Create stores function in state"
          - "Get returns stored function"
          - "Update modifies stored function"
          - "Delete removes function from state"
          - "Get after delete returns not-found"
        classification:
          component: "cli"
          function_under_test: "FakeGCFClient"

