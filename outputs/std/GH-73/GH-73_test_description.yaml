            expected: "Role uses secret reference instead of inline PEM"
        assertions:
          - "Role creation succeeds without error"
          - "Role configuration references the existing secret name"
        classification:
          component: "cli"
          function_under_test: "mintAddRole"

      - id: "GH-73-TC-028"
