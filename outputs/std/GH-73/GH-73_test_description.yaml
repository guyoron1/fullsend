  # ---------------------------------------------------------------------------
  # Requirement Group 10: Status reconciliation
  # ---------------------------------------------------------------------------
  - id: "RG-10"
    requirement: "Status reconciliation finalizes orphaned status comments from hard-killed agent processes"
    jira_id: "GH-73"
    scenarios:

      - id: "GH-73-TC-040"
        title: "Verify orphaned comment finalized to interrupted"
        test_type: "unit"
        priority: "P2"
        coverage_status: "NEW"
        test_objective: >
          Confirm that reconcile-status detects an orphaned in-progress
          status comment and updates it to the interrupted final state.
        common_preconditions:
          - "Fake forge client with an in-progress status comment"
          - "No active agent process for the comment"
        test_steps:
          - step: 1
            action: "Create an in-progress status comment via fake forge client"
            expected: "Comment created"
          - step: 2
            action: "Run reconcile-status"
            expected: "Comment updated to interrupted state"
          - step: 3
            action: "Read the updated comment"
            expected: "Comment body indicates interrupted status"
        assertions:
          - "Comment body updated to reflect interrupted status"
          - "Reconciliation completes without error"
        classification:
          component: "cli"
          function_under_test: "reconcileStatus"

      - id: "GH-73-TC-041"
        title: "Verify idempotent on already-finalized comment"
        test_type: "unit"
        priority: "P2"
        coverage_status: "NEW"
        test_objective: >
          Confirm that reconcile-status is idempotent: running it on an
          already-finalized comment does not modify it further.
        common_preconditions:
          - "Fake forge client with a finalized status comment"
        test_steps:
          - step: 1
            action: "Create a status comment already in finalized state"
            expected: "Comment created"
          - step: 2
            action: "Run reconcile-status"
            expected: "No modification made"
          - step: 3
            action: "Verify comment is unchanged"
            expected: "Comment body identical to before reconciliation"
        assertions:
          - "Comment body is unchanged after reconciliation"
          - "No update API call made to the forge"
        classification:
          component: "cli"
          function_under_test: "reconcileStatus"

      - id: "GH-73-TC-042"
        title: "Verify cancelled reason handled correctly"
        test_type: "unit"
        priority: "P2"
        coverage_status: "NEW"
        test_objective: >
          Confirm that reconcile-status correctly handles the cancelled
          reason when finalizing an orphaned comment.
        common_preconditions:
          - "Fake forge client with an in-progress status comment"
          - "Cancellation reason available"
        test_steps:
          - step: 1
            action: "Create an in-progress status comment"
            expected: "Comment created"
          - step: 2
            action: "Run reconcile-status with reason='cancelled'"
            expected: "Comment updated with cancelled reason"
          - step: 3
            action: "Read the updated comment"
            expected: "Comment body indicates cancelled status with reason"
        assertions:
          - "Comment body contains 'cancelled' status"
          - "Cancellation reason is included in the comment"
        classification:
          component: "cli"
          function_under_test: "reconcileStatus"

