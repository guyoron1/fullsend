# ---------------------------------------------------------------------------
# Requirement Group 1: Agent sandbox run lifecycle
# ---------------------------------------------------------------------------
requirement_groups:
  - id: "RG-01"
    requirement: "Agent sandbox run lifecycle completes successfully with all bootstrap phases"
    jira_id: "GH-73"
    scenarios:

      - id: "GH-73-TC-001"
        title: "Verify agent run completes full lifecycle"
        test_type: "e2e"
        priority: "P0"
        coverage_status: "NEW"
        test_objective: >
          Validate that a fullsend agent run progresses through all lifecycle
          phases (bootstrap, validation, execution, cleanup) and terminates
          with a success status when all dependencies are available.
        common_preconditions:
          - "Fake forge client configured with valid repo/PR data"
          - "Sandbox binary available at expected path"
          - "Mock openshell endpoint reachable"
        test_steps:
          - step: 1
            action: "Configure a fake forge client with a valid repository, PR, and commit SHA"
            expected: "Forge client is initialized without error"
          - step: 2
            action: "Invoke runAgent with the configured context"
            expected: "Agent enters bootstrap phase"
          - step: 3
            action: "Allow agent to proceed through bootstrap, validation, and execution phases"
            expected: "Each phase completes without error"
          - step: 4
            action: "Observe final agent status"
            expected: "Agent returns success status and exit code 0"
        assertions:
          - "Agent exit code equals 0"
          - "All lifecycle phases executed in order: bootstrap, validate, execute, cleanup"
          - "No error logs emitted during run"
        classification:
          component: "cli"
          function_under_test: "runAgent"

      - id: "GH-73-TC-002"
        title: "Verify sandbox cleanup after successful run"
        test_type: "functional"
        priority: "P0"
        coverage_status: "NEW"
        test_objective: >
          Confirm that after a successful agent run, all temporary sandbox
          resources (temp dirs, extracted archives) are cleaned up.
        common_preconditions:
          - "Fake forge client configured"
          - "Temp directory created for sandbox workspace"
        test_steps:
          - step: 1
            action: "Create a temp directory to serve as the sandbox workspace"
            expected: "Temp directory exists on filesystem"
          - step: 2
            action: "Run the agent to successful completion"
            expected: "Agent returns success"
          - step: 3
            action: "Check whether the temp directory still exists"
            expected: "Temp directory has been removed"
        assertions:
          - "Sandbox temp directory does not exist after successful run"
        classification:
          component: "cli"
          function_under_test: "runAgent"

      - id: "GH-73-TC-003"
        title: "Verify run fails gracefully when openshell unavailable"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective: >
          Confirm that when the openshell endpoint is unreachable, the agent
          run returns a clear error without panicking or hanging.
        common_preconditions:
          - "Fake forge client configured"
          - "No openshell mock server running"
        test_steps:
          - step: 1
            action: "Configure agent context with an invalid/unreachable openshell URL"
            expected: "Context created successfully"
          - step: 2
            action: "Invoke runAgent"
            expected: "Function returns an error"
          - step: 3
            action: "Inspect the returned error"
            expected: "Error message indicates openshell is unavailable"
        assertions:
          - "runAgent returns a non-nil error"
          - "Error message contains reference to openshell connectivity failure"
        classification:
          component: "cli"
          function_under_test: "runAgent"

      - id: "GH-73-TC-004"
        title: "Verify run aborts on bootstrap failure"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective: >
          Confirm that if bootstrapCommon returns an error, the agent run
          aborts immediately and propagates the error.
        common_preconditions:
          - "Fake forge client configured"
          - "Bootstrap dependency missing or misconfigured to trigger failure"
        test_steps:
          - step: 1
            action: "Configure context so that bootstrapCommon will fail (e.g., invalid binary path)"
            expected: "Context created"
          - step: 2
            action: "Invoke runAgent"
            expected: "Function returns an error from bootstrap phase"
          - step: 3
            action: "Inspect the error"
            expected: "Error originates from bootstrapCommon"
        assertions:
          - "runAgent returns a non-nil error"
          - "Error wraps or references bootstrap failure"
          - "Execution phase is never reached"
        classification:
          component: "cli"
          function_under_test: "runAgent"

      - id: "GH-73-TC-005"
        title: "Verify validation loop retries on failure"
        test_type: "functional"
        priority: "P0"
        coverage_status: "NEW"
        test_objective: >
          Confirm that the validation loop retries on transient failures
          before eventually succeeding or exhausting retries.
        common_preconditions:
          - "Fake forge client configured"
          - "Validation endpoint configured to fail N times then succeed"
        test_steps:
          - step: 1
            action: "Configure a mock validation endpoint that returns failure for the first 2 attempts, then success"
            expected: "Mock endpoint configured"
          - step: 2
            action: "Invoke the validation loop"
            expected: "Loop retries and eventually succeeds"
          - step: 3
            action: "Count the number of attempts made"
            expected: "Exactly 3 attempts recorded (2 failures + 1 success)"
        assertions:
          - "Validation loop completes successfully"
          - "Number of retry attempts matches expected count"
        classification:
          component: "cli"
          function_under_test: "runAgent"

  # ---------------------------------------------------------------------------
  # Requirement Group 2: Binary download and checksum verification
  # ---------------------------------------------------------------------------
  - id: "RG-02"
    requirement: "Binary download and checksum verification ensures integrity of cross-compiled binaries"
    jira_id: "GH-73"
    scenarios:

      - id: "GH-73-TC-006"
        title: "Verify release download with valid checksum"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective: >
          Confirm that DownloadRelease successfully downloads a release archive
          when the server-provided SHA256 checksum matches the archive content.
        common_preconditions:
          - "httptest server serving a valid tar.gz archive"
          - "Corresponding SHA256 checksums file available at expected URL"
        test_steps:
          - step: 1
            action: "Create a valid tar.gz archive in memory with known content"
            expected: "Archive created"
          - step: 2
            action: "Compute SHA256 checksum of the archive"
            expected: "Checksum computed"
          - step: 3
            action: "Start httptest server serving the archive and checksums file"
            expected: "Server listening"
          - step: 4
            action: "Call DownloadRelease with ReleaseBaseURL pointing to httptest server"
            expected: "Function returns extracted content without error"
          - step: 5
            action: "Verify extracted files match original archive content"
            expected: "Files match"
        assertions:
          - "DownloadRelease returns nil error"
          - "Extracted files are present in the target directory"
          - "File contents match the original archive entries"
        classification:
          component: "binary"
          function_under_test: "DownloadRelease"

      - id: "GH-73-TC-007"
        title: "Verify rejection of tampered archive"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective: >
          Confirm that DownloadRelease rejects an archive whose SHA256
          checksum does not match the checksums file.
        common_preconditions:
          - "httptest server serving a tar.gz archive"
          - "Checksums file contains a different (wrong) SHA256 value"
        test_steps:
          - step: 1
            action: "Create a tar.gz archive"
            expected: "Archive created"
          - step: 2
            action: "Create a checksums file with an incorrect SHA256 value"
            expected: "Checksums file created"
          - step: 3
            action: "Start httptest server serving both files"
            expected: "Server listening"
          - step: 4
            action: "Call DownloadRelease"
            expected: "Function returns a checksum mismatch error"
        assertions:
          - "DownloadRelease returns a non-nil error"
          - "Error message indicates checksum mismatch"
          - "No files are extracted to the target directory"
        classification:
          component: "binary"
          function_under_test: "DownloadRelease"

      - id: "GH-73-TC-008"
        title: "Verify rejection of oversized download"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective: >
          Confirm that DownloadRelease rejects archives that exceed the
          200MB compressed size limit.
        common_preconditions:
          - "httptest server configured to serve a response with Content-Length exceeding 200MB"
        test_steps:
          - step: 1
            action: "Configure httptest server to advertise Content-Length > 200MB"
            expected: "Server configured"
          - step: 2
            action: "Call DownloadRelease"
            expected: "Function returns a size limit error"
        assertions:
          - "DownloadRelease returns a non-nil error"
          - "Error message references size limit exceeded"
        classification:
          component: "binary"
          function_under_test: "DownloadRelease"

      - id: "GH-73-TC-009"
        title: "Verify latest release tag resolution"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective: >
          Confirm that when no explicit version is specified, DownloadRelease
          resolves and uses the latest release tag from the GitHub API.
        common_preconditions:
          - "httptest server serving GitHub Releases API response with tagged releases"
        test_steps:
          - step: 1
            action: "Configure httptest server with a mock GitHub Releases API listing multiple tags"
            expected: "Server configured"
          - step: 2
            action: "Call DownloadRelease without specifying a version"
            expected: "Function resolves the latest tag"
          - step: 3
            action: "Verify the resolved tag matches the expected latest release"
            expected: "Tag matches"
        assertions:
          - "Resolved tag equals the most recent release tag from the API"
          - "Download URL includes the resolved tag"
        classification:
          component: "binary"
          function_under_test: "DownloadRelease"

      - id: "GH-73-TC-010"
        title: "Verify source tree extraction strips root prefix"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective: >
          Confirm that when extracting a source tree from a tar archive, the
          root directory prefix is stripped so files appear at the target root.
        common_preconditions:
          - "tar.gz archive with a single root directory prefix (e.g., fullsend-v1.0.0/)"
        test_steps:
          - step: 1
            action: "Create a tar.gz with entries under a root prefix (e.g., fullsend-v1.0.0/main.go)"
            expected: "Archive created"
          - step: 2
            action: "Extract using the source tree extraction function"
            expected: "Files extracted"
          - step: 3
            action: "Check that files appear without the root prefix"
            expected: "main.go exists at target root, not under fullsend-v1.0.0/"
        assertions:
          - "Extracted file paths do not contain the root prefix"
          - "File contents are intact after extraction"
        classification:
          component: "binary"
          function_under_test: "extractSourceTree"

  # ---------------------------------------------------------------------------
  # Requirement Group 3: Vendor source root resolution
  # ---------------------------------------------------------------------------
  - id: "RG-03"
    requirement: "Vendor source root resolution falls back through local checkout, module root, and remote fetch"
    jira_id: "GH-73"
    scenarios:

      - id: "GH-73-TC-011"
        title: "Verify explicit source dir takes precedence"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that when an explicit source directory is provided,
          ResolveVendorRoot uses it without checking ModuleRoot or fetching remotely.
        common_preconditions:
          - "Temp directory created with valid Go source files"
        test_steps:
          - step: 1
            action: "Create a temp directory with a go.mod file"
            expected: "Directory created"
          - step: 2
            action: "Call ResolveVendorRoot with the explicit source dir path"
            expected: "Function returns the explicit path"
          - step: 3
            action: "Verify no network calls were made"
            expected: "No HTTP requests recorded"
        assertions:
          - "Returned path equals the explicitly provided source directory"
          - "No fallback mechanisms were invoked"
        classification:
          component: "binary"
          function_under_test: "ResolveVendorRoot"

      - id: "GH-73-TC-012"
        title: "Verify fallback to ModuleRoot"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that when no explicit source dir is provided but the binary
          is a release build, ResolveVendorRoot falls back to ModuleRoot.
        common_preconditions:
          - "No explicit source dir provided"
          - "Binary built as release (not dev)"
          - "ModuleRoot returns a valid path"
        test_steps:
          - step: 1
            action: "Call ResolveVendorRoot without an explicit source dir, with a release binary"
            expected: "Function falls back to ModuleRoot"
          - step: 2
            action: "Verify the returned path matches ModuleRoot output"
            expected: "Paths match"
        assertions:
          - "Returned path equals the ModuleRoot value"
        classification:
          component: "binary"
          function_under_test: "ResolveVendorRoot"

      - id: "GH-73-TC-013"
        title: "Verify fallback to GitHub source fetch"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that when no explicit source dir is provided and ModuleRoot
          is unavailable, ResolveVendorRoot fetches source from GitHub releases.
        common_preconditions:
          - "No explicit source dir provided"
          - "ModuleRoot returns empty/error"
          - "httptest server serving source archive"
        test_steps:
          - step: 1
            action: "Configure ModuleRoot to return an error or empty string"
            expected: "ModuleRoot fallback disabled"
          - step: 2
            action: "Start httptest server serving source tree archive"
            expected: "Server listening"
          - step: 3
            action: "Call ResolveVendorRoot"
            expected: "Function fetches source from remote"
          - step: 4
            action: "Verify returned path contains fetched source files"
            expected: "Source files present"
        assertions:
          - "Returned path contains extracted source files"
          - "HTTP request was made to the release URL"
        classification:
          component: "binary"
          function_under_test: "ResolveVendorRoot"

      - id: "GH-73-TC-014"
        title: "Verify error for dev build without checkout"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that ResolveVendorRoot returns an error when the binary is
          a dev build and no local checkout is available.
        common_preconditions:
          - "Binary is a dev build (no version embedded)"
          - "No local git checkout available"
        test_steps:
          - step: 1
            action: "Configure binary as dev build with no local checkout"
            expected: "Configuration set"
          - step: 2
            action: "Call ResolveVendorRoot"
            expected: "Function returns an error"
        assertions:
          - "ResolveVendorRoot returns a non-nil error"
          - "Error message indicates dev build requires a local checkout"
        classification:
          component: "binary"
          function_under_test: "ResolveVendorRoot"

  # ---------------------------------------------------------------------------
  # Requirement Group 4: Post-review CLI
  # ---------------------------------------------------------------------------
  - id: "RG-04"
    requirement: "Post-review CLI correctly handles stale-head detection and inline diff comments"
    jira_id: "GH-73"
    scenarios:

      - id: "GH-73-TC-015"
        title: "Verify stale-head detection discards review"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that when the PR head SHA has changed since the review
          started, the review is discarded to avoid commenting on outdated code.
        common_preconditions:
          - "Fake forge client configured"
          - "PR head SHA differs from the SHA recorded at review start"
        test_steps:
          - step: 1
            action: "Configure forge client to return a different head SHA than the review's recorded SHA"
            expected: "Head SHA mismatch configured"
          - step: 2
            action: "Call submitFormalReview with the stale SHA"
            expected: "Function detects stale head and skips review submission"
        assertions:
          - "No review is submitted to the forge"
          - "Function returns without error (graceful skip)"
          - "Log output indicates stale head detected"
        classification:
          component: "cli"
          function_under_test: "submitFormalReview"

      - id: "GH-73-TC-016"
        title: "Verify inline comments map to diff hunks"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that findingsToReviewComments correctly maps findings to
          inline review comments positioned within the correct diff hunks.
        common_preconditions:
          - "Diff hunks available for the target file"
          - "Findings reference line numbers within hunk ranges"
        test_steps:
          - step: 1
            action: "Create diff hunks for a file covering lines 10-20 and 50-60"
            expected: "Hunks created"
          - step: 2
            action: "Create findings at lines 15 and 55"
            expected: "Findings created"
          - step: 3
            action: "Call findingsToReviewComments"
            expected: "Each finding maps to the correct hunk"
          - step: 4
            action: "Verify the review comments have correct line positions"
            expected: "Line positions match the finding line numbers"
        assertions:
          - "Number of review comments equals number of findings"
          - "Each comment references the correct file path"
          - "Each comment line number falls within the corresponding hunk range"
        classification:
          component: "cli"
          function_under_test: "findingsToReviewComments"

      - id: "GH-73-TC-017"
        title: "Verify file-level fallback for out-of-hunk lines"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that when a finding references a line outside any diff hunk,
          the comment falls back to a file-level comment instead of an inline one.
        common_preconditions:
          - "Diff hunks for a file covering lines 10-20"
          - "Finding at line 100 (outside any hunk)"
        test_steps:
          - step: 1
            action: "Create diff hunks covering only lines 10-20"
            expected: "Hunks created"
          - step: 2
            action: "Create a finding at line 100"
            expected: "Finding created"
          - step: 3
            action: "Call findingsToReviewComments"
            expected: "Comment falls back to file-level"
        assertions:
          - "Review comment is created as a file-level comment (no line position)"
          - "Comment body includes the original line reference for context"
        classification:
          component: "cli"
          function_under_test: "findingsToReviewComments"

      - id: "GH-73-TC-018"
        title: "Verify stale reviews are minimized"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that when new reviews are submitted, previous stale reviews
          from the same bot are minimized (collapsed) to reduce noise.
        common_preconditions:
          - "Fake forge client with existing reviews from the bot user"
        test_steps:
          - step: 1
            action: "Configure forge client with 2 existing reviews from the bot"
            expected: "Previous reviews exist"
          - step: 2
            action: "Submit a new formal review"
            expected: "New review created"
          - step: 3
            action: "Check that previous reviews were minimized"
            expected: "DismissPullRequestReview called for each previous review"
        assertions:
          - "DismissPullRequestReview called for each prior bot review"
          - "New review is submitted successfully"
        classification:
          component: "cli"
          function_under_test: "submitFormalReview"

      - id: "GH-73-TC-019"
        title: "Verify COMMENT review skipped without inline findings"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that when there are no inline findings, the COMMENT review
          type is skipped entirely rather than posting an empty review.
        common_preconditions:
          - "Fake forge client configured"
          - "Review contains body text but no inline findings"
        test_steps:
          - step: 1
            action: "Create a review result with body text but zero inline findings"
            expected: "Review result created"
          - step: 2
            action: "Call submitFormalReview"
            expected: "Function skips COMMENT review submission"
        assertions:
          - "No COMMENT-type review is submitted to the forge"
          - "Function returns without error"
        classification:
          component: "cli"
          function_under_test: "submitFormalReview"

      - id: "GH-73-TC-020"
        title: "Verify error for empty review body"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that attempting to submit a review with an empty body
          returns a validation error.
        common_preconditions:
          - "Fake forge client configured"
        test_steps:
          - step: 1
            action: "Create a review result with an empty body and no findings"
            expected: "Review result created"
          - step: 2
            action: "Call submitFormalReview"
            expected: "Function returns an error"
        assertions:
          - "Function returns a non-nil error"
          - "Error indicates empty review body is not allowed"
        classification:
          component: "cli"
          function_under_test: "submitFormalReview"

  # ---------------------------------------------------------------------------
  # Requirement Group 5: Remote agent discovery
  # ---------------------------------------------------------------------------
  - id: "RG-05"
    requirement: "Remote agent discovery identifies roles and slugs from harness files in config repos"
    jira_id: "GH-73"
    scenarios:

      - id: "GH-73-TC-021"
        title: "Verify discovery parses role and slug from YAML"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that DiscoverAgents correctly parses harness YAML files
          and extracts role and slug fields from each agent definition.
        common_preconditions:
          - "Fake forge client returning directory listing with harness YAML files"
          - "YAML files contain valid role and slug fields"
        test_steps:
          - step: 1
            action: "Configure fake forge client to return a directory listing with 2 harness YAML files"
            expected: "Directory listing configured"
          - step: 2
            action: "Configure YAML content with role='reviewer' and slug='my-agent'"
            expected: "YAML content configured"
          - step: 3
            action: "Call DiscoverAgents"
            expected: "Function returns parsed agent entries"
        assertions:
          - "Returned slice contains 2 entries"
          - "First entry has correct role and slug values"
          - "No errors returned"
        classification:
          component: "harness"
          function_under_test: "DiscoverAgents"

      - id: "GH-73-TC-022"
        title: "Verify slug derivation from role and appSet"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that when a harness YAML specifies a role but no explicit
          slug, the slug is derived from the role name and appSet identifier.
        common_preconditions:
          - "Harness YAML with role field but no slug field"
          - "appSet identifier available"
        test_steps:
          - step: 1
            action: "Configure YAML with role='triage' and no slug, appSet='myapp'"
            expected: "YAML configured"
          - step: 2
            action: "Call DiscoverAgents"
            expected: "Slug is derived as '{appSet}-{role}'"
        assertions:
          - "Derived slug equals 'myapp-triage'"
        classification:
          component: "harness"
          function_under_test: "DiscoverAgents"

      - id: "GH-73-TC-023"
        title: "Verify deduplication of discovered slugs"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that when multiple harness files produce the same slug,
          DiscoverAgents deduplicates and returns unique entries only.
        common_preconditions:
          - "Multiple harness YAML files producing the same slug"
        test_steps:
          - step: 1
            action: "Configure 3 harness YAML files, 2 of which produce the same slug"
            expected: "Files configured"
          - step: 2
            action: "Call DiscoverAgents"
            expected: "Returns deduplicated list"
        assertions:
          - "Returned slice contains 2 unique entries (not 3)"
        classification:
          component: "harness"
          function_under_test: "DiscoverAgents"

      - id: "GH-73-TC-024"
