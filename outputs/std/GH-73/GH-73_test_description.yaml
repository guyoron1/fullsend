    jira_id: "GH-73"
    scenarios:

      - id: "GH-73-TC-026"
        title: "Verify add-role with slug and PEM file"
        test_type: "functional"
        priority: "P1"
        coverage_status: "NEW"
        test_objective: >
          Confirm that mint add-role correctly provisions a new role when
          given a slug and a path to a PEM private key file.
        common_preconditions:
          - "Temp PEM file with valid RSA key content"
          - "Fake forge client or mock API for role creation"
        test_steps:
          - step: 1
            action: "Create a temp PEM file with RSA key content"
            expected: "PEM file created"
          - step: 2
            action: "Call mint add-role with --slug=test-agent and --pem-file=<path>"
            expected: "Role provisioning completes"
          - step: 3
            action: "Verify the role was created with correct slug"
            expected: "Role exists with slug 'test-agent'"
        assertions:
          - "Role creation succeeds without error"
          - "Created role has the correct slug"
          - "PEM key content is associated with the role"
        classification:
          component: "cli"
          function_under_test: "mintAddRole"

      - id: "GH-73-TC-027"
        title: "Verify add-role with existing PEM secret"
        test_type: "functional"
        priority: "P1"
        coverage_status: "NEW"
