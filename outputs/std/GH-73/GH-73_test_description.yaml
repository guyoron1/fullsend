# =============================================================================
# Section 3.0 — Two-Pass Review Orchestration
# =============================================================================

sections:
  - id: "section-3.0"
    title: "Two-Pass Review Orchestration"
    scenarios:

      - scenario_id: "TC-095"
        test_id: "TS-GH73-095"
        test_type: "integration"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "PR with diff exceeding large-PR threshold triggers two review passes"
          what: "Verify that when a PR diff exceeds the configured large-PR threshold, the review agent is dispatched twice with the second pass receiving first-pass context"
          why: "Two-pass review is the core feature — large PRs must trigger the second refinement pass to improve review quality"
          acceptance_criteria:
            - "Review agent dispatched exactly twice"
            - "Second pass receives first-pass context (findings from pass 1)"
            - "Final review reflects merged output from both passes"
        test_steps:
          setup:
            - "Create a FakeClient with a PR whose diff size exceeds the large-PR threshold"
            - "Configure the two-pass review strategy with a known threshold value"
          test_execution:
            - "Invoke the review orchestration with the large PR"
            - "Capture the dispatch count and pass context"
          cleanup:
            - "No cleanup required (in-memory state)"
        assertions:
          - "assert.Equal(t, 2, dispatchCount)"
          - "assert.NotNil(t, secondPassContext.FirstPassFindings)"

      - scenario_id: "TC-096"
        test_id: "TS-GH73-096"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "PR with diff below threshold triggers single pass"
          what: "Verify that when a PR diff is below the large-PR threshold, only a single review pass is dispatched"
          why: "Small PRs should not incur the overhead of a second review pass"
          acceptance_criteria:
            - "Review agent dispatched exactly once"
            - "No second-pass dispatch occurs"
        test_steps:
          setup:
            - "Create a FakeClient with a PR whose diff size is below the large-PR threshold"
          test_execution:
            - "Invoke the review orchestration with the small PR"
            - "Capture the dispatch count"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.Equal(t, 1, dispatchCount)"

      - scenario_id: "TC-097"
        test_id: "TS-GH73-097"
        test_type: "integration"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "Second pass produces findings that refine first-pass findings"
          what: "Verify that the second pass can refine or override first-pass findings, and the final review comment reflects the merged result"
          why: "The value of two-pass review is in refinement — the second pass should produce a higher-quality merged output"
          acceptance_criteria:
            - "Final review comment reflects merged findings from both passes"
            - "Second-pass refinements override or augment first-pass findings"
        test_steps:
          setup:
            - "Create a FakeClient with a large PR"
            - "Configure first-pass to return a set of initial findings"
            - "Configure second-pass to return refined findings"
          test_execution:
            - "Run the full two-pass orchestration"
            - "Capture the final merged review comment"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.Contains(t, finalComment, expectedRefinedFinding)"
          - "assert.NotContains(t, finalComment, overriddenFirstPassFinding)"

      - scenario_id: "TC-098"
        test_id: "TS-GH73-098"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective:
          title: "First pass fails; second pass not dispatched"
          what: "Verify that when the first review pass fails with an error, the second pass is not dispatched and the error propagates"
          why: "A failed first pass means no context for a second pass — the error must propagate cleanly"
          acceptance_criteria:
            - "Error from first pass is returned to caller"
            - "No second pass dispatch attempted"
        test_steps:
          setup:
            - "Create a FakeClient configured to return an error on the first dispatch"
          test_execution:
            - "Invoke the review orchestration"
            - "Capture the returned error and dispatch count"
          cleanup:
            - "No cleanup required"
        assertions:
          - "require.Error(t, err)"
          - "assert.Equal(t, 1, dispatchCount)"

  # ===========================================================================
  # Section 3.1 — Post-Review — Review Result Parsing
  # ===========================================================================

  - id: "section-3.1"
    title: "Post-Review — Review Result Parsing"
    scenarios:

      - scenario_id: "TC-001"
        test_id: "TS-GH73-001"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "Parse valid JSON with body and action"
          what: "Verify that parseReviewResult correctly parses valid JSON containing body and action fields into a ReviewResult struct"
          why: "Review result parsing is the entry point for all review input — correct JSON parsing is fundamental"
          acceptance_criteria:
            - "Returns ReviewResult with body matching JSON body field"
            - "Returns ReviewResult with action matching JSON action field"
            - "No error returned"
        test_steps:
          setup:
            - "Create JSON string with body='Review looks good' and action='approve'"
          test_execution:
            - "Call parseReviewResult with the JSON string"
          cleanup:
            - "No cleanup required"
        assertions:
          - "require.NoError(t, err)"
          - "assert.Equal(t, 'Review looks good', result.Body)"
          - "assert.Equal(t, 'approve', result.Action)"

      - scenario_id: "TC-002"
        test_id: "TS-GH73-002"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "Parse plain text input (non-JSON)"
          what: "Verify that parseReviewResult treats non-JSON input as plain text body with action defaulting to 'comment'"
          why: "Backward compatibility — plain text review output must be handled gracefully"
          acceptance_criteria:
            - "Returns ReviewResult with body equal to the input string"
            - "Action defaults to 'comment'"
            - "No error returned"
        test_steps:
          setup:
            - "Create a plain text string 'This is a review comment'"
          test_execution:
            - "Call parseReviewResult with the plain text string"
          cleanup:
            - "No cleanup required"
        assertions:
          - "require.NoError(t, err)"
          - "assert.Equal(t, 'This is a review comment', result.Body)"
          - "assert.Equal(t, 'comment', result.Action)"

      - scenario_id: "TC-003"
        test_id: "TS-GH73-003"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective:
          title: "Parse JSON with missing action field"
          what: "Verify that parseReviewResult defaults action to 'comment' when the action field is absent from JSON"
          why: "Graceful handling of incomplete JSON input prevents review pipeline failures"
          acceptance_criteria:
            - "Action defaults to 'comment'"
            - "Body is correctly parsed"
        test_steps:
          setup:
            - "Create JSON string with only body field, no action"
          test_execution:
            - "Call parseReviewResult with the JSON string"
          cleanup:
            - "No cleanup required"
        assertions:
          - "require.NoError(t, err)"
          - "assert.Equal(t, 'comment', result.Action)"

      - scenario_id: "TC-004"
        test_id: "TS-GH73-004"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "Parse JSON with empty body and non-failure action"
          what: "Verify that parseReviewResult returns an error when body is empty and action is not 'failure'"
          why: "Non-failure actions require a review body — empty body indicates a broken review pipeline"
          acceptance_criteria:
            - "Returns error containing 'empty body'"
        test_steps:
          setup:
            - "Create JSON with body='' and action='approve'"
          test_execution:
            - "Call parseReviewResult with the JSON string"
          cleanup:
            - "No cleanup required"
        assertions:
          - "require.Error(t, err)"
          - "assert.Contains(t, err.Error(), 'empty body')"

      - scenario_id: "TC-005"
        test_id: "TS-GH73-005"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "Parse JSON with action='failure' and empty body"
          what: "Verify that parseReviewResult succeeds when action is 'failure' even with an empty body"
          why: "Failure actions represent pipeline errors — they may not have a review body"
          acceptance_criteria:
            - "No error returned"
            - "Action is 'failure'"
            - "Body is empty"
        test_steps:
          setup:
            - "Create JSON with body='' and action='failure'"
          test_execution:
            - "Call parseReviewResult with the JSON string"
          cleanup:
            - "No cleanup required"
        assertions:
          - "require.NoError(t, err)"
          - "assert.Equal(t, 'failure', result.Action)"
          - "assert.Empty(t, result.Body)"

      - scenario_id: "TC-006"
        test_id: "TS-GH73-006"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective:
          title: "Parse JSON with head_sha field"
          what: "Verify that parseReviewResult correctly extracts the HeadSHA field from JSON"
          why: "HeadSHA is used for stale-head detection — must be parsed correctly"
          acceptance_criteria:
            - "HeadSHA field correctly populated from JSON"
        test_steps:
          setup:
            - "Create JSON with head_sha='abc123def456...'"
          test_execution:
            - "Call parseReviewResult with the JSON string"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.Equal(t, expectedSHA, result.HeadSHA)"

      - scenario_id: "TC-007"
        test_id: "TS-GH73-007"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective:
          title: "Parse JSON with findings array"
          what: "Verify that parseReviewResult correctly deserializes a findings array with all fields (file, line, severity, message, remediation)"
          why: "Findings drive inline comment placement — all fields must be preserved"
          acceptance_criteria:
            - "Findings array has correct length"
            - "Each finding has all fields populated correctly"
        test_steps:
          setup:
            - "Create JSON with findings array containing 2 findings with all fields"
          test_execution:
            - "Call parseReviewResult with the JSON string"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.Len(t, result.Findings, 2)"
          - "assert.Equal(t, 'main.go', result.Findings[0].File)"
          - "assert.Equal(t, 42, result.Findings[0].Line)"

  # ===========================================================================
  # Section 3.2 — Post-Review — Stale Head Detection
  # ===========================================================================

  - id: "section-3.2"
    title: "Post-Review — Stale Head Detection"
    scenarios:

      - scenario_id: "TC-008"
        test_id: "TS-GH73-008"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "PR HEAD matches reviewed SHA — stale=false"
          what: "Verify that checkStaleHead returns stale=false when the PR HEAD matches the reviewed SHA"
          why: "The review is still valid when HEAD has not moved — must not block review submission"
          acceptance_criteria:
            - "stale is false"
            - "currentSHA equals PR HEAD"
        test_steps:
          setup:
            - "Create FakeClient with PR HEAD set to 'abc123'"
            - "Set reviewed SHA to 'abc123'"
          test_execution:
            - "Call checkStaleHead with the FakeClient, repo, PR number, and reviewed SHA"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.False(t, stale)"
          - "assert.Equal(t, 'abc123', currentSHA)"

      - scenario_id: "TC-009"
        test_id: "TS-GH73-009"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "PR HEAD differs from reviewed SHA — stale=true"
          what: "Verify that checkStaleHead returns stale=true when the PR HEAD differs from the reviewed SHA"
          why: "Stale-head detection is a safety gate — must detect when code has changed since review"
          acceptance_criteria:
            - "stale is true"
            - "currentSHA equals the new HEAD"
        test_steps:
          setup:
            - "Create FakeClient with PR HEAD set to 'def456'"
            - "Set reviewed SHA to 'abc123'"
          test_execution:
            - "Call checkStaleHead with the FakeClient, repo, PR number, and reviewed SHA"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.True(t, stale)"
          - "assert.Equal(t, 'def456', currentSHA)"

      - scenario_id: "TC-010"
        test_id: "TS-GH73-010"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective:
          title: "Dry-run mode — stale=false without API call"
          what: "Verify that in dry-run mode, checkStaleHead returns stale=false without making any API calls"
          why: "Dry-run must not interact with the forge API"
          acceptance_criteria:
            - "stale is false"
            - "No API calls made to FakeClient"
        test_steps:
          setup:
            - "Create FakeClient with PR HEAD set to 'def456' (different from reviewed SHA)"
            - "Enable dry-run mode"
          test_execution:
            - "Call checkStaleHead with dry-run enabled"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.False(t, stale)"
          - "assert.Empty(t, fakeClient.Calls)"

      - scenario_id: "TC-011"
        test_id: "TS-GH73-011"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective:
          title: "Case-insensitive SHA comparison"
          what: "Verify that checkStaleHead treats uppercase and lowercase hex SHAs as matching"
          why: "Git SHAs are case-insensitive hex — comparison must normalize case"
          acceptance_criteria:
            - "stale is false when SHAs differ only in case"
        test_steps:
          setup:
            - "Create FakeClient with PR HEAD set to 'ABC123DEF'"
            - "Set reviewed SHA to 'abc123def'"
          test_execution:
            - "Call checkStaleHead with the mismatched-case SHAs"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.False(t, stale)"

      - scenario_id: "TC-012"
        test_id: "TS-GH73-012"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "Stale-head notice posted when HEAD moved"
          what: "Verify that when stale head is detected, a failure comment containing 'stale-head' and both SHAs is posted"
          why: "Users must be informed why the review was not posted"
          acceptance_criteria:
            - "Comment posted to PR containing 'stale-head'"
            - "Comment contains both the reviewed SHA and current HEAD SHA"
        test_steps:
          setup:
            - "Create FakeClient with PR HEAD different from reviewed SHA"
          test_execution:
            - "Trigger the stale-head notice posting flow"
            - "Capture the comment posted to FakeClient"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.Contains(t, postedComment, 'stale-head')"
          - "assert.Contains(t, postedComment, reviewedSHA)"
          - "assert.Contains(t, postedComment, currentSHA)"

      - scenario_id: "TC-013"
        test_id: "TS-GH73-013"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "staleHeadError returns StaleHeadExitCode (10)"
          what: "Verify that staleHeadError implements the ExitCoder interface and returns exit code 10"
          why: "Exit code 10 drives re-dispatch in the shell wrapper — must be exactly 10"
          acceptance_criteria:
            - "ExitCode() returns 10"
            - "Error message contains both SHAs"
        test_steps:
          setup:
            - "Create a staleHeadError with reviewed and current SHAs"
          test_execution:
            - "Call ExitCode() on the error"
            - "Call Error() on the error"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.Equal(t, 10, err.ExitCode())"
          - "assert.Contains(t, err.Error(), reviewedSHA)"
          - "assert.Contains(t, err.Error(), currentSHA)"

  # ===========================================================================
  # Section 3.3 — Post-Review — Formal Review Submission
  # ===========================================================================

  - id: "section-3.3"
    title: "Post-Review — Formal Review Submission"
    scenarios:

      - scenario_id: "TC-014"
        test_id: "TS-GH73-014"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "Submit APPROVE review"
          what: "Verify that submitFormalReview creates a review with event=APPROVE and empty body"
          why: "APPROVE is the happy-path outcome — must submit correctly to unblock PR merge"
          acceptance_criteria:
            - "Review created with event APPROVE"
            - "Review body is empty"
        test_steps:
          setup:
            - "Create FakeClient"
            - "Create ReviewResult with action='approve'"
          test_execution:
            - "Call submitFormalReview with the ReviewResult"
            - "Capture the review created on FakeClient"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.Equal(t, 'APPROVE', createdReview.Event)"
          - "assert.Empty(t, createdReview.Body)"

      - scenario_id: "TC-015"
        test_id: "TS-GH73-015"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "Submit REQUEST_CHANGES with comment URL"
          what: "Verify that submitFormalReview creates a REQUEST_CHANGES review with body linking to the sticky comment"
          why: "The review body should direct users to the full review comment for details"
          acceptance_criteria:
            - "Review event is REQUEST_CHANGES"
            - "Review body contains the comment URL"
        test_steps:
          setup:
            - "Create FakeClient"
            - "Create ReviewResult with action='request_changes' and a comment URL"
          test_execution:
            - "Call submitFormalReview with the ReviewResult and comment URL"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.Equal(t, 'REQUEST_CHANGES', createdReview.Event)"
          - "assert.Contains(t, createdReview.Body, commentURL)"

      - scenario_id: "TC-016"
        test_id: "TS-GH73-016"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective:
          title: "Submit REQUEST_CHANGES without comment URL"
          what: "Verify that when no comment URL is provided, the body falls back to a generic message"
          why: "Graceful degradation when sticky comment posting fails"
          acceptance_criteria:
            - "Review body contains fallback message about 'review comment above'"
        test_steps:
          setup:
            - "Create FakeClient"
            - "Create ReviewResult with action='request_changes' and empty comment URL"
          test_execution:
            - "Call submitFormalReview with empty comment URL"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.Contains(t, createdReview.Body, 'See the review comment above')"

      - scenario_id: "TC-017"
        test_id: "TS-GH73-017"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "Submit with action='reject' maps to REQUEST_CHANGES"
          what: "Verify that action='reject' is mapped to GitHub's REQUEST_CHANGES event"
          why: "The 'reject' action is an alias — must map correctly to the GitHub API event"
          acceptance_criteria:
            - "Review event is REQUEST_CHANGES"
        test_steps:
          setup:
            - "Create ReviewResult with action='reject'"
          test_execution:
            - "Call submitFormalReview"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.Equal(t, 'REQUEST_CHANGES', createdReview.Event)"

      - scenario_id: "TC-018"
        test_id: "TS-GH73-018"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "Submit COMMENT with no inline findings"
          what: "Verify that submitFormalReview is a no-op when action is 'comment' and there are no inline-eligible findings"
          why: "Empty COMMENT reviews add noise — should be suppressed"
          acceptance_criteria:
            - "No review created on FakeClient"
        test_steps:
          setup:
            - "Create FakeClient"
            - "Create ReviewResult with action='comment' and empty findings"
          test_execution:
            - "Call submitFormalReview"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.Empty(t, fakeClient.CreatedReviews)"

      - scenario_id: "TC-019"
        test_id: "TS-GH73-019"
        test_type: "unit"
        priority: "P0"
        coverage_status: "NEW"
        test_objective:
          title: "Submit COMMENT with inline-eligible findings"
          what: "Verify that submitFormalReview submits a COMMENT review with inline comments when findings map to diff hunks"
          why: "Inline comments are the primary value of the two-pass review — must be attached to the review"
          acceptance_criteria:
            - "Review event is COMMENT"
            - "Inline comments attached to the review"
        test_steps:
          setup:
            - "Create FakeClient with PR diff containing hunks for 'main.go'"
            - "Create ReviewResult with action='comment' and findings on 'main.go' lines within hunks"
          test_execution:
            - "Call submitFormalReview"
            - "Capture the created review and its inline comments"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.Equal(t, 'COMMENT', createdReview.Event)"
          - "assert.NotEmpty(t, createdReview.Comments)"

      - scenario_id: "TC-020"
        test_id: "TS-GH73-020"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective:
          title: "Submit COMMENT when all findings filtered out"
          what: "Verify that submitFormalReview skips review submission when all findings are filtered out (not in diff)"
          why: "No useful inline comments means the review adds no value"
          acceptance_criteria:
            - "No review created on FakeClient"
        test_steps:
          setup:
            - "Create FakeClient with PR diff that does not include files from findings"
            - "Create ReviewResult with findings on files not in the diff"
          test_execution:
            - "Call submitFormalReview"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.Empty(t, fakeClient.CreatedReviews)"

      - scenario_id: "TC-021"
        test_id: "TS-GH73-021"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective:
          title: "Unknown action string skips formal review"
          what: "Verify that an unrecognized action string causes submitFormalReview to skip review submission without error"
          why: "Unknown actions should be handled gracefully — not crash the pipeline"
          acceptance_criteria:
            - "No review created"
            - "No error returned"
        test_steps:
          setup:
            - "Create ReviewResult with action='unknown_action'"
          test_execution:
            - "Call submitFormalReview"
          cleanup:
            - "No cleanup required"
        assertions:
          - "require.NoError(t, err)"
          - "assert.Empty(t, fakeClient.CreatedReviews)"

      - scenario_id: "TC-022"
        test_id: "TS-GH73-022"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective:
          title: "Dry-run mode"
          what: "Verify that submitFormalReview makes no API calls in dry-run mode"
          why: "Dry-run must be side-effect-free for safe testing"
          acceptance_criteria:
            - "No forge client methods invoked"
            - "No review created"
        test_steps:
          setup:
            - "Create FakeClient"
            - "Enable dry-run mode"
            - "Create ReviewResult with action='approve'"
          test_execution:
            - "Call submitFormalReview with dry-run=true"
          cleanup:
            - "No cleanup required"
        assertions:
          - "assert.Empty(t, fakeClient.CreatedReviews)"

      - scenario_id: "TC-023"
        test_id: "TS-GH73-023"
        test_type: "unit"
        priority: "P1"
        coverage_status: "NEW"
        test_objective:
          title: "Commit SHA passed to review API"
          what: "Verify that the commit SHA is passed to the review creation API to pin the review to a specific commit"
          why: "Pinning reviews to commits prevents race conditions where HEAD moves between check and submit"
          acceptance_criteria:
