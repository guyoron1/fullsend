scenarios:
  # =========================================================================
  # Requirement Group 1: Threshold Activation
  # GH-2096 — Security-triage pre-pass activates for large PRs at file count threshold
  # =========================================================================

  - scenario_id: "001"
    test_id: "TS-GH-2096-001"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2096"
    coverage_status: "NEW"

    test_objective:
      title: "Verify triage pre-pass runs for PR with >=50 files"
      what: |
        Tests that the security-triage pre-pass is activated when a PR contains
        50 or more changed files. The threshold check function should return true,
        indicating the triage pass should run before context assembly.
      why: |
        The 50-file threshold is the core gating mechanism for the two-pass strategy.
        If the threshold check fails, security-critical files in large PRs will not
        receive prioritized review, risking missed security issues like GH-898.
      acceptance_criteria:
        - "Threshold function returns true for PR with exactly 50 files"
        - "Threshold function returns true for PR with 100 files"
        - "Threshold function returns true for PR with 500 files"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing + testify"

    specific_preconditions: []

    test_data:
      resource_definitions:
        - name: "large_pr_file_list"
          type: "[]string"
          yaml: |
            # Generate a list of 50+ file paths
            files := make([]string, 50)
            for i := range files {
                files[i] = fmt.Sprintf("pkg/file_%d.go", i)
            }

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock PR metadata with 50+ changed files"
          command: "Construct PR file list with >=50 entries"
          validation: "File list length >= 50"
      test_execution:
        - step_id: "TEST-01"
          action: "Call threshold check function with large file list"
          command: "result := shouldRunTriage(files)"
          validation: "result == true"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Triage activation returns true for 50+ files"
        condition: "shouldRunTriage returns true when len(files) >= 50"
        failure_impact: "Security-critical files in large PRs will not receive prioritized review"

  - scenario_id: "002"
    test_id: "TS-GH-2096-002"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2096"
    coverage_status: "NEW"

    test_objective:
      title: "Verify triage pre-pass skipped for PR with <50 files"
      what: |
        Tests that the security-triage pre-pass is NOT activated when a PR contains
        fewer than 50 changed files. Small PRs should continue with the existing
        uniform-attention review strategy.
      why: |
        Running the triage pre-pass on small PRs adds unnecessary latency without
        benefit. The uniform-attention approach is sufficient for small PRs where
        all files can receive adequate review context.
      acceptance_criteria:
        - "Threshold function returns false for PR with 49 files"
        - "Threshold function returns false for PR with 1 file"
        - "Threshold function returns false for PR with 0 files"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing + testify"

    specific_preconditions: []

    test_data:
      resource_definitions:
        - name: "small_pr_file_list"
          type: "[]string"
          yaml: |
            files := make([]string, 49)
            for i := range files {
                files[i] = fmt.Sprintf("pkg/file_%d.go", i)
            }

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock PR metadata with <50 changed files"
          command: "Construct PR file list with 49 entries"
          validation: "File list length < 50"
      test_execution:
        - step_id: "TEST-01"
          action: "Call threshold check function with small file list"
          command: "result := shouldRunTriage(files)"
          validation: "result == false"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Triage activation returns false for <50 files"
        condition: "shouldRunTriage returns false when len(files) < 50"
        failure_impact: "Small PRs would unnecessarily run the triage pre-pass"

  - scenario_id: "003"
    test_id: "TS-GH-2096-003"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2096"
    coverage_status: "NEW"

    test_objective:
      title: "Verify behavior at exact threshold boundary (50 files)"
      what: |
        Tests the exact boundary condition at 50 files to ensure the threshold
        is inclusive (>=50 activates triage, not >50). This validates the
        off-by-one correctness of the threshold comparison.
      why: |
        Boundary conditions are a common source of bugs. The threshold must be
        precisely defined and tested to avoid ambiguity about whether 50 is
        above or at the threshold.
      acceptance_criteria:
        - "Threshold function returns true for exactly 50 files"
        - "Threshold function returns false for exactly 49 files"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing + testify"

    specific_preconditions: []

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create file lists of exactly 49 and 50 files"
          command: "Create boundary test data"
          validation: "Lists have exact counts"
      test_execution:
        - step_id: "TEST-01"
          action: "Call threshold check with exactly 50 files"
          command: "result50 := shouldRunTriage(files50)"
          validation: "result50 == true"
        - step_id: "TEST-02"
          action: "Call threshold check with exactly 49 files"
          command: "result49 := shouldRunTriage(files49)"
          validation: "result49 == false"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Boundary at exactly 50 activates triage"
        condition: "shouldRunTriage returns true for len(files) == 50"
        failure_impact: "Off-by-one error in threshold comparison"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Boundary at exactly 49 does not activate triage"
        condition: "shouldRunTriage returns false for len(files) == 49"
        failure_impact: "Off-by-one error in threshold comparison"

  # =========================================================================
  # Requirement Group 2: File Classification
  # GH-2096 — Security-triage sub-agent classifies files correctly
  # =========================================================================

  - scenario_id: "004"
    test_id: "TS-GH-2096-004"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2096"
    coverage_status: "NEW"

    test_objective:
      title: "Verify mint/auth/oidc paths classified as security-critical"
      what: |
        Tests that files in known security-sensitive paths (mint, auth, oidc
        directories) are classified as security-critical by the triage logic.
        Path patterns include **/mint/**, **/auth/**, **/oidc/**.
      why: |
        These directories contain authentication, authorization, and token handling
        logic. Missing security-critical classification for these paths directly
        caused the GH-898 fail-open bug.
      acceptance_criteria:
        - "Files under internal/mint/ classified as security-critical"
        - "Files under internal/auth/ classified as security-critical"
        - "Files matching **/oidc/** classified as security-critical"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing + testify"

    specific_preconditions: []

    test_data:
      resource_definitions:
        - name: "security_paths"
          type: "[]string"
          yaml: |
            paths:
              - "internal/mint/handler.go"
              - "internal/mintcore/wif.go"
              - "internal/auth/oauth.go"
              - "cmd/oidc/provider.go"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create list of known security-sensitive file paths"
          command: "Define test paths for mint, auth, oidc directories"
          validation: "Paths cover all security-sensitive directories"
      test_execution:
        - step_id: "TEST-01"
          action: "Classify each path using security classification function"
          command: "result := classifyFile(path)"
          validation: "All paths classified as security-critical"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "All security-sensitive paths classified as critical"
        condition: "classifyFile returns security-critical for mint/auth/oidc paths"
        failure_impact: "Security-critical files would receive standard-priority review"

  - scenario_id: "005"
    test_id: "TS-GH-2096-005"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2096"
    coverage_status: "NEW"

    test_objective:
      title: "Verify workflow files with permissions blocks classified as security-critical"
      what: |
        Tests that GitHub Actions workflow files containing permissions blocks
        are classified as security-critical via content heuristic analysis.
        The classifier should inspect diff content for permission-related keywords.
      why: |
        Workflow permission changes can escalate or reduce access. Content heuristics
        catch security-relevant changes that path patterns alone would miss.
      acceptance_criteria:
        - "Workflow file with 'permissions:' block classified as security-critical"
        - "Workflow file without permissions block classified as standard"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing + testify"

    specific_preconditions: []

    test_data:
      resource_definitions:
        - name: "workflow_with_permissions"
          type: "DiffSummary"
          yaml: |
            file: ".github/workflows/deploy.yml"
            diff_summary: |
              +permissions:
              +  contents: write
              +  id-token: write

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock diff summaries for workflow files"
          command: "Build diff content with and without permission blocks"
          validation: "Test data covers both cases"
      test_execution:
        - step_id: "TEST-01"
          action: "Classify workflow file with permissions block"
          command: "result := classifyFileWithContent(path, diffContent)"
          validation: "Classified as security-critical"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Permissions-containing workflow file is security-critical"
        condition: "Content heuristic detects permissions block and classifies as critical"
        failure_impact: "Permission escalation changes would receive standard review"

  - scenario_id: "006"
    test_id: "TS-GH-2096-006"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2096"
    coverage_status: "NEW"

    test_objective:
      title: "Verify non-security files classified as standard"
      what: |
        Tests that files in non-security paths (documentation, tests, UI components,
        configuration) are classified as standard by the triage logic.
      why: |
        Accurate standard classification ensures that security-critical files are not
        diluted by false positives from non-security paths. Too many false positives
        would negate the benefit of the two-pass strategy.
      acceptance_criteria:
        - "Documentation files (*.md) classified as standard"
        - "Test files (*_test.go) classified as standard"
        - "UI components (web/*) classified as standard"
        - "Configuration files (*.yaml, *.json) classified as standard"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing + testify"

    specific_preconditions: []

    test_data:
      resource_definitions:
        - name: "standard_paths"
          type: "[]string"
          yaml: |
            paths:
              - "docs/guide.md"
              - "internal/cli/run_test.go"
              - "web/components/Button.tsx"
              - "config/settings.yaml"
              - "README.md"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create list of non-security file paths"
          command: "Define standard file paths"
          validation: "Paths cover various non-security categories"
      test_execution:
        - step_id: "TEST-01"
          action: "Classify each path using security classification function"
          command: "result := classifyFile(path)"
          validation: "All paths classified as standard"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Non-security paths classified as standard"
        condition: "classifyFile returns standard for docs/tests/UI/config paths"
        failure_impact: "False positives would dilute security-critical review context"

  - scenario_id: "007"
    test_id: "TS-GH-2096-007"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2096"
    coverage_status: "NEW"

    test_objective:
      title: "Verify ambiguous files default to security-critical"
      what: |
        Tests that files which cannot be clearly classified as standard are
        defaulted to security-critical. The design intentionally errs on inclusion
        to avoid false negatives (missed security files).
      why: |
        False negatives (missing actual security-critical files) are worse than
        false positives (over-including standard files). Defaulting to critical
        ensures maximum security coverage at the cost of some extra review context.
      acceptance_criteria:
        - "Files mentioning auth keywords in diff default to security-critical"
        - "Files in unknown directories default to security-critical"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing + testify"

    specific_preconditions: []

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create files with ambiguous security relevance"
          command: "Build diff content with auth-related keywords in non-security paths"
          validation: "Files are genuinely ambiguous in classification"
      test_execution:
        - step_id: "TEST-01"
          action: "Classify ambiguous file"
          command: "result := classifyFileWithContent(ambiguousPath, ambiguousDiff)"
          validation: "Classified as security-critical"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Ambiguous files default to security-critical"
        condition: "Classification errs on the side of inclusion"
        failure_impact: "False negatives could cause missed security issues"

  # =========================================================================
  # Requirement Group 3: Context Assembly
  # GH-2096 — Security-prioritized context packages assemble correctly
  # =========================================================================

  - scenario_id: "008"
    test_id: "TS-GH-2096-008"
    test_type: "functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2096"
    coverage_status: "NEW"

    test_objective:
      title: "Verify security sub-agent receives critical files first"
      what: |
        Tests that the security review sub-agent's context package contains
        security-critical files placed before standard files, ensuring the
        security sub-agent allocates its reasoning budget to critical files first.
      why: |
        Prioritized ordering ensures the security sub-agent focuses on the most
        important files even if it runs out of context window. This directly
        addresses the root cause of the GH-898 incident.
      acceptance_criteria:
        - "Security sub-agent context has critical files before standard files"
        - "Critical files section is clearly demarcated with headers"
        - "All security-critical files appear in the context"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Go testing + testify"

    specific_preconditions:
      - name: "Triage classification output"
        requirement: "Valid triage JSON with both critical and standard files"
        validation: "Triage output parses successfully"

    test_data:
      resource_definitions:
        - name: "triage_output"
          type: "TriageResult"
          yaml: |
            security_critical_files:
              - file: "internal/mint/handler.go"
                reason: "Token handling logic"
              - file: "internal/mintcore/wif.go"
                reason: "WIF verification"
            standard_files:
              - "docs/README.md"
              - "web/index.html"
            summary: "2 security-critical files identified"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock triage result with mixed classifications"
          command: "Build TriageResult struct with critical and standard files"
          validation: "Triage result has both categories populated"
      test_execution:
        - step_id: "TEST-01"
          action: "Assemble context package for security sub-agent"
          command: "ctx := assembleSecurityContext(triageResult, allDiffs)"
          validation: "Context package is non-empty"
        - step_id: "TEST-02"
          action: "Verify critical files appear before standard files"
          command: "criticalIdx := strings.Index(ctx, criticalFile); standardIdx := strings.Index(ctx, standardFile)"
          validation: "criticalIdx < standardIdx"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Critical files ordered before standard files in security context"
        condition: "Index of first critical file < index of first standard file"
        failure_impact: "Security sub-agent may exhaust reasoning budget on boilerplate"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "All security-critical files present in context"
        condition: "All files from triage.security_critical_files appear in context"
        failure_impact: "Some security-critical files would not receive prioritized review"

  - scenario_id: "009"
    test_id: "TS-GH-2096-009"
    test_type: "functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2096"
    coverage_status: "NEW"

    test_objective:
      title: "Verify correctness sub-agent receives critical files first"
      what: |
        Tests that the correctness review sub-agent also receives security-critical
        files with priority ordering, since correctness review of auth/token logic
        is equally important to security review.
      why: |
        The correctness sub-agent validates logical correctness of code changes.
        Security-critical code paths need correctness review with the same
        prioritization as security review.
      acceptance_criteria:
        - "Correctness sub-agent context has critical files prioritized"
        - "Context structure matches security sub-agent format"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Go testing + testify"

    specific_preconditions: []

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock triage result"
          command: "Build TriageResult with critical and standard files"
          validation: "Triage result ready"
      test_execution:
        - step_id: "TEST-01"
          action: "Assemble context package for correctness sub-agent"
          command: "ctx := assembleCorrectnessContext(triageResult, allDiffs)"
          validation: "Critical files appear before standard files"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Correctness sub-agent receives prioritized context"
        condition: "Critical files ordered before standard files"
        failure_impact: "Correctness review would miss prioritization for security-critical code"

  - scenario_id: "010"
    test_id: "TS-GH-2096-010"
    test_type: "functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2096"
    coverage_status: "NEW"

    test_objective:
      title: "Verify other sub-agents receive standard context"
      what: |
        Tests that non-security sub-agents (e.g., style, documentation) receive
        standard context without security-prioritized ordering. These agents
        should not be affected by the triage classification.
      why: |
        The two-pass strategy should only modify context for security and correctness
        sub-agents. Other sub-agents should receive the same context they would have
        received without the feature.
      acceptance_criteria:
        - "Style sub-agent receives all files without prioritization"
        - "Documentation sub-agent receives standard context"
        - "Non-security sub-agents are unaffected by triage"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Go testing + testify"

    specific_preconditions: []

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock triage result and sub-agent list"
          command: "Build context for non-security sub-agents"
          validation: "Sub-agent list includes style and docs agents"
      test_execution:
        - step_id: "TEST-01"
          action: "Assemble context for style sub-agent"
          command: "ctx := assembleContext(\"style\", triageResult, allDiffs)"
          validation: "Context does not have priority ordering"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Non-security sub-agents receive unmodified context"
        condition: "Context assembly ignores triage classification for non-security agents"
        failure_impact: "Non-security sub-agents would receive inappropriately ordered context"

  - scenario_id: "011"
    test_id: "TS-GH-2096-011"
    test_type: "unit"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2096"
    coverage_status: "NEW"

    test_objective:
      title: "Verify classification headers present in prioritized context"
      what: |
        Tests that security-prioritized context packages include clear demarcation
        headers (e.g., "SECURITY-CRITICAL FILES" and "STANDARD FILES") to help
        the sub-agent understand the prioritization.
      why: |
        Without clear headers, the sub-agent may not understand why files are
        ordered differently, reducing the effectiveness of prioritization.
      acceptance_criteria:
        - "Context contains 'SECURITY-CRITICAL' header section"
        - "Context contains 'STANDARD' header section"
        - "Headers appear at correct positions relative to file content"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing + testify"

    specific_preconditions: []

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create triage result with both file categories"
          command: "Build TriageResult"
          validation: "Both categories populated"
      test_execution:
        - step_id: "TEST-01"
          action: "Assemble prioritized context and check for headers"
          command: "ctx := assembleSecurityContext(triageResult, allDiffs)"
          validation: "Context contains classification headers"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Security-critical header present in context"
        condition: "strings.Contains(ctx, securityCriticalHeader)"
        failure_impact: "Sub-agent may not recognize prioritized ordering"

  # =========================================================================
  # Requirement Group 4: Triage Failure Fallback
  # GH-2096 — Triage failure falls back to uniform attention safely
  # =========================================================================

  - scenario_id: "012"
    test_id: "TS-GH-2096-012"
    test_type: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2096"
    coverage_status: "NEW"

    test_objective:
      title: "Verify fallback on triage sub-agent timeout"
      what: |
        Tests that when the triage sub-agent times out, the system falls back
        to uniform attention (all files treated equally) rather than failing
        the entire review.
      why: |
        Reliability requires graceful degradation. A triage timeout should not
        block the review. The system must fall back to the pre-existing behavior
        (uniform attention) which is still a valid review approach.
      acceptance_criteria:
        - "Triage timeout triggers fallback to uniform attention"
        - "All files treated as security-critical in fallback mode"
        - "Review continues without error"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Go testing + testify"

    specific_preconditions: []

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Configure triage to simulate timeout"
          command: "Mock triage sub-agent to return timeout error"
          validation: "Timeout behavior configured"
      test_execution:
        - step_id: "TEST-01"
          action: "Run review orchestrator with triage timeout"
          command: "result := runTriageWithFallback(timeoutError, files)"
