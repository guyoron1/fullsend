      title: "Verify authorized user triggers /fs-triage successfully"
      what: |
        Tests that a user with an authorized association (OWNER, MEMBER, or COLLABORATOR)
        can successfully trigger the /fs-triage slash command via a GitHub issue comment.
        The dispatch routing should set the STAGE variable to proceed with triage.
      why: |
        Authorized users must be able to invoke triage to maintain the core product workflow.
        If authorization incorrectly blocks authorized users, the triage pipeline breaks.
      acceptance_criteria:
        - "Dispatch routing sets STAGE when comment author has OWNER association"
        - "Dispatch routing sets STAGE when comment author has MEMBER association"
        - "Dispatch routing sets STAGE when comment author has COLLABORATOR association"

