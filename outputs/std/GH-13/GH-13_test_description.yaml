          action: "Read the document's claims about ToolAllowlistPreToolHook"
          command: "Parse mcp-config-drift.md for tool allowlist hook references"
          validation: "Claims extracted: hook filters by tool names, not server endpoints"
        - step_id: "SETUP-02"
          action: "Locate the ToolAllowlistPreToolHook implementation"
          command: "grep -r 'ToolAllowlistPreToolHook\\|ToolAllowlist' internal/"
          validation: "Hook implementation file found"

      test_execution:
        - step_id: "TEST-01"
          action: "Read the hook implementation source code"
          command: "cat internal/security/hooks.go"
          validation: "Source code loaded"
        - step_id: "TEST-02"
          action: "Analyze the hook's filtering mechanism"
          command: "Search for tool name filtering logic (e.g., tool.Name, allowedTools)"
          validation: "Hook filters based on tool name identifiers"
        - step_id: "TEST-03"
          action: "Verify no server endpoint filtering exists in the hook"
          command: "Search for server URL/endpoint filtering in hook implementation"
          validation: "No endpoint-based filtering found in the hook"

