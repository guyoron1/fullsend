    code_structure: |
      func TestToolAllowlistHookClaims(t *testing.T) {
        // Setup: read document claims about ToolAllowlistPreToolHook
        // Test: grep codebase for ToolAllowlistPreToolHook implementation
        // Assert: hook filters by tool names (not server endpoints) as claimed
      }

    test_objective:
      title: "Verify the document's claims about the tool allowlist hook's operating mechanism are accurate"
      what: |
        Validates that the MCP config drift document's claims about ToolAllowlistPreToolHook are accurate.
        Specifically, the document asserts that this hook filters by tool names rather than server endpoints.
        This test reads the actual source code of the hook implementation and verifies the filtering mechanism
        matches the document's description.
      why: |
        Inaccurate claims about security hook behavior could lead engineers to build defenses on false
        assumptions. If the document incorrectly describes how the tool allowlist operates, subsequent
        security implementations based on this analysis would have architectural gaps.
      acceptance_criteria:
        - "ToolAllowlistPreToolHook exists in the codebase"
        - "The hook implementation confirms it filters by tool names"
        - "The hook does NOT filter by server endpoints, consistent with document claims"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with source code analysis"

    specific_preconditions:
