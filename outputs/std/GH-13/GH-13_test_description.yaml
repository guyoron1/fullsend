          action: "Extract all relative markdown links from the document"
          command: "Parse markdown for [text](relative/path) patterns"
          validation: "List of relative paths extracted"
        - step_id: "TEST-02"
          action: "Resolve each relative link against the document's directory"
          command: "filepath.Join(docDir, relativePath) for each link"
          validation: "All paths resolved to absolute paths"
        - step_id: "TEST-03"
          action: "Verify each resolved path exists on the filesystem"
          command: "os.Stat(resolvedPath) for each path"
          validation: "All referenced files exist (no ENOENT errors)"

      cleanup: []

