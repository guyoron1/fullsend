      func TestCrossReferencesValid(t *testing.T) {
        // Setup: locate repo root and document
        // Test: parse markdown links, verify each target file exists
        // Assert: all referenced files exist
      }

    test_objective:
      title: "Verify cross-references to security-threat-model.md, agent-architecture.md, and ADRs 0016/0017 are valid and link targets exist"
      what: |
        Validates that all cross-references within the MCP configuration drift problem document
        point to existing files in the repository. This includes references to security-threat-model.md,
        agent-architecture.md, governance.md, ADR 0016 (unidirectional control flow), and ADR 0017
        (credential isolation). Each relative markdown link is resolved and verified to exist on disk.
      why: |
        Broken cross-references undermine the document's value as a security analysis resource.
        If links to foundational ADRs or related problem docs are invalid, readers cannot follow
        the analytical chain from problem description to architectural decisions, reducing the
        document's utility for informing future defense implementations.
      acceptance_criteria:
        - "All relative markdown links in mcp-config-drift.md resolve to existing files"
        - "ADR 0016 and ADR 0017 references point to valid ADR files in the docs/adrs/ directory"
        - "References to security-threat-model.md and agent-architecture.md resolve correctly"

