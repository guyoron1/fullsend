scenarios:
  # =========================================================================
  # REQUIREMENT: Code agent pre-script detects existing human PRs and skips
  # Priority: P0
  # =========================================================================
  - scenario_id: "001"
    test_id: "TS-GH-26-001"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-26"
    variables:
      closure_scope:
        - name: "mockGH"
          type: "*MockGHCLI"
          initialized_in: "TestSetup"
          used_in: ["TestSetup", "Test"]
          comment: "Mock gh CLI that returns human PR results"
        - name: "output"
          type: "string"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Captured script output"
        - name: "err"
          type: "error"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Error from script execution"
    test_structure:
      type: "single"
      function: "TestPreCodeSkipsWhenHumanPRExists"
      subtest: false
    test_objective:
      title: "Verify pre-code skips when human PR exists"
      what: |
        Tests that pre-code.sh detects an existing open human PR addressing the
        target issue and sets the skip flag. The script queries GitHub for open
        PRs mentioning the issue number, filters out bot-authored PRs, and when
        a human PR remains, signals the workflow to skip code agent execution.
      why: |
        This is the first defense layer against duplicate PRs. If pre-code.sh
        fails to detect existing human PRs, the code agent will create a duplicate
        PR, wasting CI resources and confusing developers.
      acceptance_criteria:
        - "Script exits with code 0 when human PR exists"
        - "Script sets skipped=true in GITHUB_OUTPUT"
        - "Script logs the detected human PR URL"
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with mock gh binary"
    specific_preconditions:
      - name: "Mock gh binary"
        requirement: "Mock gh CLI returning JSON with human-authored PR"
        validation: "Mock binary exists and is executable"
    test_data:
      resource_definitions:
        - name: "human_pr_response"
          type: "JSON"
          yaml: |
            [
              {
                "number": 100,
                "author": {"login": "human-dev"},
                "url": "https://github.com/org/repo/pull/100",
                "title": "Fix issue #42",
                "state": "open"
              }
            ]
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh binary returning human PR JSON"
          command: "Create temp directory with mock gh script"
          validation: "Mock binary is executable"
      test_execution:
        - step_id: "TEST-01"
          action: "Run pre-code.sh with mock gh and target issue"
          command: "Execute pre-code.sh with ISSUE_NUMBER=42"
          validation: "Script completes without error"
        - step_id: "TEST-02"
          action: "Check GITHUB_OUTPUT for skip flag"
          command: "Read GITHUB_OUTPUT file content"
          validation: "Contains skipped=true"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temp directory and mock binaries"
          command: "os.RemoveAll(tmpDir)"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Script sets skipped=true when human PR exists"
        condition: "GITHUB_OUTPUT contains 'skipped=true'"
        failure_impact: "Code agent proceeds and creates duplicate PR"
    dependencies:
      kubernetes_resources: []
      external_tools:
        - "gh CLI (mocked)"
      scenario_specific_rbac: []

  - scenario_id: "002"
    test_id: "TS-GH-26-002"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-26"
    variables:
      closure_scope:
        - name: "issueComment"
          type: "string"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Comment body posted to the issue"
    test_structure:
      type: "single"
      function: "TestPreCodePostsSkipComment"
      subtest: false
    test_objective:
      title: "Verify skip comment posted on issue"
      what: |
        Tests that when pre-code.sh detects an existing human PR and skips,
        it posts a comment on the GitHub issue explaining why the code agent
        was not invoked, including a link to the existing PR.
      why: |
        The skip comment provides observability for maintainers. Without it,
        there is no record of why the code agent did not act on the issue.
      acceptance_criteria:
        - "Comment is posted to the target issue via gh CLI"
        - "Comment mentions the existing PR URL"
        - "Comment explains the skip reason"
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with mock gh binary"
    specific_preconditions:
      - name: "Mock gh binary"
        requirement: "Mock gh CLI capturing comment creation calls"
        validation: "Mock records gh issue comment invocations"
    test_data:
      resource_definitions: []
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh binary that records comment calls"
          command: "Create temp mock capturing args to file"
          validation: "Mock binary is executable and captures output"
      test_execution:
        - step_id: "TEST-01"
          action: "Run pre-code.sh with mock gh returning human PR"
          command: "Execute pre-code.sh with ISSUE_NUMBER=42"
          validation: "Script completes and calls gh issue comment"
        - step_id: "TEST-02"
          action: "Verify comment was posted with correct content"
          command: "Read captured mock args"
          validation: "Contains issue comment with PR reference"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temp directory"
          command: "os.RemoveAll(tmpDir)"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Skip comment posted to issue"
        condition: "Mock gh received 'issue comment' command with skip explanation"
        failure_impact: "No audit trail for skipped code agent invocations"
    dependencies:
      kubernetes_resources: []
      external_tools:
        - "gh CLI (mocked)"
      scenario_specific_rbac: []

  - scenario_id: "003"
    test_id: "TS-GH-26-003"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-26"
    variables:
      closure_scope:
        - name: "labelArgs"
          type: "[]string"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Captured label command arguments"
    test_structure:
      type: "single"
      function: "TestPreCodeAppliesPROpenLabel"
      subtest: false
    test_objective:
      title: "Verify pr-open label applied on skip"
      what: |
        Tests that when pre-code.sh skips due to an existing human PR, it
        applies the 'pr-open' label to the issue for tracking purposes.
      why: |
        The pr-open label enables issue triage dashboards to filter issues
        that already have active PRs, reducing duplicate triage effort.
      acceptance_criteria:
        - "pr-open label is applied to the issue via gh CLI"
        - "Label is applied after skip decision but before exit"
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with mock gh binary"
    specific_preconditions: []
    test_data:
      resource_definitions: []
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh binary capturing label commands"
          command: "Create temp mock"
          validation: "Mock captures 'issue edit --add-label' calls"
      test_execution:
        - step_id: "TEST-01"
          action: "Run pre-code.sh with human PR present"
          command: "Execute pre-code.sh"
          validation: "Script applies label"
        - step_id: "TEST-02"
          action: "Verify pr-open label applied"
          command: "Check captured mock invocations"
          validation: "gh issue edit --add-label pr-open was called"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temp directory"
          command: "os.RemoveAll(tmpDir)"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "pr-open label applied to issue"
        condition: "Mock received 'issue edit' with '--add-label pr-open'"
        failure_impact: "Issue tracking dashboards miss issues with active PRs"
    dependencies:
      kubernetes_resources: []
      external_tools:
        - "gh CLI (mocked)"
      scenario_specific_rbac: []

  - scenario_id: "004"
    test_id: "TS-GH-26-004"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-26"
    variables:
      closure_scope:
        - name: "githubOutput"
          type: "string"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Contents of GITHUB_OUTPUT file"
    test_structure:
      type: "single"
      function: "TestPreCodeWritesSkippedTrueToOutput"
      subtest: false
    test_objective:
      title: "Verify skipped=true written to GITHUB_OUTPUT"
      what: |
        Tests that pre-code.sh writes 'skipped=true' to the GITHUB_OUTPUT
        file when a human PR is detected, enabling downstream workflow steps
        to gate on this output.
      why: |
        The GITHUB_OUTPUT mechanism is the interface between the pre-code
        validation step and all downstream workflow steps. If this value is
        not written correctly, workflow gating fails silently.
      acceptance_criteria:
        - "GITHUB_OUTPUT file contains 'skipped=true'"
        - "Output is written in GitHub Actions key=value format"
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with mock gh binary and temp GITHUB_OUTPUT"
    specific_preconditions:
      - name: "GITHUB_OUTPUT file"
        requirement: "Writable temp file simulating GITHUB_OUTPUT"
        validation: "File exists and is writable"
    test_data:
      resource_definitions: []
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create temp GITHUB_OUTPUT file and mock gh"
          command: "Create temp file, set GITHUB_OUTPUT env var"
          validation: "Temp file exists, env var set"
      test_execution:
        - step_id: "TEST-01"
          action: "Run pre-code.sh with human PR present"
          command: "Execute pre-code.sh"
          validation: "Script completes successfully"
        - step_id: "TEST-02"
          action: "Read GITHUB_OUTPUT file"
          command: "os.ReadFile(githubOutputPath)"
          validation: "File contains 'skipped=true'"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temp files"
          command: "os.RemoveAll(tmpDir)"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "skipped=true written to GITHUB_OUTPUT"
        condition: "File content contains line 'skipped=true'"
        failure_impact: "Downstream workflow steps cannot gate on skip status"
    dependencies:
      kubernetes_resources: []
      external_tools:
        - "gh CLI (mocked)"
      scenario_specific_rbac: []

  # =========================================================================
  # REQUIREMENT: Code agent pre-script allows execution when no PRs found
  # Priority: P0
  # =========================================================================
  - scenario_id: "005"
    test_id: "TS-GH-26-005"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-26"
    variables:
      closure_scope:
        - name: "exitCode"
          type: "int"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Script exit code"
    test_structure:
      type: "single"
      function: "TestPreCodeProceedsWithNoPRs"
      subtest: false
    test_objective:
      title: "Verify agent proceeds with no existing PRs"
      what: |
        Tests that pre-code.sh allows the code agent to proceed when no
        existing open PRs are found for the target issue. The gh search
        returns an empty result set and the script does not set the skip flag.
      why: |
        This is the happy path — most issues will not have existing PRs.
        If the script incorrectly blocks on empty results, no code agent
        work can proceed.
      acceptance_criteria:
        - "Script exits successfully"
        - "Script does NOT set skipped=true"
        - "No skip comment is posted"
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with mock gh binary"
    specific_preconditions: []
    test_data:
      resource_definitions:
        - name: "empty_pr_response"
          type: "JSON"
          yaml: "[]"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh returning empty PR list"
          command: "Create mock binary echoing '[]'"
          validation: "Mock returns empty JSON array"
      test_execution:
        - step_id: "TEST-01"
          action: "Run pre-code.sh with no existing PRs"
          command: "Execute pre-code.sh"
          validation: "Script completes without setting skip"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temp directory"
          command: "os.RemoveAll(tmpDir)"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Agent proceeds when no PRs exist"
        condition: "GITHUB_OUTPUT does NOT contain 'skipped=true'"
        failure_impact: "Code agent blocked on issues with no PRs"
    dependencies:
      kubernetes_resources: []
      external_tools:
        - "gh CLI (mocked)"
      scenario_specific_rbac: []

  - scenario_id: "006"
    test_id: "TS-GH-26-006"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-26"
    variables:
      closure_scope:
