        - step_id: "SETUP-01"
          action: "Read reusable-code.yml"
          command: "Parse YAML"
          validation: "YAML parsed"
      test_execution:
        - step_id: "TEST-01"
          action: "Check GCP setup step has skip gate"
          command: "Validate 'if' conditional on GCP step"
          validation: "Condition references validate skip output"
      cleanup: []
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "GCP setup gated on validate skip output"
        condition: "GCP step 'if' includes validate.outputs.skipped != 'true'"
        failure_impact: "Wasted GCP auth calls on skipped runs"
    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

