          comment: "Contents of GITHUB_OUTPUT file"
    test_structure:
      type: "single"
      function: "TestPreCodeWritesSkippedFalseToOutput"
      subtest: false
    test_objective:
      title: "Verify skipped=false written to GITHUB_OUTPUT"
      what: |
        Tests that pre-code.sh writes 'skipped=false' to the GITHUB_OUTPUT
        file when no existing human PRs are found, explicitly signaling
        downstream steps to proceed.
      why: |
        Explicit false output ensures workflow steps have a definitive
        signal rather than relying on absence of the skipped key.
      acceptance_criteria:
        - "GITHUB_OUTPUT file contains 'skipped=false'"
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with mock gh binary and temp GITHUB_OUTPUT"
    specific_preconditions: []
    test_data:
      resource_definitions: []
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create temp GITHUB_OUTPUT and mock gh returning empty"
          command: "Setup temp file and mock"
          validation: "Environment ready"
      test_execution:
        - step_id: "TEST-01"
          action: "Run pre-code.sh with no PRs"
          command: "Execute pre-code.sh"
          validation: "Script writes skipped=false"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temp files"
          command: "os.RemoveAll(tmpDir)"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "skipped=false written to GITHUB_OUTPUT"
        condition: "File content contains 'skipped=false'"
