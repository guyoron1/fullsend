    test_structure:
      type: "single"
      function: "TestGCPSetupSkippedWhenValidateSkips"
      subtest: false
    test_objective:
      title: "Verify GCP setup skipped when validate skips"
      what: |
        Tests that the GCP authentication/setup step in reusable-code.yml
        is correctly gated on the validate step's skip output, and does
        not execute when validate sets skipped=true.
      why: |
        GCP setup is expensive and unnecessary when the code agent will
        not run. Gating prevents wasted cloud authentication calls.
      acceptance_criteria:
        - "GCP setup step has 'if' condition checking validate.outputs.skipped"
        - "Step does not run when skipped=true"
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "YAML structure validation"
    specific_preconditions: []
    test_data:
      resource_definitions: []
