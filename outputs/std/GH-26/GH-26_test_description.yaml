  # =========================================================================
  # REQUIREMENT: Force override bypasses duplicate check
  # Priority: P1
  # =========================================================================
  - scenario_id: "007"
    test_id: "TS-GH-26-007"
    tier: "Functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-26"
    variables:
      closure_scope:
        - name: "githubOutput"
          type: "string"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Contents of GITHUB_OUTPUT file"
    test_structure:
      type: "single"
      function: "TestPreCodeForceFlagBypassesPRCheck"
      subtest: false
    test_objective:
      title: "Verify --force flag bypasses PR check"
      what: |
        Tests that when the --force flag is passed to pre-code.sh, the
        script skips the duplicate PR check entirely and allows the code
        agent to proceed regardless of existing PRs.
      why: |
        The force override enables intentional duplicate work when a
        maintainer explicitly wants the code agent to create a competing
        implementation.
      acceptance_criteria:
        - "Script proceeds without checking for existing PRs"
        - "skipped=false in GITHUB_OUTPUT"
        - "No PR search API call made"
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with mock gh binary"
    specific_preconditions: []
    test_data:
      resource_definitions: []
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh (should NOT be called for PR search)"
          command: "Create mock that logs all calls"
          validation: "Mock is ready"
      test_execution:
        - step_id: "TEST-01"
          action: "Run pre-code.sh with --force flag"
          command: "Execute pre-code.sh --force"
          validation: "Script bypasses PR check"
        - step_id: "TEST-02"
          action: "Verify no PR search call made"
          command: "Check mock call log"
          validation: "No 'pr list' or 'search' calls recorded"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temp directory"
          command: "os.RemoveAll(tmpDir)"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Force flag bypasses duplicate check"
        condition: "skipped=false AND no PR search API call"
        failure_impact: "Force override does not work, blocking intentional duplicates"
    dependencies:
      kubernetes_resources: []
      external_tools:
        - "gh CLI (mocked)"
      scenario_specific_rbac: []

  - scenario_id: "008"
