          yaml: |
            trafficEnvVars:
              ALLOWED_ORGS: ""
              ROLE_APP_IDS: '{"agent":"app-id-1","reviewer":"app-id-2"}'

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fakeGCFClient with inconsistent state"
          command: "newFakeGCFClient() with empty ALLOWED_ORGS and role-only ROLE_APP_IDS"
          validation: "Fake client created"
      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureOrgInMint"
          command: "p.EnsureOrgInMint(ctx, expectedURL, \"new-org\")"
          validation: "Error returned"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "UpdateServiceEnvVars not called"
        condition: "fake.calls does not contain 'UpdateServiceEnvVars'"
        failure_impact: "Guard fires but still attempts write, potentially corrupting data"

