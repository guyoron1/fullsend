        called. The guard must abort before any write operation to prevent data corruption.
      why: |
        If UpdateServiceEnvVars were called after the guard detects inconsistency, it could
        overwrite env vars with incomplete data, causing all existing orgs to be unenrolled.
      acceptance_criteria:
        - "UpdateServiceEnvVars is not called when guard fires"
        - "fake.calls does not contain 'UpdateServiceEnvVars'"

    classification:
