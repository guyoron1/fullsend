  # ========================================================================
  # Requirement: Concurrent enrollment isolation
  # ========================================================================

  - scenario_id: "017"
    test_id: "TS-GH-2433-017"
    test_type: "unit"
    priority: "P2"
    mvp: false
    requirement_id: "GH-74"
    coverage_status: "NEW"

    test_objective:
      title: "Verify concurrent enrollments isolate guard evaluation"
      what: |
        Tests that the guard fires independently per goroutine. Each concurrent
        EnsureOrgInMint call evaluates its own env var state without interfering
        with other goroutines.
      why: |
        EnsureOrgInMint is called per-org in parallel enrollment scenarios.
        Guard evaluation must be goroutine-safe with no shared mutable state.
      acceptance_criteria:
        - "Both goroutines complete without panic"
        - "Guard fires independently based on each goroutine's state"

    classification:
      test_type: "Unit"
      scope: "Single-function (concurrency)"
      automation_approach: "Go stdlib testing + testify + sync.WaitGroup"

    specific_preconditions:
      - name: "Per-goroutine fakeGCFClient instances"
        requirement: "Each goroutine gets its own fake client to avoid data races"
        validation: "go test -race passes"

    test_data:
      resource_definitions:
        - name: "stale goroutine client"
          type: "Test double"
          yaml: |
            trafficEnvVars:
              ALLOWED_ORGS: ""
              ROLE_APP_IDS: '{"agent":"app-1"}'
        - name: "fresh goroutine client"
          type: "Test double"
          yaml: |
            trafficEnvVars:
              ALLOWED_ORGS: "existing-org"
              ROLE_APP_IDS: '{"agent":"app-1"}'

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create separate fakeGCFClient per goroutine"
          command: "Two newFakeGCFClient() instances with different env var states"
          validation: "Two independent clients created"
      test_execution:
        - step_id: "TEST-01"
          action: "Launch concurrent EnsureOrgInMint calls"
          command: "sync.WaitGroup with 2 goroutines calling EnsureOrgInMint"
          validation: "Both goroutines complete"
        - step_id: "TEST-02"
          action: "Collect and verify results"
          command: "Check errors from each goroutine independently"
          validation: "Stale goroutine errors, fresh goroutine succeeds"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "Stale-read goroutine receives guard error"
        condition: "err != nil for stale-org goroutine"
        failure_impact: "Guard does not fire on stale data in concurrent scenario"
      - assertion_id: "ASSERT-02"
        priority: "P2"
        description: "Fresh goroutine succeeds"
        condition: "err == nil for fresh-org goroutine"
        failure_impact: "Guard false positive from cross-goroutine state leakage"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "go test -race (race detector)"
      scenario_specific_rbac: []

  - scenario_id: "018"
    test_id: "TS-GH-2433-018"
    test_type: "unit"
    priority: "P2"
    mvp: false
    requirement_id: "GH-74"
    coverage_status: "NEW"

    test_objective:
      title: "Verify stale-read goroutine fails while fresh succeeds"
      what: |
        Tests the specific scenario where one goroutine reads stale env vars
        (data loss state) while another reads fresh env vars (healthy state).
        The stale goroutine must fail, the fresh must succeed.
      why: |
        This is the real-world concurrent enrollment scenario. Parallel per-repo
        installs sharing a mint can race. The guard must protect each goroutine
        independently based on its own read.
      acceptance_criteria:
        - "Stale goroutine: error with 'data inconsistency'"
        - "Fresh goroutine: no error"
        - "Results collected without data race"

    classification:
      test_type: "Unit"
      scope: "Single-function (concurrency)"
      automation_approach: "Go stdlib testing + testify + sync.WaitGroup + sync.Mutex"

    specific_preconditions:
      - name: "Independent fakeGCFClient per goroutine"
        requirement: "Stale client has empty ALLOWED_ORGS + role-only keys; fresh client has populated ALLOWED_ORGS"
        validation: "go test -race passes"

    test_data:
      resource_definitions:
        - name: "stale client"
          type: "Test double"
          yaml: |
            trafficEnvVars:
              ALLOWED_ORGS: ""
              ROLE_APP_IDS: '{"agent":"app-1"}'
        - name: "fresh client"
          type: "Test double"
          yaml: |
            trafficEnvVars:
              ALLOWED_ORGS: "existing-org"
              ROLE_APP_IDS: '{"agent":"app-1"}'

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create stale and fresh fakeGCFClient instances"
          command: "Two newFakeGCFClient() with different ALLOWED_ORGS states"
          validation: "Independent clients created"
      test_execution:
        - step_id: "TEST-01"
          action: "Launch concurrent enrollments with sync.WaitGroup"
          command: "2 goroutines, each with own Provisioner and fake client"
          validation: "Both complete without panic"
        - step_id: "TEST-02"
          action: "Verify results per goroutine"
          command: "Check stale-org got error, fresh-org got nil"
          validation: "Independent guard evaluation confirmed"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "Stale-read goroutine fails with data inconsistency"
        condition: "stale-org result has err != nil with 'data inconsistency'"
        failure_impact: "Stale data not detected in concurrent scenario"
      - assertion_id: "ASSERT-02"
        priority: "P2"
        description: "Fresh goroutine succeeds"
        condition: "fresh-org result has err == nil"
        failure_impact: "Cross-goroutine state contamination causes false positive"
      - assertion_id: "ASSERT-03"
        priority: "P2"
        description: "No data race detected"
        condition: "go test -race passes"
