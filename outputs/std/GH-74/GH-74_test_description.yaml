  - scenario_id: "001"
    test_id: "TS-GH-2433-001"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-74"
    coverage_status: "NEW"

    test_objective:
      title: "Verify guard returns error on empty ALLOWED_ORGS with role-only entries"
      what: |
        Tests that EnsureOrgInMint returns an error when the traffic-serving revision
        has an empty ALLOWED_ORGS but ROLE_APP_IDS contains role-only entries. This is
        the core detection logic of the data consistency guard.
      why: |
        An empty ALLOWED_ORGS with populated role-only ROLE_APP_IDS indicates env var
        data loss (e.g., stale read from a diverged revision). Without this guard,
        enrollment would silently unenroll all existing organizations.
      acceptance_criteria:
        - "EnsureOrgInMint returns a non-nil error"
        - "Error message contains 'data inconsistency'"

    classification:
      test_type: "Unit"
      scope: "Single-function"
      automation_approach: "Go stdlib testing + testify"

    specific_preconditions:
      - name: "fakeGCFClient with inconsistent state"
        requirement: "trafficEnvVars has empty ALLOWED_ORGS and populated ROLE_APP_IDS with role-only keys"
        validation: "Compile and run test"

    test_data:
      resource_definitions:
        - name: "fakeGCFClient"
          type: "Test double"
          yaml: |
            trafficEnvVars:
              ALLOWED_ORGS: ""
              ROLE_APP_IDS: '{"agent":"app-id-1","reviewer":"app-id-2"}'

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fakeGCFClient with empty ALLOWED_ORGS and role-only ROLE_APP_IDS"
          command: "newFakeGCFClient() with trafficEnvVars configured"
          validation: "Fake client created"
        - step_id: "SETUP-02"
          action: "Create Provisioner with fake client"
          command: "NewProvisioner(Config{ProjectID: \"proj1\", Region: \"us-central1\"}, fake)"
          validation: "Provisioner created"
      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureOrgInMint with a new org"
          command: "p.EnsureOrgInMint(ctx, expectedURL, \"new-org\")"
          validation: "Returns non-nil error"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "EnsureOrgInMint returns error"
        condition: "err != nil"
        failure_impact: "Guard does not detect data inconsistency; silent unenrollment possible"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Error message mentions data inconsistency"
        condition: "err.Error() contains 'data inconsistency'"
        failure_impact: "Error is not actionable for operators"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

