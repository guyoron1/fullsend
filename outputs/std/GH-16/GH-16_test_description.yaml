          command: "httptest.NewServer returning 403"
          validation: "Server returns 403"
          code_template: |
            server = httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
              http.Error(w, "Permission Denied: caller lacks cloudresourcemanager.projects.get", http.StatusForbidden)
            }))

      test_execution:
        - step_id: "TEST-01"
          action: "Call GetProjectNumber and capture error"
          command: "client.GetProjectNumber(ctx, 'test-project')"
          validation: "Error is returned"
          code_template: |
            _, err = client.GetProjectNumber(ctx, "test-project")
            require.Error(t, err)
        - step_id: "TEST-02"
          action: "Assert error message contains diagnostic information"
          command: "Check error message for '403' or 'permission'"
          validation: "Message is descriptive"
          code_template: |
            errMsg := strings.ToLower(err.Error())
            assert.True(t,
              strings.Contains(errMsg, "403") || strings.Contains(errMsg, "permission") || strings.Contains(errMsg, "forbidden"),
