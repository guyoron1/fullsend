    code_structure: |
      func TestProvisioner_Provision_ProjectNumberError_Aborts(t *testing.T) {
        // SETUP: Create mock server that returns 500 on CRM endpoint
        // SETUP: Create Provisioner
        // TEST: Call Provision
        // ASSERT: Error returned, provisioning did not continue past GetProjectNumber
      }

    test_objective:
      title: "Verify provisioning aborts on project number error"
      what: |
        Tests that when GetProjectNumber fails during the provisioning flow,
        the Provisioner correctly propagates the error and aborts provisioning.
        No subsequent provisioning steps (SA creation, WIF setup) should execute.
      why: |
        If provisioning continues after a failed project number lookup, it would
        attempt to create resources with an invalid project reference, potentially
        creating orphaned GCP resources or returning confusing errors.
      acceptance_criteria:
        - "Provisioner.Provision returns an error when GetProjectNumber fails"
        - "No subsequent provisioning API calls are made after the failure"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Go testing with testify and httptest"

    specific_preconditions: []

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock server that returns 500 on CRM project lookup"
          command: "httptest.NewServer returning 500 for /v1/projects"
          validation: "Server configured to fail on CRM endpoint"
          code_template: |
            callLog := []string{}
            server := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                callLog = append(callLog, r.URL.Path)
                if strings.Contains(r.URL.Path, "projects") {
                    w.WriteHeader(http.StatusInternalServerError)
                    fmt.Fprintln(w, `{"error": {"code": 500, "message": "Internal error"}}`)
                    return
                }
                w.Header().Set("Content-Type", "application/json")
                fmt.Fprintln(w, `{"done": true}`)
            }))
            defer server.Close()

        - step_id: "SETUP-02"
          action: "Create Provisioner with mock client"
          command: "Construct provisioner pointing to mock server"
          validation: "Provisioner created"

      test_execution:
        - step_id: "TEST-01"
          action: "Call Provision and expect error"
          command: "provisioner.Provision(ctx, config)"
          validation: "Error returned"
          code_template: |
            err := provisioner.Provision(ctx, config)
            require.Error(t, err)

        - step_id: "TEST-02"
          action: "Verify no post-CRM API calls were made"
          command: "Inspect callLog for absence of SA/WIF endpoints"
          validation: "Only CRM endpoint was called"
          code_template: |
            for _, path := range callLog {
                assert.NotContains(t, path, "serviceAccounts",
                    "Should not attempt SA creation after project number failure")
            }

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Provisioning returns error on GetProjectNumber failure"
        condition: "err != nil"
        failure_impact: "Provisioning could continue with invalid project state"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "No subsequent provisioning steps executed"
        condition: "callLog contains no SA or WIF API paths"
        failure_impact: "Orphaned GCP resources could be created"

