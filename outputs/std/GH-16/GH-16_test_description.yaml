          comment: "GCF client under test"

    test_structure:
      type: "single"
      function: "TestGetProjectNumber_SubsequentCallsUseOriginalQuotaProject"
      subtest: null

    code_structure: |
      func TestGetProjectNumber_SubsequentCallsUseOriginalQuotaProject(t *testing.T) {
        // SETUP: Create httptest.Server that logs headers per request
        // SETUP: Create LiveGCFClient with QuotaProject
        // TEST: Call GetProjectNumber (CRM call — should omit header)
        // TEST: Call another API method (should include header)
        // ASSERT: First call has no x-goog-user-project
        // ASSERT: Second call has x-goog-user-project = "my-quota-project"
      }

    test_objective:
      title: "Verify subsequent API calls use original QuotaProject"
      what: |
        Tests that after GetProjectNumber clears the QuotaProject on its
        internal copy, subsequent API calls (e.g., other LiveGCFClient
        methods) continue to use the original QuotaProject value. This
        validates that the shallow copy is truly isolated.
      why: |
        If the copy is not isolated, the QuotaProject clearing in
        GetProjectNumber would affect all subsequent API calls, breaking
        methods like CreateServiceAccount that require the quota project
        header for billing.
      acceptance_criteria:
        - "CRM request (from GetProjectNumber) omits x-goog-user-project"
        - "Subsequent API call includes x-goog-user-project with original value"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing with testify and httptest"

    specific_preconditions:
      - name: "QuotaProject field exists on gcp.Client"
        requirement: "gcp.Client struct has QuotaProject string field wired into DoRequest"
        validation: "go build ./internal/gcp/..."

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock HTTP server that logs request headers per call"
          command: "httptest.NewServer with request counter and header log"
          validation: "Server starts and request log is initialized"
          code_template: |
            var requestLog []http.Header
            server := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                requestLog = append(requestLog, r.Header.Clone())
                w.Header().Set("Content-Type", "application/json")
                fmt.Fprintln(w, `{"projectNumber": "123456789"}`)
            }))
            defer server.Close()

        - step_id: "SETUP-02"
          action: "Create LiveGCFClient with QuotaProject set"
          command: "Construct client with QuotaProject = \"my-quota-project\""
          validation: "Client created successfully"

      test_execution:
        - step_id: "TEST-01"
          action: "Call GetProjectNumber (uses copied client without QuotaProject)"
          command: "client.GetProjectNumber(ctx, \"my-project\")"
          validation: "Call succeeds"
          code_template: |
            _, err := client.GetProjectNumber(ctx, "my-project")
            require.NoError(t, err)

        - step_id: "TEST-02"
          action: "Call another API method that uses the original client"
          command: "Invoke a method that calls DoRequest on the original client"
          validation: "Call completes (success or expected error)"

        - step_id: "TEST-03"
          action: "Inspect headers from both requests"
          command: "Check requestLog entries"
          validation: "First request omits header; second request includes header"
          code_template: |
            require.GreaterOrEqual(t, len(requestLog), 2, "Expected at least 2 requests")
            assert.Empty(t, requestLog[0].Get("x-goog-user-project"),
                "CRM request should not have x-goog-user-project header")
            assert.Equal(t, "my-quota-project", requestLog[1].Get("x-goog-user-project"),
                "Subsequent request should use original QuotaProject")

      cleanup: []

