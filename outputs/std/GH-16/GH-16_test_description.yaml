      what: |
        This test validates that when GetProjectNumber encounters a 403
        response, the error message contains enough information for users
        to diagnose the permission issue (e.g., status code, permission
        context).
      why: |
        Descriptive error messages help users self-diagnose GCP permission
        issues without needing to contact support. The error should indicate
        that it's a permission problem related to the CRM API.
      acceptance_criteria:
        - "Error message contains '403' or 'permission' (case-insensitive)"
        - "Error message is actionable for diagnosis"

