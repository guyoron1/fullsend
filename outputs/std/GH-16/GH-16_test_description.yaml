    test_structure:
      type: "single"
      function: "TestGetProjectNumber_OmitsQuotaProjectHeader"
      subtest: null

    code_structure: |
      func TestGetProjectNumber_OmitsQuotaProjectHeader(t *testing.T) {
        // SETUP: Create httptest.Server that captures request headers
        // SETUP: Create LiveGCFClient with QuotaProject set
        // TEST: Call GetProjectNumber
        // ASSERT: x-goog-user-project header is absent in captured headers
      }

    test_objective:
      title: "Verify project number lookup omits quota project header"
      what: |
        Tests that when GetProjectNumber is called on a LiveGCFClient that has a
        QuotaProject configured, the outgoing HTTP request to the Cloud Resource
        Manager API does NOT include the x-goog-user-project header. This validates
        that the shallow copy of the gcp.Client with cleared QuotaProject is used
        for the CRM API call.
      why: |
        The x-goog-user-project header causes CRM API calls to fail when the
        cloudresourcemanager API is not enabled on the target project. Omitting
        this header removes a permission dependency and reduces setup friction
        for GCP users provisioning FullSend via OIDC.
      acceptance_criteria:
        - "GetProjectNumber succeeds without error when CRM API returns valid project number"
        - "The x-goog-user-project header is NOT present in the outgoing CRM request"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing with testify and httptest"

    specific_preconditions:
      - name: "QuotaProject field exists on gcp.Client"
        requirement: "The gcp.Client struct must have a QuotaProject string field"
        validation: "go build ./internal/gcp/..."

    test_data:
      resource_definitions:
        - name: "mock CRM response"
          type: "HTTP JSON response"
          yaml: |
            {
              "projectNumber": "123456789"
            }

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock HTTP server that captures request headers and returns project number"
          command: "httptest.NewServer with handler that records headers"
          validation: "Server starts and is accessible"
          code_template: |
            var capturedHeaders http.Header
            server := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                capturedHeaders = r.Header.Clone()
                w.Header().Set("Content-Type", "application/json")
                fmt.Fprintln(w, `{"projectNumber": "123456789"}`)
            }))
            defer server.Close()

        - step_id: "SETUP-02"
          action: "Create LiveGCFClient with QuotaProject set and pointing to mock server"
          command: "Construct gcp.Client with QuotaProject and wrap in LiveGCFClient"
          validation: "Client is created successfully"
          code_template: |
            gcpClient := &gcp.Client{
                QuotaProject: "my-quota-project",
                // ... configure to use server.URL
            }
            client := &gcf.LiveGCFClient{Client: gcpClient}

      test_execution:
        - step_id: "TEST-01"
          action: "Call GetProjectNumber on the client"
          command: "client.GetProjectNumber(ctx, \"my-project\")"
          validation: "Call returns project number without error"
          code_template: |
            projectNumber, err := client.GetProjectNumber(ctx, "my-project")
            require.NoError(t, err)
            assert.Equal(t, "123456789", projectNumber)

        - step_id: "TEST-02"
          action: "Inspect captured request headers for x-goog-user-project"
          command: "Check capturedHeaders"
          validation: "x-goog-user-project header is absent"
          code_template: |
            assert.Empty(t, capturedHeaders.Get("x-goog-user-project"),
                "x-goog-user-project header should not be present in CRM request")

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "x-goog-user-project header is absent from CRM API request"
        condition: "capturedHeaders.Get('x-goog-user-project') == ''"
        failure_impact: "CRM call would require cloudresourcemanager API enabled on target project"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "GetProjectNumber returns correct project number"
        condition: "projectNumber == '123456789' && err == nil"
        failure_impact: "OIDC provisioning flow would fail to resolve project number"

