    mvp: true
    requirement_id: "GH-16"
    requirement_summary: "QuotaProject clearing does not mutate the original GCFClient's embedded Client"

    patterns:
      primary: "state-isolation"
      secondary:
        - "mock-http-server"
        - "struct-comparison"
      helpers_required:
        - name: "httptest"
          functions: ["NewServer", "Server.Close"]
          purpose: "Mock HTTP server for GetProjectNumber call"
      decorators: []

    variables:
      closure_scope:
        - name: "server"
          type: "*httptest.Server"
          initialized_in: "test setup"
          used_in: ["setup", "test_execution", "cleanup"]
          comment: "Mock CRM API server"
        - name: "client"
          type: "*gcf.LiveGCFClient"
          initialized_in: "test setup"
          used_in: ["test_execution"]
          comment: "GCF client under test"
        - name: "originalQuotaProject"
          type: "string"
          initialized_in: "test setup"
          used_in: ["test_execution"]
          comment: "Original QuotaProject value to compare after call"

    test_structure:
      type: "single"
      function: "TestGetProjectNumber_OriginalClientUnchanged"
      subtest: null

    code_structure: |
      func TestGetProjectNumber_OriginalClientUnchanged(t *testing.T) {
        // SETUP: Create client with QuotaProject = "my-quota-project"
        // SETUP: Record original QuotaProject value
        // TEST: Call GetProjectNumber
        // ASSERT: client.Client.QuotaProject is still "my-quota-project"
      }

    test_objective:
      title: "Verify original client unchanged after GetProjectNumber"
      what: |
        Tests that after calling GetProjectNumber, the original LiveGCFClient's
        embedded gcp.Client retains its QuotaProject value. The shallow copy
        used internally must not modify the original struct's fields.
      why: |
        If the original client's QuotaProject is mutated, all subsequent API
        calls from the same client instance would lose the quota project header,
        breaking other GCF operations that depend on it (e.g., CreateServiceAccount,
        CreateWIFPool).
      acceptance_criteria:
        - "client.Client.QuotaProject equals the original value after GetProjectNumber returns"
        - "No side effects on the original gcp.Client struct"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing with testify and httptest"

    specific_preconditions:
      - name: "QuotaProject field exists on gcp.Client"
        requirement: "gcp.Client struct has QuotaProject string field"
        validation: "go build ./internal/gcp/..."

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock HTTP server returning valid project number"
          command: "httptest.NewServer"
          validation: "Server starts successfully"
          code_template: |
            server := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                w.Header().Set("Content-Type", "application/json")
                fmt.Fprintln(w, `{"projectNumber": "123456789"}`)
            }))
            defer server.Close()

        - step_id: "SETUP-02"
          action: "Create LiveGCFClient with QuotaProject set"
          command: "Construct gcp.Client and LiveGCFClient"
          validation: "Client created with QuotaProject = \"my-quota-project\""
          code_template: |
            gcpClient := &gcp.Client{
                QuotaProject: "my-quota-project",
            }
            client := &gcf.LiveGCFClient{Client: gcpClient}
            originalQuotaProject := gcpClient.QuotaProject

      test_execution:
        - step_id: "TEST-01"
          action: "Call GetProjectNumber"
          command: "client.GetProjectNumber(ctx, \"target-project\")"
          validation: "Call completes without error"
          code_template: |
            _, err := client.GetProjectNumber(ctx, "target-project")
            require.NoError(t, err)

        - step_id: "TEST-02"
          action: "Verify original QuotaProject is unchanged"
          command: "Compare client.Client.QuotaProject with original"
          validation: "QuotaProject still equals original value"
          code_template: |
            assert.Equal(t, originalQuotaProject, client.Client.QuotaProject,
                "Original client's QuotaProject must not be mutated by GetProjectNumber")

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Original QuotaProject value is preserved"
        condition: "client.Client.QuotaProject == originalQuotaProject"
        failure_impact: "All subsequent GCF API calls would lose quota project header"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "GetProjectNumber succeeds without error"
        condition: "err == nil"
        failure_impact: "Cannot validate state preservation if the call itself fails"

