        - step_id: "SETUP-01"
          action: "Create mock HTTP server returning 403 Forbidden"
          command: "httptest.NewServer returning 403"
          validation: "Server starts successfully"
          code_template: |
            server := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                w.WriteHeader(http.StatusForbidden)
                fmt.Fprintln(w, `{"error": {"code": 403, "message": "Permission denied"}}`)
            }))
            defer server.Close()

        - step_id: "SETUP-02"
