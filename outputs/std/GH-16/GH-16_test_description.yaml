          validation: "Returns '123456789' without error"
          code_template: |
            projectNum, err = client.GetProjectNumber(ctx, "test-project")
            require.NoError(t, err)
            assert.Equal(t, "123456789", projectNum)
        - step_id: "TEST-02"
