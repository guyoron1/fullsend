    test_objective:
      title: "GetProjectNumber omits x-goog-user-project header when QuotaProject is set on the client"
      what: |
        This test validates that when GetProjectNumber is called on a client
        with a non-empty QuotaProject field, the outgoing CRM API request
        does NOT include the x-goog-user-project header. The shallow copy
        mechanism should strip the quota project from the request.
      why: |
        The x-goog-user-project header triggers quota-project permission
        checks on the target GCP project. The CRM API is a global Google
        API that does not require this header. Omitting it removes the
        requirement for users to enable cloudresourcemanager permissions,
        simplifying GCP onboarding.
      acceptance_criteria:
        - "CRM API request must NOT include x-goog-user-project header"
        - "GetProjectNumber returns the correct project number from the response"

