  - scenario_id: "7"
    test_id: "TS-GH-16-007"
    tier: "Functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-16"

    variables:
      closure_scope:
        - name: "server"
          type: "*httptest.Server"
          initialized_in: "setup"
          used_in: ["setup", "test", "cleanup"]
          comment: "Mock server returning 500 for CRM endpoint"
        - name: "provisioner"
          type: "*gcf.Provisioner"
          initialized_in: "setup"
          used_in: ["test"]
          comment: "GCP provisioner with failing CRM endpoint"

    test_structure:
      type: "single"
      function_name: "TestProvisionAborts_WhenGetProjectNumberFails"
      subtest: false

    code_structure: |
      func TestProvisionAborts_WhenGetProjectNumberFails(t *testing.T) {
        // Setup: create mock server returning 500 for CRM
        // Create provisioner
        // Call Provision
        // Assert error and no SA creation attempted
      }

    test_objective:
      title: "Provisioning aborts when GetProjectNumber fails"
      what: |
        This test validates that when GetProjectNumber returns an error
        (e.g., CRM returns 500), the provisioning flow aborts immediately
        and does not attempt subsequent steps like service account creation.
      why: |
        Error propagation through the provisioning chain is critical for
        user experience. If GetProjectNumber fails silently, the
        provisioner would attempt to create resources with invalid project
        context, leading to confusing downstream errors.
      acceptance_criteria:
        - "Provisioner.Provision returns error when GetProjectNumber fails"
        - "No service account creation is attempted after CRM failure"

    classification:
      test_type: "Functional"
      scope: "Multi-method"
      automation_approach: "Go testing with httptest mock"

    specific_preconditions: []

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server returning 500 for CRM endpoint"
          command: "httptest.NewServer returning 500"
          validation: "Server returns 500 for CRM requests"
          code_template: |
            saCallCount := 0
            mux := http.NewServeMux()
            mux.HandleFunc("/v1/projects/test-project", func(w http.ResponseWriter, r *http.Request) {
              http.Error(w, "Internal Server Error", http.StatusInternalServerError)
            })
            mux.HandleFunc("/v1/projects/test-project/serviceAccounts", func(w http.ResponseWriter, r *http.Request) {
              saCallCount++
              w.WriteHeader(http.StatusOK)
            })
            server = httptest.NewServer(mux)

      test_execution:
        - step_id: "TEST-01"
          action: "Call Provisioner.Provision and expect error"
          command: "provisioner.Provision(ctx, config)"
          validation: "Returns non-nil error"
          code_template: |
            err = provisioner.Provision(ctx, provisionConfig)
            require.Error(t, err, "Provisioning should fail when GetProjectNumber returns error")
        - step_id: "TEST-02"
          action: "Assert no service account creation was attempted"
          command: "Check saCallCount"
          validation: "saCallCount == 0"
          code_template: |
            assert.Equal(t, 0, saCallCount,
              "No SA creation should be attempted after GetProjectNumber failure")

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close httptest server"
          command: "server.Close()"
          code_template: |
            defer server.Close()

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Provisioning returns error on CRM failure"
        condition: "err != nil"
        failure_impact: "Provisioner continues with invalid state after CRM failure"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "No downstream operations attempted after CRM failure"
        condition: "saCallCount == 0"
        failure_impact: "Unnecessary API calls made with invalid project context"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "Go 1.23+"
      scenario_specific_rbac: []

