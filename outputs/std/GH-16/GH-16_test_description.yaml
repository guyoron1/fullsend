      title: "Verify lookup fails gracefully on permission denied"
      what: |
        Tests that when the CRM API returns HTTP 403 (Permission Denied),
        GetProjectNumber returns an appropriate error rather than panicking
        or returning invalid data. Validates error propagation through the
        copied client.
      why: |
        Users may still encounter permission errors for other reasons (e.g.,
        IAM misconfiguration). The error path must work correctly with the
        shallow-copied client to provide actionable feedback.
      acceptance_criteria:
        - "GetProjectNumber returns a non-nil error when CRM returns 403"
        - "Error message contains sufficient context for debugging"

    classification:
