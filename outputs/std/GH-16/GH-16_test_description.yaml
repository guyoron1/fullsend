      why: |
        The shallow copy shares the http.Client transport with the
        original. Errors from the shared transport must still propagate
        correctly through the copied client's DoRequest method.
      acceptance_criteria:
        - "GetProjectNumber returns error when host is unreachable"
        - "Error originates from the copied client's DoRequest"

