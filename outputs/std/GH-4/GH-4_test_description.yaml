        })
      }

    test_objective:
      title: "Verify review agent blocks code not matching generated spec"

      what: |
        This test validates that the review agent correctly identifies and blocks
        a PR when the submitted code does not match the generated spec checklist.
        The review agent must compare the code changes against the spec's functional
        requirements and report non-compliance.

      why: |
        The review agent is the enforcement mechanism that prevents scope creep and
        ensures code matches the developer's declared intent. If the agent fails to
        block non-compliant code, the entire vibe-to-spec workflow loses its value
        as a quality gate, allowing arbitrary changes to bypass intent verification.

      acceptance_criteria:
        - "Review agent returns a 'blocked' or 'changes_requested' status"
        - "Review agent identifies specific spec checklist items that are not satisfied"
        - "Review output includes actionable feedback on what code changes are needed"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Ginkgo with CLI invocation"

    specific_preconditions:
      - name: "Generated spec checklist"
        requirement: "A valid spec checklist produced by vibe-to-spec workflow"
        validation: "Spec checklist file exists and is valid"
      - name: "Non-compliant code change"
        requirement: "A PR or code diff that intentionally violates the spec"
        validation: "Code diff exists that does not satisfy spec requirements"

    test_data:
      resource_definitions:
        - name: "non_compliant_pr"
          type: "CodeChange"
          yaml: |
            description: "PR that adds functionality not in spec"
            spec_requirement: "Add(a, b) function"
            actual_code: "Subtract(a, b) function"
      api_endpoints: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Generate spec from prototype"
          command: "fullsend vibe-to-spec --input /tmp/prototype --output /tmp/spec"
          validation: "Spec generated successfully"

        - step_id: "SETUP-02"
          action: "Prepare code change that violates spec"
