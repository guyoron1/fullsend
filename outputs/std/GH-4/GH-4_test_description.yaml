      }

    test_objective:
      title: "Verify error returned when prototype contains no testable behavior"

      what: |
        This test validates that the vibe-to-spec workflow returns a clear, actionable
        error message when the input prototype contains no testable behavior (e.g.,
        empty files, comments only, or code with no exported functions).

      why: |
        Developers need clear feedback when their prototype is insufficient for spec
        generation. Silent failures or cryptic errors waste developer time and erode
        trust in the workflow. Clear errors guide developers to iterate on their
        prototype before attempting spec generation again.

      acceptance_criteria:
        - "Workflow returns a non-zero exit code when prototype has no testable behavior"
        - "Error message clearly indicates the prototype lacks testable behavior"
        - "Error message suggests what the developer should do (add testable functions)"

    classification:
