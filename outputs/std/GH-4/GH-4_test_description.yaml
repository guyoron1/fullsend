          validation: "Review agent completes execution"

        - step_id: "TEST-02"
          action: "Check review agent verdict"
          command: "Parse review agent output for status"
          validation: "Status is 'blocked' or 'changes_requested'"

        - step_id: "TEST-03"
          action: "Verify review agent provides specific feedback"
          command: "Parse review output for checklist item references"
          validation: "Output references specific unsatisfied spec items"

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove test artifacts"
          command: "rm -rf /tmp/prototype /tmp/spec /tmp/non-compliant.diff"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Review agent blocks non-compliant code"
        condition: "Review status is 'blocked' or 'changes_requested'"
        failure_impact: "Non-compliant code can be merged, defeating spec enforcement"

      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Review agent cites specific spec violations"
        condition: "Review output references spec checklist items"
        failure_impact: "Developers receive vague rejection without actionable guidance"

    dependencies:
