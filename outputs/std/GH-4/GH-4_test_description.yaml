    test_objective:
      title: "Verify exploration artifacts are cleaned up after spec generation completes"

      what: |
        This test validates that after the vibe-to-spec workflow generates a formal
        specification, all exploration/prototype artifacts are properly cleaned up
        and do not persist in the working directory or repository.

      why: |
        Exploration artifacts (prototype code) must be discarded after spec generation
        to prevent prototype code from leaking into production. Leaving exploration
        artifacts can cause confusion, accidental commits of throwaway code, and
        pollute the repository with non-production code.

      acceptance_criteria:
        - "After spec generation completes, exploration artifact directory no longer exists"
        - "No prototype source files remain in the working directory"
        - "Generated spec file is the only output preserved"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Ginkgo with CLI invocation"

    specific_preconditions:
      - name: "Completed vibe-to-spec workflow"
        requirement: "Spec generation has run successfully producing output"
        validation: "Spec output file exists"

    test_data:
      resource_definitions:
        - name: "exploration_artifacts"
          type: "Directory"
          yaml: |
            path: "/tmp/exploration"
            files:
              - name: "prototype.go"
                content: "package main\n// exploration code"
      api_endpoints: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create prototype directory with exploration artifacts"
          command: "mkdir -p /tmp/exploration && create prototype files"
          validation: "Exploration directory exists with files"

        - step_id: "SETUP-02"
          action: "Run vibe-to-spec workflow to completion"
          command: "fullsend vibe-to-spec --input /tmp/exploration --output /tmp/spec-output"
          validation: "Workflow completes with exit code 0"

      test_execution:
        - step_id: "TEST-01"
          action: "Check exploration artifact directory no longer exists"
          command: "stat /tmp/exploration"
          validation: "Directory does not exist (stat returns error)"

        - step_id: "TEST-02"
          action: "Verify no prototype files remain in working directory"
          command: "find /tmp -name '*.go' -path '*/exploration/*'"
          validation: "No files found"

        - step_id: "TEST-03"
          action: "Verify generated spec file is preserved"
          command: "stat /tmp/spec-output/spec.yaml"
          validation: "Spec file exists"

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove any remaining test artifacts"
          command: "rm -rf /tmp/exploration /tmp/spec-output"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Exploration directory is removed after spec generation"
        condition: "Directory /tmp/exploration does not exist"
        failure_impact: "Prototype code may leak into production commits"

