                content: |
                  package main
                  // This file has no testable behavior
      api_endpoints: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create prototype directory with no testable behavior"
          command: "mkdir -p /tmp/empty-prototype && write comment-only Go file"
          validation: "Directory exists with .go file containing no testable functions"

      test_execution:
