    code_structure: |
      Context("Verify vibe-to-spec workflow produces valid spec from prototype code", Ordered) {
        BeforeAll(func() {
          // Setup: prepare prototype code directory with testable behavior
        })
        It("[test_id:TS-GH-4-001] should generate a valid formal specification from developer prototype code", func() {
          // Execute vibe-to-spec workflow and validate output
        })
      }

    test_objective:
      title: "Verify vibe-to-spec workflow produces valid spec from prototype code"

      what: |
        This test validates that the vibe-to-spec workflow correctly generates a valid,
        structured formal specification from developer prototype code. It verifies that
        given a prototype with testable behavior, the workflow produces a spec containing
        functional requirements, acceptance scenarios, and machine-evaluable criteria.

      why: |
        The vibe-to-spec workflow is the core value proposition of this feature — bridging
        rapid prototyping and formal specification. If spec generation fails or produces
        invalid output, developers cannot transition from exploration to formal requirements,
        breaking the entire intent-to-implementation pipeline.

      acceptance_criteria:
        - "Workflow accepts prototype code directory as input and completes without error"
        - "Generated specification contains a functional requirements section"
        - "Generated specification contains acceptance scenarios with pass/fail criteria"
        - "Generated specification is valid YAML/structured format that can be parsed programmatically"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Ginkgo with CLI invocation"

    specific_preconditions:
      - name: "Prototype code with testable behavior"
        requirement: "A directory containing Go source files implementing at least one testable function"
        validation: "ls $PROTOTYPE_DIR/*.go"

    test_data:
      resource_definitions:
        - name: "prototype_project"
          type: "Directory"
          yaml: |
            # Prototype Go project with a simple testable function
            path: "/tmp/test-prototype"
            files:
              - name: "main.go"
                content: |
                  package main
                  func Add(a, b int) int { return a + b }
      api_endpoints: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create prototype code directory with testable behavior"
          command: "mkdir -p /tmp/test-prototype && write test Go files"
          validation: "Directory exists with .go files"

        - step_id: "SETUP-02"
          action: "Configure AI/LLM inference endpoint"
          command: "export LLM_ENDPOINT=$TEST_LLM_ENDPOINT"
          validation: "LLM endpoint responds to health check"

      test_execution:
        - step_id: "TEST-01"
          action: "Execute vibe-to-spec workflow on prototype directory"
          command: "fullsend vibe-to-spec --input /tmp/test-prototype --output /tmp/spec-output"
          validation: "Command exits with status 0"

        - step_id: "TEST-02"
          action: "Validate generated specification structure"
          command: "Parse spec output and verify required sections exist"
          validation: "Spec contains functional_requirements and acceptance_scenarios sections"

        - step_id: "TEST-03"
          action: "Validate specification is parseable"
          command: "yaml.Unmarshal(specBytes, &spec)"
          validation: "Parsing succeeds without error"

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove prototype directory"
          command: "rm -rf /tmp/test-prototype"

        - step_id: "CLEANUP-02"
          action: "Remove spec output"
          command: "rm -rf /tmp/spec-output"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Vibe-to-spec workflow completes without error"
        condition: "Exit code is 0 and no error output"
        failure_impact: "Core workflow is broken; developers cannot generate specs from prototypes"

      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Generated spec contains functional requirements"
        condition: "Spec output has a non-empty functional_requirements section"
        failure_impact: "Generated specs are incomplete and cannot drive review agent enforcement"

      - assertion_id: "ASSERT-03"
        priority: "P0"
        description: "Generated spec contains acceptance scenarios"
        condition: "Spec output has at least one acceptance scenario with pass/fail criteria"
        failure_impact: "Generated specs lack testable criteria"

      - assertion_id: "ASSERT-04"
        priority: "P1"
        description: "Generated spec is valid structured format"
        condition: "Spec output can be parsed as valid YAML"
        failure_impact: "Downstream tooling cannot consume generated specs"

    dependencies:
      kubernetes_resources: []
      external_tools:
