    test_type: "functional"
    priority: "P2"
    mvp: false
    requirement_id: "GH-1230"
    coverage_status: "NEW"

    test_objective:
      title: "Verify zero-width char obfuscated token detected"
      what: |
        Tests that a GitHub PAT with zero-width characters (U+200B, U+200C, U+200D,
        U+FEFF) inserted between characters is still detected and redacted after
        Unicode normalization removes the zero-width characters.
      why: |
        Attackers may insert invisible Unicode characters into tokens to bypass
        regex-based secret detection. The UnicodeNormalizer step must strip these
        before SecretRedactor runs.
      acceptance_criteria:
        - "Token with zero-width chars inserted is redacted after normalization"
        - "Zero-width characters are stripped before secret detection"

    classification:
