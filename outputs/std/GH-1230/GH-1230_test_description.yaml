  - scenario_id: 1
    test_id: "TS-GH1230-001"
    test_type: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-1230"
    coverage_status: "NEW"

    test_objective:
      title: "Verify GitHub PAT in review body is redacted"
      what: |
        Tests that a GitHub Personal Access Token (ghp_...) embedded in the review
        body text is detected and replaced with a redaction placeholder by the
        sanitizeReviewResult function before the content reaches the forge API.
      why: |
        GitHub PATs are high-value credentials. If leaked in a public PR comment,
        they could be used to access repositories, trigger workflows, or exfiltrate
        code. This is the primary security scenario.
      acceptance_criteria:
        - "Review body containing ghp_xxxx... token has the token replaced with [REDACTED]"
        - "Sanitized output retains all non-secret content unchanged"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go unit test with testify"

    specific_preconditions: []

    test_data:
      resource_definitions:
        - name: "review_result_with_pat"
          type: "ReviewResult"
          yaml: |
            body: "Found issue: token ghp_ABCDEFghijklmnop1234567890abcdefghijklmn was exposed"
            action: "comment"
            findings: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create ReviewResult with GitHub PAT in body"
          command: "Construct ReviewResult struct with known ghp_ token in body field"
          validation: "Struct created successfully"
      test_execution:
        - step_id: "TEST-01"
          action: "Call sanitizeReviewResult on the ReviewResult"
          command: "result := sanitizeReviewResult(reviewResult)"
          validation: "Function returns without error"
        - step_id: "TEST-02"
          action: "Assert body no longer contains the PAT"
          command: "assert.NotContains(t, result.Body, \"ghp_\")"
          validation: "Body does not contain ghp_ prefix"
        - step_id: "TEST-03"
          action: "Assert redaction placeholder is present"
          command: "assert.Contains(t, result.Body, \"[REDACTED]\")"
          validation: "Redaction marker present in output"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "GitHub PAT is redacted from review body"
        condition: "result.Body does not contain the original ghp_ token"
        failure_impact: "Credentials would be leaked in public PR comments"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Non-secret content preserved"
        condition: "result.Body retains surrounding text"
        failure_impact: "Over-redaction would remove useful review content"

    dependencies:
