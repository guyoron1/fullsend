    code_structure: |
      func TestEnsureOrgInMint_BlocksWhenActiveRolesButEmptyAllowedOrgs(t *testing.T) {
        // Setup: mock with empty ALLOWED_ORGS but active role-only keys in APP_ID_REGISTRY
        // Execute: call EnsureOrgInMint
        // Assert: error contains "data inconsistency", enrollment is blocked
      }

    test_objective:
      title: "Verify org enrollment is blocked with a data inconsistency error when allowed orgs are empty but active role configurations exist"
      what: |
        Tests the core data consistency guard in the org enrollment operation.
        When the allowed-orgs list is empty but the app ID registry contains active
        role-only keys (keys without "/" separator), this indicates configuration data
        loss rather than a first enrollment. The guard must abort the operation.
      why: |
        Without this guard, a stale read from the traffic-serving revision could
        silently clobber the allowed-orgs configuration, effectively unenrolling
        all existing orgs from the mint. This is the primary defense-in-depth
        check for data integrity.
      acceptance_criteria:
        - "EnsureOrgInMint returns a non-nil error"
        - "Error message contains 'data inconsistency'"
        - "Error message includes the count of configured roles"
        - "Allowed-orgs list is NOT modified"

    classification:
