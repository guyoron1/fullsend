        requirement: "Traffic-serving revision env returns empty ALLOWED_ORGS"
        validation: "Mock returns empty string for ALLOWED_ORGS"
      - name: "Active role-only keys in APP_ID_REGISTRY"
        requirement: "APP_ID_REGISTRY contains at least one key without '/' separator"
        validation: "Mock returns JSON with role-only keys"

    test_data:
