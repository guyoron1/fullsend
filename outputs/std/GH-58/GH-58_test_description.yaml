          command: "Configure mock to return empty ALLOWED_ORGS and populated APP_ID_REGISTRY with role-only keys"
          validation: "Mock provisioner is configured correctly"
      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureOrgInMint with a new org"
          command: "provisioner.EnsureOrgInMint(ctx, orgName)"
          validation: "Function returns error"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "No cleanup needed for unit test"
          command: "N/A"

