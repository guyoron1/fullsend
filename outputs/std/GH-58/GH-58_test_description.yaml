      title: "Verify org enrollment proceeds when app ID registry contains only legacy keys with '/' separator"
      what: |
        Tests that the guard correctly identifies legacy org/role keys (which contain
        a "/" separator) and treats them as non-active. When only legacy keys exist
        in the app ID registry, the guard treats it as equivalent to empty and
        permits enrollment.
      why: |
        During migration from the legacy org/role model to the role-only model,
        the app ID registry may contain only legacy keys. These should not trigger
        the data consistency guard since they represent deprecated configuration.
      acceptance_criteria:
        - "EnsureOrgInMint returns nil error"
        - "Legacy keys with '/' separator are filtered out by role-only key filtering"
        - "Enrollment proceeds normally"

