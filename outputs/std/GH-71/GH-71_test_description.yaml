          validation: "Mock returns [1, 0] for sequential calls"
      test_execution:
        - step_id: "TEST-01"
          action: "Execute runAgent through two iterations"
          command: "Call runAgent with maxIterations=2"
          validation: "Both iterations execute"
        - step_id: "TEST-02"
          action: "Check AGENT_EXIT_CODE after completion"
          command: "Read AGENT_EXIT_CODE from post-script env"
          validation: "Value is '0' (from last successful iteration)"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "lastExitCode reflects the final iteration's exit code"
        condition: "AGENT_EXIT_CODE == '0' after [fail, succeed] sequence"
        failure_impact: "Stale exit codes could cause false failure reports"

    dependencies:
