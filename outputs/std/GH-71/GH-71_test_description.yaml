scenarios:
  # ============================================================
  # Group 1: Exit Code Propagation (P0, Unit Tests)
  # Requirement: Agent exit code is propagated to post-script
  # ============================================================

  - scenario_id: 1
    test_id: "TS-GH-71-001"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-71"
    coverage_status: "NEW"

    test_objective:
      title: "Verify AGENT_EXIT_CODE set when agent exits non-zero"
      what: |
        Tests that when the agent process (runAgent) exits with a non-zero exit code,
        the AGENT_EXIT_CODE environment variable is set to that exit code value in the
        post-script environment. This validates the core propagation mechanism from
        runAgent's lastExitCode to the deferred post-script execution.
      why: |
        Without exit code propagation, post-scripts cannot distinguish between agent
        failures and successful no-op runs. This is the root cause of issue #2378
        where failed agent runs silently succeeded.
      acceptance_criteria:
        - "AGENT_EXIT_CODE environment variable is set to the non-zero exit code"
        - "Post-script receives the exit code via its environment"
        - "Exit code value matches the agent process's actual exit code"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing with testify"

    specific_preconditions:
      - name: "runAgent function accessible"
        requirement: "Internal CLI package test (same-package)"
        validation: "go test ./internal/cli/ -run TestAgentExitCode"

    test_data:
      resource_definitions: []
      api_endpoints: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create a mock agent runtime that exits with code 1"
          command: "Configure sandbox mock to return exit code 1"
          validation: "Mock is configured"
      test_execution:
        - step_id: "TEST-01"
          action: "Execute runAgent with the mock runtime"
          command: "Call runAgent() with mocked sandbox"
          validation: "Function returns without panic"
        - step_id: "TEST-02"
          action: "Inspect the environment variables passed to post-script"
          command: "Check AGENT_EXIT_CODE in post-script env"
          validation: "AGENT_EXIT_CODE equals '1'"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Reset environment"
          command: "os.Unsetenv('AGENT_EXIT_CODE')"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "AGENT_EXIT_CODE is set to the non-zero exit code"
        condition: "env['AGENT_EXIT_CODE'] == '1'"
        failure_impact: "Post-scripts cannot detect agent failures, silently succeed"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  - scenario_id: 2
    test_id: "TS-GH-71-002"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-71"
    coverage_status: "NEW"

    test_objective:
      title: "Verify AGENT_EXIT_CODE is zero on successful agent run"
      what: |
        Tests that when the agent process exits successfully (exit code 0),
        the AGENT_EXIT_CODE environment variable is set to '0', allowing
        post-scripts to confirm the agent completed without error.
      why: |
        Post-scripts need to distinguish between a successful agent run that
        produced no changes (no-op) and a failed agent run. Both produce no
        commits, but only the failure case should report an error.
      acceptance_criteria:
        - "AGENT_EXIT_CODE is set to '0' on successful agent exit"
        - "Post-script can read the value correctly"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing with testify"

    specific_preconditions: []
    test_data:
      resource_definitions: []
      api_endpoints: []

    test_steps:
