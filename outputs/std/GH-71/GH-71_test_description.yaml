          validation: "Mock is configured"
      test_execution:
        - step_id: "TEST-01"
          action: "Execute runAgent with the mock runtime"
          command: "Call runAgent() with mocked sandbox"
          validation: "Function completes successfully"
        - step_id: "TEST-02"
          action: "Inspect AGENT_EXIT_CODE in post-script environment"
          command: "Check AGENT_EXIT_CODE value"
          validation: "AGENT_EXIT_CODE equals '0'"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "AGENT_EXIT_CODE is '0' on successful run"
        condition: "env['AGENT_EXIT_CODE'] == '0'"
        failure_impact: "Successful runs could be misidentified as failures"

    dependencies:
