          action: "Set up a post-script that echoes AGENT_EXIT_CODE"
          command: "Create temp script: echo $AGENT_EXIT_CODE"
          validation: "Script is executable"
      test_execution:
        - step_id: "TEST-01"
          action: "Execute the run command with a failing agent"
          command: "Trigger deferred post-script execution"
          validation: "Post-script runs and can read AGENT_EXIT_CODE"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temp script"
          command: "os.Remove(tempScript)"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
