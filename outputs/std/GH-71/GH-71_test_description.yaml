    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-71"
    coverage_status: "NEW"

    test_objective:
      title: "Verify lastExitCode updated after each iteration"
      what: |
        Tests that in multi-iteration validation loops, the lastExitCode
        variable is updated to reflect the exit code of the most recent
        agent iteration, not a stale value from a previous iteration.
      why: |
        The known limitation states that only the last iteration's exit code
        is captured. This test ensures the variable is at least correctly
        updated on each iteration, preventing stale values.
      acceptance_criteria:
        - "lastExitCode reflects the final iteration's exit code"
        - "Previous iteration exit codes do not persist"

    classification:
