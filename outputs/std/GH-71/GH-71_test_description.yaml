        - step_id: "SETUP-02"
          action: "Set environment variables"
          command: "export AGENT_EXIT_CODE=1 GITHUB_SERVER_URL=https://github.com GITHUB_REPOSITORY=org/repo GITHUB_RUN_ID=12345 ISSUE_NUMBER=42"
          validation: "Variables are set"
