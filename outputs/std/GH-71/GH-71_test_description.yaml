      external_tools: []
      scenario_specific_rbac: []

  - scenario_id: 3
    test_id: "TS-GH-71-003"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-71"
    coverage_status: "NEW"

    test_objective:
      title: "Verify post-script receives exit code via environment"
      what: |
        Tests the integration point where the deferred post-script execution
        in run.go receives the AGENT_EXIT_CODE environment variable. Validates
        that the env var is correctly injected into the exec.Command environment
        for the post-script subprocess.
      why: |
        The defer block in run.go must correctly pass lastExitCode to the
        post-script. If the env injection fails, the post-script receives
        no exit code and defaults to treating the run as successful.
      acceptance_criteria:
        - "Post-script exec.Command receives AGENT_EXIT_CODE in its Env slice"
        - "Value is a string representation of the integer exit code"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing with testify"

    specific_preconditions: []
    test_data:
