  # ============================================================
  # GH-69-AC6: Integration — post-review posts sanitized content
  # ============================================================

  - scenario_id: 12
    test_id: "TS-GH-69-012"
    test_type: "functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-69-AC6"
    coverage_status: "NEW"

    variables:
      closure_scope:
        - name: "fakeForge"
          type: "forge.Client (mock)"
          initialized_in: "test"
          used_in: ["test"]
          comment: "Mock forge client to capture posted content"
        - name: "capturedBody"
          type: "string"
          initialized_in: "test"
          used_in: ["test"]
          comment: "Body string captured from forge client call"

    test_structure:
      type: "single"
      function_name: "TestPostReviewCommand_PostsSanitizedContentToForge"

    test_objective:
      title: "Verify post-review command posts sanitized content to forge API when review body contains embedded secrets"
      what: |
        Integration test that exercises the full post-review command flow: parse
        review result → sanitize → post to forge. Uses a mock forge client to
        capture the content actually delivered to the API and verify it has been
        sanitized.
      why: |
        Unit tests validate sanitizeReviewResult in isolation, but this test
        confirms the function is wired correctly into the command flow. A wiring
        error could leave sanitization implemented but not invoked.
      acceptance_criteria:
        - "Content posted to forge API does not contain raw secret"
        - "Content posted to forge API still contains non-secret review text"
        - "The post-review command completes successfully"

    classification:
      test_type: "Functional"
      scope: "Multi-component"
      automation_approach: "Go testing + testify with mock forge client"

    specific_preconditions:
      - name: "Mock forge client"
        requirement: "A forge.Client implementation that captures posted content"
        validation: "Mock client created with content capture hook"

    test_data:
      resource_definitions:
        - name: "review_json_with_secret"
          type: "JSON input"
          yaml: |
            {
              "body": "Review complete. CI token: ghp_1234567890abcdefABCDEF1234567890abcd",
              "action": "comment",
              "findings": []
            }

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock forge client that captures CreatePullRequestReview body"
          command: "Configure mock to store body argument"
          validation: "Mock client ready to capture"

        - step_id: "SETUP-02"
          action: "Prepare review JSON input with embedded secret"
          command: "Write JSON to temp file or stdin"
          validation: "Review JSON available for command"

      test_execution:
        - step_id: "TEST-01"
          action: "Execute post-review command with secret-containing review"
          command: "Run command with mock forge client and review input"
          validation: "Command completes without error"

        - step_id: "TEST-02"
          action: "Assert captured body does not contain raw secret"
          command: "assert.NotContains(t, capturedBody, 'ghp_1234567890')"
          validation: "Secret was sanitized before reaching forge API"

        - step_id: "TEST-03"
          action: "Assert captured body contains non-secret text"
          command: "assert.Contains(t, capturedBody, 'Review complete')"
          validation: "Non-secret content was preserved"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Forge API receives sanitized content"
        condition: "capturedBody does not contain raw secret"
        failure_impact: "Sanitization not wired into command flow — credential leak"

      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Non-secret content preserved in forge post"
        condition: "capturedBody contains legitimate review text"
        failure_impact: "Over-sanitization corrupts review content"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "Mock forge.Client implementation"
      scenario_specific_rbac: []
