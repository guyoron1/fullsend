          initialized_in: "test"
          used_in: ["test"]
          comment: "Sanitized review result returned by sanitizeReviewResult"

    test_structure:
      type: "single"
      function_name: "TestSanitizeReviewResult_SecretsInBodyAreRedacted"

    test_objective:
      title: "Verify secrets embedded in review body are redacted before posting"
      what: |
        Tests that sanitizeReviewResult() detects and redacts secrets (API keys,
        tokens, credentials) embedded in the review body text. The OutputPipeline
        runs UnicodeNormalizer then SecretRedactor on the body field, replacing
        detected secrets with masked values.
      why: |
        A leaked credential in a public PR comment could compromise infrastructure.
        This test ensures the security pipeline prevents credential exposure in the
        most common attack vector — the review body.
      acceptance_criteria:
        - "Secret patterns (GitHub PATs, API keys) in body are replaced with masked values"
        - "Non-secret text surrounding the secret is preserved unchanged"
        - "The returned ReviewResult has the same structure with only body content changed"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing + testify"

    specific_preconditions:
      - name: "security.OutputPipeline available"
        requirement: "OutputPipeline() returns functional scanner chain"
        validation: "Compile check"

    test_data:
      resource_definitions:
        - name: "review_with_secret"
          type: "ReviewResult"
          yaml: |
            body: "Review looks good. Token: ghp_1234567890abcdefABCDEF1234567890abcd"
            action: "approve"
            findings: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create ReviewResult with a GitHub PAT embedded in body"
          command: "Construct ReviewResult{Body: '...ghp_...', Action: 'approve'}"
          validation: "ReviewResult created with secret in body"

      test_execution:
        - step_id: "TEST-01"
          action: "Call sanitizeReviewResult with the secret-containing review"
          command: "sanitized := sanitizeReviewResult(result, discardPrinter)"
          validation: "Function returns without error"

        - step_id: "TEST-02"
          action: "Assert body no longer contains the raw secret"
          command: "assert.NotContains(t, sanitized.Body, 'ghp_1234567890')"
          validation: "Raw secret string is absent from sanitized body"

        - step_id: "TEST-03"
          action: "Assert non-secret content is preserved"
          command: "assert.Contains(t, sanitized.Body, 'Review looks good')"
          validation: "Surrounding text is unchanged"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Secret token is redacted from body"
        condition: "sanitized.Body does not contain the original secret string"
        failure_impact: "Credential leak in public PR comment"

      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Non-secret text preserved"
        condition: "sanitized.Body still contains non-secret surrounding text"
        failure_impact: "Review content corrupted by over-aggressive sanitization"

