      function_name: "TestSanitizeReviewResult_ZeroWidthObfuscatedSecretDetected"

    test_objective:
      title: "Verify secrets obfuscated with zero-width characters are detected and redacted"
      what: |
        Tests that the UnicodeNormalizer stage of the OutputPipeline strips zero-width
        characters (U+200C ZWNJ, U+200B ZWSP, etc.) before the SecretRedactor runs,
        ensuring that secrets split by invisible characters are still detected.
      why: |
        An attacker could inject zero-width characters into a secret to bypass
        pattern-based detection. The two-stage pipeline (normalize then scan) prevents
        this evasion technique.
      acceptance_criteria:
        - "Secret with embedded zero-width non-joiner characters is detected and redacted"
        - "The zero-width characters themselves are removed from the output"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go testing + testify"

    specific_preconditions: []

    test_data:
      resource_definitions:
        - name: "obfuscated_secret_review"
          type: "ReviewResult"
          yaml: |
            body: "Token: ghp_12\u200C34567890abcdefABCDEF1234567890abcd"
            action: "comment"
            findings: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create ReviewResult with zero-width obfuscated GitHub PAT"
          command: "Construct ReviewResult with body containing ghp_ token split by U+200C"
          validation: "ReviewResult has obfuscated secret in body"

      test_execution:
        - step_id: "TEST-01"
          action: "Call sanitizeReviewResult"
          command: "sanitized := sanitizeReviewResult(result, discardPrinter)"
          validation: "Function returns without error"

        - step_id: "TEST-02"
          action: "Assert body no longer contains the secret (after normalization)"
          command: "assert.NotContains(t, sanitized.Body, 'ghp_')"
          validation: "Obfuscated secret is detected and fully redacted"

        - step_id: "TEST-03"
          action: "Assert zero-width characters are removed"
          command: "assert.NotContains(t, sanitized.Body, '\\u200C')"
          validation: "Invisible characters are stripped"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Obfuscated secret is detected and redacted"
        condition: "Body does not contain ghp_ prefix after sanitization"
        failure_impact: "Obfuscation bypass allows credential leak"

    dependencies:
