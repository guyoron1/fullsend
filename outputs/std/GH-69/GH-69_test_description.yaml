  # GH-69-AC1: Secrets in review body redacted before posting
  # ============================================================

  - scenario_id: 1
    test_id: "TS-GH-69-001"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-69-AC1"
    coverage_status: "NEW"

    variables:
      closure_scope:
        - name: "result"
          type: "ReviewResult"
          initialized_in: "test"
          used_in: ["test"]
          comment: "Review result containing secrets in body"
        - name: "sanitized"
