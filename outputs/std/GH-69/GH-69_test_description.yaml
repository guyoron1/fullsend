    test_objective:
      title: "Verify secrets obfuscated with fullwidth characters are detected and redacted"
      what: |
        Tests that the UnicodeNormalizer's NFKC normalization converts fullwidth
        ASCII characters back to standard ASCII before the SecretRedactor runs,
        ensuring secrets written with fullwidth letters are still detected.
      why: |
        Fullwidth Unicode characters (U+FF01–U+FF5E) are visually similar to ASCII
        but have different codepoints. An attacker could use them to bypass simple
        string matching. NFKC normalization defeats this technique.
      acceptance_criteria:
        - "Secret written with fullwidth characters is normalized and redacted"

    classification:
