      what: |
        Validates that when multiple harness wrapper files produce the same slug,
        discoverAgentSlugs deduplicates the results and returns each slug only once.
        First occurrence order is preserved.
      why: |
        Duplicate slugs would cause duplicate app deletion API calls during uninstall,
        potentially causing errors or confusing output. Deduplication ensures clean
        app cleanup.
      acceptance_criteria:
        - "Duplicate slugs from multiple harness files are removed"
        - "First occurrence order is preserved in the result"
        - "Result contains each unique slug exactly once"

