              - "/fs-code"
              - "/fs-review"
              - "/fs-fix"
              - "/fs-retro"
              - "/fs-prioritize"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create test table with all slash commands and NONE association"
          command: "Build table-driven test cases"
          validation: "All 6 commands represented"
      test_execution:
        - step_id: "TEST-01"
          action: "For each slash command, invoke dispatch with NONE association"
          command: "Call dispatch for each command with author_association=NONE"
          validation: "is_authorized returns false for all"
        - step_id: "TEST-02"
          action: "Verify no STAGE output is set"
          command: "Check dispatch output is empty"
          validation: "No STAGE set for any command"
      cleanup: []
    assertions:
