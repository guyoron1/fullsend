          action: "Execute dispatch routing"
          command: "Run dispatch routing"
          validation: "STAGE is not set despite MEMBER association"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Reset environment"
          command: "Unset variables"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Bot user blocked from slash commands"
        condition: "STAGE empty when COMMENT_USER_TYPE=Bot"
        failure_impact: "Bot accounts can trigger agent runs causing infinite loops"

