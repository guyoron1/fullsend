  - scenario_id: 1
    test_id: "TS-GH-79-001"
    test_type: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-79"
    coverage_status: "NEW"
    test_objective:
      title: "Verify unauthorized user cannot trigger /fs-triage"
      what: |
        Tests that when a user with an unauthorized association (e.g., NONE or
        CONTRIBUTOR) issues the /fs-triage slash command, the dispatch routing
        does not set STAGE=triage and the agent run is not triggered.
      why: |
        /fs-triage was previously ungated as a slash command, creating a
        cost-exposure and abuse-surface gap. ADR 0051 mandates authorization
        on all slash-command dispatch paths.
      acceptance_criteria:
        - "STAGE is not set to 'triage' for unauthorized user"
        - "No agent inference run is dispatched"
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with testify assertions"
    specific_preconditions:
      - name: "Unauthorized user association"
        requirement: "Simulated COMMENT_AUTHOR_ASSOC=NONE"
        validation: "Environment variable set correctly"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Configure dispatch environment with unauthorized user"
          command: "Set COMMENT_AUTHOR_ASSOC=NONE, COMMENT_BODY=/fs-triage, COMMENT_USER_TYPE=User"
          validation: "Environment variables set"
      test_execution:
        - step_id: "TEST-01"
          action: "Execute is_authorized check for /fs-triage command"
          command: "Call is_authorized() with COMMENT_AUTHOR_ASSOC=NONE"
          validation: "Function returns non-zero (unauthorized)"
        - step_id: "TEST-02"
          action: "Verify STAGE is not set"
          command: "Check STAGE variable after dispatch routing"
          validation: "STAGE is empty or unset"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Reset environment variables"
          command: "Unset dispatch environment variables"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "is_authorized returns unauthorized for NONE association"
        condition: "is_authorized() returns non-zero exit code"
        failure_impact: "Unauthorized users can trigger agent triage runs, incurring cost"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "STAGE not set for unauthorized user"
        condition: "STAGE variable is empty after routing"
        failure_impact: "Agent dispatch proceeds without authorization"

