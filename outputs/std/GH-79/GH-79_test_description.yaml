          command: "Check for reaction/comment on the original comment"
          validation: "Feedback present"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Reset environment"
          command: "Unset variables"
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Visible feedback on unauthorized slash command"
        condition: "Reaction or comment posted for unauthorized user"
        failure_impact: "Users receive no indication their command was not authorized"

