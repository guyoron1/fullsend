  # ===============================================================
  - scenario_id: "015"
    test_id: "TS-GH-79-015"
    test_type: "functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-79"
    coverage_status: "NEW"
    test_objective:
      title: "Verify fork PR is blocked from fix agent dispatch"
      what: |
        Tests that when the PR head repository differs from the base repository
        (indicating a fork PR), the fix agent dispatch is blocked.
      why: |
        Fix agents push commits to the PR branch. Fork PRs require cross-repo
        push permissions which the agent does not have. Blocking prevents
        runtime failures and potential security issues.
      acceptance_criteria:
        - "Fork PR (head.repo != base.repo) blocks fix dispatch"
        - "No STAGE output set for fork PRs targeting fix"
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go testing with testify assertions"
    specific_preconditions: []
    test_data:
      resource_definitions:
        - name: "fork_pr_event"
          type: "GitHubEvent"
          yaml: |
            event: issue_comment
            action: created
            comment:
              body: "/fs-fix"
              author_association: "MEMBER"
            issue:
              pull_request:
                head:
                  repo:
                    full_name: "external-user/fullsend"
                base:
                  repo:
                    full_name: "fullsend-ai/fullsend"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock /fs-fix comment on fork PR"
          command: "Construct event with different head/base repos"
          validation: "Head repo differs from base repo"
      test_execution:
        - step_id: "TEST-01"
          action: "Invoke dispatch for /fs-fix on fork PR"
          command: "Call dispatch handler"
          validation: "Fix dispatch blocked"
      cleanup: []
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Fork PR blocked from fix dispatch"
        condition: "No fix STAGE set when head.repo != base.repo"
        failure_impact: "Fix agent attempts to push to fork repo and fails at runtime"
    dependencies:
