          type: "TestTable"
          yaml: |
            cases:
              - association: "MEMBER"
                expected: true
              - association: "member"
                expected: false
              - association: "Member"
                expected: false
    test_steps:
      setup: []
      test_execution:
        - step_id: "TEST-01"
          action: "Test each case variation"
          command: "Table-driven test for case sensitivity"
          validation: "Only uppercase passes"
      cleanup: []
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "Authorization is case-sensitive"
        condition: "Only uppercase MEMBER/OWNER/COLLABORATOR pass"
        failure_impact: "Case mismatch could bypass or block authorization"
