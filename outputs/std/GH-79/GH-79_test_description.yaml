  - scenario_id: "001"
    test_id: "TS-GH-79-001"
    test_type: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-79"
    coverage_status: "NEW"
    test_objective:
      title: "Verify authorized user (MEMBER) can trigger /fs-triage dispatch"
      what: |
        Tests that a user with MEMBER author_association can successfully invoke
        the /fs-triage slash command and have it dispatched for agent processing.
        The authorization check must pass before setting the STAGE output.
      why: |
        Core security requirement from ADR 0051. Organization members must retain
        the ability to trigger triage operations via slash commands. Blocking
        legitimate users would disrupt standard workflow.
      acceptance_criteria:
        - "MEMBER association passes is_authorized check"
        - "Dispatch sets the triage STAGE output"
    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go testing with testify assertions"
    specific_preconditions: []
    test_data:
      resource_definitions:
        - name: "issue_comment_event"
          type: "GitHubEvent"
          yaml: |
            event: issue_comment
            action: created
            comment:
              body: "/fs-triage"
              author_association: "MEMBER"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock issue comment event with MEMBER association"
          command: "Construct event payload with author_association=MEMBER"
          validation: "Event payload is valid"
      test_execution:
        - step_id: "TEST-01"
          action: "Invoke dispatch handler with /fs-triage comment"
          command: "Call dispatch function with prepared event"
          validation: "is_authorized returns true for MEMBER"
        - step_id: "TEST-02"
          action: "Verify triage STAGE is set in output"
          command: "Check dispatch output for STAGE=triage"
          validation: "STAGE output equals 'triage'"
      cleanup: []
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "MEMBER association passes authorization"
        condition: "is_authorized(MEMBER) == true"
        failure_impact: "Legitimate org members blocked from triage"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Triage stage is dispatched"
        condition: "STAGE output == 'triage'"
        failure_impact: "Authorized triage commands silently dropped"
    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

