    test_structure:
      type: "single"
      function:
        name: "TestDiscoverRemoteAgents_DirectoryListingError"
        description: "Verify directory listing errors propagate with context"

    test_objective:
      title: "Verify directory listing errors propagate with context"
      what: |
        Tests that when the forge API returns an error for directory listing
        (other than not-found), the error is propagated to the caller with
        additional context about what operation failed.
      why: |
        Clear error propagation with context enables operators to distinguish
        between "directory doesn't exist" (normal) and "API error" (problem)
        and take appropriate action.
      acceptance_criteria:
        - "Error is returned when directory listing fails"
        - "Error wraps the original forge API error"
        - "Error includes context about the listing operation"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with testify assertions"

    patterns:
      primary: "unit-negative-error-propagation"
      description: "Error wrapping and propagation"
      helpers_required: []

