          comment: "Discovered agents — only from .yaml/.yml files"
        - name: "err"
          type: "error"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Error result"

    test_structure:
      type: "table-driven"
      function:
        name: "TestDiscoverRemoteAgents_YAMLExtensionFilter"
        description: "Verify only .yaml and .yml files are processed"

    test_objective:
      title: "Verify only .yaml and .yml files are processed"
      what: |
        Tests that DiscoverRemoteAgents only attempts to fetch and parse files
        with .yaml or .yml extensions from the directory listing, ignoring all
        other file types.
      why: |
        Processing non-YAML files would cause unnecessary API calls and parse
        errors. The extension filter ensures efficient and correct discovery.
      acceptance_criteria:
        - "Files with .yaml extension are processed"
        - "Files with .yml extension are processed"
        - "Files with other extensions (.json, .txt, .md) are ignored"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with testify assertions"

    patterns:
      primary: "unit-positive-table-driven"
      description: "Extension filter table-driven test"
      helpers_required: []

    code_structure: "func TestXxx(t *testing.T) { tests := []struct{...}; for _, tt := range tests { t.Run(tt.name, func(t *testing.T) { setup; act; assert }) } }"

    specific_preconditions:
      - name: "Mixed file types in directory listing"
        requirement: "FakeClient directory contains .yaml, .yml, .json, .txt, .md files"
        validation: "Client fixture with mixed extensions"

    test_data:
      resource_definitions:
        - name: "mixed_directory"
          type: "Directory listing"
          yaml: |
            - name: "agent-a.yaml"
              type: "file"
            - name: "agent-b.yml"
              type: "file"
            - name: "readme.md"
              type: "file"
            - name: "config.json"
              type: "file"
            - name: "notes.txt"
              type: "file"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fake forge client with mixed file types in directory"
          command: "forge.NewFakeClient(mixedFiles)"
          validation: "Client created with 5 files of different types"
      test_execution:
        - step_id: "TEST-01"
          action: "Call DiscoverRemoteAgents"
          command: "harness.DiscoverRemoteAgents(ctx, fakeClient, repo, dir)"
          validation: "Returns agents only from YAML files"
        - step_id: "TEST-02"
          action: "Verify only 2 agents returned (from .yaml and .yml files)"
          command: "assert.Len(t, agents, 2)"
          validation: "Non-YAML files excluded"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Only YAML files processed"
        condition: "len(agents) == count of .yaml + .yml files with valid content"
        failure_impact: "Non-YAML files cause parse errors or unexpected behavior"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "Go 1.22+"
