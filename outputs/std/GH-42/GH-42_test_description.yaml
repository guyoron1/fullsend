    test_structure:
      type: "single"
      function:
        name: "TestDiscoverRemoteAgents_PartialFailure"
        description: "Verify valid agents returned alongside aggregated errors"

    test_objective:
      title: "Verify valid agents returned alongside aggregated errors for malformed files"
      what: |
        Tests that when some harness files are valid and others are malformed,
        DiscoverRemoteAgents returns the successfully parsed agents AND an
        aggregated error containing all individual file errors.
      why: |
        Partial failure handling ensures that a single bad file doesn't prevent
        discovery of all other valid agents. This is critical for operational
        resilience when remote repositories have mixed content quality.
      acceptance_criteria:
        - "Valid agents are returned even when some files fail"
        - "Error contains all individual failures aggregated"
        - "Agent count equals number of valid files only"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with testify assertions"

    patterns:
      primary: "unit-partial-failure"
      description: "Partial failure with valid results"
      helpers_required: []

    code_structure: "func TestXxx(t *testing.T) { setup; act; assert }"

    specific_preconditions:
      - name: "Mix of valid and invalid harness files"
        requirement: "FakeClient with 2 valid and 1 malformed YAML file"
        validation: "Client fixture"

    test_data:
      resource_definitions:
        - name: "mixed_validity_files"
          type: "Harness YAML"
          yaml: |
            # valid-1.yaml
            role: "agent-a"
            slug: "a"
            ---
            # invalid.yaml
            {{invalid yaml
            ---
            # valid-2.yaml
            role: "agent-b"
            slug: "b"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fake forge client with mix of valid and invalid files"
          command: "forge.NewFakeClient(mixedValidityFiles)"
          validation: "Client created"
      test_execution:
        - step_id: "TEST-01"
          action: "Call DiscoverRemoteAgents"
          command: "harness.DiscoverRemoteAgents(ctx, fakeClient, repo, dir)"
          validation: "Returns both agents and error"
        - step_id: "TEST-02"
          action: "Verify valid agents are returned"
          command: "assert.Len(t, agents, 2)"
          validation: "2 valid agents from valid files"
        - step_id: "TEST-03"
          action: "Verify error is non-nil (aggregated)"
          command: "assert.Error(t, err)"
          validation: "Error returned for malformed files"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Valid agents returned despite errors"
        condition: "len(agents) == 2 && err != nil"
        failure_impact: "Single bad file causes total discovery failure"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Errors aggregated into multi-error"
        condition: "err contains all individual file errors"
        failure_impact: "Only first error reported, others lost"

    dependencies:
