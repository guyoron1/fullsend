    specific_preconditions:
      - name: "Fake forge client returning API error for directory listing"
        requirement: "FakeClient ListDirectory returns an error"
        validation: "Client fixture with error response"

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fake forge client that returns error for directory listing"
          command: "forge.NewFakeClient(errorOnList)"
          validation: "Client created"
      test_execution:
        - step_id: "TEST-01"
          action: "Call DiscoverRemoteAgents with client returning list error"
          command: "harness.DiscoverRemoteAgents(ctx, fakeClient, repo, dir)"
          validation: "Returns non-nil error"
        - step_id: "TEST-02"
          action: "Verify error wraps original API error"
          command: "assert.ErrorIs(t, err, originalErr)"
          validation: "Original error preserved in chain"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Error propagated for directory listing failure"
        condition: "err != nil"
        failure_impact: "API failures silently ignored"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Original error preserved in error chain"
