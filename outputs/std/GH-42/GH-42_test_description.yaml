        - name: "err"
          type: "error"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Error — expected non-nil for invalid YAML"

    test_structure:
      type: "single"
      function:
        name: "TestDiscoverRemoteAgents_InvalidYAML"
        description: "Verify error when forge API returns invalid YAML"

    test_objective:
      title: "Verify error when forge API returns invalid YAML"
      what: |
        Tests that DiscoverRemoteAgents returns an error when the forge API
        returns content that cannot be parsed as valid YAML. Validates that
        the error message identifies the problematic file.
      why: |
        Invalid YAML in remote harness files indicates a configuration error
        that must surface clearly. Silent failures or panics would make remote
        configuration debugging extremely difficult.
      acceptance_criteria:
        - "Error is returned when YAML parsing fails"
        - "Error message contains the filename of the invalid file"
        - "No panic occurs on malformed input"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with testify assertions"

    patterns:
      primary: "unit-negative-parse-error"
      description: "Invalid input error handling"
      helpers_required: []

    code_structure: "func TestXxx(t *testing.T) { setup; act; assert }"

    specific_preconditions:
      - name: "Fake forge client with invalid YAML content"
        requirement: "FakeClient returns non-parseable content for a harness file"
        validation: "Client fixture with malformed YAML"

    test_data:
      resource_definitions:
        - name: "invalid_yaml_content"
          type: "Harness YAML (malformed)"
          yaml: |
            role: "valid"
            slug: [invalid yaml {{{{

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fake forge client with invalid YAML content"
          command: "forge.NewFakeClient(invalidFiles)"
          validation: "Client created"
      test_execution:
        - step_id: "TEST-01"
          action: "Call DiscoverRemoteAgents with client returning invalid YAML"
          command: "harness.DiscoverRemoteAgents(ctx, fakeClient, repo, dir)"
          validation: "Returns non-nil error"
        - step_id: "TEST-02"
          action: "Verify error message references the failing file"
          command: "assert.Contains(t, err.Error(), filename)"
          validation: "Error contains filename for debugging"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Error returned for invalid YAML"
        condition: "err != nil"
        failure_impact: "Invalid config silently accepted, causing downstream failures"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Error identifies the problematic file"
        condition: "strings.Contains(err.Error(), filename)"
        failure_impact: "Debugging difficulty — user cannot identify which file is broken"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "Go 1.22+"
      scenario_specific_rbac: []

