scenarios:

  # ===========================================================================
  # GH-42-01: Remote agent discovery with correct identity fields (P0)
  # ===========================================================================

  - scenario_id: "001"
    test_id: "TS-GH-42-001"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "GH-42-01"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "TestSetup"
          used_in: ["TestSetup", "Test"]
          comment: "Background context for forge API calls"
        - name: "fakeClient"
          type: "*forge.FakeClient"
          initialized_in: "TestSetup"
          used_in: ["TestSetup", "Test"]
          comment: "Fake forge client with pre-configured harness files"
        - name: "agents"
          type: "[]harness.AgentInfo"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Discovered agents result"
        - name: "err"
          type: "error"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Error result from discovery"

    test_structure:
      type: "table-driven"
      function:
        name: "TestDiscoverRemoteAgents_CorrectIdentity"
        description: "Verify discovery returns agents with correct role, slug, and filename"

    test_objective:
      title: "Verify discovery returns agents with correct role, slug, and filename"
      what: |
        Tests that DiscoverRemoteAgents correctly extracts agent identity fields
        (role, slug, filename) from valid harness YAML files fetched via the forge
        API. Validates that the returned AgentInfo structs contain the exact values
        present in the source YAML content.
      why: |
        Correct identity extraction is the core contract of remote discovery.
        If role or slug values are wrong, downstream harness resolution will
        select the wrong agent, causing silent misconfigurations in production.
      acceptance_criteria:
        - "AgentInfo.Role matches the 'role' field in the source YAML"
        - "AgentInfo.Slug matches the 'slug' field in the source YAML"
        - "AgentInfo.Filename matches the directory entry name"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with testify assertions and fake forge client"

    patterns:
      primary: "unit-positive-table-driven"
      description: "Table-driven identity verification"
      helpers_required: []

    code_structure: "func TestXxx(t *testing.T) { tests := []struct{...}; for _, tt := range tests { t.Run(tt.name, func(t *testing.T) { setup; act; assert }) } }"

    specific_preconditions:
      - name: "Fake forge client with valid harness files"
        requirement: "FakeClient configured to return well-formed harness YAML with role and slug fields"
        validation: "Client setup in test fixture"

    test_data:
      resource_definitions:
        - name: "valid_harness_yaml"
          type: "Harness YAML"
          yaml: |
            role: "builder"
            slug: "builder-agent"
            base: "default"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fake forge client with valid harness YAML files"
          command: "forge.NewFakeClient(files)"
          validation: "Client created without error"
      test_execution:
        - step_id: "TEST-01"
          action: "Call DiscoverRemoteAgents with fake client and harness directory"
          command: "harness.DiscoverRemoteAgents(ctx, fakeClient, repo, dir)"
          validation: "Returns non-nil agents slice and nil error"
        - step_id: "TEST-02"
          action: "Verify each agent has correct role from source YAML"
          command: "assert.Equal(t, expected.Role, agent.Role)"
          validation: "Role matches source YAML role field"
        - step_id: "TEST-03"
          action: "Verify each agent has correct slug from source YAML"
          command: "assert.Equal(t, expected.Slug, agent.Slug)"
          validation: "Slug matches source YAML slug field"
        - step_id: "TEST-04"
          action: "Verify each agent has correct filename"
          command: "assert.Equal(t, expected.Filename, agent.Filename)"
          validation: "Filename matches directory entry name"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Agent role matches source YAML"
        condition: "agent.Role == sourceYAML.role"
        failure_impact: "Wrong agent selected during harness resolution"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Agent slug matches source YAML"
        condition: "agent.Slug == sourceYAML.slug"
        failure_impact: "Agent misidentified in discovery results"
      - assertion_id: "ASSERT-03"
        priority: "P0"
        description: "Agent filename matches directory entry"
        condition: "agent.Filename == directoryEntry.Name"
        failure_impact: "Traceability lost between agent and source file"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "Go 1.22+"
      scenario_specific_rbac: []

  - scenario_id: "002"
    test_id: "TS-GH-42-002"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "GH-42-01"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "TestSetup"
          used_in: ["TestSetup", "Test"]
          comment: "Background context"
        - name: "agents"
          type: "[]harness.AgentInfo"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Discovered agents — expected to be sorted"
        - name: "err"
          type: "error"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Error result"

    test_structure:
      type: "single"
      function:
        name: "TestDiscoverRemoteAgents_SortOrder"
        description: "Verify discovery returns agents sorted by role then filename"

    test_objective:
      title: "Verify discovery returns agents sorted by role then filename"
      what: |
        Tests that DiscoverRemoteAgents returns agents in deterministic sort order:
        primary sort by Role (ascending), secondary sort by Filename (ascending).
        This ensures consistent behavior regardless of forge API response ordering.
      why: |
        Deterministic ordering is essential for reproducible harness resolution.
        Without stable sort order, the same configuration could resolve differently
        across runs, making debugging difficult and causing flaky behavior.
      acceptance_criteria:
        - "Agents are sorted primarily by Role in ascending order"
        - "Agents with the same Role are sorted by Filename in ascending order"
        - "Sort order is stable across multiple invocations"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with testify assertions"

    patterns:
      primary: "unit-positive-ordering"
      description: "Sort order verification"
      helpers_required: []

    code_structure: "func TestXxx(t *testing.T) { setup; act; assert }"

    specific_preconditions:
      - name: "Multiple agents with varying roles"
        requirement: "FakeClient with 3+ harness files having different role values"
        validation: "Client fixture setup"

    test_data:
      resource_definitions:
        - name: "unsorted_harness_files"
          type: "Harness YAML"
          yaml: |
            # File: zebra.yaml
            role: "zebra"
            slug: "z-agent"
            ---
            # File: alpha.yaml
            role: "alpha"
            slug: "a-agent"
            ---
            # File: alpha-2.yaml
            role: "alpha"
            slug: "a2-agent"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fake forge client with multiple harness files in non-sorted order"
          command: "forge.NewFakeClient(unsortedFiles)"
          validation: "Client created"
      test_execution:
        - step_id: "TEST-01"
          action: "Call DiscoverRemoteAgents"
          command: "harness.DiscoverRemoteAgents(ctx, fakeClient, repo, dir)"
          validation: "Returns agents without error"
        - step_id: "TEST-02"
          action: "Verify agents are sorted by role ascending"
          command: "assert.Equal(t, \"alpha\", agents[0].Role)"
          validation: "First agent has lowest role alphabetically"
        - step_id: "TEST-03"
          action: "Verify secondary sort by filename for same role"
          command: "assert.Equal(t, \"alpha-2.yaml\", agents[0].Filename)"
          validation: "Within same role, sorted by filename ascending"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Agents sorted by role ascending"
        condition: "agents[i].Role <= agents[i+1].Role for all i"
        failure_impact: "Non-deterministic harness resolution order"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Secondary sort by filename for identical roles"
        condition: "When roles equal, agents[i].Filename <= agents[i+1].Filename"
        failure_impact: "Unstable ordering within same role"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "Go 1.22+"
      scenario_specific_rbac: []

  - scenario_id: "003"
    test_id: "TS-GH-42-003"
