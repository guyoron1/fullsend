      function:
        name: "TestDiscoverRemoteAgents_SkipSubdirectories"
        description: "Verify subdirectories are skipped"

    test_objective:
      title: "Verify subdirectories are skipped"
      what: |
        Tests that DiscoverRemoteAgents skips entries in the directory listing
        that are directories (not files), preventing recursive traversal and
        errors from attempting to parse directories as YAML.
