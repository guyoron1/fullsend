  - scenario_id: "004"
    test_id: "TS-GH-42-004"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "GH-42-02"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "TestSetup"
          used_in: ["Test"]
          comment: "Background context"
        - name: "agents"
          type: "[]harness.AgentInfo"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Result — expected nil"
        - name: "err"
          type: "error"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Error — expected nil"

    test_structure:
      type: "single"
      function:
        name: "TestDiscoverRemoteAgents_MissingDirectory"
        description: "Verify empty result and no error when directory not found"

    test_objective:
      title: "Verify empty result and no error returned when directory not found"
      what: |
        Tests that DiscoverRemoteAgents returns nil agents and nil error when the
        specified harness directory does not exist in the remote repository. This
        is the expected behavior for repos that do not have a harness directory.
      why: |
        Graceful handling of missing directories is critical for repos that may
        not yet have remote harness configurations. Returning an error would
        block harness resolution unnecessarily.
      acceptance_criteria:
        - "agents is nil when directory does not exist"
        - "err is nil when directory does not exist"
        - "No panic or unexpected behavior"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with testify assertions"

    patterns:
      primary: "unit-boundary-empty-input"
      description: "Missing resource graceful handling"
      helpers_required: []

    code_structure: "func TestXxx(t *testing.T) { setup; act; assert }"

    specific_preconditions:
      - name: "Fake forge client returning directory-not-found"
        requirement: "FakeClient ListDirectory returns not-found indicator"
        validation: "Client fixture returns appropriate error/empty for missing dir"

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fake forge client that returns not-found for directory listing"
          command: "forge.NewFakeClient(noDirFiles)"
          validation: "Client created"
      test_execution:
        - step_id: "TEST-01"
          action: "Call DiscoverRemoteAgents with non-existent directory path"
          command: "harness.DiscoverRemoteAgents(ctx, fakeClient, repo, \"nonexistent/dir\")"
          validation: "Returns nil, nil"
        - step_id: "TEST-02"
          action: "Verify agents is nil"
          command: "assert.Nil(t, agents)"
          validation: "No agents returned"
        - step_id: "TEST-03"
          action: "Verify error is nil"
          command: "assert.NoError(t, err)"
          validation: "No error returned"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Nil agents for missing directory"
        condition: "agents == nil"
        failure_impact: "Empty slice vs nil behavior mismatch in callers"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "No error for missing directory"
        condition: "err == nil"
        failure_impact: "Missing dir treated as error, blocking resolution"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "Go 1.22+"
      scenario_specific_rbac: []

  - scenario_id: "005"
    test_id: "TS-GH-42-005"
    tier: "Tier 1"
