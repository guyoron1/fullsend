  # ========================================================================
  # Requirement: CLAUDE.md deletion integrity
  # User Story: As a contributor, I want the CLAUDE.md removal to not break
  #   repository documentation references so that existing workflows remain
  #   functional
  # ========================================================================

  - scenario_id: "016"
    test_id: "TS-GH-17-016"
    tier: "Tier 1"
    priority: "P1"
    mvp: false
    requirement_id: "GH-17"
    test_objective:
      title: "Verify no remaining references to deleted CLAUDE.md"
      what: |
        Scans all markdown files and configuration files in the repository
        for references to CLAUDE.md (the top-level file that was deleted
        in this PR). Verifies no stale references remain.
      why: |
        Stale references to a deleted file create confusion for
        contributors who follow links or instructions pointing to a
        non-existent file.
      acceptance_criteria:
        - "No markdown files reference 'CLAUDE.md' as a link target"
        - "No config files reference 'CLAUDE.md'"
        - "References in .claude/ directory are excluded (internal config)"
    classification:
      test_type: "Functional"
      scope: "Repository-wide"
      automation_approach: "Go test with filepath.Walk and grep"
    variables:
      closure_scope:
        - name: "staleRefs"
          type: "[]string"
          initialized_in: "TestExecution"
          used_in: ["TestAssertions"]
          comment: "Files containing stale CLAUDE.md references"
    test_structure:
      type: "single"
      function: "TestNoRemainingCLAUDEMDReferences"
    test_steps:
      setup: []
      test_execution:
        - step_id: "TEST-01"
          action: "Walk repository and scan for CLAUDE.md references"
          command: "filepath.Walk with strings.Contains check per file"
          validation: "No references found outside excluded paths"
        - step_id: "TEST-02"
          action: "Exclude .claude/ directory and .git/"
          command: "Skip paths starting with .claude/ or .git/"
          validation: "Only relevant paths scanned"
      cleanup: []
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "No stale references to deleted CLAUDE.md"
        condition: "len(staleRefs) == 0"
        failure_impact: "Repository contains broken references to deleted file"
    dependencies:
      filesystem:
        - "Repository root (full tree scan)"

  - scenario_id: "017"
    test_id: "TS-GH-17-017"
    tier: "Tier 1"
    priority: "P1"
    mvp: false
    requirement_id: "GH-17"
    test_objective:
      title: "Verify repository documentation integrity after deletion"
      what: |
        Validates that the CLAUDE.md file does not exist at the repository
        root (confirming deletion) and that the repository's documentation
        structure remains intact (README.md exists, docs/ directory
        exists).
      why: |
        Confirms the deletion was carried out and the repository's
        documentation navigation is not broken by the removal.
      acceptance_criteria:
        - "CLAUDE.md does not exist at repository root"
        - "README.md exists at repository root"
        - "docs/ directory exists"
    classification:
      test_type: "Functional"
      scope: "Repository-level"
      automation_approach: "Go test with os.Stat"
    variables:
      closure_scope:
        - name: "repoRoot"
          type: "string"
          initialized_in: "TestSetup"
          used_in: ["TestExecution"]
          comment: "Repository root path"
    test_structure:
      type: "single"
      function: "TestRepositoryDocumentationIntegrity"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Determine repository root"
          command: "os.Getwd() or known path"
          validation: "Root path determined"
      test_execution:
        - step_id: "TEST-01"
          action: "Verify CLAUDE.md does not exist at root"
          command: "os.Stat(\"CLAUDE.md\") returns os.ErrNotExist"
          validation: "File confirmed deleted"
        - step_id: "TEST-02"
          action: "Verify README.md exists"
          command: "os.Stat(\"README.md\")"
          validation: "README exists"
        - step_id: "TEST-03"
          action: "Verify docs/ directory exists"
          command: "os.Stat(\"docs\")"
          validation: "Docs directory exists"
      cleanup: []
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "CLAUDE.md does not exist at root"
        condition: "os.Stat returns ErrNotExist"
        failure_impact: "Deletion not carried out"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "README.md exists"
        condition: "os.Stat succeeds"
        failure_impact: "Core documentation file missing"
      - assertion_id: "ASSERT-03"
        priority: "P1"
        description: "docs/ directory exists"
        condition: "os.Stat succeeds for docs/"
        failure_impact: "Documentation directory missing"
    dependencies:
      filesystem:
        - "Repository root"
