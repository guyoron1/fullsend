  # ========================================================================
  # Requirement: Attack scenario quality
  # User Story: As a reader, I want the attack scenarios to be distinct and
  #   cover the MCP threat surface so that I understand the security risks
  # ========================================================================

  - scenario_id: "012"
    test_id: "TS-GH-17-012"
    tier: "Tier 1"
    priority: "P2"
    mvp: false
    requirement_id: "GH-17"
    test_objective:
      title: "Verify document contains distinct attack scenarios"
      what: |
        Validates that the document contains at least 3 distinct attack
        scenarios under the Attack scenarios subsection, each with a
        unique bold label (e.g., **Scenario 1:**, **Scenario 2:**).
      why: |
        The document's value lies in comprehensive threat coverage. Fewer
        than 3 scenarios suggests incomplete analysis.
      acceptance_criteria:
        - "At least 3 distinct attack scenarios identified"
        - "Each scenario has a unique numbered label"
    classification:
      test_type: "Functional"
      scope: "Single-file"
      automation_approach: "Go test with regex counting"
    variables:
      closure_scope:
        - name: "content"
          type: "string"
          initialized_in: "TestSetup"
          used_in: ["TestExecution"]
          comment: "Document content"
    test_structure:
      type: "single"
      function: "TestDistinctAttackScenarios"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Read mcp-config-drift.md"
          command: "os.ReadFile"
          validation: "File reads without error"
      test_execution:
        - step_id: "TEST-01"
          action: "Count **Scenario N:** patterns"
          command: "regexp.FindAllString(`\\*\\*Scenario \\d+:`, content)"
          validation: "At least 3 matches"
      cleanup: []
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "At least 3 distinct attack scenarios"
        condition: "Count of scenario labels >= 3"
        failure_impact: "Incomplete threat analysis"
    dependencies:
      filesystem:
        - "docs/problems/mcp-config-drift.md"

