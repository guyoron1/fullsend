  - scenario_id: "004"
    test_id: "TS-GH-17-004"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "GH-17"
    test_objective:
      title: "Verify all relative links resolve to existing files"
      what: |
        Extracts all markdown relative links from mcp-config-drift.md and
        verifies that each target file exists on disk. Links with anchor
        fragments are resolved to the file portion only.
      why: |
        Broken links undermine the document's role as a cross-reference hub.
        Readers encountering 404s lose trust in the document's accuracy.
      acceptance_criteria:
        - "All relative file links resolve to existing files"
        - "Links with anchors are resolved to the file portion"
        - "External URLs (http/https) are excluded from file checks"
    classification:
      test_type: "Functional"
      scope: "Multi-file"
      automation_approach: "Go test with regex link extraction and os.Stat"
    variables:
      closure_scope:
        - name: "content"
          type: "string"
          initialized_in: "TestSetup"
          used_in: ["TestExecution"]
          comment: "Raw content of the document"
        - name: "docDir"
          type: "string"
          initialized_in: "TestSetup"
          used_in: ["TestExecution"]
          comment: "Directory containing the document for relative path resolution"
    test_structure:
      type: "single"
      function: "TestRelativeLinksResolve"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Read mcp-config-drift.md"
          command: "os.ReadFile(\"docs/problems/mcp-config-drift.md\")"
          validation: "File reads without error"
      test_execution:
        - step_id: "TEST-01"
          action: "Extract all markdown links using regex"
          command: "regexp.FindAllStringSubmatch(`\\]\\(([^)]+)\\)`, content)"
          validation: "Links extracted"
        - step_id: "TEST-02"
          action: "Filter to relative links only (exclude http/https)"
          command: "Skip links starting with http:// or https://"
          validation: "Only relative links remain"
        - step_id: "TEST-03"
          action: "Strip anchor fragments from link targets"
          command: "strings.SplitN(link, \"#\", 2)[0]"
          validation: "File path extracted"
        - step_id: "TEST-04"
          action: "Verify each file exists"
          command: "os.Stat(filepath.Join(docDir, filePath))"
          validation: "File exists on disk"
      cleanup: []
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "All relative links resolve to existing files"
        condition: "os.Stat succeeds for every extracted file path"
        failure_impact: "Broken cross-reference links in document"
    dependencies:
      filesystem:
        - "docs/problems/mcp-config-drift.md"
        - "docs/problems/security-threat-model.md"
        - "docs/problems/agent-architecture.md"
        - "docs/ADRs/0017-credential-isolation-for-sandboxed-agents.md"
        - "docs/ADRs/0016-unidirectional-control-flow.md"

