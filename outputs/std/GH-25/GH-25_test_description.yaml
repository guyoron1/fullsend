            expected: "Input exists for backward compatibility"
          - action: "Check description mentions deprecation or mint-url"
            expected: "Description contains 'deprecat' or 'mint-url'"

      - id: TS-GH-25-039
        name: "should prefer mint-url over status-token when both provided"
        description: >
          Validates that action.yml steps provide both MINT_URL and STATUS_TOKEN
          env vars, with the CLI binary handling priority.
        requirements: [REQ-10]
        function: TestRunWithMintURL
        subtest: "[test_id:TS-GH-25-039] should prefer mint-url over status-token when both provided"
        pattern: yaml_validation
        steps:
          - action: "Parse action.yml and find step with both MINT_URL and STATUS_TOKEN env vars"
            expected: "Both env vars are sourced from their respective inputs"

      - id: TS-GH-25-040
        name: "should mint token successfully with role"
        description: >
          Validates that the reconcile-status step in action.yml references
          mint-url or MINT_URL configuration.
        requirements: [REQ-10]
        function: TestReconcileStatusWithMintURL
        subtest: "[test_id:TS-GH-25-040] should mint token successfully with role"
        pattern: yaml_validation
        steps:
          - action: "Parse action.yml and find reconcile-status step"
            expected: "Step references mint-url or MINT_URL"

      - id: TS-GH-25-041
        name: "should return error when role missing with mint-url"
        description: >
          Validates that the reconcile-status step always includes --role
          alongside mint-url configuration.
        requirements: [REQ-10]
        function: TestReconcileStatusWithMintURL
        subtest: "[test_id:TS-GH-25-041] should return error when role missing with mint-url"
        pattern: yaml_validation
        steps:
          - action: "Parse action.yml and find reconcile-status step with mint-url"
            expected: "Step also includes role parameter"

      - id: TS-GH-25-042
        name: "should emit warning for deprecated token flag"
        description: >
