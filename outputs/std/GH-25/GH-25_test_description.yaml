          - action: "Scan steps for MINT_URL env var sourced from inputs.mint-url"
            expected: "At least one step maps inputs.mint-url → MINT_URL"

      - id: TS-GH-25-038
        name: "should emit deprecation warning for status-token"
        description: >
          Validates that the deprecated status-token input still exists in action.yml
          for backward compatibility, with its description mentioning deprecation.
