  - id: TG-06
    name: "Mint-URL Status Token Migration"
    component: "action.yml / cli"
    file: "qf-tests/GH-25/go/mint_url_migration_test.go"
    tier: 1
    pattern: action_yaml_contract
    stp_note: "Tests 037-045 extend STP scope; STP Section 1.1 lists cli/run.go and statuscomment as in-scope but no explicit STP scenarios were defined for mint-url migration"
    tests:
      - id: TS-GH-25-037
        name: "should mint fresh token for status comments"
        description: >
