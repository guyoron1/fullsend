        subtest: "[test_id:TS-GH-25-007] should return paths from FileContents map"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with FileContents for myorg/myrepo and other-org/other"
            expected: "FakeClient populated with 4 entries across 2 repos"
          - action: "Call fake.ListRepositoryFiles(ctx, 'myorg', 'myrepo')"
            expected: "Returns 3 paths for myorg/myrepo only"
          - action: "Assert returned paths match expected set"
            expected: "Contains README.md, src/main.go, docs/guide.md"

      - id: TS-GH-25-008
        name: "should return injected error"
        description: >
          Verifies that FakeClient returns injected errors from the Errors map
          when ListRepositoryFiles is called, allowing callers to test error paths.
        requirements: [REQ-07]
        function: TestFakeListRepositoryFiles
        subtest: "[test_id:TS-GH-25-008] should return injected error"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with injected ListRepositoryFiles error"
            expected: "FakeClient configured with simulated API failure"
          - action: "Call fake.ListRepositoryFiles(ctx, 'org', 'repo')"
            expected: "Returns injected error, nil paths"

  - id: TG-03
    name: "ComparePathPresence — Batched Path Checking"
    component: "internal/scaffold"
    file: "qf-tests/GH-25/go/compare_path_presence_test.go"
    tier: 1
    pattern: fake_client
    tests:
      - id: TS-GH-25-009
        name: "should return nil when all expected paths exist"
        description: >
          Verifies that ComparePathPresence returns nil missing slice when all
          expected paths are present in the repository file listing.
        requirements: [REQ-05]
        function: TestComparePathPresence
        subtest: "[test_id:TS-GH-25-009] should return nil when all expected paths exist"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with FileContents matching all expected paths"
            expected: "All 3 expected paths present in FakeClient"
          - action: "Call scaffold.ComparePathPresence with 3 expected paths"
            expected: "Returns nil missing, no error"

      - id: TS-GH-25-010
        name: "should return sorted missing paths when some are absent"
        description: >
          Verifies that missing paths are returned in sorted order when only
          some expected paths exist in the repository.
        requirements: [REQ-05, REQ-06]
        function: TestComparePathPresence
        subtest: "[test_id:TS-GH-25-010] should return sorted missing paths when some are absent"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with only README.md (2 paths missing)"
            expected: "FakeClient has 1 of 3 expected paths"
          - action: "Call scaffold.ComparePathPresence with 3 expected paths"
            expected: "Returns 2 missing paths in sorted order"
          - action: "Assert sort.StringsAreSorted(missing)"
            expected: "Missing paths are lexicographically sorted"

      - id: TS-GH-25-011
        name: "should return all paths as missing when none exist"
        description: >
          Verifies behavior when no expected paths exist. All paths should be
          returned as missing in sorted order.
        requirements: [REQ-05, REQ-06]
        function: TestComparePathPresence
        subtest: "[test_id:TS-GH-25-011] should return all paths as missing when none exist"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with empty FileContents"
            expected: "No matching paths available"
          - action: "Call scaffold.ComparePathPresence with 3 expected paths"
            expected: "Returns all 3 paths as missing in sorted order [a-file.txt, m-file.txt, z-file.txt]"

      - id: TS-GH-25-012
        name: "should return nil nil for empty expected paths"
        description: >
          Verifies the short-circuit behavior: when no paths are expected,
          the function returns immediately without making any API calls.
        requirements: [REQ-05]
        function: TestComparePathPresence
        subtest: "[test_id:TS-GH-25-012] should return nil nil for empty expected paths"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with injected ListRepositoryFiles error"
            expected: "Error would trigger if API were called"
          - action: "Call scaffold.ComparePathPresence with empty expected slice"
            expected: "Returns nil missing, nil error (no API call made)"

      - id: TS-GH-25-013
        name: "should propagate ListRepositoryFiles error with context"
        description: >
          Verifies that errors from ListRepositoryFiles are wrapped with
          descriptive context before being returned to the caller.
        requirements: [REQ-05]
        function: TestComparePathPresence
        subtest: "[test_id:TS-GH-25-013] should propagate ListRepositoryFiles error with context"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with injected 'connection refused' error"
            expected: "FakeClient configured to return error on ListRepositoryFiles"
          - action: "Call scaffold.ComparePathPresence with one expected path"
            expected: "Returns error wrapping original error with 'listing repository files' context"

      - id: TS-GH-25-014
        name: "should use batch ListRepositoryFiles not per-path GetFileContent"
        description: >
          Verifies the batch behavior: ComparePathPresence should call
          ListRepositoryFiles (single call) instead of per-path GetFileContent.
          GetFileContent is injected with a fatal error to prove it's never called.
        requirements: [REQ-05]
        function: TestComparePathPresence
        subtest: "[test_id:TS-GH-25-014] should use batch ListRepositoryFiles not per-path GetFileContent"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with valid FileContents and injected GetFileContent error"
            expected: "GetFileContent would fail if called"
          - action: "Call scaffold.ComparePathPresence with 2 expected paths"
            expected: "Succeeds using ListRepositoryFiles; GetFileContent error never triggered"
          - action: "Assert missing contains only file-c.go"
            expected: "Correct missing path identified via batch lookup"

  - id: TG-04
    name: "Harness Lint — Diagnostics"
    component: "internal/harness"
    file: "qf-tests/GH-25/go/harness_lint_test.go"
    tier: 1
    pattern: struct_method
    tests:
      - id: TS-GH-25-015
        name: "should return nil for harness with role set"
        description: >
          Verifies that Lint() returns nil diagnostics when the harness has
          a role field set (the primary required field).
        requirements: [REQ-09]
        function: TestLint
        subtest: "[test_id:TS-GH-25-015] should return nil for harness with role set"
        pattern: struct_method
        steps:
          - action: "Create Harness with Role='triage'"
            expected: "Well-configured harness struct"
          - action: "Call h.Lint()"
