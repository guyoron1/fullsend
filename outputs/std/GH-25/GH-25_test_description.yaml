test_groups:
  - id: TG-01
    name: "ListRepositoryFiles — LiveClient Implementation"
    component: "internal/forge/github"
    file: "qf-tests/GH-25/go/list_repository_files_test.go"
    tier: 1
    pattern: httptest_mock
    tests:
      - id: TS-GH-25-001
        name: "should return all blob paths for repository with files"
        description: >
          Verifies that ListRepositoryFiles returns only blob-type entries from
          the Git Trees API response, excluding tree (directory) entries. Uses an
          httptest server simulating the 4-step ref chain (repo → ref → commit → tree).
        requirements: [REQ-01]
        function: TestListRepositoryFiles
        subtest: "[test_id:TS-GH-25-001] should return all blob paths for repository with files"
        pattern: httptest_mock
        steps:
          - action: "Create httptest server with 6 tree entries (4 blobs, 2 trees)"
            expected: "Server responds with mixed blob/tree entries"
          - action: "Call client.ListRepositoryFiles(ctx, 'test-owner', 'test-repo')"
            expected: "Returns exactly 4 blob paths"
          - action: "Assert returned paths contain only blob entries"
            expected: "Contains README.md, src/main.go, src/util/helper.go, go.mod; excludes src, src/util"

      - id: TS-GH-25-002
        name: "should follow ref chain with exactly 4 API calls"
        description: >
          Validates the API call count optimization. The implementation should make
          exactly 4 sequential calls: get repo (default branch), get ref, get commit,
          get tree. Uses an atomic counter to track HTTP requests.
        requirements: [REQ-02]
        function: TestListRepositoryFiles
        subtest: "[test_id:TS-GH-25-002] should follow ref chain with exactly 4 API calls"
        pattern: httptest_mock
        steps:
          - action: "Create httptest server with atomic request counter"
            expected: "Counter initialized to 0"
          - action: "Call client.ListRepositoryFiles(ctx, 'test-owner', 'test-repo')"
            expected: "Returns successfully"
          - action: "Assert apiCallCount equals 4"
            expected: "Exactly 4 API calls made in ref chain"

      - id: TS-GH-25-003
        name: "should return ErrNotFound for non-existent repository"
        description: >
          Verifies error handling when the repository does not exist. The GitHub API
          returns 404, and ListRepositoryFiles should propagate this as an error.
        requirements: [REQ-03]
        function: TestListRepositoryFiles
        subtest: "[test_id:TS-GH-25-003] should return ErrNotFound for non-existent repository"
        pattern: httptest_mock
        steps:
          - action: "Create httptest server returning 404 for all requests"
            expected: "Server responds with HTTP 404"
          - action: "Call client.ListRepositoryFiles(ctx, 'ghost-owner', 'no-repo')"
            expected: "Returns non-nil error and nil paths"

      - id: TS-GH-25-004
        name: "should return error on truncated tree"
        description: >
          Verifies that when the Git Trees API response includes truncated: true,
          the function returns a descriptive error mentioning truncation rather than
          returning a partial file list.
        requirements: [REQ-04]
        function: TestListRepositoryFiles
        subtest: "[test_id:TS-GH-25-004] should return error on truncated tree"
        pattern: httptest_mock
        steps:
          - action: "Create httptest server returning truncated=true in tree response"
            expected: "Server responds with truncated tree"
          - action: "Call client.ListRepositoryFiles(ctx, 'test-owner', 'test-repo')"
            expected: "Returns error containing 'truncated', nil paths"

      - id: TS-GH-25-005
        name: "should return empty slice for empty repository"
        description: >
          Verifies behavior for a repository with no files. The function should
          return a non-nil empty slice (not nil), indicating successful API call
          with zero results.
        requirements: [REQ-01, REQ-03]
        function: TestListRepositoryFiles
        subtest: "[test_id:TS-GH-25-005] should return empty slice for empty repository"
        pattern: httptest_mock
        steps:
          - action: "Create httptest server returning empty tree entries"
            expected: "Server responds with empty tree array"
          - action: "Call client.ListRepositoryFiles(ctx, 'test-owner', 'test-repo')"
            expected: "Returns no error, non-nil empty slice"

      - id: TS-GH-25-006
        name: "should retry on transient failures during ref resolution"
        description: >
          Verifies that the retry logic in LiveClient.do() handles transient
          HTTP errors (502 Bad Gateway) during the ref resolution step. The first
          call returns 502, subsequent calls succeed.
        requirements: [REQ-01]
        function: TestListRepositoryFiles
        subtest: "[test_id:TS-GH-25-006] should retry on transient failures during ref resolution"
        pattern: httptest_mock
        steps:
          - action: "Create httptest server returning 502 on first ref call, success on retry"
            expected: "Server simulates transient failure then recovery"
          - action: "Call client.ListRepositoryFiles(ctx, 'test-owner', 'test-repo')"
            expected: "Returns successfully after retry"
          - action: "Assert ref endpoint called more than once"
            expected: "Retry occurred (refCallCount > 1)"

  - id: TG-02
    name: "ListRepositoryFiles — FakeClient Test Double"
    component: "internal/forge"
    file: "qf-tests/GH-25/go/list_repository_files_test.go"
    tier: 1
