            expected: "DirContents and FileContentsRef populated for single triage agent"
          - action: "Call harness.DiscoverRemoteAgents"
            expected: "Agent has empty Path field"

      - id: TS-GH-25-035
        name: "should strip path prefix to bare filename"
        description: >
          Verifies that the Filename field contains only the bare filename
          (e.g., 'triage.yaml') without the harness/ directory prefix.
