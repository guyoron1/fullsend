    test_structure:
      type: "single"
      function: "TestListRepositoryFiles"
      subtest: "follows ref chain with exactly 3 API calls"

    test_objective:
      title: "ListRepositoryFiles follows the ref chain: default branch -> commit SHA -> tree SHA -> recursive tree"
      what: |
        Validates the API call sequence: get repo default branch, resolve branch
        ref to commit SHA, get commit to extract tree SHA, then fetch recursive
        tree. This ensures the method uses the documented 3-call chain.
      why: |
        The performance optimization depends on a fixed number of API calls
        regardless of file count. If additional calls are made, the O(1)
        guarantee is broken.
      acceptance_criteria:
        - "Exactly 3-4 API calls are issued (get repo, get ref, get commit, get tree)"
        - "Calls follow the correct sequence"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with httptest mock server tracking call count"

    specific_preconditions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server tracking API call count and sequence"
          command: "httptest.NewServer with counting handler"
          validation: "Server tracks each API endpoint hit"
      test_execution:
        - step_id: "TEST-01"
          action: "Call ListRepositoryFiles"
          command: "client.ListRepositoryFiles(ctx, owner, repo)"
          validation: "Returns successfully"
        - step_id: "TEST-02"
          action: "Verify API call count"
          command: "assert.Equal(t, expectedCount, apiCallCount)"
          validation: "Exactly 3-4 API calls were made"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close httptest server"
          command: "server.Close()"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Fixed number of API calls"
        condition: "apiCallCount == 3 or 4"
        failure_impact: "Performance regression - more API calls than expected"

    dependencies:
      external_tools:
        - "Go 1.23+"
      scenario_specific_rbac: []

