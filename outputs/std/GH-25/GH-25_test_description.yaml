  - scenario_id: "001"
    test_id: "TS-GH-25-001"
    tier: "Tier1"
    priority: "P0"
    mvp: true
    requirement_id: "REQ-001"
    section: "forge.Client.ListRepositoryFiles"
    package: "internal/forge"

    variables:
      closure_scope:
        - name: "client"
          type: "*github.LiveClient"
          initialized_in: "TestSetup"
          used_in: ["TestSetup", "t.Run"]
          comment: "GitHub API client under test"
        - name: "paths"
          type: "[]string"
          initialized_in: "t.Run"
          used_in: ["t.Run"]
          comment: "Returned file paths"
        - name: "err"
          type: "error"
          initialized_in: "t.Run"
          used_in: ["t.Run"]
          comment: "Error from API call"

    test_structure:
      type: "table-driven"
      function: "TestListRepositoryFiles"
      subtest: "returns all blob paths for repository with files"

    test_objective:
      title: "ListRepositoryFiles on a repository with files returns all blob paths"
      what: |
        Validates that ListRepositoryFiles correctly retrieves all file paths
        from a repository's default branch. The method should return only blob
        entries (files), excluding tree entries (directories).
      why: |
        This is the core functionality replacing O(N) GetFileContent calls.
        If blob filtering fails, ComparePathPresence will produce false positives
        on directory entries.
      acceptance_criteria:
        - "Returns []string containing all file paths in the repository"
        - "No tree/directory entries are included in the result"
        - "No error is returned for a valid repository"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with httptest mock server"

    specific_preconditions:
      - name: "Mock GitHub API server"
        requirement: "httptest server returning valid Git Trees API responses"
        validation: "Server responds to /repos/{owner}/{repo}/git/trees/{sha}?recursive=1"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server with Git Trees API response containing blobs and trees"
          command: "httptest.NewServer with handler returning tree response"
          validation: "Server is running and accessible"
      test_execution:
        - step_id: "TEST-01"
          action: "Call ListRepositoryFiles with valid owner/repo"
          command: "client.ListRepositoryFiles(ctx, owner, repo)"
          validation: "Returns []string of blob paths only"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close httptest server"
          command: "server.Close()"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "All blob paths are returned"
        condition: "len(paths) matches expected blob count"
        failure_impact: "File listing incomplete, path presence checks unreliable"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "No directory entries in result"
        condition: "No path in result corresponds to a tree entry"
        failure_impact: "False positives in path existence checks"

    dependencies:
      external_tools:
        - "Go 1.23+"
      scenario_specific_rbac: []

