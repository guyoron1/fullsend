    name: "Harness Scaffold Integration & ParseRaw"
    component: "internal/harness"
    file: "qf-tests/GH-25/go/harness_scaffold_integration_test.go"
    tier: 1
    pattern: filesystem_integration
    stp_note: "Tests 049-051 extend STP scope; cover harness loading and YAML parsing which is foundational for DiscoverRemoteAgents (REQ-08)"
    tests:
      - id: TS-GH-25-049
        name: "should validate generated harness files against schema"
        description: >
          Integration test verifying that a well-formed harness YAML file
          (representative of scaffold generator output) loads and validates
          successfully.
        requirements: [REQ-13]
        function: TestScaffoldIntegration
        subtest: "[test_id:TS-GH-25-049] should validate generated harness files against schema"
        pattern: filesystem_integration
        steps:
          - action: "Write well-formed harness YAML to temp directory"
            expected: "File created at tmpDir/triage.yaml"
          - action: "Call harness.Load(harnessPath)"
            expected: "Returns non-nil Harness with Role='triage', Slug='triage-agent'"

      - id: TS-GH-25-050
        name: "should parse valid YAML bytes into Harness struct"
        description: >
          Tests the LoadRaw function (which calls parseRaw internally) with
          valid YAML content, verifying correct field extraction.
        requirements: [REQ-13]
        function: TestParseRaw
        subtest: "[test_id:TS-GH-25-050] should parse valid YAML bytes into Harness struct"
        pattern: filesystem_integration
        steps:
          - action: "Write valid harness YAML to temp file"
            expected: "File with role, slug, description, model fields"
          - action: "Call harness.LoadRaw(yamlPath)"
            expected: "Returns Harness with Role='triage', Slug='triage-agent'"

      - id: TS-GH-25-051
        name: "should return parse error for invalid YAML"
        description: >
          Tests that LoadRaw returns an error and nil Harness when given
          malformed YAML content.
        requirements: [REQ-13]
        function: TestParseRaw
        subtest: "[test_id:TS-GH-25-051] should return parse error for invalid YAML"
        pattern: filesystem_integration
        steps:
          - action: "Write invalid YAML content to temp file"
            expected: "File contains ':::invalid yaml{{{'"
          - action: "Call harness.LoadRaw(yamlPath)"
            expected: "Returns error and nil Harness"

