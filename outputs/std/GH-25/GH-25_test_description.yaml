      - id: TS-GH-25-016
        name: "should return warning for harness with empty role"
        description: >
          Verifies that Lint() returns a warning-severity diagnostic targeting
          the 'role' field when the role is empty.
        requirements: [REQ-09]
        function: TestLint
        subtest: "[test_id:TS-GH-25-016] should return warning for harness with empty role"
        pattern: struct_method
        steps:
          - action: "Create Harness with empty Role"
            expected: "Harness with missing role"
          - action: "Call h.Lint()"
            expected: "Returns 1 diagnostic with SeverityWarning, Field='role', message mentions 'required in a future version'"

      - id: TS-GH-25-017
        name: "should return nil for harness with role and slug"
        description: >
          Verifies that a fully configured harness (both role and slug set)
          produces no diagnostics.
        requirements: [REQ-09]
        function: TestLint
        subtest: "[test_id:TS-GH-25-017] should return nil for harness with role and slug"
        pattern: struct_method
        steps:
          - action: "Create Harness with Role='triage' and Slug='triage-agent'"
            expected: "Fully configured harness"
          - action: "Call h.Lint()"
            expected: "Returns nil diagnostics"

      - id: TS-GH-25-018
        name: "should format warning severity correctly"
        description: >
          Verifies the String() method of Diagnostic formats warning severity
          as 'warning: field: message'.
        requirements: [REQ-09]
        function: TestDiagnosticString
        subtest: "[test_id:TS-GH-25-018] should format warning severity correctly"
        pattern: struct_method
        steps:
          - action: "Create Diagnostic with SeverityWarning, Field='role', Message='test'"
            expected: "Diagnostic struct with Severity=SeverityWarning, Field='role', Message='test'"
          - action: "Call d.String()"
            expected: "Returns 'warning: role: test'"

      - id: TS-GH-25-019
        name: "should format error severity correctly"
        description: >
          Verifies the String() method of Diagnostic formats error severity
          as 'error: field: message'.
        requirements: [REQ-09]
        function: TestDiagnosticString
        subtest: "[test_id:TS-GH-25-019] should format error severity correctly"
        pattern: struct_method
        steps:
          - action: "Create Diagnostic with SeverityError, Field='name', Message='missing'"
            expected: "Diagnostic struct with Severity=SeverityError, Field='name', Message='missing'"
          - action: "Call d.String()"
            expected: "Returns 'error: name: missing'"

      - id: TS-GH-25-020
        name: "should format unknown severity with fallback"
        description: >
          Verifies that an unknown DiagnosticSeverity value produces a fallback
          string representation using the numeric value.
        requirements: [REQ-09]
        function: TestDiagnosticString
        subtest: "[test_id:TS-GH-25-020] should format unknown severity with fallback"
        pattern: struct_method
        steps:
          - action: "Create Diagnostic with DiagnosticSeverity(99)"
            expected: "Invalid severity value"
          - action: "Call d.String()"
            expected: "Returns 'DiagnosticSeverity(99): x: y'"

      - id: TS-GH-25-021
        name: "should return nil not empty slice when no issues found"
        description: >
          Verifies Go idiom compliance: Lint() returns nil (not an empty allocated
          slice) when there are no diagnostics, allowing callers to use 'if diags != nil'.
        requirements: [REQ-09]
        function: TestLint
        subtest: "[test_id:TS-GH-25-021] should return nil not empty slice when no issues found"
        pattern: struct_method
        steps:
          - action: "Create Harness with Role='triage'"
            expected: "Well-configured harness"
          - action: "Call h.Lint()"
            expected: "Returns pointer-nil, not empty []Diagnostic{}"

  - id: TG-05
    name: "DiscoverRemoteAgents — Remote Agent Discovery"
    component: "internal/harness"
    file: "qf-tests/GH-25/go/discover_remote_agents_test.go"
    tier: 1
    pattern: fake_client
    stp_note: "STP defines TS-GH-25-022 through 027 (6 scenarios); tests 028-036 extend coverage with edge cases discovered during implementation"
    tests:
      - id: TS-GH-25-022
        name: "should return agents sorted by role then filename"
        description: >
          Verifies that DiscoverRemoteAgents returns agents sorted first by Role
          then by Filename for deterministic output.
        requirements: [REQ-08]
        function: TestDiscoverRemoteAgents
        subtest: "[test_id:TS-GH-25-022] should return agents sorted by role then filename"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with 3 harness files (review, coder, triage)"
            expected: "DirContents and FileContentsRef populated"
          - action: "Call harness.DiscoverRemoteAgents(ctx, fake, owner, repo, ref)"
            expected: "Returns 3 agents sorted by role: coder < review < triage"

      - id: TS-GH-25-023
        name: "should return nil nil when no harness directory exists"
        description: >
          Verifies graceful handling when the harness directory does not exist.
          Should return (nil, nil), not an error.
        requirements: [REQ-08]
        function: TestDiscoverRemoteAgents
        subtest: "[test_id:TS-GH-25-023] should return nil nil when no harness directory exists"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with no DirContents entry for harness/"
            expected: "FakeClient returns ErrNotFound for directory listing"
          - action: "Call harness.DiscoverRemoteAgents"
            expected: "Returns nil agents, nil error"

      - id: TS-GH-25-024
        name: "should skip files without role or slug"
        description: >
          Verifies that harness YAML files containing neither role nor slug
          fields are excluded from the returned agent list.
        requirements: [REQ-08]
        function: TestDiscoverRemoteAgents
        subtest: "[test_id:TS-GH-25-024] should skip files without role or slug"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with 3 files: 1 with role, 2 empty"
            expected: "Mixed valid and empty harness files"
          - action: "Call harness.DiscoverRemoteAgents"
            expected: "Returns 1 agent (triage), skips empty files"

      - id: TS-GH-25-025
        name: "should include file with role only"
        description: >
          Verifies that a harness file with only a role field (no slug) is
          included in results with an empty slug.
        requirements: [REQ-08]
        function: TestDiscoverRemoteAgents
        subtest: "[test_id:TS-GH-25-025] should include file with role only"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with one role-only harness file"
            expected: "File has role='triage', no slug"
          - action: "Call harness.DiscoverRemoteAgents"
            expected: "Returns 1 agent with Role='triage', empty Slug"

      - id: TS-GH-25-026
        name: "should include file with slug only"
        description: >
          Verifies that a harness file with only a slug field (no role) is
          included in results with an empty role.
        requirements: [REQ-08]
        function: TestDiscoverRemoteAgents
        subtest: "[test_id:TS-GH-25-026] should include file with slug only"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with one slug-only harness file"
            expected: "File has slug='my-agent', no role"
          - action: "Call harness.DiscoverRemoteAgents"
            expected: "Returns 1 agent with Slug='my-agent', empty Role"

      - id: TS-GH-25-027
        name: "should return multi-error with valid files on malformed YAML"
        description: >
          Verifies partial success behavior: when one harness file has invalid
          YAML, valid files are still returned alongside an error mentioning
          the bad file.
        requirements: [REQ-08]
        function: TestDiscoverRemoteAgents
        subtest: "[test_id:TS-GH-25-027] should return multi-error with valid files on malformed YAML"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with 1 valid and 1 malformed YAML file"
            expected: "Mixed valid and invalid harness files"
          - action: "Call harness.DiscoverRemoteAgents"
            expected: "Returns 1 valid agent AND error mentioning 'bad.yaml'"

      - id: TS-GH-25-028
        name: "should return multi-error on GetFileContentAtRef failure"
        description: >
          Verifies partial success when GetFileContentAtRef fails for one file.
          Valid files are returned alongside an error for the missing file.
        requirements: [REQ-08]
        function: TestDiscoverRemoteAgents
        subtest: "[test_id:TS-GH-25-028] should return multi-error on GetFileContentAtRef failure"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with 2 dir entries but only 1 file content"
            expected: "missing.yaml has no FileContentsRef entry"
          - action: "Call harness.DiscoverRemoteAgents"
            expected: "Returns 1 valid agent AND error mentioning 'missing.yaml'"

      - id: TS-GH-25-029
        name: "should return empty slice for empty harness directory"
        description: >
          Verifies behavior when the harness directory exists but contains
          no files. Returns empty slice, not nil.
        requirements: [REQ-08]
        function: TestDiscoverRemoteAgents
        subtest: "[test_id:TS-GH-25-029] should return empty slice for empty harness directory"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with empty DirContents for harness/"
            expected: "Directory exists but is empty"
          - action: "Call harness.DiscoverRemoteAgents"
            expected: "Returns empty agents slice, no error"

      - id: TS-GH-25-030
        name: "should discover .yml extension files"
        description: >
          Verifies that files with .yml extension (not just .yaml) are
          recognized and processed as harness files.
        requirements: [REQ-08]
        function: TestDiscoverRemoteAgents
        subtest: "[test_id:TS-GH-25-030] should discover .yml extension files"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with agent.yml file"
            expected: "File uses .yml extension"
          - action: "Call harness.DiscoverRemoteAgents"
            expected: "Returns 1 agent with Filename='agent.yml'"

      - id: TS-GH-25-031
        name: "should skip non-YAML files"
        description: >
          Verifies that non-YAML files (README.md, notes.txt) in the harness
          directory are ignored during discovery.
        requirements: [REQ-08]
        function: TestDiscoverRemoteAgents
        subtest: "[test_id:TS-GH-25-031] should skip non-YAML files"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with 4 files: 2 YAML, 1 .md, 1 .txt"
            expected: "Mixed file types in harness directory"
          - action: "Call harness.DiscoverRemoteAgents"
            expected: "Returns 2 agents (only .yaml and .yml files)"

      - id: TS-GH-25-032
        name: "should skip subdirectories in harness directory"
        description: >
          Verifies that directory entries in the harness listing are skipped,
          only file-type entries are processed.
        requirements: [REQ-08]
        function: TestDiscoverRemoteAgents
        subtest: "[test_id:TS-GH-25-032] should skip subdirectories in harness directory"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with 1 file and 2 directories in harness/"
            expected: "Directory entries have Type='dir'"
          - action: "Call harness.DiscoverRemoteAgents"
            expected: "Returns 1 agent (file only), skips directories"

      - id: TS-GH-25-033
        name: "should sort same role by filename for deterministic output"
        description: >
          Verifies the secondary sort key: when multiple agents share the same
          role, they are sorted by filename for deterministic ordering.
        requirements: [REQ-08]
        function: TestDiscoverRemoteAgents
        subtest: "[test_id:TS-GH-25-033] should sort same role by filename for deterministic output"
        pattern: fake_client
        steps:
          - action: "Create FakeClient with 3 files all having role='coder'"
            expected: "z-coder.yaml, a-coder.yaml, m-coder.yaml"
          - action: "Call harness.DiscoverRemoteAgents"
            expected: "Returns agents sorted by filename: a-coder, m-coder, z-coder"

      - id: TS-GH-25-034
        name: "should have empty Path for remote agents"
        description: >
          Verifies that agents discovered from remote repositories have an
