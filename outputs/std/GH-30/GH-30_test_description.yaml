      what: |
        Tests the three OrgConfig-variant test functions
        (HarnessLoadWithOrgConfig, MalformedOrgConfig, WithURLBase) to confirm
        they use t.TempDir() and consistently reach their expected openshell
        error assertions without tar-related failures.
      why: |
        The OrgConfig variants exercise different harness loading configurations.
        Each must be verified independently to confirm the fix was applied and
        they reach their intended assertion points.
      acceptance_criteria:
        - "HarnessLoadWithOrgConfig reaches openshell error assertion"
        - "MalformedOrgConfig reaches malformed config error assertion"
        - "WithURLBase reaches openshell error assertion"
        - "No tar/directory errors in any variant"

