          body: '{"message": "Head branch was modified."}'
        - name: "update_branch_failure"
          status_code: 500
          body: '{"message": "Internal server error"}'

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server returning 409 for merge and 500 for update-branch"
          command: "httptest.NewServer with appropriate handler"
          validation: "Server configured"
      test_execution:
        - step_id: "TEST-01"
          action: "Call MergeChangeProposal"
          command: "client.MergeChangeProposal(ctx, prNumber)"
          validation: "Returns non-nil error"
        - step_id: "TEST-02"
          action: "Verify error message content"
          command: "assert.ErrorContains(t, err, expectedMessage)"
          validation: "Error references update-branch failure"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close httptest server"
          command: "server.Close()"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Error returned when update-branch API fails"
        condition: "err != nil"
        failure_impact: "Silent failure could lead to infinite retry loop or confusing errors"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Error message describes update-branch failure"
        condition: "err.Error() contains update-branch context"
        failure_impact: "Debugging difficulty if error message is generic"

    dependencies:
      external_tools:
        - "net/http/httptest (stdlib)"

  - scenario_id: 10
    test_id: "TS-GH-2432-010"
    test_type: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2432"
    coverage_status: "NEW"

    test_objective:
      title: "Verify successful merge on first attempt"
      what: |
        Regression guard test: validates that the happy-path merge (no 409 conflict)
