    test_type: "functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2432"
    coverage_status: "NEW"

    test_objective:
      title: "Verify exhaustion after 3 failed retries"
      what: |
        Tests that after receiving 409 on all 3 retry attempts (with successful
        update-branch calls in between), MergeChangeProposal gives up and returns
        an error indicating retry exhaustion.
      why: |
        Unbounded retries could hang indefinitely. The 3-attempt limit ensures
        the operation fails cleanly within a bounded time (max ~9 seconds) and
        surfaces the persistent conflict to the caller.
      acceptance_criteria:
        - "MergeChangeProposal returns error after 3 failed attempts"
        - "Exactly 3 merge attempts are made"
        - "Update-branch is called before each retry"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with httptest mock server"

    specific_preconditions: []

    test_data:
