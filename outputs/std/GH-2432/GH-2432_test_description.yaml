  - scenario_id: 1
    test_id: "TS-GH-2432-001"
    test_type: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2432"
    coverage_status: "NEW"

    test_objective:
      title: "Verify merge succeeds after 409 with branch update"
      what: |
        Tests that MergeChangeProposal detects a 409 "Head branch out of date"
        response, calls the update-branch API to sync the PR branch, waits for
        the branch to update, and then successfully retries the merge.
      why: |
        This is the core fix for the flaky E2E failure. Without retry logic,
        concurrent reconcile workflow pushes cause enrollment PR merges to fail
        intermittently, breaking CI reliability.
      acceptance_criteria:
        - "MergeChangeProposal returns nil error when first attempt returns 409 and retry succeeds"
        - "Update-branch API is called between the failed merge and the retry"
        - "The merge PUT request is sent at least twice"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with httptest mock server"

    specific_preconditions: []

    test_data:
      mock_responses:
        - name: "first_merge_attempt"
          status_code: 409
          body: '{"message": "Head branch was modified. Review and try the merge again."}'
        - name: "update_branch"
          status_code: 202
          body: '{"message": "Updating pull request branch."}'
        - name: "retry_merge_attempt"
          status_code: 200
          body: '{"merged": true, "message": "Pull Request successfully merged"}'

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server with sequenced responses"
          command: "httptest.NewServer with handler returning 409 then 200 for merge, 202 for update-branch"
          validation: "Server starts and URL is accessible"
      test_execution:
        - step_id: "TEST-01"
          action: "Call MergeChangeProposal with PR number"
          command: "client.MergeChangeProposal(ctx, prNumber)"
          validation: "Returns nil error"
        - step_id: "TEST-02"
          action: "Verify update-branch was called"
          command: "Assert update-branch endpoint received PUT request"
          validation: "Request count for update-branch is 1"
        - step_id: "TEST-03"
          action: "Verify merge was retried"
          command: "Assert merge endpoint received 2 PUT requests"
          validation: "Total merge request count is 2"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close httptest server"
          command: "server.Close()"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "MergeChangeProposal returns no error after successful retry"
        condition: "err == nil"
        failure_impact: "Core retry logic is broken; 409 errors will still fail merges"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Update-branch API was invoked between attempts"
        condition: "updateBranchCallCount == 1"
        failure_impact: "Retry without branch update will likely fail again with same 409"

    dependencies:
      external_tools:
        - "net/http/httptest (stdlib)"

  - scenario_id: 2
    test_id: "TS-GH-2432-002"
    test_type: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2432"
    coverage_status: "NEW"

    test_objective:
      title: "Verify update-branch called before retry"
      what: |
        Validates the ordering guarantee: after receiving a 409 on merge,
        MergeChangeProposal must call the update-branch API before attempting
        the next merge. This ensures the PR branch is synced with the base.
      why: |
        Retrying merge without updating the branch would result in the same 409
        error. The update-branch call is the critical step that resolves the
        out-of-date condition.
      acceptance_criteria:
        - "PUT /repos/{owner}/{repo}/pulls/{number}/update-branch is called after 409"
        - "The update-branch request occurs before the second merge attempt"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with httptest mock server and request ordering tracking"

    specific_preconditions: []

    test_data:
      mock_responses:
        - name: "merge_409"
          status_code: 409
          body: '{"message": "Head branch was modified."}'
        - name: "update_branch_success"
          status_code: 202
          body: '{"message": "Updating pull request branch."}'
        - name: "merge_success"
          status_code: 200
          body: '{"merged": true}'

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server that records request order"
          command: "httptest.NewServer with request log capturing URL path and method"
          validation: "Server captures requests in order"
      test_execution:
        - step_id: "TEST-01"
          action: "Call MergeChangeProposal"
          command: "client.MergeChangeProposal(ctx, prNumber)"
          validation: "Returns nil error"
        - step_id: "TEST-02"
          action: "Inspect request log for ordering"
          command: "Assert request[0]=PUT merge, request[1]=PUT update-branch, request[2]=PUT merge"
          validation: "Update-branch call is between the two merge attempts"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close httptest server"
          command: "server.Close()"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Update-branch request precedes retry merge request"
        condition: "requestLog indexOf(update-branch) < requestLog indexOf(second merge)"
        failure_impact: "Merge retry may fail if branch not updated first"

    dependencies:
      external_tools:
        - "net/http/httptest (stdlib)"

  - scenario_id: 3
