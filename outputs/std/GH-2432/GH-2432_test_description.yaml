  # ============================================================

  - scenario_id: 8
    test_id: "TS-GH-2432-008"
    test_type: "functional"
    priority: "P2"
    mvp: false
    requirement_id: "GH-2432"
    coverage_status: "NEW"

    test_objective:
      title: "Verify cancelled context aborts retry"
      what: |
        Tests that when the context is cancelled during the retry wait period
        (between update-branch and the next merge attempt), MergeChangeProposal
        stops retrying and returns promptly.
      why: |
        Context cancellation support ensures the retry loop respects timeouts
        and shutdown signals. Without this, a cancelled operation could block
        for up to 9 seconds waiting for retries to complete.
      acceptance_criteria:
        - "MergeChangeProposal returns within a short time after context cancellation"
        - "No additional merge attempts after cancellation"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with context.WithCancel and httptest"

    specific_preconditions: []

    test_data:
      mock_responses:
        - name: "merge_409"
          status_code: 409
          body: '{"message": "Head branch was modified."}'
        - name: "update_branch_success"
          status_code: 202
          body: '{"message": "Updating pull request branch."}'

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create context with cancel function"
          command: "ctx, cancel := context.WithCancel(context.Background())"
          validation: "Cancellable context created"
        - step_id: "SETUP-02"
          action: "Create httptest server that cancels context after first 409"
          command: "Handler calls cancel() after responding with 409"
          validation: "Server configured to trigger cancellation"
      test_execution:
        - step_id: "TEST-01"
          action: "Call MergeChangeProposal with cancellable context"
          command: "client.MergeChangeProposal(ctx, prNumber)"
          validation: "Returns error promptly"
        - step_id: "TEST-02"
          action: "Verify function returned quickly"
          command: "Assert total duration < 5 seconds"
          validation: "Did not block for full retry timeout"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close httptest server"
          command: "server.Close()"

    assertions:
      - assertion_id: "ASSERT-01"
