        - name: "merge_409_always"
          status_code: 409
          body: '{"message": "Head branch was modified."}'
          repeat: 3
        - name: "update_branch_success"
          status_code: 202
          body: '{"message": "Updating pull request branch."}'
          repeat: 3

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server always returning 409 for merge and 202 for update-branch"
          command: "httptest.NewServer with persistent 409 response"
          validation: "Server configured"
      test_execution:
        - step_id: "TEST-01"
          action: "Call MergeChangeProposal"
          command: "client.MergeChangeProposal(ctx, prNumber)"
          validation: "Returns non-nil error"
        - step_id: "TEST-02"
          action: "Verify exactly 3 merge attempts"
          command: "assert.Equal(t, 3, mergeCallCount)"
          validation: "mergeCallCount == 3"
        - step_id: "TEST-03"
          action: "Verify update-branch called before each retry"
