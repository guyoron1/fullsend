  - scenario_id: "008"
    test_id: "TS-GH-2432-008"
    tier: "Unit"
    priority: "P2"
    mvp: false
    requirement_id: "REQ-004"

    test_objective:
      title: "Context cancelled during retry delay"
      what: |
        Validates that when a context is cancelled during the retry delay
        (between the 409 response and the next merge attempt), the function
        returns the context error promptly without hanging.
      why: |
        CI timeouts and test cancellation must be respected. If the retry
        loop ignores context cancellation, tests could hang for the full
        retry delay (up to 9s worst-case) even when the parent context has
        been cancelled.
      acceptance_criteria:
        - "Function returns ctx.Err() when context is cancelled during retry delay"
        - "Function does not hang or block"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "go test with httptest mock server and cancelled context"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "test body"
          used_in: ["execution"]
          comment: "Context with short timeout for cancellation testing"
        - name: "cancel"
          type: "context.CancelFunc"
          initialized_in: "test body"
          used_in: ["setup"]
          comment: "Cancel function to trigger context cancellation"

    test_structure:
      type: "single"
      function_name: "TestMergeChangeProposal_ContextCancelled"
      description: "should return context error when cancelled during retry delay"

    specific_preconditions:
      - name: "Mock GitHub API server returning 409"
        requirement: "httptest server returning 409 on merge"
        validation: "Server returns 409"
      - name: "Context with short timeout"
        requirement: "Context that cancels during the retry delay"
        validation: "Context deadline shorter than retry delay"

    test_data:
      api_endpoints:
        - operation: "merge_pull_request"
          method: "PUT"
          path: "/repos/{owner}/{repo}/pulls/{number}/merge"
          expected_status: 409

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server returning 409 on merge"
          command: "httptest.NewServer with 409 handler"
          validation: "Server running"
        - step_id: "SETUP-02"
          action: "Create context with short timeout (< retry delay)"
          command: "context.WithTimeout(context.Background(), 100*time.Millisecond)"
          validation: "Context will cancel before retry completes"
      test_execution:
        - step_id: "TEST-01"
          action: "Call MergeChangeProposal with short-lived context"
          command: "client.MergeChangeProposal(ctx, owner, repo, prNumber)"
          validation: "Function returns context error"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Function returns a context error"
        condition: "errors.Is(err, context.DeadlineExceeded) || errors.Is(err, context.Canceled)"
        failure_impact: "Retry loop ignores context cancellation — tests could hang"

    dependencies:
      external_tools:
        - "Go 1.23+"
        - "net/http/httptest"

  - scenario_id: "009"
    test_id: "TS-GH-2432-009"
    tier: "Unit"
    priority: "P2"
    mvp: false
    requirement_id: "REQ-001"

    test_objective:
      title: "update-branch call fails but retry still proceeds"
      what: |
        Validates that when the update-branch API call fails (returns an error),
        the function still proceeds to retry the merge. The update-branch failure
        should not abort the retry loop since the merge might succeed anyway.
      why: |
        The update-branch call is a best-effort optimization. Even if it fails,
        the base branch might have been updated by other means, or the merge
        might succeed without it. Aborting on update-branch failure would make
        the retry logic fragile.
      acceptance_criteria:
        - "Function continues to retry merge despite update-branch failure"
        - "Final result depends on merge outcome, not update-branch outcome"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "go test with httptest mock server"

    variables:
      closure_scope:
        - name: "mergeCallCount"
          type: "int"
          initialized_in: "httptest handler"
          used_in: ["handler", "assertion"]
          comment: "Tracks merge attempts"
        - name: "updateBranchCallCount"
          type: "int"
          initialized_in: "httptest handler"
          used_in: ["handler", "assertion"]
          comment: "Tracks update-branch calls"

    test_structure:
      type: "single"
      function_name: "TestMergeChangeProposal_UpdateBranchFailsRetryProceeds"
      description: "should continue retrying merge even when update-branch fails"

    specific_preconditions:
      - name: "Mock GitHub API with failing update-branch"
        requirement: "httptest server returning 409 then 200 on merge, 500 on update-branch"
        validation: "Server configured with error on update-branch endpoint"

    test_data:
      api_endpoints:
        - operation: "merge_pull_request_first"
          method: "PUT"
          path: "/repos/{owner}/{repo}/pulls/{number}/merge"
          expected_status: 409
        - operation: "update_branch"
          method: "PUT"
          path: "/repos/{owner}/{repo}/pulls/{number}/update-branch"
          expected_status: 500
        - operation: "merge_pull_request_retry"
          method: "PUT"
          path: "/repos/{owner}/{repo}/pulls/{number}/merge"
          expected_status: 200

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server: merge returns 409 then 200, update-branch returns 500"
          command: "httptest.NewServer with failing update-branch handler"
          validation: "Server correctly sequences responses"
          code_template: |
            mux := http.NewServeMux()
            mergeCallCount := 0
            updateBranchCallCount := 0
            mux.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
                if r.Method == http.MethodPut && strings.HasSuffix(r.URL.Path, "/merge") {
                    mergeCallCount++
                    if mergeCallCount == 1 {
                        w.WriteHeader(http.StatusConflict) // 409
                        fmt.Fprint(w, `{"message":"Head branch is out of date"}`)
                        return
                    }
                    w.WriteHeader(http.StatusOK)
                    return
                }
                if strings.HasSuffix(r.URL.Path, "/update-branch") {
                    updateBranchCallCount++
                    w.WriteHeader(http.StatusInternalServerError) // 500
                    return
                }
                w.WriteHeader(http.StatusNotFound)
            })
            server := httptest.NewServer(mux)
            defer server.Close()
      test_execution:
        - step_id: "TEST-01"
          action: "Call MergeChangeProposal"
          command: "client.MergeChangeProposal(ctx, owner, repo, prNumber)"
          validation: "Function returns nil (merge succeeded on retry despite update-branch failure)"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Function returns nil (merge eventually succeeded)"
        condition: "err == nil"
        failure_impact: "update-branch failure aborts retry loop — fragile retry logic"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "update-branch was attempted"
        condition: "updateBranchCallCount >= 1"
        failure_impact: "update-branch not being called at all"
      - assertion_id: "ASSERT-03"
        priority: "P1"
        description: "Merge was retried after update-branch failure"
        condition: "mergeCallCount == 2"
        failure_impact: "Merge retry skipped after update-branch failure"

    dependencies:
      external_tools:
        - "Go 1.23+"
        - "net/http/httptest"
