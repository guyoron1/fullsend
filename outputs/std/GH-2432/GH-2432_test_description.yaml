scenarios:
  - scenario_id: "001"
    test_id: "TS-GH-2432-001"
    tier: "Unit"
    priority: "P0"
    mvp: true
    requirement_id: "REQ-001"

    test_objective:
      title: "Successful merge on first attempt (happy path)"
      what: |
        Validates that MergeChangeProposal completes successfully when the
        GitHub API returns 200 OK on the first merge attempt. No retry logic
        should be triggered and no update-branch call should be made.
      why: |
        Establishes the baseline happy-path behavior. The retry logic must not
        interfere with merges that succeed on the first try. If this fails,
        the core merge path is broken regardless of retry behavior.
      acceptance_criteria:
        - "Merge succeeds and function returns nil"
        - "No update-branch API call is made"
        - "Merge endpoint is called exactly once"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "go test with httptest mock server"

    variables:
      closure_scope:
        - name: "mergeCallCount"
          type: "int"
          initialized_in: "httptest handler"
          used_in: ["handler", "assertion"]
          comment: "Tracks number of merge API calls"
        - name: "updateBranchCalled"
          type: "bool"
          initialized_in: "httptest handler"
          used_in: ["handler", "assertion"]
          comment: "Tracks whether update-branch was called"

    test_structure:
      type: "single"
      function_name: "TestMergeChangeProposal_SuccessOnFirstAttempt"
      description: "should merge successfully on first attempt without retry"

    specific_preconditions:
      - name: "Mock GitHub API server"
        requirement: "httptest server returning 200 on PUT /repos/{owner}/{repo}/pulls/{number}/merge"
        validation: "Server responds to merge endpoint"

    test_data:
      api_endpoints:
        - operation: "merge_pull_request"
          method: "PUT"
          path: "/repos/{owner}/{repo}/pulls/{number}/merge"
          expected_status: 200

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server that returns 200 OK on merge endpoint"
          command: "httptest.NewServer with handler for PUT /merge → 200"
          validation: "Server is running and accessible"
          code_template: |
            mux := http.NewServeMux()
            mergeCallCount := 0
            updateBranchCalled := false
            mux.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
                if r.Method == http.MethodPut && strings.HasSuffix(r.URL.Path, "/merge") {
                    mergeCallCount++
                    w.WriteHeader(http.StatusOK)
                    return
                }
                if strings.HasSuffix(r.URL.Path, "/update-branch") {
                    updateBranchCalled = true
                    w.WriteHeader(http.StatusAccepted)
                    return
                }
                w.WriteHeader(http.StatusNotFound)
            })
            server := httptest.NewServer(mux)
            defer server.Close()
        - step_id: "SETUP-02"
          action: "Create GitHub client pointed at mock server"
          command: "Instantiate LiveClient with server.URL as base URL"
          validation: "Client is configured correctly"
      test_execution:
        - step_id: "TEST-01"
          action: "Call MergeChangeProposal with valid owner/repo/number"
          command: "client.MergeChangeProposal(ctx, owner, repo, prNumber)"
          validation: "Function returns nil"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Merge returns no error"
        condition: "err == nil"
        failure_impact: "Core merge path is broken"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "update-branch was never called"
        condition: "updateBranchCalled == false"
        failure_impact: "Unnecessary branch update on successful merge"
      - assertion_id: "ASSERT-03"
        priority: "P1"
        description: "Merge endpoint called exactly once"
        condition: "mergeCallCount == 1"
        failure_impact: "Unnecessary retry on successful merge"

    dependencies:
      external_tools:
        - "Go 1.23+"
        - "net/http/httptest"

  - scenario_id: "002"
    test_id: "TS-GH-2432-002"
    tier: "Unit"
    priority: "P0"
    mvp: true
    requirement_id: "REQ-001"

    test_objective:
      title: "409 triggers branch update and successful retry"
      what: |
        Validates the core retry-on-409 logic: when the first merge attempt
        returns a 409 "Head branch is out of date" error, the function should
        call update-branch, then retry the merge. The second attempt succeeds.
      why: |
        This is the primary fix scenario. The 409 race condition between
        reconcile workflow and enrollment PR merge is the root cause of the
        flaky E2E test. This test proves the retry mechanism works correctly.
      acceptance_criteria:
        - "Function returns nil (merge eventually succeeds)"
        - "update-branch endpoint is called exactly once"
        - "Merge endpoint is called exactly twice"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "go test with httptest mock server"

    variables:
      closure_scope:
        - name: "mergeCallCount"
          type: "int"
          initialized_in: "httptest handler"
          used_in: ["handler", "assertion"]
          comment: "Tracks number of merge API calls"
        - name: "updateBranchCallCount"
          type: "int"
          initialized_in: "httptest handler"
          used_in: ["handler", "assertion"]
          comment: "Tracks number of update-branch calls"

    test_structure:
      type: "single"
      function_name: "TestMergeChangeProposal_409TriggersRetry"
      description: "should update branch and retry merge on 409"

    specific_preconditions:
      - name: "Mock GitHub API server with 409-then-200 sequence"
        requirement: "httptest server returning 409 on first PUT /merge, 202 on PUT /update-branch, 200 on second PUT /merge"
        validation: "Server is running with stateful handler"

    test_data:
      api_endpoints:
        - operation: "merge_pull_request_first_attempt"
          method: "PUT"
          path: "/repos/{owner}/{repo}/pulls/{number}/merge"
          expected_status: 409
        - operation: "update_branch"
          method: "PUT"
          path: "/repos/{owner}/{repo}/pulls/{number}/update-branch"
          expected_status: 202
        - operation: "merge_pull_request_retry"
          method: "PUT"
          path: "/repos/{owner}/{repo}/pulls/{number}/merge"
          expected_status: 200

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server with stateful merge handler (409 first, 200 second)"
          command: "httptest.NewServer with counter-based handler"
          validation: "Server correctly sequences 409 → 200 responses"
          code_template: |
            mux := http.NewServeMux()
            mergeCallCount := 0
            updateBranchCallCount := 0
            mux.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
                if r.Method == http.MethodPut && strings.HasSuffix(r.URL.Path, "/merge") {
                    mergeCallCount++
                    if mergeCallCount == 1 {
                        w.WriteHeader(http.StatusConflict) // 409
                        fmt.Fprint(w, `{"message":"Head branch is out of date"}`)
                        return
                    }
                    w.WriteHeader(http.StatusOK)
                    return
                }
                if strings.HasSuffix(r.URL.Path, "/update-branch") {
                    updateBranchCallCount++
                    w.WriteHeader(http.StatusAccepted)
                    return
                }
                w.WriteHeader(http.StatusNotFound)
            })
            server := httptest.NewServer(mux)
            defer server.Close()
        - step_id: "SETUP-02"
          action: "Create GitHub client pointed at mock server"
          command: "Instantiate LiveClient with server.URL"
          validation: "Client configured"
      test_execution:
        - step_id: "TEST-01"
          action: "Call MergeChangeProposal"
          command: "client.MergeChangeProposal(ctx, owner, repo, prNumber)"
          validation: "Function returns nil after retry"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Merge returns no error (retry succeeded)"
        condition: "err == nil"
        failure_impact: "Retry-on-409 mechanism is broken"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "update-branch was called exactly once"
        condition: "updateBranchCallCount == 1"
        failure_impact: "Branch update not triggered on 409"
      - assertion_id: "ASSERT-03"
        priority: "P0"
        description: "Merge endpoint was called exactly twice"
        condition: "mergeCallCount == 2"
        failure_impact: "Incorrect number of merge attempts"

    dependencies:
      external_tools:
        - "Go 1.23+"
        - "net/http/httptest"

  - scenario_id: "003"
    test_id: "TS-GH-2432-003"
    tier: "Unit"
    priority: "P1"
    mvp: true
    requirement_id: "REQ-003"

    test_objective:
      title: "Non-409 error is not retried"
      what: |
        Validates that HTTP errors other than 409 (e.g., 422 "not mergeable")
        are returned immediately without triggering the retry loop or calling
        update-branch.
      why: |
        Retry logic must be selective — only 409 "out of date" errors are
        retriable. Other errors (validation failures, permission errors) should
        propagate immediately to avoid masking real problems.
      acceptance_criteria:
        - "Function returns error containing the original error message"
        - "Merge endpoint is called exactly once"
        - "update-branch is never called"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "go test with httptest mock server"

    variables:
      closure_scope:
        - name: "mergeCallCount"
          type: "int"
          initialized_in: "httptest handler"
          used_in: ["handler", "assertion"]
          comment: "Tracks merge call count"
        - name: "updateBranchCalled"
          type: "bool"
          initialized_in: "httptest handler"
          used_in: ["handler", "assertion"]
          comment: "Tracks whether update-branch was called"

    test_structure:
      type: "single"
      function_name: "TestMergeChangeProposal_Non409NotRetried"
      description: "should not retry on non-409 errors"

    specific_preconditions:
      - name: "Mock GitHub API server returning 422"
        requirement: "httptest server returning 422 on PUT /merge"
        validation: "Server responds with 422 and error message"

    test_data:
      api_endpoints:
        - operation: "merge_pull_request"
          method: "PUT"
          path: "/repos/{owner}/{repo}/pulls/{number}/merge"
          expected_status: 422

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server returning 422 'not mergeable' on merge endpoint"
          command: "httptest.NewServer with 422 handler"
          validation: "Server returns 422 with error body"
          code_template: |
            mux := http.NewServeMux()
            mergeCallCount := 0
            updateBranchCalled := false
            mux.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
                if r.Method == http.MethodPut && strings.HasSuffix(r.URL.Path, "/merge") {
                    mergeCallCount++
                    w.WriteHeader(http.StatusUnprocessableEntity) // 422
                    fmt.Fprint(w, `{"message":"Pull request is not mergeable"}`)
                    return
                }
                if strings.HasSuffix(r.URL.Path, "/update-branch") {
                    updateBranchCalled = true
                    w.WriteHeader(http.StatusAccepted)
                    return
                }
                w.WriteHeader(http.StatusNotFound)
            })
            server := httptest.NewServer(mux)
            defer server.Close()
      test_execution:
        - step_id: "TEST-01"
          action: "Call MergeChangeProposal"
          command: "client.MergeChangeProposal(ctx, owner, repo, prNumber)"
          validation: "Function returns error"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Function returns an error"
        condition: "err != nil"
        failure_impact: "Non-retriable errors are being swallowed"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Error message contains original failure reason"
        condition: "strings.Contains(err.Error(), \"not mergeable\") or status code 422"
        failure_impact: "Error context lost during retry handling"
      - assertion_id: "ASSERT-03"
        priority: "P0"
        description: "Merge endpoint called exactly once (no retry)"
        condition: "mergeCallCount == 1"
        failure_impact: "Non-409 errors are being incorrectly retried"
      - assertion_id: "ASSERT-04"
        priority: "P0"
        description: "update-branch was never called"
        condition: "updateBranchCalled == false"
        failure_impact: "Unnecessary branch update on non-409 error"

    dependencies:
      external_tools:
        - "Go 1.23+"
        - "net/http/httptest"

  - scenario_id: "004"
    test_id: "TS-GH-2432-004"
    tier: "Unit"
    priority: "P1"
    mvp: true
    requirement_id: "REQ-002"

    test_objective:
      title: "Persistent 409 exhausts retries"
      what: |
        Validates that when the GitHub API returns 409 on every merge attempt,
        the retry loop terminates after the maximum number of attempts (3) and
        returns an error rather than looping indefinitely.
      why: |
        Unbounded retries could cause tests to hang or consume excessive CI
        resources. The retry bound ensures predictable failure behavior and
        keeps E2E test execution times within acceptable limits.
      acceptance_criteria:
        - "Function returns an error after exhausting retries"
        - "Error message references the PR number"
        - "Merge endpoint called more than once (retries attempted)"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "go test with httptest mock server"

    variables:
      closure_scope:
        - name: "mergeCallCount"
          type: "int"
          initialized_in: "httptest handler"
          used_in: ["handler", "assertion"]
          comment: "Tracks total merge attempts"

    test_structure:
      type: "single"
      function_name: "TestMergeChangeProposal_ExhaustsRetries"
      description: "should return error after exhausting retry attempts on persistent 409"

    specific_preconditions:
      - name: "Mock GitHub API server returning 409 on all attempts"
        requirement: "httptest server returning 409 on every PUT /merge, 202 on update-branch"
        validation: "Server always returns 409 for merge"

    test_data:
      api_endpoints:
        - operation: "merge_pull_request_all_attempts"
          method: "PUT"
          path: "/repos/{owner}/{repo}/pulls/{number}/merge"
          expected_status: 409
        - operation: "update_branch"
          method: "PUT"
          path: "/repos/{owner}/{repo}/pulls/{number}/update-branch"
          expected_status: 202

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server always returning 409 on merge, 202 on update-branch"
          command: "httptest.NewServer with persistent-409 handler"
          validation: "Server consistently returns 409"
          code_template: |
            mux := http.NewServeMux()
            mergeCallCount := 0
            mux.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
                if r.Method == http.MethodPut && strings.HasSuffix(r.URL.Path, "/merge") {
                    mergeCallCount++
                    w.WriteHeader(http.StatusConflict) // 409
                    fmt.Fprint(w, `{"message":"Head branch is out of date"}`)
                    return
                }
                if strings.HasSuffix(r.URL.Path, "/update-branch") {
                    w.WriteHeader(http.StatusAccepted)
                    return
                }
                w.WriteHeader(http.StatusNotFound)
            })
            server := httptest.NewServer(mux)
            defer server.Close()
      test_execution:
        - step_id: "TEST-01"
          action: "Call MergeChangeProposal"
          command: "client.MergeChangeProposal(ctx, owner, repo, prNumber)"
          validation: "Function returns error after retries exhausted"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Function returns an error"
        condition: "err != nil"
        failure_impact: "Infinite retry loop — function never returns on persistent 409"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Merge was attempted more than once"
        condition: "mergeCallCount > 1"
        failure_impact: "Retry logic not executing"
      - assertion_id: "ASSERT-03"
        priority: "P1"
        description: "Error message references the PR number"
        condition: "error contains PR number or meaningful context"
        failure_impact: "Error message unhelpful for debugging"

    dependencies:
      external_tools:
        - "Go 1.23+"
        - "net/http/httptest"

  - scenario_id: "005"
    test_id: "TS-GH-2432-005"
    tier: "Tier1"
    priority: "P1"
    mvp: false
