  - scenario_id: 9
    test_id: "TS-GH-2432-009"
    test_type: "functional"
    priority: "P2"
    mvp: false
    requirement_id: "GH-2432"
    coverage_status: "NEW"

    test_objective:
      title: "Verify context error returned on cancellation"
      what: |
        Validates that when the context is cancelled during the retry wait,
        the returned error wraps or is the context error (context.Canceled),
        allowing the caller to distinguish cancellation from merge failure.
      why: |
        Callers need to differentiate between "merge failed after retries"
        and "operation was cancelled." This enables proper error handling
        and logging upstream.
      acceptance_criteria:
        - "Returned error is or wraps context.Canceled"
        - "Error is distinguishable from a merge failure error"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with context.WithCancel"

    specific_preconditions: []

    test_data:
      mock_responses:
        - name: "merge_409"
          status_code: 409
          body: '{"message": "Head branch was modified."}'

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create cancellable context and httptest server"
          command: "ctx, cancel := context.WithCancel(context.Background()); cancel after 409"
          validation: "Context and server configured"
      test_execution:
        - step_id: "TEST-01"
          action: "Call MergeChangeProposal"
          command: "err := client.MergeChangeProposal(ctx, prNumber)"
          validation: "Returns non-nil error"
        - step_id: "TEST-02"
          action: "Verify error is context.Canceled"
          command: "assert.ErrorIs(t, err, context.Canceled)"
          validation: "Error wraps context.Canceled"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close httptest server"
          command: "server.Close()"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "Error wraps context.Canceled"
        condition: "errors.Is(err, context.Canceled)"
        failure_impact: "Caller cannot distinguish cancellation from merge failure"

    dependencies:
      external_tools:
        - "net/http/httptest (stdlib)"

