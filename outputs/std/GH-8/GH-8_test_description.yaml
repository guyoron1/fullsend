    test_objective:
      title: "Verify identical content with different trailing newlines is not flagged as stale"
      what: |
        Tests the core fix for issue #2247. Creates two versions of the same shim
        content where one has trailing newlines and the other does not. Encodes both
        to base64 and runs the drift detection comparison. Verifies that the decoded
        text comparison correctly identifies the content as identical.
      why: |
        This is the primary regression test for the bug. Before the fix, Bash command
        substitution stripped trailing newlines from decoded base64, causing re-encoded
        base64 to differ. This led to false-positive drift detection and bogus update
        PRs being created for enrolled repositories.
      acceptance_criteria:
        - "Identical shim content with different trailing newlines MUST NOT be flagged as stale"
        - "Comparison function returns false (not stale) for logically identical content"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go/Ginkgo test with mocked shell commands"

