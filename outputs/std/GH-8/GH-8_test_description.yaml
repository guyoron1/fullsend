    test_objective:
      title: "Verify genuinely stale shim content is correctly detected"
      what: |
        Tests that the drift detection correctly identifies genuinely different shim
        content as stale. Creates managed content and a modified remote version with
        actual content differences (not just whitespace). Runs the comparison and
        verifies the content is flagged as needing an update.
      why: |
        While the fix addresses false positives, it must not introduce false negatives.
        If genuinely stale content is not detected, enrolled repositories would run
        outdated shim workflows, potentially breaking the FullSend enrollment pipeline.
      acceptance_criteria:
        - "Genuinely different shim content MUST be flagged as stale"
        - "Comparison function returns true (stale) for content with real differences"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go/Ginkgo test with mocked shell commands"

