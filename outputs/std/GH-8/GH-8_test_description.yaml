        - step_id: "SETUP-02"
          action: "Prepare stale remote content with actual differences"
          command: "staleRemoteContent = outdatedShimYAML"
          validation: "Remote content has genuine differences (e.g., old version ref)"
        - step_id: "SETUP-03"
          action: "Base64-encode both content strings"
          command: "managedB64 = base64.Encode(managedContent); remoteB64 = base64.Encode(staleRemoteContent)"
          validation: "Base64 strings differ due to content differences"

      test_execution:
        - step_id: "TEST-01"
          action: "Run drift detection comparison using decoded text"
          command: "isStale = compareDecodedContent(managedB64, remoteB64)"
          validation: "Comparison correctly identifies content difference"
        - step_id: "TEST-02"
