          type: "string"
          yaml: |
            content: |
              name: fullsend-shim
              on:
                workflow_dispatch:
              jobs:
                shim:
                  uses: fullsend-ai/fullsend/.github/workflows/shim.yml@main
        - name: "remote_shim_content_with_trailing_newline"
          type: "string"
          yaml: |
            # Same content as managed_shim_content but with trailing \n
            content: |
              name: fullsend-shim
              on:
                workflow_dispatch:
              jobs:
                shim:
