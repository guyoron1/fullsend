    test_objective:
      title: "Verify comparison handles CR/LF encoding variations"
      what: |
        Tests that the drift detection correctly handles content where one version
        uses Windows-style CR/LF line endings and the other uses Unix-style LF. The
        fix includes a `tr -d '\r'` step that strips carriage returns before comparing,
        ensuring platform encoding differences do not trigger false drift.
      why: |
        GitHub API may return content with different line ending conventions depending
        on the repository's .gitattributes or platform. The CR stripping ensures
        cross-platform compatibility and prevents false positives from line ending
        normalization differences.
      acceptance_criteria:
        - "Content with CR/LF line endings MUST be treated as identical to LF-only content"
        - "The tr -d '\\r' normalization correctly strips carriage returns before comparison"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go/Ginkgo test with mocked shell commands"

    specific_preconditions: []

    test_data:
      resource_definitions:
        - name: "content_with_crlf"
          type: "string"
          yaml: |
            # Content with \r\n line endings
            content: "name: fullsend-shim\r\non:\r\n  workflow_dispatch:\r\n"
        - name: "content_with_lf"
          type: "string"
          yaml: |
            # Same content with \n line endings
            content: "name: fullsend-shim\non:\n  workflow_dispatch:\n"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Prepare shim content with CRLF line endings"
          command: "contentWithCRLF = strings.ReplaceAll(shimContent, LF, CRLF)"
          validation: "Content contains \\r\\n sequences"
        - step_id: "SETUP-02"
          action: "Prepare same shim content with LF-only line endings"
          command: "contentWithLF = shimContent"
          validation: "Content contains only \\n sequences"
        - step_id: "SETUP-03"
          action: "Base64-encode both versions"
          command: "crlfB64 = base64.Encode(contentWithCRLF); lfB64 = base64.Encode(contentWithLF)"
          validation: "Base64 strings differ due to CR bytes"

      test_execution:
        - step_id: "TEST-01"
          action: "Run drift detection comparison"
          command: "isStale = compareDecodedContent(crlfB64, lfB64)"
          validation: "Comparison strips CR before comparing, treats content as identical"
        - step_id: "TEST-02"
          action: "Verify comparison result is not stale"
          command: "assert isStale == false"
          validation: "CR/LF differences are normalized away"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "CR/LF vs LF content is treated as identical after normalization"
        condition: "isStale == false"
        failure_impact: "Line ending differences would cause false drift on cross-platform repos"
      - assertion_id: "ASSERT-02"
