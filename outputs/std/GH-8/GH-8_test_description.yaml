              on:
                workflow_dispatch:
              jobs:
                shim:
                  uses: fullsend-ai/fullsend/.github/workflows/shim.yml@main
        - name: "stale_remote_content"
          type: "string"
          yaml: |
            # Different content — old version of shim
            content: |
              name: fullsend-shim
              on:
                workflow_dispatch:
              jobs:
                shim:
                  uses: fullsend-ai/fullsend/.github/workflows/shim.yml@v0.9

