          command: "managedContent = shimYAMLContent"
          validation: "Content string is non-empty"
        - step_id: "SETUP-02"
          action: "Prepare remote shim content with trailing newlines appended"
          command: "remoteContent = shimYAMLContent + trailingNewlines"
          validation: "Remote content differs in raw bytes but is logically identical"
        - step_id: "SETUP-03"
          action: "Base64-encode both content strings"
          command: "managedB64 = base64.Encode(managedContent); remoteB64 = base64.Encode(remoteContent)"
          validation: "Base64 strings differ due to trailing newline differences"

      test_execution:
        - step_id: "TEST-01"
          action: "Run drift detection comparison using decoded text"
          command: "isStale = compareDecodedContent(managedB64, remoteB64)"
          validation: "Comparison decodes both base64 strings, strips CR, and compares text"
        - step_id: "TEST-02"
          action: "Verify comparison result is not stale"
          command: "assert isStale == false"
          validation: "Content is correctly identified as identical"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Drift detection returns not-stale for identical content with different encoding"
        condition: "isStale == false"
        failure_impact: "False positive drift detection causes bogus update PRs (issue #2247)"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "No error during comparison"
        condition: "err == nil"
        failure_impact: "Comparison failure would block reconciliation entirely"

