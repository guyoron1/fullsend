      }

    test_objective:
      title: "[NEGATIVE] Verify detection when recommendation section is missing from evaluation"
      what: |
        Validates that the evaluation document completeness check can detect
        when the recommendation section (adopt/defer/reject) is absent. This
        tests the failure path where an evaluation provides analysis but no
        actionable conclusion.
      why: |
        An evaluation without a recommendation is incomplete research. The
        validation logic must detect this absence to prevent evaluation
        documents that analyze without concluding from being accepted.
      acceptance_criteria:
        - "Content without recommendation keywords fails the recommendation check"
        - "Content with recommendation keywords passes the recommendation check"
        - "Detection works for all three recommendation types (adopt/defer/reject)"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with testify assertions"

    specific_preconditions: []

    test_data:
      resource_definitions:
        - name: "content_without_recommendation"
          type: "string"
          yaml: |
            "This document analyzes Gastown architecture and integration surfaces but does not provide any conclusion or decision."
        - name: "recommendation_keywords"
          type: "StringSlice"
          yaml: |
            - "adopt"
            - "defer"
            - "reject"
            - "recommend"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Prepare content without recommendation language"
          command: "noRecContent := \"This document analyzes Gastown architecture and integration surfaces but does not provide any conclusion or decision.\""
          validation: "Test content prepared without recommendation keywords"

      test_execution:
        - step_id: "TEST-01"
          action: "Verify recommendation check fails on content without recommendation"
          command: "hasRec := regexp.MustCompile(`(?i)(\\badopt\\b|\\bdefer\\b|\\breject\\b|\\brecommend\\b)`).MatchString(noRecContent); assert.False(t, hasRec, \"content without recommendation should fail check\")"
          validation: "Recommendation check correctly returns false for content lacking recommendation"
        - step_id: "TEST-02"
          action: "Verify recommendation check passes on actual document"
          command: "hasRec := regexp.MustCompile(`(?i)(\\badopt\\b|\\bdefer\\b|\\breject\\b|\\brecommend\\b)`).MatchString(docContent); assert.True(t, hasRec, \"actual evaluation should contain recommendation\")"
          validation: "Recommendation check correctly returns true for actual evaluation document"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Missing recommendation is detectable"
        condition: "Recommendation check correctly identifies absence of recommendation language"
        failure_impact: "Evaluations without conclusions may pass validation"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []
