      what: |
        Validates that the evaluation document records the accessibility status
        of all three repositories (Gastown, gascity, goosetown) at the time of
        evaluation. This includes whether repos are public, archived, or unavailable.
      why: |
        External repositories can change status (archived, deleted, made private)
        at any time. Documenting accessibility status provides a snapshot for
        future reference and identifies potential blockers for adoption.
      acceptance_criteria:
        - "Document records accessibility status for each repository"
        - "Status includes whether repo is public, archived, or unavailable"
        - "Repository URLs or references are provided"

