            - "gascity"
            - "aaif-goose/goosetown"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Read evaluation document"
          command: "os.ReadFile(evalDocPath)"
          validation: "Document content loaded"

      test_execution:
        - step_id: "TEST-01"
          action: "Verify repository URLs or references present"
          command: "for _, repo := range []string{\"gastown\", \"gascity\", \"goosetown\"} { assert.True(t, strings.Contains(strings.ToLower(content), repo), \"missing repo reference: \"+repo) }"
          validation: "All three repository name references found in document"
        - step_id: "TEST-02"
          action: "Check for accessibility status language"
          command: "regexp.MustCompile(`(?i)(public|archived|accessible|available|private|deprecated|maintained)`).MatchString(content)"
          validation: "Accessibility or maintenance status language present"

