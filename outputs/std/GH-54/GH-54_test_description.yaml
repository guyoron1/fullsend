  - scenario_id: "012"
    test_id: "TS-GH-54-012"
    tier: "Tier 1"
    priority: "P2"
    mvp: false
    requirement_id: "GH-54"
    patterns:
      primary: "document-validation"
      helpers_required: []

    variables:
      closure_scope:
        - name: "docContent"
          type: "string"
          initialized_in: "Test"
          used_in: ["Test"]
          comment: "Raw content of evaluation document"

    test_structure:
      type: "single"
      describe:
        description: "Evaluation document completeness negative check"
      context:
        description: "When evaluation document is missing required sections"
        decorators: []
      it:
        description: "[NEGATIVE] should detect when a required project section is absent"
        test_id_format: "[test_id:TS-GH-54-012]"

    code_structure: |
      func TestEvalDetectsMissingProjectSection(t *testing.T) {
        // Setup: read evaluation document
        // Test: verify that absence of any required project section is detectable
        // Cleanup: none required
      }

    test_objective:
      title: "[NEGATIVE] Verify detection when a required project section is absent from evaluation"
      what: |
        Validates that the evaluation document's completeness can be verified by
        checking for the absence of a required project section. This tests the
        negative path where one of the three projects (Gastown, gascity, goosetown)
        is not covered, ensuring the validation logic correctly identifies the gap.
      why: |
        Positive-only testing creates false confidence. Verifying that missing
        content is detectable ensures the validation logic works in both directions
        and will catch incomplete evaluations.
      acceptance_criteria:
        - "Validation logic can distinguish between present and absent project sections"
        - "Missing project section produces a clear, identifiable signal"
        - "Each of the three project names is independently verifiable"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with testify assertions"

    specific_preconditions: []

    test_data:
      resource_definitions:
        - name: "required_projects"
          type: "StringSlice"
          yaml: |
            - "gastown"
            - "gascity"
            - "goosetown"
        - name: "incomplete_content"
          type: "string"
          yaml: |
            "This evaluation covers Gastown and gascity but omits goosetown entirely."

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Prepare incomplete test content missing one project"
          command: "incompleteContent := \"This evaluation covers Gastown and gascity but omits goosetown entirely.\""
          validation: "Test content prepared"

      test_execution:
        - step_id: "TEST-01"
          action: "Verify each project is independently checkable"
          command: "for _, proj := range requiredProjects { result := strings.Contains(strings.ToLower(incompleteContent), proj); if proj == \"goosetown\" { assert.False(t, result) } else { assert.True(t, result) } }"
          validation: "Present projects detected as present, absent project detected as absent"
        - step_id: "TEST-02"
          action: "Apply completeness check to actual document"
          command: "for _, proj := range requiredProjects { assert.True(t, strings.Contains(strings.ToLower(docContent), proj), \"evaluation missing required project: \"+proj) }"
          validation: "All required projects present in actual evaluation document"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Missing project section is detectable"
        condition: "Validation logic correctly identifies absent project sections"
        failure_impact: "Incomplete evaluations may pass validation undetected"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

