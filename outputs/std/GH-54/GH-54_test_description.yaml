        Validates that the recommendation is supported by justification that
        specifically references FullSend's architecture, components, or problem
        areas. The justification should explain why the recommendation is appropriate
        given FullSend's specific technical context.
      why: |
        A recommendation without FullSend-specific justification is generic and
        unconvincing. Grounding the decision in FullSend's architecture ensures
        the evaluation was thorough and the recommendation is well-reasoned.
      acceptance_criteria:
        - "Recommendation section contains justification"
        - "Justification references FullSend components or architecture"
        - "Justification connects external project features to FullSend needs"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with testify assertions"

    specific_preconditions: []

    test_data:
      resource_definitions: []

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Read evaluation document"
          command: "os.ReadFile(evalDocPath)"
          validation: "Document content loaded"

      test_execution:
        - step_id: "TEST-01"
          action: "Verify justification references FullSend"
          command: "regexp.MustCompile(`(?i)(recommend|conclusion|verdict)[\\s\\S]{0,500}(fullsend|FullSend|forge|harness|sandbox|agent)`).MatchString(content)"
          validation: "Recommendation section contains FullSend component references within 500 chars"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Justification references FullSend architecture"
        condition: "Recommendation justification mentions FullSend components or architecture"
        failure_impact: "Recommendation lacks FullSend-specific grounding"

