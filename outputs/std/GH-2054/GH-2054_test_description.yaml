  test_id: TS-GH-2054-012
  tier: Tier 1
  priority: P0
  mvp: true
  requirement_id: GH-2054
  variables:
    closure_scope:
    - name: cmd
      type: '*exec.Cmd'
      initialized_in: test
      used_in:
      - test
      comment: CLI command execution for post-review
    - name: output
      type: string
      initialized_in: test
      used_in:
      - test
      comment: CLI stdout/stderr output
  test_structure:
    type: single
    describe:
      description: post-review command
    context:
      description: when review result has contradictory body
      decorators: []
    it:
      description: should apply consistency check before posting
      test_id_format: '[test_id:TS-GH-2054-012]'
  code_structure: "func TestPostReviewCommand_AppliesConsistencyCheck(t *testing.T) {\n  // Arrange: mock forge.Client, create\
    \ contradictory review JSON\n  // Act: invoke post-review command with contradictory input\n  // Assert: posted comment\
    \ body contains findings, not \"No findings\"\n}\n"
  test_objective:
    title: Verify post-review command applies consistency check before posting
    what: 'Tests the integration point where the consistency check runs in the

      post-review CLI command flow. Verifies that after parsing the review

      result JSON but before posting the sticky comment, the body is checked

      for contradictions and replaced if necessary.

      '
    why: 'This is the end-to-end validation that the consistency check is wired

      into the correct point in the command pipeline. Without this, the unit

      tests pass but the fix may not actually run in production.

      '
    acceptance_criteria:
    - Consistency check runs between result parsing and comment posting
    - Posted comment body reflects findings, not original contradictory text
  classification:
    test_type: Functional
    scope: CLI command integration
    automation_approach: go test with testify and mock forge.Client
  specific_preconditions:
  - name: Mock forge.Client
    requirement: Stubbed GitHub API client capturing posted comment body
    validation: Mock captures Post() call arguments
  test_data:
    resource_definitions:
    - name: contradictory_review_json
      type: ReviewResult JSON
      yaml: "{\n  \"action\": \"request-changes\",\n  \"body\": \"No significant findings.\",\n  \"findings\": [\n    {\n\
        \      \"category\": \"logic-error\",\n      \"severity\": \"critical\",\n      \"file\": \"pkg/handler.go\",\n  \
        \    \"line\": 42,\n      \"message\": \"Nil pointer dereference\"\n    }\n  ]\n}\n"
  test_steps:
    setup:
    - step_id: SETUP-01
      action: Create mock forge.Client that captures posted body
      command: Set up mock with assertion on Post() body argument
      validation: Mock is ready to capture
    - step_id: SETUP-02
      action: Write contradictory review JSON to temp file
      command: os.WriteFile with review result JSON
      validation: Temp file created
    test_execution:
    - step_id: TEST-01
      action: Execute post-review command with contradictory input
      command: Run post-review with mock client and temp file
      validation: Command completes without error
    - step_id: TEST-02
      action: Verify posted body was corrected
      command: assert.Contains(t, capturedBody, "logic-error")
      validation: Posted body contains finding categories
    - step_id: TEST-03
      action: Verify original contradictory text removed
      command: assert.NotContains(t, capturedBody, "No significant findings")
      validation: Contradictory text was replaced
    cleanup:
    - step_id: CLEANUP-01
      action: Remove temp file
      command: os.Remove(tempFile)
  assertions:
  - assertion_id: ASSERT-01
    priority: P0
    description: Consistency check runs before posting
    condition: Posted body differs from input body when contradictory
    failure_impact: Fix not integrated — contradictory summaries still posted
  - assertion_id: ASSERT-02
    priority: P0
    description: Posted body contains corrected findings
    condition: Posted body includes critical finding categories
    failure_impact: Consistency check runs but produces wrong output
  dependencies:
    kubernetes_resources: []
    external_tools:
    - go 1.23+
    scenario_specific_rbac: []
  patterns:
    primary_pattern: cli-integration
    helpers_required:
    - mock-forge-client
    - testify-assertions
