      description: ensureBodyFindingsConsistency
    context:
      description: when action is approve or comment
      decorators: []
    it:
      description: should not modify the body
      test_id_format: '[test_id:TS-GH-2054-002]'
  code_structure: "func TestEnsureBodyFindingsConsistency_NoOpForApproveComment(t *testing.T) {\n  for _, action := range\
    \ []string{\"approve\", \"comment\"} {\n    t.Run(action, func(t *testing.T) {\n      // Arrange: ReviewResult with non-blocking\
    \ action\n      // Act: call ensureBodyFindingsConsistency\n      // Assert: body is unchanged\n    })\n  }\n}\n"
  test_objective:
    title: Verify no-op for approve/comment actions
    what: 'Tests that ensureBodyFindingsConsistency does not modify the review body

      when the action is "approve" or "comment", regardless of what findings

      exist. These are non-blocking verdicts where consistency enforcement

      is intentionally skipped.

      '
    why: 'The consistency check should only apply to blocking verdicts

      (request-changes, reject). Modifying approve/comment bodies would be

      unexpected behavior and could break existing workflows.

      '
    acceptance_criteria:
    - Body is unchanged when action is 'approve'
    - Body is unchanged when action is 'comment'
    - Body is unchanged even if findings array contains critical items
  classification:
    test_type: Unit
    scope: Single-function
    automation_approach: go test with testify
  specific_preconditions: []
  test_data:
    resource_definitions:
    - name: approve_result
      type: ReviewResult
      yaml: 'action: "approve"

        body: "LGTM - no issues found."

        findings: []

        '
    - name: comment_with_findings
      type: ReviewResult
      yaml: "action: \"comment\"\nbody: \"Some notes for the author.\"\nfindings:\n  - category: \"style\"\n    severity:\
        \ \"critical\"\n    message: \"Inconsistent naming\"\n"
  test_steps:
    setup:
    - step_id: SETUP-01
      action: Create ReviewResult with approve action
      command: Construct ReviewResult struct
      validation: Struct initialized with approve action
    test_execution:
    - step_id: TEST-01
      action: Call ensureBodyFindingsConsistency for approve action
      command: ensureBodyFindingsConsistency(&result)
      validation: Function returns without error
    - step_id: TEST-02
      action: Verify body is unchanged
      command: assert.Equal(t, originalBody, result.Body)
      validation: Body matches original text exactly
    cleanup: []
  assertions:
  - assertion_id: ASSERT-01
    priority: P0
    description: Body is not modified for non-blocking actions
    condition: result.Body == originalBody for approve and comment actions
    failure_impact: Consistency check incorrectly triggers on non-blocking verdicts
