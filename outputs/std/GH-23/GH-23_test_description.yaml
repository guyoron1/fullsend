          action: "Call Lint() on the harness"
          command: "diagnostics := h.Lint()"
          validation: "Lint() returns a non-nil slice"
        - step_id: "TEST-02"
          action: "Verify exactly one diagnostic returned"
          command: "require.Len(t, diagnostics, 1)"
          validation: "Slice length is 1"
        - step_id: "TEST-03"
          action: "Verify diagnostic severity is SeverityWarning"
          command: "assert.Equal(t, harness.SeverityWarning, diagnostics[0].Severity)"
