    test_objective:
      title: "Unknown severity falls back to numeric format"
      what: |
        This test validates that Diagnostic.String() handles an unrecognized
        DiagnosticSeverity value by falling back to the Go default format
        "DiagnosticSeverity(99): x: msg". This covers the default case in the
        severity switch/map.
      why: |
        As new severity levels are added in future versions, the String()
        method must gracefully handle values not yet in the switch statement.
        This edge case ensures forward compatibility and prevents panics.
      acceptance_criteria:
        - "String() returns \"DiagnosticSeverity(99): x: msg\" for unknown severity 99"

