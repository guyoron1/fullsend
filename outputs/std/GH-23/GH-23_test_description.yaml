      secondary: []
      helpers_required: []
      decorators: []

    variables:
      closure_scope:
        - name: "h"
          type: "harness.Harness"
          initialized_in: "setup"
          used_in: ["test"]
          comment: "Harness instance for Validate() regression check"
        - name: "err"
          type: "error"
          initialized_in: "test"
          used_in: ["test"]
          comment: "Error returned by Validate()"

    test_structure:
      type: "single"
      function_name: "TestValidateUnchangedAfterLintAddition"
      subtest: true
      subtests:
        - name: "invalid harness returns error"
        - name: "valid harness returns nil"

    code_structure: |
      func TestValidateUnchangedAfterLintAddition(t *testing.T) {
        t.Run("invalid harness returns error", func(t *testing.T) {
          h := harness.Harness{} // Missing required fields
          err := h.Validate()
          assert.Error(t, err)
        })
        t.Run("valid harness returns nil", func(t *testing.T) {
          h := harness.Harness{
            // Populate all required fields for valid harness
          }
          err := h.Validate()
          assert.NoError(t, err)
        })
      }

    test_objective:
      title: "Existing Validate() behavior unchanged after Lint() addition"
      what: |
        This regression test verifies that the addition of the Lint() method
        has not altered the behavior of the existing Validate() method.
        Validate() must continue to return errors for structurally invalid
        harnesses (e.g., missing required fields) and return nil for valid
        harnesses.
      why: |
        Lint() and Validate() serve different purposes — Validate() returns
        hard errors while Lint() returns non-fatal warnings. Any accidental
        coupling between them could break existing validation logic and
        impact all downstream consumers of the harness package.
      acceptance_criteria:
        - "Validate() returns an error for structurally invalid harnesses"
        - "Validate() returns nil for valid harnesses"
        - "No behavioral change from the addition of Lint()"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go testing with testify"

    specific_preconditions:
      - name: "Existing Validate() tests pass"
        requirement: "Baseline regression check before adding Lint()"
        validation: "go test ./internal/harness/... -run TestValidate"

    test_data:
      resource_definitions:
        - name: "invalid_harness"
          type: "harness.Harness"
          yaml: |
            h := harness.Harness{}  // Missing required fields
        - name: "valid_harness"
          type: "harness.Harness"
          yaml: |
            h := harness.Harness{
              // All required fields populated
            }

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create a structurally invalid Harness (missing required fields)"
          command: "h := harness.Harness{}"
          validation: "Invalid harness created"
        - step_id: "SETUP-02"
          action: "Create a valid Harness (all required fields populated)"
          command: "h := harness.Harness{...all required fields...}"
          validation: "Valid harness created"
      test_execution:
        - step_id: "TEST-01"
          action: "Call Validate() on invalid harness"
          command: "err := h.Validate()"
          validation: "Validate() returns a non-nil error"
        - step_id: "TEST-02"
          action: "Verify Validate() returns error for invalid harness"
          command: "assert.Error(t, err)"
          validation: "Error is non-nil"
        - step_id: "TEST-03"
          action: "Call Validate() on valid harness"
          command: "err := h.Validate()"
          validation: "Validate() returns nil"
        - step_id: "TEST-04"
          action: "Verify Validate() returns nil for valid harness"
          command: "assert.NoError(t, err)"
          validation: "Error is nil"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Validate() still rejects invalid harnesses"
        condition: "err != nil for invalid harness"
        failure_impact: "Validation is broken — invalid harnesses pass silently"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Validate() still accepts valid harnesses"
        condition: "err == nil for valid harness"
        failure_impact: "Valid harnesses are incorrectly rejected"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "Go 1.23+"
        - "testify"
      scenario_specific_rbac: []
