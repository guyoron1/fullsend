      func TestDiagnosticStringUnknownSeverity(t *testing.T) {
        d := harness.Diagnostic{
          Severity: harness.DiagnosticSeverity(99),
          Field:    "x",
          Message:  "msg",
        }
        result := d.String()
        assert.Equal(t, "DiagnosticSeverity(99): x: msg", result)
