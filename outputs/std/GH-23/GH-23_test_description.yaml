      function_name: "TestLintMissingRole"
      subtest: false

    code_structure: |
      func TestLintMissingRole(t *testing.T) {
        h := harness.Harness{} // Role is empty
        diagnostics := h.Lint()
        require.Len(t, diagnostics, 1)
        assert.Equal(t, harness.SeverityWarning, diagnostics[0].Severity)
        assert.Equal(t, "role", diagnostics[0].Field)
        assert.Contains(t, diagnostics[0].Message, "required in a future version")
      }

    test_objective:
      title: "Lint() returns warning diagnostic when role is missing"
      what: |
        This test validates that calling Lint() on a Harness struct with an empty
        Role field returns a []Diagnostic slice containing exactly one entry. The
        diagnostic must have Severity set to SeverityWarning, Field set to "role",
        and a Message indicating the field will be required in a future version.
      why: |
        This is the primary behavior of the Lint() method — the core lint rule for
        Phase 3. If this fails, harness authors receive no warning about the upcoming
        required role field, defeating the purpose of the gradual migration strategy
        defined in ADR-0045.
      acceptance_criteria:
        - "Lint() returns a slice with exactly 1 Diagnostic"
        - "Diagnostic.Severity equals SeverityWarning"
        - "Diagnostic.Field equals \"role\""
        - "Diagnostic.Message contains \"required in a future version\""

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go testing with testify"

