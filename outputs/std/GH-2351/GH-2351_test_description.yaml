          type: "forge.FakeClient"
          yaml: |
            FileContents:
              "owner/repo/dir/file.txt": "content"
            # FakeClient derives paths from keys; "dir/" would not appear as a key
            # This test verifies the LiveClient behavior via mocked HTTP responses

    test_steps:
