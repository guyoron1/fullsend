        condition: "len(resolved) == 0"
        failure_impact: "Unknown entries would cause unexpected behavior"

  # ============================================================
  # UNIT TESTS - Deduplication (scenarios 4-5)
  # ============================================================

  - scenario_id: 4
    test_id: "TS-GH-1270-004"
    test_type: "unit"
    priority: "P1"
    mvp: true
    requirement_id: "GH-1270"
    coverage_status: "NEW"

    test_objective:
      title: "Verify seen_names deduplication when both 'uvx' and 'uv' hooks resolve to uv"
      what: |
        Tests that when multiple hooks in a .pre-commit-config.yaml resolve to the
        same tool (e.g., both "uvx ruff" and "uv run mypy" resolve to "uv"), the
        resolver's seen_names set prevents duplicate entries in the output manifest.
      why: |
        Without deduplication, the installer would attempt to install the same tool
        multiple times, wasting CI time and potentially causing conflicts.
      acceptance_criteria:
        - "Two hooks resolving to same tool produce only one manifest entry"
        - "seen_names set tracks tool names across all hooks"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fixture with two hooks: one matching via hook_id 'uvx', one via match_entry 'uv'"
          command: "Write YAML fixture with both hooks"
      test_execution:
        - step_id: "TEST-01"
          action: "Call resolve() with multi-hook fixture"
          command: "resolver.resolve(config, registry)"
          validation: "Returns exactly one uv entry"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temp files"
          command: "Auto cleanup"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Resolved tools list contains exactly one uv entry"
        condition: "count(tool.name == 'uv') == 1"
        failure_impact: "Duplicate installs waste CI time and may cause conflicts"

  - scenario_id: 5
    test_id: "TS-GH-1270-005"
    test_type: "unit"
    priority: "P1"
    mvp: true
    requirement_id: "GH-1270"
    coverage_status: "NEW"

    test_objective:
      title: "Verify only one install entry emitted for duplicated tool name"
      what: |
        Tests that the JSON manifest output contains exactly one install entry per
        unique tool name, even when multiple hooks resolve to the same tool.
      why: |
        The installer processes the manifest sequentially; duplicate entries would
        trigger redundant downloads and checksum verifications.
      acceptance_criteria:
        - "JSON manifest has unique tool names only"
        - "No duplicate install blocks in output"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fixture with overlapping hook resolutions"
          command: "Write YAML fixture"
      test_execution:
        - step_id: "TEST-01"
