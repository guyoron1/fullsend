      why: |
        False warnings for auto-managed hooks create noise and reduce trust in the
        warning system. Python hooks are handled natively by pre-commit.
      acceptance_criteria:
        - "No warning emitted for language:python hooks"
        - "Resolver silently skips python-language hooks"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fixture with language:python hook"
          command: "Write YAML fixture"
      test_execution:
        - step_id: "TEST-01"
          action: "Call resolve() and capture stderr"
