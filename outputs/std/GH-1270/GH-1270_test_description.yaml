  - scenario_id: 12
    test_id: "TS-GH-1270-012"
    test_type: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-1270"
    coverage_status: "NEW"

    test_objective:
      title: "Verify binary install with mismatched checksum exits non-zero"
      what: |
        Tests that install-precommit-tools.sh refuses to install a binary when
        the SHA256 checksum does not match the expected value. The script must
        exit non-zero (hard stop) rather than skipping or warning.
      why: |
        This is a P0 supply-chain safety control. A mismatched checksum indicates
        either a corrupted download or a tampered binary. The fail-loud design is
        intentional to prevent compromised tools from entering the CI pipeline.
      acceptance_criteria:
        - "Script exits with non-zero exit code"
        - "Binary is NOT installed"
        - "Error message mentions checksum mismatch"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock HTTP server serving a binary"
          command: "httptest.NewServer()"
        - step_id: "SETUP-02"
          action: "Create JSON manifest with WRONG checksum for the binary"
          command: "Write JSON manifest with invalid sha256"
      test_execution:
        - step_id: "TEST-01"
          action: "Run install-precommit-tools.sh with bad-checksum manifest"
          command: "bash install-precommit-tools.sh < manifest.json"
          validation: "Exit code != 0"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Stop mock server, remove temp files"
          command: "server.Close()"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Script exits non-zero on checksum mismatch"
        condition: "exit_code != 0"
        failure_impact: "CRITICAL: Compromised binaries could enter CI pipeline"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Binary is NOT placed on PATH after failure"
        condition: "binary file does not exist"
        failure_impact: "Tampered binary would be executable"

