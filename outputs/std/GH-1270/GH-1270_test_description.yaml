  # ============================================================

  - scenario_id: 25
    test_id: "TS-GH-1270-025"
    test_type: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-1270"
    coverage_status: "NEW"

    test_objective:
      title: "Verify sha256sum failure causes exit 1 (hard stop, not skip)"
      what: |
        Tests that the install-precommit-tools.sh script exits with code 1 (not 0)
        when sha256sum verification fails. This is the fail-loud behavior that
        prevents compromised binaries from being installed.
      why: |
        P0 supply-chain safety. The distinction between exit 1 (hard stop) and exit 0
        with skip (graceful degradation) is critical. Checksum failures MUST hard-stop
        to prevent tampered binaries from entering the pipeline.
      acceptance_criteria:
        - "Exit code is exactly 1"
        - "Not exit 0 with a warning (that would be skip behavior)"
        - "Error message clearly indicates checksum failure"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock HTTP server with binary"
          command: "httptest.NewServer()"
        - step_id: "SETUP-02"
          action: "Create manifest with wrong checksum"
          command: "Write JSON with bad sha256"
      test_execution:
        - step_id: "TEST-01"
          action: "Run installer and capture exit code"
          command: "bash install-precommit-tools.sh"
          validation: "exit code == 1"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Stop mock server"
          command: "server.Close()"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Exit code is 1 (hard stop)"
        condition: "exit_code == 1"
        failure_impact: "CRITICAL: Exit 0 would allow tampered binary installation"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Error message explicitly mentions checksum"
        condition: "stderr contains 'checksum' or 'sha256'"
        failure_impact: "Unclear error message hinders incident response"

