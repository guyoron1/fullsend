scenarios:
  # ============================================================
  # UNIT TESTS - Resolver matching (scenarios 1-3)
  # ============================================================

  - scenario_id: 1
    test_id: "TS-GH-1270-001"
    test_type: "unit"
    priority: "P1"
    mvp: true
    requirement_id: "GH-1270"
    coverage_status: "NEW"

    test_objective:
      title: "Verify resolver matches 'uv' match_entry for 'uv run mypy' hook entry"
      what: |
        Tests that the resolver's entry_match_map correctly resolves a hook whose
        entry field contains "uv run mypy" to the "uv" tool via the match_entry
        mechanism. The match_entry field enables matching hooks by their command
        prefix rather than requiring exact hook_id matches.
      why: |
        GH-1270 identifies that "uv run" entry format hooks are not matched by
        the resolver, causing tool auto-installation to miss uv. This is the
        primary gap the issue was filed for.
      acceptance_criteria:
        - "Resolver returns uv tool entry when hook entry contains 'uv run'"
        - "match_entry 'uv' correctly triggers on 'uv run mypy' command"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fixture .pre-commit-config.yaml with a local hook using 'uv run mypy' entry"
          command: "Write YAML fixture to temp file"
        - step_id: "SETUP-02"
          action: "Load the default .pre-commit-tools.yaml registry containing uv match_entry"
          command: "Read registry file"
      test_execution:
        - step_id: "TEST-01"
          action: "Call resolve() with the fixture config and registry"
          command: "resolver.resolve(config, registry)"
          validation: "Returns list containing uv tool entry"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temp fixture files"
          command: "Handled by t.TempDir() or tempfile cleanup"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Resolved tools list contains an entry with name 'uv'"
        condition: "len(resolved) > 0 AND resolved contains tool with name='uv'"
        failure_impact: "uv tool will not be auto-installed, breaking hooks that depend on 'uv run'"

  - scenario_id: 2
    test_id: "TS-GH-1270-002"
    test_type: "unit"
    priority: "P1"
    mvp: true
    requirement_id: "GH-1270"
    coverage_status: "NEW"

    test_objective:
      title: "Verify resolver does not match partial substrings (e.g., 'uv' does not match 'uvx-other')"
      what: |
        Tests that the match_entry matching logic uses word-boundary or prefix
        matching, not naive substring containment. A match_entry of "uv" should
        not match a hook entry like "uvx-other-tool".
      why: |
        Substring matching would cause false positives, installing the wrong tool
        for unrelated hooks. Precise matching is critical for supply-chain safety.
      acceptance_criteria:
        - "Resolver does NOT return uv tool when hook entry is 'uvx-other-tool'"
        - "match_entry uses prefix/word-boundary matching, not substring"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fixture with hook entry 'uvx-other-tool' (should NOT match 'uv')"
          command: "Write YAML fixture"
      test_execution:
        - step_id: "TEST-01"
          action: "Call resolve() with the fixture"
          command: "resolver.resolve(config, registry)"
          validation: "Returns empty list or list without uv"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temp files"
          command: "Auto cleanup"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Resolved tools list does NOT contain uv"
        condition: "resolved does not contain tool with name='uv'"
        failure_impact: "False positive match would install wrong tool"

  - scenario_id: 3
    test_id: "TS-GH-1270-003"
    test_type: "unit"
    priority: "P2"
    mvp: false
    requirement_id: "GH-1270"
    coverage_status: "NEW"

    test_objective:
      title: "Verify resolver returns no match for unknown entry command"
      what: |
        Tests that when a hook uses an entry command not present in the registry
        (neither as hook_id nor match_entry), the resolver correctly returns no
        match rather than erroring or returning a partial result.
      why: |
        Unknown hooks should be silently skipped (with a warning) rather than
