    test_objective:
      title: "Verify tool with skip_install:true is recognized but not installed"
      what: |
        Tests that the resolver correctly processes registry entries with
        skip_install:true by recognizing the tool (suppressing warnings) but
        excluding it from the install manifest.
      why: |
        Some tools (e.g., shellcheck-py) are auto-managed by pre-commit and should
        not be separately installed. skip_install prevents double-installation.
      acceptance_criteria:
        - "Tool with skip_install:true does not appear in install manifest"
        - "No warning emitted for the skipped tool's hooks"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fixture with hook matching a skip_install:true registry entry"
          command: "Write YAML fixture"
      test_execution:
        - step_id: "TEST-01"
          action: "Call resolve() with fixture"
          command: "resolver.resolve(config, registry)"
          validation: "Resolved list excludes skip_install tool"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temp files"
          command: "Auto cleanup"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "skip_install tool is not in resolved manifest"
        condition: "tool with skip_install:true not in resolved list"
        failure_impact: "Double installation wastes time and may cause conflicts"

