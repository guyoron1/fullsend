  - scenario_id: 11
    test_id: "TS-GH-1270-011"
    test_type: "functional"
    priority: "P1"
    mvp: true
    requirement_id: "GH-1270"
    coverage_status: "NEW"

    test_objective:
      title: "Verify binary install with valid checksum succeeds"
      what: |
        Tests that install-precommit-tools.sh correctly downloads a binary,
        verifies its SHA256 checksum, extracts it (if tarball), and places it
        on PATH when the checksum matches.
      why: |
        Binary installation is the primary install method for tools like actionlint
        and lychee. Correct checksum verification ensures supply-chain safety.
      acceptance_criteria:
        - "Binary is downloaded and extracted"
        - "SHA256 checksum verification passes"
        - "Binary is executable and on PATH"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock HTTP server serving a test tarball with known SHA256"
          command: "httptest.NewServer() or fixture tarball"
        - step_id: "SETUP-02"
          action: "Create JSON manifest with binary install entry pointing to mock server"
          command: "Write JSON manifest"
      test_execution:
        - step_id: "TEST-01"
          action: "Run install-precommit-tools.sh with the manifest"
          command: "bash install-precommit-tools.sh < manifest.json"
          validation: "Exit code 0, binary exists on PATH"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Stop mock server, remove temp files"
          command: "server.Close(), os.RemoveAll()"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Install script exits with code 0"
        condition: "exit_code == 0"
        failure_impact: "Valid binary installs would fail in CI"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Binary is placed in expected location and is executable"
