    requirement_summary: "Licensing and deployment model constraints are documented with actionable recommendations"

    test_objective:
      title: "Verify licensing model constraints identified"
      what: |
        Verify that the evaluation deliverables clearly identify and document
        the licensing model constraints for OpenHands. This includes the
        distinction between MIT-licensed open-source components and
        PolyForm-licensed enterprise components, and the one-month trial
        limitation for enterprise features.
      why: |
        Licensing constraints directly impact whether fullsend can reuse
        OpenHands components. Incomplete or inaccurate licensing analysis
        could lead to legal risk or wasted engineering effort pursuing
        integration paths blocked by license terms.
      acceptance_criteria:
        - "MIT license for core OpenHands OSS identified and documented"
        - "PolyForm commercial license for Enterprise directory identified"
        - "One-month evaluation limitation for enterprise features noted"
        - "Implications for fullsend reuse clearly stated"

