  - scenario_id: 8
    test_id: "TS-GH-1835-008"
    test_type: "functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-1835"
    coverage_status: "NEW"

    test_objective:
      title: "Verify scaffold install deploys updated files"
      what: |
        Simulates a scaffold installation to a temporary directory and verifies
        that the code-review SKILL.md and correctness.md files are written to
        the target directory with the correct content including the cross-file
        verification instructions.
      why: |
        The scaffold install pipeline is the mechanism that deploys skill files
        to enrolled repositories. This test verifies the end-to-end deployment
        path: embed.FS -> WalkLayeredContent -> file written to target directory.
        Without this, we cannot confirm the fix reaches its intended destination.
      acceptance_criteria:
        - "Scaffold install writes SKILL.md to target directory"
        - "Scaffold install writes correctness.md to target directory"
        - "Written files contain cross-file verification instructions"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with temporary directory and scaffold install"

    specific_preconditions:
      - name: "Temporary directory"
        requirement: "Writable temporary directory for install target"
        validation: "os.MkdirTemp succeeds"

    test_data:
      install_paths:
        - source: "skills/code-review/SKILL.md"
          target: "skills/code-review/SKILL.md"
        - source: "skills/pr-review/sub-agents/correctness.md"
          target: "skills/pr-review/sub-agents/correctness.md"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create temporary directory for install target"
          command: "tmpDir := t.TempDir()"
          validation: "Directory created"

      test_execution:
        - step_id: "TEST-01"
          action: "Run scaffold install to temporary directory"
          command: "scaffold.CollectInstallFiles() and write to tmpDir"
          validation: "Install completes without error"
        - step_id: "TEST-02"
          action: "Verify SKILL.md exists in target"
          command: "os.ReadFile(filepath.Join(tmpDir, \"skills/code-review/SKILL.md\"))"
          validation: "File exists and is readable"
        - step_id: "TEST-03"
          action: "Verify correctness.md exists in target"
          command: "os.ReadFile(filepath.Join(tmpDir, \"skills/pr-review/sub-agents/correctness.md\"))"
          validation: "File exists and is readable"
        - step_id: "TEST-04"
          action: "Verify deployed SKILL.md contains cross-file verification"
          command: "strings.Contains(string(content), \"Cross-file verification\")"
          validation: "Returns true"

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary directory"
          command: "Handled by t.TempDir() cleanup"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Scaffold install deploys both skill files with verification instructions"
        condition: "Both files exist in target with cross-file verification content"
        failure_impact: "Updated skill files not delivered to enrolled repositories"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  # =====================================================================
  # Requirement: Transparent limitation communication (P2)
