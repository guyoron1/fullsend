  - scenario_id: 9
    test_id: "TS-GH-1835-009"
    test_type: "functional"
    priority: "P2"
    mvp: false
    requirement_id: "GH-1835"
    coverage_status: "NEW"

    test_objective:
      title: "Verify graceful degradation language in both skill files"
      what: |
        Reads both the code-review SKILL.md and correctness.md files and
        verifies that each contains graceful degradation language for when
        files cannot be read. Both files should instruct the agent to state
        its inability to verify rather than making assumptions.
