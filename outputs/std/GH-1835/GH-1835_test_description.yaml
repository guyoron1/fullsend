scenarios:
  # =====================================================================
  # Requirement: Verify file contents before making assertions (P0)
  # =====================================================================

  - scenario_id: 1
    test_id: "TS-GH-1835-001"
    test_type: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-1835"
    coverage_status: "NEW"

    test_objective:
      title: "Verify cross-file verification instruction present in SKILL.md step 2"
      what: |
        Reads the code-review SKILL.md file via the scaffold embed and verifies
        that step 2 contains the cross-file verification instruction text.
        Specifically checks for the mandate that the agent MUST read a file
        before claiming it contains specific text.
      why: |
        The cross-file verification instruction in step 2 is the primary defense
        against false positive findings caused by hallucinated file contents.
        Without this instruction, the review agent may assert file contents
        it never read, as happened in the konflux-ci/konflux-test PR #833 incident.
      acceptance_criteria:
        - "SKILL.md content contains 'Cross-file verification' heading or label in step 2"
        - "SKILL.md content contains 'MUST read that file first' mandate"
        - "SKILL.md content contains 'Never claim a file contains specific text without having read it'"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with embed.FS content verification"

    specific_preconditions: []

    test_data:
      resource_definitions: []
      expected_strings:
        - key: "cross_file_label"
          value: "Cross-file verification"
          file: "internal/scaffold/fullsend-repo/skills/code-review/SKILL.md"
        - key: "must_read_mandate"
          value: "MUST read that file first"
          file: "internal/scaffold/fullsend-repo/skills/code-review/SKILL.md"
        - key: "never_claim"
          value: "Never claim a file contains specific text without having read it"
          file: "internal/scaffold/fullsend-repo/skills/code-review/SKILL.md"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Read SKILL.md via scaffold embed"
          command: "scaffold.FullsendRepoFile(\"skills/code-review/SKILL.md\")"
          validation: "File content returned without error"

      test_execution:
        - step_id: "TEST-01"
          action: "Check for cross-file verification label in step 2"
          command: "strings.Contains(content, \"Cross-file verification\")"
          validation: "Returns true"
        - step_id: "TEST-02"
          action: "Check for MUST read mandate"
          command: "strings.Contains(content, \"MUST read that file first\")"
          validation: "Returns true"
        - step_id: "TEST-03"
          action: "Check for never-claim instruction"
          command: "strings.Contains(content, \"Never claim a file contains specific text without having read it\")"
          validation: "Returns true"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Cross-file verification instruction is present in SKILL.md step 2"
        condition: "Content contains all three expected instruction strings"
        failure_impact: "Review agent has no instruction to verify file contents before asserting, leading to false positives"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  - scenario_id: 2
    test_id: "TS-GH-1835-002"
    test_type: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-1835"
    coverage_status: "NEW"

    test_objective:
      title: "Verify self-check gate present in SKILL.md step 4"
      what: |
        Reads the code-review SKILL.md file and verifies that step 4 contains
        the cross-file finding self-check gate. This gate requires the agent to
        verify it actually read a file before finalizing any finding that asserts
        specific file contents.
      why: |
        The self-check gate is the secondary defense mechanism. Even if the agent
        skips the step 2 instruction, the step 4 gate catches unverified content
        assertions before they become findings. This creates a two-layer protection
        against cross-file hallucination.
      acceptance_criteria:
        - "SKILL.md content contains 'Cross-file finding self-check' label in step 4"
        - "SKILL.md content contains instruction to verify file was read during step 2"
        - "SKILL.md content contains instruction to reframe finding if file is unreadable"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with embed.FS content verification"

    specific_preconditions: []

    test_data:
      expected_strings:
        - key: "self_check_label"
          value: "Cross-file finding self-check"
          file: "internal/scaffold/fullsend-repo/skills/code-review/SKILL.md"
        - key: "verify_read"
          value: "verify that you read that file during step 2"
          file: "internal/scaffold/fullsend-repo/skills/code-review/SKILL.md"
        - key: "reframe_finding"
          value: "reframe the finding to state that the contents could not be verified"
          file: "internal/scaffold/fullsend-repo/skills/code-review/SKILL.md"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Read SKILL.md via scaffold embed"
          command: "scaffold.FullsendRepoFile(\"skills/code-review/SKILL.md\")"
          validation: "File content returned without error"

      test_execution:
        - step_id: "TEST-01"
          action: "Check for self-check gate label"
          command: "strings.Contains(content, \"Cross-file finding self-check\")"
          validation: "Returns true"
        - step_id: "TEST-02"
          action: "Check for step 2 verification instruction"
          command: "strings.Contains(content, \"verify that you read that file during step 2\")"
          validation: "Returns true"
        - step_id: "TEST-03"
          action: "Check for reframe instruction"
          command: "strings.Contains(content, \"reframe the finding\")"
          validation: "Returns true"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Self-check gate is present in SKILL.md step 4"
        condition: "Content contains self-check label, verification instruction, and reframe instruction"
        failure_impact: "No secondary defense against unverified file content in findings"

    dependencies:
      kubernetes_resources: []
      external_tools: []
