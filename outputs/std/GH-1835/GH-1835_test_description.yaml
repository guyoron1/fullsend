    mvp: false
    requirement_id: "GH-1835"
    coverage_status: "NEW"

    test_objective:
      title: "Verify self-check reframes finding for unreadable files"
      what: |
        Reads the code-review SKILL.md and verifies that the self-check gate
        instructs the agent to reframe findings when files are unreadable,
        specifically stating that contents could not be verified rather than
        asserting unverified content.
      why: |
        When both the step 2 read and the step 4 re-read fail (file truly
        unreadable), the agent must not silently drop the finding or assert
        unverified content. Instead, it must reframe the finding to be
        transparent about the verification gap. This is the last line of defense.
      acceptance_criteria:
        - "SKILL.md step 4 contains instruction to reframe for unreadable files"
        - "Instruction prohibits asserting unverified contents as fact"
        - "Content contains 'do not assert unverified contents as fact'"

    classification:
