    test_steps:
      setup: []

      test_execution:
        - step_id: "TEST-01"
          action: "Read correctness.md from scaffold embed"
          command: "content, err := scaffold.FullsendRepoFile(\"skills/pr-review/sub-agents/correctness.md\")"
          validation: "No error returned"
        - step_id: "TEST-02"
          action: "Verify content is non-empty"
          command: "assert.NotEmpty(t, content)"
          validation: "Content has length > 0"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "correctness.md is readable from scaffold embed"
        condition: "File exists in embed and has non-empty content"
        failure_impact: "Correctness sub-agent not available to pr-review orchestrator"

    dependencies:
