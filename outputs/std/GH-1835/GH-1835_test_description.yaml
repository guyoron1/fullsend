  - scenario_id: 6
    test_id: "TS-GH-1835-006"
    test_type: "functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-1835"
    coverage_status: "NEW"

    test_objective:
      title: "Verify SKILL.md walkable via WalkFullsendRepo"
      what: |
        Uses the WalkFullsendRepo function from the scaffold package to walk
        the embedded filesystem and verifies that the code-review SKILL.md
        file is discoverable in the walk. This confirms the file is properly
        embedded and included in the scaffold binary.
      why: |
        The scaffold embed mechanism is the delivery vehicle for skill files.
        If SKILL.md is not walkable via WalkFullsendRepo, it will not be
        deployed to enrolled repositories, making the cross-file verification
        instructions unreachable by review agents.
      acceptance_criteria:
        - "WalkFullsendRepo encounters skills/code-review/SKILL.md during walk"
        - "File is readable at the walked path"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with scaffold.WalkFullsendRepo"

    specific_preconditions: []

    test_data:
      expected_paths:
        - "skills/code-review/SKILL.md"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Initialize walk collector"
          command: "var found []string"
          validation: "Collector initialized"

      test_execution:
        - step_id: "TEST-01"
          action: "Walk embedded filesystem and collect skill file paths"
          command: "scaffold.WalkFullsendRepo(func(path string, d fs.DirEntry, err error) error { ... })"
          validation: "Walk completes without error"
        - step_id: "TEST-02"
          action: "Check that SKILL.md path appears in collected paths"
          command: "assert.Contains(t, found, \"skills/code-review/SKILL.md\")"
          validation: "Path is present in walk results"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "SKILL.md is discoverable via WalkFullsendRepo"
        condition: "Walk includes skills/code-review/SKILL.md"
        failure_impact: "Skill file not embedded in binary, cross-file verification instructions will not be deployed"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  - scenario_id: 7
    test_id: "TS-GH-1835-007"
    test_type: "functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-1835"
    coverage_status: "NEW"

    test_objective:
      title: "Verify correctness.md included in scaffold embed"
      what: |
        Uses the scaffold.FullsendRepoFile function to read the correctness.md
        sub-agent file and verifies that it is readable from the embedded
        filesystem. This confirms the correctness sub-agent definition is
        included in the compiled binary.
      why: |
        The correctness sub-agent file must be embedded in the scaffold binary
        for it to be available when the pr-review skill dispatches sub-agents.
        If missing, the correctness sub-agent will not have cross-file
        verification instructions.
      acceptance_criteria:
        - "scaffold.FullsendRepoFile returns content for correctness.md without error"
        - "Returned content is non-empty"

