  - scenario_id: 3
    test_id: "TS-GH-1835-003"
    test_type: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-1835"
    coverage_status: "NEW"

    test_objective:
      title: "Verify unreadable file fallback language in SKILL.md"
      what: |
        Reads the code-review SKILL.md file and verifies that it contains
        fallback language for when files cannot be read. The instruction must
        direct the agent to state its inability to verify rather than assuming
        file contents.
      why: |
        When the review agent encounters files in external repositories or
        inaccessible locations, it must not guess at file contents. The fallback
        language ensures the agent transparently communicates its limitations,
        preventing false assertions about unreadable files.
      acceptance_criteria:
        - "SKILL.md contains 'unable to verify the contents' fallback phrase"
        - "SKILL.md contains prohibition against assuming file contents"
        - "SKILL.md does NOT contain 'assume' phrasing for unreadable files"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with embed.FS content verification (negative check)"

    specific_preconditions: []

    test_data:
      expected_strings:
        - key: "unable_to_verify"
          value: "unable to verify the contents"
          file: "internal/scaffold/fullsend-repo/skills/code-review/SKILL.md"
        - key: "rather_than_assuming"
          value: "rather than assuming what they contain"
          file: "internal/scaffold/fullsend-repo/skills/code-review/SKILL.md"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Read SKILL.md via scaffold embed"
          command: "scaffold.FullsendRepoFile(\"skills/code-review/SKILL.md\")"
          validation: "File content returned without error"

      test_execution:
        - step_id: "TEST-01"
          action: "Check for 'unable to verify' fallback language"
          command: "strings.Contains(content, \"unable to verify the contents\")"
          validation: "Returns true"
        - step_id: "TEST-02"
          action: "Check for 'rather than assuming' prohibition"
          command: "strings.Contains(content, \"rather than assuming what they contain\")"
          validation: "Returns true"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "[NEGATIVE] Unreadable file fallback language prevents false assertions"
        condition: "Content contains transparent limitation language and prohibition against assuming"
        failure_impact: "Agent may fabricate file contents when files are inaccessible"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  # =====================================================================
  # Requirement: Correctness sub-agent cross-file verification (P0)
  # =====================================================================

  - scenario_id: 4
    test_id: "TS-GH-1835-004"
    test_type: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-1835"
    coverage_status: "NEW"

    test_objective:
      title: "Verify cross-file verification section in correctness sub-agent"
      what: |
        Reads the correctness.md sub-agent file and verifies it contains
        a dedicated cross-file verification section. This section instructs
        the correctness sub-agent to read files before asserting their contents
        in findings and prohibits reasoning about what a file "probably" contains.
      why: |
        The correctness sub-agent is dispatched by the pr-review orchestrator and
        is responsible for factual accuracy of review findings. Without cross-file
        verification instructions, the sub-agent may produce findings based on
        assumed file contents, as seen in the original GH-1835 incident.
      acceptance_criteria:
        - "correctness.md contains 'Cross-file verification' section heading"
        - "correctness.md contains 'MUST read that file before asserting' mandate"
        - "correctness.md contains prohibition against reasoning about probable contents"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with embed.FS content verification"

    specific_preconditions: []

    test_data:
      expected_strings:
        - key: "section_heading"
          value: "Cross-file verification"
          file: "internal/scaffold/fullsend-repo/skills/pr-review/sub-agents/correctness.md"
        - key: "must_read"
          value: "MUST read that file before asserting"
          file: "internal/scaffold/fullsend-repo/skills/pr-review/sub-agents/correctness.md"
        - key: "no_probably"
          value: "Do not reason about what a file \"probably\" contains"
          file: "internal/scaffold/fullsend-repo/skills/pr-review/sub-agents/correctness.md"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Read correctness.md via scaffold embed"
          command: "scaffold.FullsendRepoFile(\"skills/pr-review/sub-agents/correctness.md\")"
          validation: "File content returned without error"

      test_execution:
        - step_id: "TEST-01"
          action: "Check for cross-file verification section heading"
          command: "strings.Contains(content, \"Cross-file verification\")"
          validation: "Returns true"
        - step_id: "TEST-02"
          action: "Check for MUST read mandate"
          command: "strings.Contains(content, \"MUST read that file before asserting\")"
          validation: "Returns true"
        - step_id: "TEST-03"
          action: "Check for prohibition against probable reasoning"
          command: "strings.Contains(content, `Do not reason about what a file`)"
          validation: "Returns true"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Cross-file verification section exists in correctness sub-agent"
        condition: "Content contains section heading, read mandate, and prohibition"
        failure_impact: "Correctness sub-agent lacks file verification instructions, enabling false positive findings"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  - scenario_id: 5
    test_id: "TS-GH-1835-005"
    test_type: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-1835"
    coverage_status: "NEW"

    test_objective:
      title: "Verify unverified content prohibition in correctness sub-agent"
      what: |
        Reads the correctness.md sub-agent file and verifies it contains the
        prohibition against presenting unverified file contents as fact in findings.
        This is the negative test ensuring the sub-agent is instructed to never
        assert unverified content.
      why: |
        The prohibition against presenting unverified content as fact is the key
        behavioral constraint. Even with cross-file verification instructions, the
        explicit prohibition ensures that when files are unreadable, the agent does
        not fall back to fabricating content.
      acceptance_criteria:
        - "correctness.md contains 'Never present unverified file contents as fact'"
        - "correctness.md contains fallback for unreadable files"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with embed.FS content verification (negative check)"

    specific_preconditions: []

    test_data:
      expected_strings:
        - key: "never_present"
          value: "Never present unverified file contents as fact"
          file: "internal/scaffold/fullsend-repo/skills/pr-review/sub-agents/correctness.md"
        - key: "unable_to_verify"
          value: "unable to verify the contents"
          file: "internal/scaffold/fullsend-repo/skills/pr-review/sub-agents/correctness.md"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Read correctness.md via scaffold embed"
          command: "scaffold.FullsendRepoFile(\"skills/pr-review/sub-agents/correctness.md\")"
          validation: "File content returned without error"

      test_execution:
        - step_id: "TEST-01"
          action: "Check for never-present prohibition"
          command: "strings.Contains(content, \"Never present unverified file contents as fact\")"
          validation: "Returns true"
        - step_id: "TEST-02"
          action: "Check for unable-to-verify fallback"
          command: "strings.Contains(content, \"unable to verify the contents\")"
          validation: "Returns true"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "[NEGATIVE] Unverified content prohibition exists in correctness sub-agent"
        condition: "Content contains prohibition and fallback language"
        failure_impact: "Sub-agent may present fabricated file contents as factual findings"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  # =====================================================================
