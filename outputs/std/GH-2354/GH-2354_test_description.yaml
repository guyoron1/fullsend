  - scenario_id: "004"
    test_id: "TS-GH-2354-004"
    tier: "Functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2354"
    requirement_summary: "Enrollment polling uses exponential backoff to avoid excessive API calls"

    test_objective:
      title: "Verify wait time between status updates increases progressively"
      what: |
        Validates that the polling interval between successive ListWorkflowRuns
        calls increases exponentially (doubles) from the initial interval
        (enrollmentPollInitial = 2s) on each iteration.
      why: |
        Exponential backoff prevents overwhelming the GitHub API with rapid
        polling requests and reduces unnecessary load during slow workflows.
      acceptance_criteria:
        - "Second poll interval is approximately 2x the first"
        - "Intervals increase monotonically up to the cap"

    variables:
