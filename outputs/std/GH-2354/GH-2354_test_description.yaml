    requirement_summary: "Enrollment install completes or fails within a bounded, predictable timeout"

    test_objective:
      title: "Verify timeout returns actionable error message"
      what: |
        Validates that when enrollment polling exceeds the enrollmentWaitTimeout
        (3 minutes), the operation returns an error with a clear, actionable
        message guiding the user toward manual recovery steps.
      why: |
        Silent failures frustrate users. When enrollment times out, the error
        message must tell users what happened and what to do next, reducing
        support burden and enabling self-service recovery.
      acceptance_criteria:
        - "Enrollment returns a non-nil error after timeout expires"
        - "Error message contains manual recovery guidance"
        - "Error message is not empty or generic"

    variables:
      closure_scope:
