              ListWorkflowRunsFn: func(ctx context.Context, owner, repo, workflowFile string) ([]forge.WorkflowRun, error) {
                return []forge.WorkflowRun{{ID: 1, Status: "in_progress", Conclusion: ""}}, nil
              },
            }

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create FakeClient that never completes workflow"
          validation: "FakeClient is configured"
      test_execution:
        - step_id: "TEST-01"
          action: "Invoke enrollment install with never-complete FakeClient"
          validation: "Function returns (does not hang forever)"
      cleanup: []

    assertions:
