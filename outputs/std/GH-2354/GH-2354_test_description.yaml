      what: |
        Validates that when the workflow registration is slow (ListWorkflowRuns
        returns empty results for several polls before eventually registering),
        enrollment still completes or times out within the configured bound.
      why: |
        GitHub can be slow to register dispatched workflows. The enrollment flow
        must handle this gracefully by continuing to poll with backoff rather
        than failing immediately on empty results.
      acceptance_criteria:
        - "Enrollment eventually succeeds when workflow registers after delay"
        - "Total elapsed time respects enrollmentWaitTimeout bound"
        - "No premature failure on empty workflow run list"

