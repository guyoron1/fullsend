            fakeClient := &forge.FakeClient{
              ListWorkflowRunsFn: func(ctx context.Context, owner, repo, workflowFile string) ([]forge.WorkflowRun, error) {
                callCount++
                if callCount < 4 {
                  return []forge.WorkflowRun{}, nil
                }
                return []forge.WorkflowRun{{ID: 1, Status: "completed", Conclusion: "success", HTMLURL: "https://github.com/org/repo/actions/runs/1"}}, nil
              },
            }

    test_steps:
