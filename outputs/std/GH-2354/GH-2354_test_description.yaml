        priority: "P0"
        description: "Enrollment returns non-nil error"
        condition: "err != nil"
        failure_impact: "Timeout is silently swallowed; user gets no feedback"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Error message contains actionable guidance"
        condition: "strings.Contains(err.Error(), 'manual') || strings.Contains(err.Error(), 'check') || strings.Contains(err.Error(), 'timeout')"
        failure_impact: "User has no recovery path after timeout"

