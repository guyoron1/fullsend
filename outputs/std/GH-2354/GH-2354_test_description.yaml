  - scenario_id: 5
    test_id: "TS-GH2354-005"
    test_type: "unit"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2354"
    coverage_status: "NEW"

    test_objective:
      title: "Polling interval doubles from initial to max"
      what: |
        Validates that the nextInterval function produces the expected
        exponential backoff sequence: 2s → 4s → 8s → 15s (capped).
        This is a table-driven test covering the full progression.
      why: |
        The exponential backoff bounds are critical to the GH-2354 fix.
        Too-fast polling wastes API calls; too-slow polling delays detection.
      acceptance_criteria:
        - "2s → 4s (doubles)"
        - "4s → 8s (doubles)"
        - "8s → 15s (capped at enrollmentPollMax)"
        - "15s → 15s (stays at cap)"

    classification:
      test_type: "unit"
      scope: "single-function"
      target_function: "nextInterval"
      target_file: "internal/layers/enrollment.go"

    test_steps:
      setup: []
      test_execution:
        - step_id: "TEST-01"
          action: "Run table-driven test with backoff progression"
          code_template: |
            tests := []struct {
                name     string
                current  time.Duration
                expected time.Duration
            }{
                {"doubles small interval", 2 * time.Second, 4 * time.Second},
                {"doubles again", 4 * time.Second, 8 * time.Second},
                {"caps at max", 8 * time.Second, enrollmentPollMax},
                {"stays at max", enrollmentPollMax, enrollmentPollMax},
            }
            for _, tt := range tests {
                t.Run(tt.name, func(t *testing.T) {
                    got := nextInterval(tt.current)
                    assert.Equal(t, tt.expected, got)
                })
            }
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Each interval step matches expected backoff value"
        condition: "nextInterval(current) == expected for all test cases"
        code_template: "assert.Equal(t, tt.expected, got)"

