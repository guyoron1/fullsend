        failure_impact: "Enrollment fails prematurely when GitHub is slow to register workflows"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "ListWorkflowRuns was called multiple times"
        condition: "callCount >= 4"
        failure_impact: "Polling loop did not retry on empty results"

