    requirement_summary: "Enrollment workflow dispatch failure is reported clearly"

    test_objective:
      title: "Verify dispatch error does not block install"
      what: |
        Validates that when workflow dispatch fails, the enrollment install
        does not hang or block indefinitely. The error is returned promptly
        without entering the polling loop.
      why: |
        If dispatch fails, polling for a never-started workflow is pointless.
        The error should be returned immediately to avoid wasting user time.
      acceptance_criteria:
        - "Enrollment returns within seconds of dispatch failure"
        - "No polling occurs after dispatch failure"

