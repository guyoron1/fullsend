    test_objective:
      title: "Install respects context cancellation during wait"
      what: |
        Validates that when the context is cancelled while awaitWorkflowRun is
        polling, Install returns promptly without blocking until the full
        timeout. The ctx.Done() select case in awaitWorkflowRun must exit
        the polling loop immediately.
      why: |
        Context cancellation is the standard Go mechanism for cooperative
        shutdown. If awaitWorkflowRun ignores cancellation, the install
        pipeline cannot be interrupted by the user or by upstream timeout.
      acceptance_criteria:
        - "Install returns nil (non-fatal)"
        - "Output contains cancellation warning"
        - "Returns promptly after cancellation (not after full timeout)"

