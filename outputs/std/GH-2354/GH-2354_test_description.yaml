  - scenario_id: "001"
    test_id: "TS-GH-2354-001"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2354"
    requirement_summary: "Enrollment install completes or fails within a bounded, predictable timeout"

    test_objective:
      title: "Verify enrollment completes within timeout bound"
      what: |
        Validates that when the enrollment install flow is invoked and the
        workflow registers and completes successfully, the entire operation
        finishes within the enrollmentWaitTimeout bound (3 minutes). Asserts
        that the elapsed wall-clock time is less than the configured timeout.
      why: |
        Users must have confidence that enrollment will not hang indefinitely.
        A bounded timeout ensures predictable CLI behavior and prevents
        blocking CI pipelines or interactive sessions.
      acceptance_criteria:
        - "Enrollment completes in under enrollmentWaitTimeout when workflow succeeds"
        - "No error is returned on successful completion"

    variables:
      closure_scope:
        - name: "ctx"
          type: "context.Context"
          initialized_in: "test setup"
          used_in: ["test execution"]
          comment: "Background context for enrollment call"
        - name: "fakeClient"
          type: "*forge.FakeClient"
          initialized_in: "test setup"
          used_in: ["test execution"]
          comment: "Mock forge client with fast workflow completion"
        - name: "err"
          type: "error"
          initialized_in: "test execution"
          used_in: ["assertions"]
          comment: "Error returned from enrollment install"

    test_structure:
      type: "single"
      function: "TestEnrollmentCompletesWithinTimeoutBound"
      subtest: "completes within timeout bound"

    code_structure: |
      func TestEnrollmentCompletesWithinTimeoutBound(t *testing.T) {
        // Setup: Configure FakeClient for immediate workflow success
        // Execute: Call enrollment install
        // Assert: No error, elapsed < enrollmentWaitTimeout
      }

    specific_preconditions:
      - name: "FakeClient configured for fast success"
        requirement: "FakeClient.ListWorkflowRuns returns completed run on first poll"
        validation: "Unit test setup"

    test_data:
      mock_configurations:
        - name: "immediate_success_client"
          description: "FakeClient that returns a completed workflow run immediately"
          setup: |
            fakeClient := &forge.FakeClient{
              DispatchWorkflowFn: func(ctx context.Context, owner, repo, workflowFile string, ref string) error {
                return nil
              },
              ListWorkflowRunsFn: func(ctx context.Context, owner, repo, workflowFile string) ([]forge.WorkflowRun, error) {
                return []forge.WorkflowRun{{ID: 1, Status: "completed", Conclusion: "success", HTMLURL: "https://github.com/org/repo/actions/runs/1"}}, nil
              },
            }

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create FakeClient with immediate workflow completion"
          validation: "FakeClient is configured and non-nil"
      test_execution:
        - step_id: "TEST-01"
          action: "Record start time"
          validation: "Start timestamp captured"
        - step_id: "TEST-02"
          action: "Invoke enrollment install with FakeClient"
          validation: "Function returns without panic"
        - step_id: "TEST-03"
          action: "Record end time and compute elapsed duration"
          validation: "Elapsed duration is measurable"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Enrollment returns no error"
        condition: "err == nil"
        failure_impact: "Enrollment is broken even when workflow succeeds"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Elapsed time is less than enrollmentWaitTimeout"
        condition: "elapsed < enrollmentWaitTimeout"
        failure_impact: "Timeout bound is not enforced; CLI may hang"

    dependencies:
      external_tools: ["go 1.23+"]

