  - scenario_id: 1
    test_id: "TS-GH2354-001"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2354"
    coverage_status: "NEW"

    test_objective:
      title: "Install completes within timeout on fast registration"
      what: |
        Validates that EnrollmentLayer.Install completes the full enrollment
        workflow (dispatch + await + report) when the repo-maintenance workflow
        registers and completes quickly. The mock returns a completed run after
        2 polls, verifying the happy-path timing through awaitWorkflowRun.
      why: |
        The core value proposition of GH-2354 is bounded, predictable wait times.
        This test confirms that fast-completing workflows pass through the polling
        loop efficiently without unnecessary delays.
      acceptance_criteria:
        - "Install returns nil (no error)"
        - "Output contains 'enrollment completed successfully'"
        - "Total elapsed time is less than enrollmentWaitTimeout"

    classification:
      test_type: "unit"
      scope: "single-function"
      target_function: "awaitWorkflowRun"
      target_file: "internal/layers/enrollment.go"

    specific_preconditions:
      - name: "FakeClient with completed workflow run"
        requirement: "WorkflowRuns map contains a completed run with CreatedAt in the future"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create FakeClient with a completed workflow run"
          code_template: |
            now := time.Now().UTC()
            client := &forge.FakeClient{
                WorkflowRuns: map[string]*forge.WorkflowRun{
                    "test-org/.fullsend/repo-maintenance.yml": {
                        ID: 1, Status: "completed", Conclusion: "success",
                        CreatedAt: now.Add(time.Minute).Format(time.RFC3339),
                        HTMLURL: "https://github.com/test-org/.fullsend/actions/runs/1",
                    },
                },
            }
        - step_id: "SETUP-02"
          action: "Create enrollment layer with enabled repos"
          code_template: |
            repos := []string{"repo-a", "repo-b"}
            layer, buf := newEnrollmentLayer(t, client, repos, nil)
      test_execution:
        - step_id: "TEST-01"
          action: "Call Install with background context"
          code_template: |
            err := layer.Install(context.Background())
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Install returns no error"
        condition: "err == nil"
        code_template: "require.NoError(t, err)"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Output confirms successful enrollment"
        condition: "output contains 'enrollment completed successfully'"
        code_template: |
          output := buf.String()
          assert.Contains(t, output, "enrollment completed successfully")

