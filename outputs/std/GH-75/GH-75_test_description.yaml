  - scenario_id: "TS-06"
    test_id: "TS-GH-75-006"
    test_type: "unit"
    priority: "P0"
    requirement_id: "R2, R3"
    coverage_status: "NEW"

    test_objective:
      title: "Update-branch API failure resilience"
      what: |
        Validates that MergeChangeProposal continues retrying the merge even when
        the update-branch API call fails (e.g., returns 403 Forbidden or 500
        Internal Server Error). The implementation silently ignores update-branch
        errors and proceeds to the next merge attempt.
      why: |
        In production, the GitHub token may lack permissions to update the PR branch,
        or the update-branch endpoint may be temporarily unavailable. The retry logic
        must be resilient to these failures — the branch may have been updated by an
        external actor (e.g., GitHub's auto-update feature), so retrying the merge
        is still worthwhile.
      acceptance_criteria:
        - "MergeChangeProposal returns nil (no error) when merge eventually succeeds"
        - "update-branch 403/500 failure does not abort the retry loop"
        - "Merge endpoint is called at least twice (initial + retry)"
        - "update-branch endpoint is called at least once"

    classification:
      test_type: "Unit"
      scope: "Single-component"
      automation_approach: "Go stdlib testing + testify + httptest"

    specific_preconditions:
      - name: "httptest server with mixed responses"
        requirement: "Server returns 409 for first merge, 403 for update-branch, 200 for second merge"
        validation: "Server handler routes requests by method and path"

    test_data:
      api_endpoints:
        - operation: "merge_pr"
          method: "PUT"
          path: "/repos/{owner}/{repo}/pulls/{number}/merge"
          first_response_status: 409
          second_response_status: 200
        - operation: "update_branch"
          method: "PUT"
          path: "/repos/{owner}/{repo}/pulls/{number}/update-branch"
          response_status: 403

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server with route handler"
          details: |
            Configure handler to:
            - PUT /repos/org/repo/pulls/7/merge:
                Attempt 1 → 409 {"message": "Head branch is out of date"}
                Attempt 2 → 200 {"sha": "merged123"}
            - PUT /repos/org/repo/pulls/7/update-branch:
                → 403 {"message": "Resource not accessible by integration"}
          code_template: |
            var mergeAttempts atomic.Int32
            var updateCalls atomic.Int32

            srv := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
                switch {
                case r.Method == http.MethodPut && r.URL.Path == "/repos/org/repo/pulls/7/merge":
                    attempt := mergeAttempts.Add(1)
                    if attempt == 1 {
                        w.WriteHeader(http.StatusConflict)
                        json.NewEncoder(w).Encode(map[string]string{
                            "message": "Head branch is out of date",
                        })
                        return
                    }
                    w.WriteHeader(http.StatusOK)
                    json.NewEncoder(w).Encode(map[string]string{"sha": "merged123"})

                case r.Method == http.MethodPut && r.URL.Path == "/repos/org/repo/pulls/7/update-branch":
                    updateCalls.Add(1)
                    w.WriteHeader(http.StatusForbidden)
                    json.NewEncoder(w).Encode(map[string]string{
                        "message": "Resource not accessible by integration",
                    })

                default:
                    t.Errorf("unexpected request: %s %s", r.Method, r.URL.Path)
                    w.WriteHeader(http.StatusNotFound)
                }
            }))
            defer srv.Close()

        - step_id: "SETUP-02"
          action: "Create test client pointing at httptest server"
          code_template: |
            client := newTestClient(t, srv)

      test_execution:
        - step_id: "TEST-01"
          action: "Call MergeChangeProposal"
          details: "Invoke the method; it should handle 409 → update-branch failure → retry merge → success"
          code_template: |
            err := client.MergeChangeProposal(context.Background(), "org", "repo", 7)

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close httptest server"
          details: "Server closed via defer srv.Close() in setup"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Method returns no error (merge eventually succeeds)"
        condition: "err == nil"
        failure_impact: "Update-branch failure incorrectly aborts the retry loop"
        code_template: |
          require.NoError(t, err)

      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Merge endpoint was called at least twice"
        condition: "mergeAttempts >= 2"
        failure_impact: "Retry did not occur after 409 + update-branch failure"
        code_template: |
          assert.GreaterOrEqual(t, mergeAttempts.Load(), int32(2),
              "should have retried merge after update-branch failure")

      - assertion_id: "ASSERT-03"
        priority: "P0"
        description: "Update-branch endpoint was called"
        condition: "updateCalls >= 1"
        failure_impact: "409 handler did not attempt to update the branch"
        code_template: |
          assert.GreaterOrEqual(t, updateCalls.Load(), int32(1),
              "should have attempted to update branch")

