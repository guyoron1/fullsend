  - scenario_id: 1
    test_id: "TS-GH-76-001"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-76"
    coverage_status: "NEW"
    target_package: "layers"
    target_directory: "internal/layers"
    test_objective:
      title: "Verify enrollment wait completes when workflow succeeds quickly"
      what: |
        Tests that awaitWorkflowRun returns successfully when the forge client
        reports the workflow run as completed on the first or second poll iteration.
        Validates that the bounded wait loop exits promptly on success without
        exhausting the full 3-minute timeout.
      why: |
        Fast-completing workflows should give immediate feedback to the operator.
        If the polling loop does not exit promptly on success, operators experience
        unnecessary delays during enrollment.
      acceptance_criteria:
        - "awaitWorkflowRun returns nil error when workflow completes"
        - "Function returns within a fraction of the total timeout"
        - "Progress messages are emitted during polling"
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create a fake forge.Client that returns workflow completed status"
          validation: "Fake client is callable and returns expected responses"
      test_execution:
        - step_id: "TEST-01"
          action: "Call awaitWorkflowRun with short context deadline"
          validation: "Function returns nil error"
        - step_id: "TEST-02"
          action: "Verify printer output contains progress messages"
          validation: "Progress buffer contains expected output"
      cleanup: []
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "awaitWorkflowRun returns nil error on success"
        condition: "err == nil"
        failure_impact: "Enrollment will not complete even when workflow succeeds"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Progress messages are printed during wait"
        condition: "printer output contains progress text"
        failure_impact: "Operator has no visibility into enrollment progress"
    variables:
      closure_scope:
        - name: "fc"
          type: "*forge.FakeClient"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Fake client returning completed workflow"
        - name: "buf"
          type: "*bytes.Buffer"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Captures printer output"
    dependencies:
      kubernetes_resources: []
      external_tools: []

  - scenario_id: 2
    test_id: "TS-GH-76-002"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-76"
    coverage_status: "NEW"
    target_package: "layers"
    target_directory: "internal/layers"
    test_objective:
      title: "Verify backoff intervals follow 2s->4s->8s->15s progression"
      what: |
        Tests the nextInterval function with successive inputs to verify the
        exponential backoff sequence: 2s initial, doubling each iteration (4s, 8s),
        capping at 15s maximum. Validates the complete interval progression.
      why: |
        Correct backoff progression reduces GitHub API calls from ~36 to ~10-12
        per enrollment wait while providing faster initial feedback.
      acceptance_criteria:
        - "nextInterval(2s) returns 4s"
        - "nextInterval(4s) returns 8s"
        - "nextInterval(8s) returns 15s (capped)"
        - "nextInterval(15s) returns 15s (stays at max)"
    test_steps:
      setup: []
      test_execution:
        - step_id: "TEST-01"
          action: "Call nextInterval with enrollmentPollInitial (2s)"
          validation: "Returns 4s"
        - step_id: "TEST-02"
          action: "Call nextInterval with 4s"
          validation: "Returns 8s"
        - step_id: "TEST-03"
          action: "Call nextInterval with 8s"
          validation: "Returns enrollmentPollMax (15s)"
        - step_id: "TEST-04"
          action: "Call nextInterval with enrollmentPollMax (15s)"
          validation: "Returns enrollmentPollMax (15s, no change)"
      cleanup: []
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Interval doubles from initial to 4s"
        condition: "nextInterval(2s) == 4s"
        failure_impact: "Backoff progression broken, API calls not reduced"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Interval caps at enrollmentPollMax"
        condition: "nextInterval(8s) == 15s"
        failure_impact: "Unbounded interval growth could cause excessive delays"
    variables:
      closure_scope: []
    dependencies:
      kubernetes_resources: []
      external_tools: []

