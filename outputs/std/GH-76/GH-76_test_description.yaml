    test_objective:
      title: "Verify nextInterval doubles current value"
      what: |
        Tests the pure function nextInterval with various input values to
        confirm it always returns 2x the input (when below the max cap).
      why: |
        Exponential backoff requires correct doubling. An incorrect
        multiplier would cause either too-frequent or too-infrequent polling.
      acceptance_criteria:
        - "nextInterval(2s) == 4s"
        - "nextInterval(4s) == 8s"
        - "nextInterval(1s) == 2s"
    test_steps:
