        normalize, and compare.
      why: |
        Ensures the complete pipeline works correctly, not just individual
        comparison functions. A PR-level integration test for the fix.
      acceptance_criteria:
        - "Script completes successfully"
        - "No PR created"
        - "Summary output shows 0 updates needed"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "bash test harness with mocked gh CLI"

    test_steps:
