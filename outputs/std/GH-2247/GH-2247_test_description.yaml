          action: "Clean up temp files and mocks"
          command: "rm -rf $MOCK_DIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Zero PRs created for up-to-date shim"
        condition: "PR creation count == 0"
        failure_impact: "False-positive PR creation active"

    dependencies:
      external_tools:
        - "bash 4.0+"

  - scenario_id: "004"
    test_id: "TS-GH-2247-004"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"

    test_objective:
      title: "Verify false-positive detection after freshly enrolled repo re-run"
      what: |
        After a repo is freshly enrolled (shim created), running reconcile
        again should detect the shim as up-to-date and not create another
        PR. This tests the enrollment → re-check path.
      why: |
        The original bug manifested most visibly when re-running after
        enrollment. The freshly created shim would be immediately flagged
        as stale on the next run.
      acceptance_criteria:
        - "First run enrolls repo and creates shim PR"
        - "Second run detects shim as current and creates no PR"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "bash test harness with mocked gh CLI"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Set up mock environment for new enrollment"
          command: "Mock gh to return 404 for content (repo not enrolled)"
          validation: "gh api returns 404 for workflow file"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh first time (enrollment)"
          command: "bash hack/reconcile-repos.sh"
          validation: "PR created for enrollment"
        - step_id: "TEST-02"
          action: "Update mock to return the enrolled shim content"
          command: "Update mock gh to return base64 of the shim that was just created"
          validation: "Mock now returns the enrolled content"
        - step_id: "TEST-03"
          action: "Run reconcile-repos.sh second time (re-check)"
          command: "bash hack/reconcile-repos.sh"
          validation: "No new PR created"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove mocks and temp files"
          command: "rm -rf $MOCK_DIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Second run does not create a PR"
        condition: "PR creation count on second run == 0"
        failure_impact: "Enrollment-then-recheck cycle creates infinite PR churn"

    dependencies:
      external_tools:
        - "bash 4.0+"

  # =========================================================================
  # Group 2: Genuine Drift Detection (P0)
  # Requirement: Genuinely stale content triggers update PR
  # =========================================================================

  - scenario_id: "005"
    test_id: "TS-GH-2247-005"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"

    test_objective:
      title: "Verify stale shim triggers update PR creation"
      what: |
        When the remote shim content genuinely differs from the expected
        template (e.g., template was updated), the reconcile script must
        detect the drift and create an update PR.
      why: |
        The fix for false positives must not break true positive detection.
        Genuine drift must still trigger updates to keep repos in sync.
      acceptance_criteria:
        - "Script detects content difference"
        - "Update PR created with correct branch and body"
        - "PR contains the updated shim content"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "bash test harness with mocked gh CLI"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock with outdated shim content"
          command: "Mock gh returns base64 of OLD shim template version"
          validation: "Decoded remote content differs from current template"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash hack/reconcile-repos.sh"
          validation: "Exit code 0"
        - step_id: "TEST-02"
          action: "Verify update PR was created"
          command: "Check mock log for POST to /repos/.../pulls"
          validation: "PR creation recorded"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove mocks"
          command: "rm -rf $MOCK_DIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Update PR created for genuinely stale shim"
        condition: "gh mock log contains POST to /repos/.../pulls"
        failure_impact: "True drift goes undetected — repos drift out of sync"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "PR title indicates shim update"
        condition: "PR title contains 'update' or 'shim'"
        failure_impact: "PR is created but unclear purpose"

    dependencies:
      external_tools:
        - "bash 4.0+"

  - scenario_id: "006"
    test_id: "TS-GH-2247-006"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"

    test_objective:
      title: "Verify update PR contains correct updated shim content"
      what: |
        When an update PR is created for a stale shim, the PR must contain
        the correct new shim content — the current template with ORG
        interpolated and sentinel lines intact.
      why: |
        An update PR with wrong content could break the target repo's CI
        or remove the sentinel, causing further issues on subsequent runs.
      acceptance_criteria:
        - "PR blob contains current template content"
        - "ORG placeholder replaced with actual org name"
        - "Sentinel lines present in the blob"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "bash test harness with mocked gh CLI"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock with outdated shim; capture blob creation payload"
          command: "Mock gh logs all API payloads to temp file"
          validation: "Mock captures request bodies"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh to trigger update"
          command: "bash hack/reconcile-repos.sh"
          validation: "Update PR created"
        - step_id: "TEST-02"
          action: "Extract and decode the blob content from mock log"
          command: "Parse mock log; extract base64 content; decode"
          validation: "Decoded content available for assertion"
        - step_id: "TEST-03"
          action: "Verify blob content matches current template"
          command: "diff decoded_blob expected_template"
          validation: "No differences"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove mocks and temp files"
          command: "rm -rf $MOCK_DIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Blob content matches current template with ORG interpolated"
        condition: "diff returns 0 (no differences)"
        failure_impact: "Update PR would deploy wrong shim content"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Sentinel lines present in blob"
        condition: "Blob contains '# --- fullsend-managed-start ---' and '# --- fullsend-managed-end ---'"
        failure_impact: "Missing sentinel breaks future drift detection"

    dependencies:
      external_tools:
        - "bash 4.0+"
        - "diff"

  - scenario_id: "007"
    test_id: "TS-GH-2247-007"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"

    test_objective:
      title: "Verify drift detected when template changes between runs"
      what: |
        When the shim template itself is updated (e.g., new step added),
        repos with the old template version must be detected as stale and
        updated. This tests the legitimate template evolution path.
      why: |
        Template updates are the primary reason drift detection exists.
        The false-positive fix must not interfere with this core function.
      acceptance_criteria:
        - "Old template version detected as stale"
        - "Update PR created with new template content"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "bash test harness with mocked gh CLI"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock with old template version as remote content"
          command: "Mock gh returns base64 of template v1"
          validation: "Remote content is template v1"
        - step_id: "SETUP-02"
          action: "Update local template to v2 (add new step)"
          command: "Modify shim template file to include new workflow step"
          validation: "Local template differs from remote"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash hack/reconcile-repos.sh"
          validation: "Drift detected"
        - step_id: "TEST-02"
          action: "Verify update PR created"
          command: "Check mock log"
          validation: "PR creation recorded"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Restore original template; remove mocks"
          command: "git checkout -- template; rm -rf $MOCK_DIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Template v1→v2 change detected as genuine drift"
        condition: "Update PR created"
        failure_impact: "Template evolution broken — repos stuck on old version"

    dependencies:
      external_tools:
        - "bash 4.0+"

  # =========================================================================
  # Group 3: Sentinel Preservation (P0)
  # Requirement: Sentinel lines preserved in all code paths
  # =========================================================================

  - scenario_id: "008"
    test_id: "TS-GH-2247-008"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"

    test_objective:
      title: "Verify generated shim blob contains sentinel comment"
      what: |
        Every shim blob generated by reconcile-repos.sh must contain the
        sentinel comment markers that delimit the managed section. These
        markers are used by extract_managed_content for precise comparison.
      why: |
        Without sentinel markers, the script falls back to full-content
        comparison which is less precise and harder to maintain.
      acceptance_criteria:
        - "Generated blob contains start sentinel marker"
        - "Generated blob contains end sentinel marker"
        - "Sentinels are in correct order (start before end)"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "bash test harness"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Set up mock environment for new enrollment"
          command: "Mock gh returns 404 (new repo, not enrolled)"
          validation: "Environment ready for enrollment"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh to generate enrollment blob"
          command: "bash hack/reconcile-repos.sh"
          validation: "Enrollment blob created"
        - step_id: "TEST-02"
          action: "Extract blob content from mock log"
          command: "Parse and decode blob payload"
          validation: "Blob content available"
        - step_id: "TEST-03"
          action: "Check for sentinel markers"
          command: "grep for start and end sentinel patterns"
          validation: "Both markers found"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove mocks"
          command: "rm -rf $MOCK_DIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Start sentinel present in blob"
        condition: "Blob contains '# --- fullsend-managed-start ---'"
        failure_impact: "Managed content extraction fails on next comparison"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "End sentinel present in blob"
        condition: "Blob contains '# --- fullsend-managed-end ---'"
        failure_impact: "Managed content boundary undefined"
      - assertion_id: "ASSERT-03"
        priority: "P1"
        description: "Start sentinel appears before end sentinel"
        condition: "Line number of start < line number of end"
        failure_impact: "Extraction logic may extract wrong content"

    dependencies:
      external_tools:
        - "bash 4.0+"
        - "grep"

  - scenario_id: "009"
    test_id: "TS-GH-2247-009"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"

    test_objective:
      title: "Verify sentinel preserved through base64 encode-decode round-trip"
      what: |
        Sentinel markers must survive a base64 encode → decode round-trip
        without corruption or loss. This validates that the GitHub Content
        API storage path preserves sentinel integrity.
      why: |
        If sentinels are corrupted during base64 handling, extract_managed_content
        will fail and the script will fall back to less precise comparison.
      acceptance_criteria:
        - "Sentinel markers present after base64 encode-decode"
        - "No extra whitespace or corruption in sentinel text"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "bash test harness"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create shim content with sentinel markers"
          command: "Generate shim from template with sentinels"
          validation: "Shim has sentinel markers"
      test_execution:
        - step_id: "TEST-01"
          action: "Base64 encode the shim content"
          command: "echo \"$SHIM_CONTENT\" | base64"
          validation: "Base64 string produced"
        - step_id: "TEST-02"
          action: "Base64 decode the encoded content"
          command: "echo \"$ENCODED\" | base64 -d"
          validation: "Decoded content produced"
        - step_id: "TEST-03"
          action: "Verify sentinels in decoded content"
          command: "grep sentinel patterns in decoded output"
          validation: "Both sentinels found intact"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temp files"
          command: "rm -f $TEMP_FILES"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Sentinels survive base64 round-trip"
        condition: "Decoded content contains both sentinel markers verbatim"
        failure_impact: "Base64 handling corrupts sentinel — breaks managed content extraction"

    dependencies:
      external_tools:
        - "base64"

  - scenario_id: "010"
    test_id: "TS-GH-2247-010"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"

    test_objective:
