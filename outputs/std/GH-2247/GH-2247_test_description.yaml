      why: |
        This is the primary regression test for GH-2247. The original bug caused
        false-positive stale detection because base64 re-encoding via Bash command
        substitution strips trailing newlines, producing byte-different but logically
        identical content. If this test fails, bogus update PRs will be created.
      acceptance_criteria:
