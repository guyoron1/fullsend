      external_tools:
        - "bash 4.0+"

  # =========================================================================
  # Group 8: New Enrollment (P1)
  # =========================================================================

  - scenario_id: "023"
    test_id: "TS-GH-2247-023"
    tier: "Functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2247"

    test_objective:
      title: "Verify new enrollment creates shim with sentinel and ORG interpolated"
      what: |
        When enrolling a new repo (no existing shim), the generated shim
        must contain sentinel markers and have __ORG__ replaced with the
        actual org name.
      why: |
        Correct enrollment is the foundation for future drift detection.
        Missing sentinels or uninterpolated ORG would cause issues on
        subsequent reconciliation runs.
      acceptance_criteria:
        - "Enrollment PR created for new repo"
        - "Shim blob contains sentinel markers"
        - "__ORG__ replaced with actual org name"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "bash test harness"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock for new repo (404 on content fetch)"
          command: "Mock gh returns 404 for workflow file; accepts PR creation"
          validation: "Mock simulates unenrolled repo"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash hack/reconcile-repos.sh"
          validation: "Enrollment PR created"
        - step_id: "TEST-02"
          action: "Extract and validate blob content"
          command: "Decode blob from mock log"
          validation: "Blob has sentinels and interpolated ORG"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove mocks"
          command: "rm -rf $MOCK_DIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Enrollment blob contains sentinel markers"
        condition: "Blob has start and end sentinel comments"
        failure_impact: "Enrolled repo lacks sentinels — future comparison uses fallback"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "__ORG__ fully interpolated"
        condition: "Blob does not contain literal '__ORG__'"
        failure_impact: "Shim workflow references nonexistent org"

    dependencies:
      external_tools:
        - "bash 4.0+"

  - scenario_id: "024"
    test_id: "TS-GH-2247-024"
    tier: "Functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2247"

    test_objective:
      title: "Verify enrollment PR created with correct title and body"
      what: |
        The enrollment PR must have a descriptive title indicating it's
        a shim enrollment and a body explaining what the shim does and
        who manages it.
      why: |
        Clear PR metadata helps repo maintainers understand and approve
        the enrollment PR. Unclear PRs may be rejected or ignored.
      acceptance_criteria:
        - "PR title contains repo name and 'enroll' or 'shim'"
        - "PR body explains the shim workflow purpose"
        - "PR targets the default branch"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "bash test harness"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock for new repo enrollment"
          command: "Mock gh captures PR creation payload"
          validation: "Mock logs PR title and body"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash hack/reconcile-repos.sh"
          validation: "Enrollment PR created"
        - step_id: "TEST-02"
          action: "Extract PR payload from mock log"
          command: "Parse mock log for PR creation request body"
          validation: "PR title and body available"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove mocks"
          command: "rm -rf $MOCK_DIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "PR title is descriptive"
        condition: "Title contains 'shim' or 'enroll' and repo name"
        failure_impact: "PR title unclear to repo maintainers"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "PR body explains purpose"
        condition: "Body contains explanation of shim workflow"
        failure_impact: "Maintainers may reject unexplained PR"

