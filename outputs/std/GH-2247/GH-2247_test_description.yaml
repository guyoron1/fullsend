  - scenario_id: "025"
    test_id: "TS-GH-2247-025"
    tier: "Functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2247"

    test_objective:
      title: "Verify enrollment skipped for private repos"
      what: |
        Private repos should be excluded from shim enrollment unless
        explicitly configured. The script should check repo visibility
        and skip private repos.
      why: |
        Private repos may have different workflow requirements or may
        not need the shim. Enrolling them without opt-in could disrupt
        their existing CI.
      acceptance_criteria:
        - "Private repo detected and skipped"
        - "No enrollment PR created for private repo"
        - "Log message indicates skip reason"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "bash test harness"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock where repo visibility is 'private'"
          command: "Mock gh returns repo metadata with 'private: true'"
          validation: "Mock reports repo as private"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash hack/reconcile-repos.sh 2>&1"
          validation: "Script completes"
        - step_id: "TEST-02"
          action: "Verify no enrollment PR created"
          command: "Check mock log"
          validation: "No PR creation for private repo"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove mocks"
          command: "rm -rf $MOCK_DIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Private repo skipped for enrollment"
        condition: "No PR created; skip message in log"
        failure_impact: "Private repos get unwanted enrollment PRs"

    dependencies:
      external_tools:
        - "bash 4.0+"
