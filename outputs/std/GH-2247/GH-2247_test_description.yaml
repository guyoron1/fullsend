    test_objective:
      title: "Verify decoded comparison matches despite trailing newline differences"
      what: |
        Validates that the decoded text comparison (with tr -d '\\r'
        normalization) correctly handles content where the only difference
        is trailing newline count (0, 1, or 2 trailing newlines).
      why: |
        Multiple variations of trailing newline differences can occur
        depending on how content is stored and retrieved. All variations
        must be normalized before comparison.
      acceptance_criteria:
        - "Content with 0 trailing newlines matches content with 1 trailing newline"
        - "Content with 1 trailing newline matches content with 2 trailing newlines"
        - "All trailing newline variations are treated as equivalent"

