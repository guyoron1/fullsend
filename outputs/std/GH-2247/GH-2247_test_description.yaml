    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh CLI returning stale pre-sentinel shim"
          command: "Mock returns base64 of stale content without sentinel"
          validation: "Mock configured with stale pre-sentinel content"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash reconcile-repos.sh CONFIG_DIR"
          validation: "Script detects stale content"
        - step_id: "TEST-02"
          action: "Verify update blob created"
