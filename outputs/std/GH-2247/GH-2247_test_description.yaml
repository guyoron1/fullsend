        - name: "pre_sentinel_shim"
          type: "text"
          content: "fresh shim template"
          description: "Same content as template but without sentinel line"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh CLI returning pre-sentinel shim with matching content"
          command: "Mock returns base64 of content without sentinel"
          validation: "Mock configured with pre-sentinel content"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash reconcile-repos.sh CONFIG_DIR"
          validation: "Script uses fallback comparison"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary directory"
          command: "rm -rf TMPDIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Pre-sentinel shim with matching content recognized"
        condition: "No 'shim is stale' in output OR shim detected as stale for migration"
        failure_impact: "Unnecessary migration churn for pre-sentinel repos"

    dependencies:
      kubernetes_resources: []
      external_tools: ["GNU base64", "awk"]
      scenario_specific_rbac: []

  - scenario_id: 9
    test_id: "TS-GH2247-009"
    test_type: "unit"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2247"
    coverage_status: "NEW"

    test_objective:
      title: "Verify pre-sentinel shim detects genuine drift"
      what: |
        Tests that when a pre-sentinel shim has content that genuinely
        differs from the template, the full decoded content comparison
        correctly detects the drift and flags it as stale.
      why: |
        The fallback path must still catch real drift in pre-sentinel repos,
