      title: "Verify reconciliation handles mixed repo states correctly"
      what: |
        This test runs the full reconciliation script against a mix of repos in different
        states: one up-to-date, one stale, one pre-sentinel, and one new enrollment. It
        validates that each repo is handled according to its state.
      why: |
        Production reconciliation runs against all enrolled repos simultaneously. The
        script must correctly categorize and handle each repo independently. A bug that
