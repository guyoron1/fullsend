          action: "Run full reconcile-repos.sh"
          command: "bash reconcile-repos.sh"
          validation: "Script completes without error"
        - step_id: "TEST-02"
          action: "Analyze mock gh call log"
          command: "Parse mock log to categorize API calls per repo"
          validation: "Each repo has expected API call pattern"

