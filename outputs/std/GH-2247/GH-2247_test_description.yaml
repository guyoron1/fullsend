    test_objective:
      title: "Verify sentinel present in blob for stale shim update"
      what: |
        This test validates that when a stale shim is updated, the resulting blob
        contains the sentinel line. The sentinel is the boundary marker between
        user-owned header and fullsend-managed content.
      why: |
        The original bug (PR #2101) removed sentinel lines. Without the sentinel,
        future reconciliation cannot distinguish user content from managed content,
        causing infinite churn. This is a critical invariant.
      acceptance_criteria:
        - "Output blob contains the sentinel line"
        - "Sentinel appears before managed content"

    test_structure:
      type: "single"
      function: "TestSentinelPreservation"
      subtest: "sentinel_present_in_stale_shim_update"

    code_structure: |
      t.Run("sentinel_present_in_stale_shim_update", func(t *testing.T) {
        // Setup: create stale remote shim
        // Execute: generate update blob via shim_with_header_b64()
        // Assert: decoded blob contains sentinel line
      })

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create stale remote shim with sentinel and outdated managed content"
          command: "Build remote with old template version"
          validation: "Remote has sentinel but outdated content"

      test_execution:
        - step_id: "TEST-01"
          action: "Generate update blob via shim_with_header_b64()"
          command: "Source reconcile-repos.sh; call shim_with_header_b64"
          validation: "Function returns base64-encoded blob"
        - step_id: "TEST-02"
          action: "Decode blob and check for sentinel"
          command: "echo $BLOB | base64 -d | grep sentinel"
          validation: "Sentinel line found in decoded blob"

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temp directory"
          command: "rm -rf $TMPDIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Sentinel line present in update blob"
        condition: "Decoded blob contains '# --- fullsend managed below - do not edit ---'"
        failure_impact: "Missing sentinel breaks all future reconciliation for this repo"

