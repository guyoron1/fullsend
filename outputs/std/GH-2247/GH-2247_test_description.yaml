scenarios:
  # =========================================================================
  # Group 1: False-Positive Prevention (P0)
  # Requirement: Shim drift detection correctly identifies identical content
  # =========================================================================

  - scenario_id: "001"
    test_id: "TS-GH-2247-001"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"

    test_objective:
      title: "Verify identical shim not flagged as stale"
      what: |
        This test validates that when the remote shim content (fetched via
        GitHub Content API and base64-decoded) is identical to the expected
        shim content generated from the template, the reconcile script does
        NOT flag the shim as stale and does NOT create an update PR.
      why: |
        This is the core regression test for GH-2247. The original bug caused
        identical shims to be flagged as stale due to base64 re-encoding
        differences. Preventing false positives eliminates bogus PR churn.
      acceptance_criteria:
        - "Reconcile script exits without creating an update PR"
        - "Script logs indicate shim is up-to-date"
        - "No gh api call made to create a PR or blob"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "bash test harness with mocked gh CLI"

    specific_preconditions:
      - name: "Identical shim content"
        requirement: "Mock gh api returns base64-encoded content identical to template after ORG interpolation"
        validation: "Decoded remote content matches expected content byte-for-byte"

    test_data:
      shim_template: |
        # Managed by fullsend reconcile
        # DO NOT EDIT below this line
        # --- fullsend-managed-start ---
        name: shim-workflow
        on:
          workflow_dispatch:
        jobs:
          shim:
            runs-on: ubuntu-latest
            steps:
              - uses: __ORG__/fullsend-action@main
        # --- fullsend-managed-end ---
      remote_content_base64: "base64-encoded version of the above template with ORG replaced"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh CLI that returns base64-encoded shim content matching template"
          command: "Create mock script in temp dir; prepend to PATH"
          validation: "Mock gh api repos/.../contents/... returns correct base64 JSON"
        - step_id: "SETUP-02"
          action: "Set GITHUB_REPOSITORY_OWNER to test-org"
          command: "export GITHUB_REPOSITORY_OWNER=test-org"
          validation: "echo $GITHUB_REPOSITORY_OWNER == test-org"
        - step_id: "SETUP-03"
          action: "Create mock enrollment config listing one repo"
          command: "Create repos.yaml with one enrolled repo entry"
          validation: "yq reads config correctly"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh against the enrolled repo"
          command: "bash hack/reconcile-repos.sh"
          validation: "Exit code 0, no PR creation API call in mock log"
        - step_id: "TEST-02"
          action: "Verify no update PR was created"
          command: "Check mock gh log for absence of 'pulls' POST request"
          validation: "No PR creation recorded"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove mock scripts and temp directory"
          command: "rm -rf $MOCK_DIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "No update PR created for identical shim content"
        condition: "gh mock log does not contain POST to /repos/.../pulls"
        failure_impact: "False-positive regression — GH-2247 not fixed"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Script reports shim as up-to-date"
        condition: "stdout contains 'up-to-date' or 'skipping' message"
        failure_impact: "Script may silently skip comparison"

    dependencies:
      external_tools:
        - "bash 4.0+"
        - "base64"
        - "tr"

  - scenario_id: "002"
    test_id: "TS-GH-2247-002"
    tier: "Functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"

    test_objective:
      title: "Verify identical content with trailing newline variation detected as current"
      what: |
        This test validates that shim content which differs ONLY in trailing
        newlines (e.g., remote has trailing \n, local does not due to bash
        command substitution stripping) is correctly identified as identical
        and does not trigger a stale detection.
      why: |
        This is the exact root cause of GH-2247. Bash command substitution
        strips trailing newlines, causing base64 re-encoding to produce
        different strings for logically identical content. The fix must
        handle this normalization.
      acceptance_criteria:
        - "Content with trailing newline treated as identical to content without"
        - "No update PR created"
        - "Decoded text comparison used instead of base64 comparison"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "bash test harness with mocked gh CLI"

    specific_preconditions:
      - name: "Trailing newline mismatch"
        requirement: "Remote content has trailing newline; local template output does not (or vice versa)"
        validation: "Hex dump shows difference only in trailing 0x0a bytes"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh CLI returning content with extra trailing newline"
          command: "Mock returns base64 of content + '\\n\\n' (double trailing newline)"
          validation: "Decoded content has trailing newlines"
        - step_id: "SETUP-02"
          action: "Set up enrollment config and environment"
          command: "export GITHUB_REPOSITORY_OWNER=test-org; create repos.yaml"
          validation: "Environment ready"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash hack/reconcile-repos.sh"
          validation: "Exit code 0"
        - step_id: "TEST-02"
          action: "Verify no PR created despite trailing newline difference"
          command: "Check mock log for absence of PR creation"
          validation: "No POST to pulls endpoint"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove mock scripts and temp files"
          command: "rm -rf $MOCK_DIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Trailing newline difference does not trigger stale detection"
        condition: "No PR creation API call recorded"
        failure_impact: "Direct regression of GH-2247 — the exact bug scenario"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Comparison operates on decoded text, not base64 strings"
        condition: "Script uses base64 -d and tr -d before comparison"
        failure_impact: "Other whitespace edge cases may still trigger false positives"

    dependencies:
      external_tools:
        - "bash 4.0+"
        - "base64"
        - "tr"

  - scenario_id: "003"
    test_id: "TS-GH-2247-003"
    tier: "Functional"
    priority: "P0"
    mvp: true
