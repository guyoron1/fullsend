  # =====================================================================

  - scenario_id: 8
    test_id: "TS-GH2247-008"
    test_type: "unit"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2247"
    coverage_status: "NEW"

    test_objective:
      title: "Verify pre-sentinel shim matches full decoded content"
      what: |
        Tests that when a remote shim has no sentinel line (pre-sentinel
        format from before sentinel introduction), extract_managed_content
        returns empty, and the comparison falls back to full decoded content
        comparison. When the full content matches the template content
        (minus sentinel), it is recognized as up-to-date.
      why: |
        Pre-sentinel shims exist from before the sentinel feature was added.
        The fallback ensures these repos are not unnecessarily updated if
        the managed content is identical.
      acceptance_criteria:
        - "Pre-sentinel shim with matching content not flagged stale"
        - "Fallback to full decoded content comparison is triggered"

    specific_preconditions:
      - name: "Pre-sentinel remote shim"
        requirement: "Remote shim has managed content but no sentinel line"
        validation: "Mock returns shim without sentinel"

    test_data:
