      acceptance_criteria:
        - "Pre-sentinel shim with different content is flagged stale"
        - "Update blob is created with sentinel + fresh template"

    specific_preconditions:
      - name: "Pre-sentinel remote shim with stale content"
        requirement: "Remote shim has different content and no sentinel"
