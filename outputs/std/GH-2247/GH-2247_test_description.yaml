        The GitHub content API returns base64 with line wrapping, while
        base64 -w0 produces unwrapped output.
      why: |
        The script must handle both wrapped and unwrapped base64 formats
        since it processes content from GitHub API (wrapped) and locally
        generated content (unwrapped via -w0).
      acceptance_criteria:
        - "Wrapped base64 decoded to same content as unwrapped"
        - "No extra whitespace or newlines in decoded output"

    specific_preconditions: []
    test_data:
      resource_definitions:
        - name: "wrapped_base64"
          type: "text"
          description: "Base64 string with 76-char line wrapping (standard format)"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Generate wrapped base64 from test content"
          command: "echo content | base64 (default wrapping)"
          validation: "Output has line breaks"
      test_execution:
        - step_id: "TEST-01"
          action: "Decode wrapped base64"
          command: "echo wrapped | base64 -d"
          validation: "Decoded matches original content"
        - step_id: "TEST-02"
          action: "Compare with unwrapped decode"
          command: "echo content | base64 -w0 | base64 -d"
          validation: "Both produce identical output"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "No cleanup needed"
          command: "N/A"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Wrapped base64 decoded correctly"
        condition: "Decoded wrapped == decoded unwrapped == original content"
        failure_impact: "GitHub API base64 format causes decode errors"

    dependencies:
      kubernetes_resources: []
      external_tools: ["GNU base64"]
      scenario_specific_rbac: []
