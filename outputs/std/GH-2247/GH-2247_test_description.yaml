  # =====================================================================
  # Group 6: Base64 round-trip integrity (P1)
  # Requirement: Base64 encoding/decoding round-trip does not corrupt content
  # =====================================================================

  - scenario_id: 16
    test_id: "TS-GH2247-016"
    test_type: "unit"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2247"
    coverage_status: "NEW"

    test_objective:
      title: "Verify base64 round-trip preserves multi-line YAML"
      what: |
        Tests that encoding multi-line YAML content to base64 and decoding
        it back produces byte-identical output. This validates the data
        transformation pipeline preceding the comparison logic.
      why: |
        The comparison logic assumes base64 decode produces identical
        bytes. If the encode/decode round-trip corrupts content (e.g.,
        adding/removing characters), comparison results are unreliable.
      acceptance_criteria:
        - "Decoded content byte-identical to original input"
        - "Multi-line YAML structure preserved (indentation, colons, dashes)"

    specific_preconditions: []
    test_data:
      resource_definitions:
        - name: "multiline_yaml"
          type: "text"
          content: |
            name: test-workflow
            on:
              workflow_call:
                inputs:
                  target:
                    type: string
            jobs:
              test:
                runs-on: ubuntu-latest

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create multi-line YAML test content"
          command: "Store YAML content in variable"
          validation: "Content has multiple lines with YAML structure"
      test_execution:
        - step_id: "TEST-01"
          action: "Encode to base64 and decode back"
          command: "echo content | base64 -w0 | base64 -d"
          validation: "Output matches input"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "No cleanup needed"
          command: "N/A"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Round-trip preserves multi-line content"
        condition: "Decoded output == original input (byte comparison)"
        failure_impact: "Base64 corruption leads to false drift detection"

    dependencies:
      kubernetes_resources: []
      external_tools: ["GNU base64"]
      scenario_specific_rbac: []

  - scenario_id: 17
    test_id: "TS-GH2247-017"
