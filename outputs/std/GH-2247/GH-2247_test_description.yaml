scenarios:
  # =====================================================================
  # Group 1: Identical content detection (P0)
  # Requirement: Shim drift detection correctly identifies logically
  #              identical content as up-to-date
  # =====================================================================

  - scenario_id: 1
    test_id: "TS-GH2247-001"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"
    coverage_status: "NEW"

    test_objective:
      title: "Verify identical content with extra trailing newline not flagged stale"
      what: |
        Tests that when remote shim content (from GitHub API) has an extra
        trailing newline compared to the locally generated template, the
        decoded text comparison correctly identifies them as identical.
        The extract_managed_content function strips the sentinel-delimited
        section and trailing whitespace differences are normalized.
      why: |
        This is the root cause of GH-2247. The GitHub content API can return
        base64 content with different trailing newline counts than locally
        generated content. The old base64-level comparison produced false
        positives, creating bogus update PRs like PR #2101.
      acceptance_criteria:
        - "Script output contains 'already enrolled (shim up to date)'"
        - "No blob is created (no update PR triggered)"
        - "No 'shim is stale' message in output"

    specific_preconditions:
      - name: "Template with sentinel"
        requirement: "Shim template file containing sentinel line and managed content"
        validation: "Template file exists at CONFIG_DIR/templates/shim-workflow-call.yaml"

    test_data:
      resource_definitions:
        - name: "shim_template"
          type: "text"
          content: |
            # --- fullsend managed below - do not edit ---
            fresh shim template
        - name: "remote_content"
          type: "text"
          description: "Same content as template but with extra trailing newline (\\n\\n instead of \\n)"
          content: |
            # --- fullsend managed below - do not edit ---
            fresh shim template

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create temporary directory with config and shim template"
          command: "mktemp -d && create config.yaml and template"
          validation: "Config directory exists with template"
        - step_id: "SETUP-02"
          action: "Create mock gh CLI returning remote content with extra trailing newline"
          command: "Write mock gh script that base64-encodes content with extra \\n"
          validation: "Mock gh script is executable"
        - step_id: "SETUP-03"
          action: "Set environment variables (PATH, GITHUB_REPOSITORY_OWNER, GH_TOKEN)"
          command: "export PATH=mock_bin:$PATH"
          validation: "Mock commands are found first in PATH"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh with the test config"
          command: "bash reconcile-repos.sh CONFIG_DIR"
          validation: "Script exits successfully"
        - step_id: "TEST-02"
          action: "Check output for stale detection"
          command: "grep 'shim is stale' stdout.log"
          validation: "No match found — content not flagged stale"
        - step_id: "TEST-03"
          action: "Check output for up-to-date confirmation"
          command: "grep 'already enrolled (shim up to date)' stdout.log"
          validation: "Match found — content recognized as current"
        - step_id: "TEST-04"
          action: "Verify no blob was created"
          command: "test ! -f blob-input.json"
          validation: "No blob file exists — no update PR triggered"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary directory"
          command: "rm -rf TMPDIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Script does not flag identical content as stale"
        condition: "stdout does not contain 'shim is stale'"
        failure_impact: "False positive drift detection causes bogus update PRs (GH-2247 regression)"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Script confirms content is up to date"
        condition: "stdout contains 'already enrolled (shim up to date)'"
        failure_impact: "Script may silently skip repos or produce incorrect status"
      - assertion_id: "ASSERT-03"
        priority: "P0"
        description: "No blob created for false positive"
        condition: "blob-input file does not exist"
        failure_impact: "Unnecessary API calls and PR creation"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "GNU base64"
        - "GNU awk"
        - "jq"
      scenario_specific_rbac: []

  - scenario_id: 2
    test_id: "TS-GH2247-002"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"
    coverage_status: "NEW"

    test_objective:
      title: "Verify identical content with no trailing newline not flagged stale"
      what: |
        Tests that when remote content has no trailing newline (raw bytes end
        immediately after last content character), decoded text comparison
        still matches the template which may have a trailing newline.
      why: |
        Different base64 encoding tools and APIs may strip or add trailing
        newlines inconsistently. The comparison must be resilient to this.
      acceptance_criteria:
        - "Script output contains 'already enrolled (shim up to date)'"
        - "No blob is created"

    specific_preconditions: []
    test_data:
      resource_definitions:
        - name: "remote_content"
          type: "text"
          description: "Same managed content as template but without any trailing newline"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh CLI returning content without trailing newline"
          command: "printf '%s' content | base64 (no trailing newline in input)"
          validation: "Base64 string differs from template's base64"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash reconcile-repos.sh CONFIG_DIR"
          validation: "Script completes without flagging stale"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary directory"
          command: "rm -rf TMPDIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "No trailing newline variant not flagged stale"
        condition: "stdout contains 'already enrolled (shim up to date)'"
        failure_impact: "False positive from newline-free encoding"

    dependencies:
      kubernetes_resources: []
      external_tools: ["GNU base64"]
      scenario_specific_rbac: []

  - scenario_id: 3
    test_id: "TS-GH2247-003"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"
    coverage_status: "NEW"

    test_objective:
      title: "Verify genuinely different content is flagged stale"
      what: |
        Tests that when the remote shim content genuinely differs from the
        template (different managed content after sentinel), the script
        correctly detects staleness and triggers an update.
      why: |
        While fixing false positives, the comparison must still detect real
        drift. A regression here would leave repos with outdated shims.
      acceptance_criteria:
        - "Script output contains 'shim is stale'"
        - "A blob is created for the update PR"

    specific_preconditions: []
    test_data:
      resource_definitions:
        - name: "remote_content"
          type: "text"
          content: |
            # --- fullsend managed below - do not edit ---
            stale shim template
        - name: "expected_template"
          type: "text"
          content: |
            # --- fullsend managed below - do not edit ---
            fresh shim template

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh CLI returning stale managed content"
          command: "Create mock with 'stale shim template' instead of 'fresh shim template'"
          validation: "Mock returns base64 of stale content"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash reconcile-repos.sh CONFIG_DIR"
          validation: "Script detects stale content"
        - step_id: "TEST-02"
          action: "Verify blob created"
          command: "test -f blob-input.json"
          validation: "Blob file exists with fresh template content"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary directory"
          command: "rm -rf TMPDIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Genuinely different content is flagged stale"
        condition: "stdout contains 'shim is stale'"
        failure_impact: "Real drift not detected — repos stuck on outdated shims"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Update blob is created"
        condition: "blob-input file exists and contains fresh template"
        failure_impact: "Stale shim not updated"

    dependencies:
      kubernetes_resources: []
      external_tools: ["GNU base64", "jq"]
      scenario_specific_rbac: []

  - scenario_id: 4
    test_id: "TS-GH2247-004"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"
    coverage_status: "NEW"

    test_objective:
      title: "Verify carriage return differences ignored in comparison"
      what: |
        Tests that carriage return characters (\\r) in remote content are
        stripped via tr -d '\\r' before comparison, so Windows-style line
        endings (CRLF) do not cause false positive drift detection.
      why: |
        The GitHub content API may introduce or preserve carriage returns
        depending on the source file's line endings. The fix normalizes
        these before comparison.
      acceptance_criteria:
        - "Content with \\r\\n line endings not flagged stale"
        - "Content with mixed \\r is normalized correctly"

    specific_preconditions: []
    test_data:
      resource_definitions:
        - name: "remote_content"
          type: "text"
          description: "Same managed content but with \\r\\n line endings"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh CLI returning content with CRLF line endings"
          command: "printf content with \\r\\n | base64"
          validation: "Base64 contains CRLF artifacts"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash reconcile-repos.sh CONFIG_DIR"
          validation: "Content not flagged stale after CR normalization"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary directory"
          command: "rm -rf TMPDIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "CRLF differences do not trigger false positive"
        condition: "stdout does not contain 'shim is stale'"
        failure_impact: "Windows-originated files cause unnecessary update PRs"

    dependencies:
      kubernetes_resources: []
      external_tools: ["GNU base64", "tr"]
      scenario_specific_rbac: []

  # =====================================================================
  # Group 2: Sentinel preservation (P0)
  # Requirement: Sentinel line is preserved in all shim blob outputs
  # =====================================================================

  - scenario_id: 5
    test_id: "TS-GH2247-005"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"
    coverage_status: "NEW"

    test_objective:
      title: "Verify sentinel present in new enrollment shim"
      what: |
        Tests that when a new repo is enrolled (no existing shim on remote),
        the generated blob contains the sentinel line
        '# --- fullsend managed below - do not edit ---' from the template.
      why: |
        The sentinel line is critical for separating user-owned headers from
        fullsend-managed content. Missing sentinel breaks all future
        comparison and update logic.
      acceptance_criteria:
        - "Blob content starts with or contains sentinel line"
        - "Blob content includes fresh template after sentinel"

    specific_preconditions:
      - name: "New repo (no existing shim)"
        requirement: "Mock gh API returns 404 for shim contents endpoint"
        validation: "gh api repos/.../contents returns error"

    test_data:
      resource_definitions:
        - name: "sentinel_line"
          type: "constant"
          value: "# --- fullsend managed below - do not edit ---"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh CLI returning 404 for shim contents"
          command: "Mock returns rc=1 for contents endpoint"
          validation: "Mock correctly simulates missing shim"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh to enroll new repo"
          command: "bash reconcile-repos.sh CONFIG_DIR"
          validation: "Script creates enrollment blob"
        - step_id: "TEST-02"
          action: "Decode blob content and check for sentinel"
          command: "jq -r .content blob-input.json | base64 -d | grep sentinel"
          validation: "Sentinel line found in decoded blob"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary directory"
          command: "rm -rf TMPDIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Sentinel line present in new enrollment blob"
        condition: "Decoded blob contains '# --- fullsend managed below - do not edit ---'"
        failure_impact: "New enrollments lack sentinel — breaks future update detection"

    dependencies:
      kubernetes_resources: []
      external_tools: ["GNU base64", "jq"]
      scenario_specific_rbac: []

  - scenario_id: 6
    test_id: "TS-GH2247-006"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"
    coverage_status: "NEW"

    test_objective:
      title: "Verify sentinel present in updated stale shim"
      what: |
        Tests that when a stale shim is updated, the replacement blob
        preserves the sentinel line. The update path constructs a new blob
        from user header (if any) + sentinel + fresh template content.
      why: |
        If the update path drops the sentinel, subsequent reconciliation
        runs would see a pre-sentinel shim and enter infinite update cycles.
      acceptance_criteria:
        - "Updated blob contains sentinel line"
        - "Updated blob contains fresh template content after sentinel"
        - "User header (if present) preserved above sentinel"

    specific_preconditions:
      - name: "Stale shim with user header"
        requirement: "Remote shim has comment header + sentinel + stale content"
        validation: "Mock gh returns stale shim with header"

    test_data:
      resource_definitions:
        - name: "remote_stale_shim"
          type: "text"
          content: |
            # Copyright 2026 Conforma
            # SPDX-License-Identifier: Apache-2.0
            # --- fullsend managed below - do not edit ---
            stale shim template

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh CLI returning stale shim with user header"
          command: "Mock returns base64 of header + sentinel + stale content"
          validation: "Mock configured correctly"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash reconcile-repos.sh CONFIG_DIR"
          validation: "Script detects stale and creates update blob"
        - step_id: "TEST-02"
          action: "Decode blob and verify sentinel present"
          command: "jq -r .content blob.json | base64 -d"
          validation: "Sentinel line exists in decoded blob"
        - step_id: "TEST-03"
          action: "Verify fresh template after sentinel"
          command: "grep 'fresh shim template' decoded_blob"
          validation: "Fresh template content follows sentinel"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary directory"
          command: "rm -rf TMPDIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Sentinel preserved in updated blob"
        condition: "Decoded blob contains sentinel line"
        failure_impact: "Update removes sentinel — infinite update loop"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Fresh template follows sentinel"
        condition: "Decoded blob contains 'fresh shim template'"
        failure_impact: "Update does not apply new template"

    dependencies:
      kubernetes_resources: []
      external_tools: ["GNU base64", "jq"]
      scenario_specific_rbac: []

  - scenario_id: 7
    test_id: "TS-GH2247-007"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2247"
    coverage_status: "NEW"

    test_objective:
      title: "Verify sentinel survives injection guard rejection"
      what: |
        Tests that when non-comment YAML content is found above the sentinel
        (content injection attempt), the injection guard rejects the
        non-comment header but the sentinel and managed content are preserved
        in the output blob.
      why: |
        The injection guard protects against arbitrary YAML injection above
        the sentinel. It must reject bad headers without corrupting the
        sentinel-delimited managed content.
      acceptance_criteria:
        - "Non-comment content above sentinel is NOT in output blob"
        - "Sentinel line IS in output blob"
        - "Fresh template content IS in output blob"
        - "Warning log emitted about rejected header"

    specific_preconditions:
      - name: "Remote shim with injected YAML"
        requirement: "Non-comment YAML (e.g., 'name: injected-workflow') above sentinel"
        validation: "Mock returns shim with injection attempt"

    test_data:
      resource_definitions:
        - name: "injected_remote_shim"
          type: "text"
          content: |
            name: injected-workflow
            # --- fullsend managed below - do not edit ---
            stale shim template

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh CLI returning shim with non-comment YAML above sentinel"
          command: "Mock returns base64 of injected content"
          validation: "Mock configured with injection payload"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash reconcile-repos.sh CONFIG_DIR"
          validation: "Script runs injection guard"
        - step_id: "TEST-02"
          action: "Verify injected content rejected"
          command: "! grep 'injected-workflow' decoded_blob"
          validation: "Injected YAML not in output"
        - step_id: "TEST-03"
          action: "Verify sentinel preserved"
          command: "grep sentinel decoded_blob"
          validation: "Sentinel present in blob"
        - step_id: "TEST-04"
          action: "Verify warning emitted"
          command: "grep '::warning::.*non-comment content above sentinel was rejected' stdout"
          validation: "Warning log present"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary directory"
          command: "rm -rf TMPDIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Injected YAML content rejected"
        condition: "Decoded blob does NOT contain 'injected-workflow'"
        failure_impact: "Arbitrary YAML injection allowed in managed workflow files"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Sentinel preserved despite injection rejection"
        condition: "Decoded blob contains sentinel line"
        failure_impact: "Injection guard corrupts managed section boundary"
      - assertion_id: "ASSERT-03"
        priority: "P0"
        description: "Warning log emitted"
        condition: "stdout contains '::warning::.*non-comment content above sentinel was rejected'"
        failure_impact: "Silent rejection — repo maintainers not informed"

    dependencies:
      kubernetes_resources: []
      external_tools: ["GNU base64", "jq", "awk"]
      scenario_specific_rbac: []

  # =====================================================================
