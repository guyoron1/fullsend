      type: "single"
      function: "TestFullReconciliation"
      subtest: "handles_mixed_repo_states"

    code_structure: |
      t.Run("handles_mixed_repo_states", func(t *testing.T) {
        // Setup: 4 repos with different states
        // Execute: run full reconciliation
        // Assert: each repo handled correctly
      })

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Configure mock gh with 4 repos in different states"
          command: "Mock returns: current for repo-a, outdated for repo-b, no-sentinel for repo-c, 404 for repo-d"
          validation: "Four repos configured with distinct states"
        - step_id: "SETUP-02"
          action: "Configure mock yq with enrolled repo list"
          command: "Mock yq returns [repo-a, repo-b, repo-c, repo-d]"
          validation: "All four repos in enrolled list"

