    what: 'Tests that EnsureOrgInMint does not trigger the data consistency guard

      when ROLE_APP_IDS contains only legacy org-scoped keys (containing ''/'').

      Legacy keys are filtered out by RoleOnlyAppIDs, leaving an empty result.

      '
    why: 'Legacy org-scoped keys (e.g., "acme/coder") should not be confused with

      role-only entries. The guard must only trigger on role-only keys to avoid

      false positives during migration from the old org-scoped model.

      '
    acceptance_criteria:
    - EnsureOrgInMint returns nil error
    - Guard does not trigger for legacy-only ROLE_APP_IDS
