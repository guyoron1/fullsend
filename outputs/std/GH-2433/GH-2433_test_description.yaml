scenarios:
  - scenario_id: 1
    test_id: "TS-GH-2433-001"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2433"
    coverage_status: "NEW"

    test_objective:
      title: "Verify guard returns error when ALLOWED_ORGS is empty but ROLE_APP_IDS has role-only entries"
      what: |
        Tests the core data consistency guard in EnsureOrgInMint. When the traffic-serving
        revision returns empty ALLOWED_ORGS but ROLE_APP_IDS contains role-only entries
        (keys without "/"), the guard must detect this as a data inconsistency (stale read
        from a diverged Cloud Run revision) and return an error to prevent silent unenrollment.
      why: |
        This is the primary protection against silent data loss. Without this guard,
        EnsureOrgInMint would overwrite all existing org registrations with just the
        enrolling org, effectively unenrolling all other organizations from the mint.
      acceptance_criteria:
        - "EnsureOrgInMint returns a non-nil error"
        - "Error message contains 'data inconsistency'"
        - "No UpdateServiceEnvVars call is made (env vars not modified)"

    variables:
      closure_scope:
        - name: "fake"
          type: "*fakeGCFClient"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Fake GCP client with configurable trafficEnvVars"
        - name: "p"
          type: "*Provisioner"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Provisioner under test"

    test_structure:
      type: "single"
      function_name: "TestEnsureOrgInMint_DataInconsistencyGuard_ReturnsError"
      package: "gcf"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fakeGCFClient with FunctionInfo containing mint URL"
          command: "newFakeGCFClient() with functionInfo set"
          validation: "fake is non-nil"
        - step_id: "SETUP-02"
          action: "Configure trafficEnvVars with empty ALLOWED_ORGS and ROLE_APP_IDS containing role-only entries"
          command: |
            fake.trafficEnvVars = map[string]string{
              "ALLOWED_ORGS":  "",
              "ROLE_APP_IDS":  `{"agent":"app-id-1","reviewer":"app-id-2"}`,
            }
          validation: "trafficEnvVars configured correctly"
        - step_id: "SETUP-03"
          action: "Create Provisioner with fake client and project config"
          command: "&Provisioner{gcpAPI: fake, cfg: ProvisionConfig{ProjectID: \"proj1\", Region: \"us-central1\"}}"
          validation: "Provisioner created"
      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureOrgInMint with valid URL and new org"
          command: "p.EnsureOrgInMint(context.Background(), \"https://mint.example.com\", \"new-org\")"
          validation: "Returns non-nil error"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "EnsureOrgInMint returns error"
        condition: "err != nil"
        failure_impact: "Guard is not firing; silent unenrollment could occur"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Error message contains 'data inconsistency'"
        condition: "assert.Contains(t, err.Error(), \"data inconsistency\")"
        failure_impact: "Guard fires but with wrong error message, harder for operators to diagnose"
      - assertion_id: "ASSERT-03"
        priority: "P1"
        description: "No env var update was attempted"
        condition: "fake.updateCalls == 0 or UpdateServiceEnvVars not called"
        failure_impact: "Guard fires too late; env vars may already be corrupted"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  - scenario_id: 2
    test_id: "TS-GH-2433-002"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2433"
    coverage_status: "NEW"

    test_objective:
      title: "Verify enrollment succeeds when both ALLOWED_ORGS and ROLE_APP_IDS are empty (genuine first enrollment)"
      what: |
        Tests that EnsureOrgInMint allows enrollment when both ALLOWED_ORGS and ROLE_APP_IDS
        are empty. This represents a genuine first enrollment where no orgs or roles have
        been configured yet. The guard must not fire in this case.
      why: |
        The guard must distinguish between "data loss" (had orgs, lost them) and
        "first enrollment" (never had orgs). Blocking first enrollment would break
        the initial mint setup workflow.
      acceptance_criteria:
        - "EnsureOrgInMint returns nil error"
        - "UpdateServiceEnvVars is called with the new org in ALLOWED_ORGS"

    variables:
      closure_scope:
        - name: "fake"
          type: "*fakeGCFClient"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Fake GCP client with empty env vars"
        - name: "p"
          type: "*Provisioner"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Provisioner under test"

    test_structure:
      type: "single"
      function_name: "TestEnsureOrgInMint_FirstEnrollment_Succeeds"
      package: "gcf"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fakeGCFClient with FunctionInfo and empty trafficEnvVars"
          command: |
            fake.trafficEnvVars = map[string]string{
              "ALLOWED_ORGS": "",
              "ROLE_APP_IDS": "",
            }
          validation: "Both env vars empty"
      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureOrgInMint with valid URL and first org"
          command: "p.EnsureOrgInMint(context.Background(), expectedURL, \"first-org\")"
          validation: "Returns nil error"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "No error returned"
        condition: "err == nil"
        failure_impact: "First enrollment is blocked; mint setup workflow broken"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Org was registered in ALLOWED_ORGS"
        condition: "UpdateServiceEnvVars called with ALLOWED_ORGS containing 'first-org'"
        failure_impact: "Enrollment appears to succeed but org not registered"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  - scenario_id: 3
    test_id: "TS-GH-2433-003"
    test_type: "unit"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2433"
    coverage_status: "NEW"

    test_objective:
      title: "Verify guard is bypassed when ALLOWED_ORGS has existing orgs"
      what: |
        Tests that when ALLOWED_ORGS is non-empty (existing orgs are enrolled),
        the data consistency guard does not fire, regardless of ROLE_APP_IDS state.
        The guard only activates when ALLOWED_ORGS is completely empty.
      why: |
        The guard is a defense-in-depth measure for the "completely empty" case.
        When ALLOWED_ORGS has data, normal enrollment merging logic applies.
        False positives would block legitimate enrollment operations.
      acceptance_criteria:
        - "EnsureOrgInMint returns nil error when ALLOWED_ORGS is populated"
        - "Enrollment proceeds normally (merge or no-op)"

    variables:
      closure_scope:
        - name: "fake"
          type: "*fakeGCFClient"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Fake with populated ALLOWED_ORGS"
        - name: "p"
          type: "*Provisioner"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Provisioner under test"

    test_structure:
      type: "single"
      function_name: "TestEnsureOrgInMint_PopulatedAllowedOrgs_BypassesGuard"
      package: "gcf"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fakeGCFClient with non-empty ALLOWED_ORGS and role-only ROLE_APP_IDS"
          command: |
            fake.trafficEnvVars = map[string]string{
              "ALLOWED_ORGS": "existing-org",
              "ROLE_APP_IDS": `{"agent":"app-id-1"}`,
            }
          validation: "ALLOWED_ORGS is populated"
      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureOrgInMint with new org"
          command: "p.EnsureOrgInMint(context.Background(), expectedURL, \"new-org\")"
          validation: "Returns nil error"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "No error returned — guard did not fire"
        condition: "err == nil"
        failure_impact: "Guard fires false positive; blocks legitimate enrollment"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "ALLOWED_ORGS contains both existing and new org"
        condition: "Updated ALLOWED_ORGS contains 'existing-org' and 'new-org'"
        failure_impact: "Existing org lost during merge"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  - scenario_id: 4
    test_id: "TS-GH-2433-004"
    test_type: "unit"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2433"
    coverage_status: "NEW"

    test_objective:
      title: "Verify guard ignores org/role keys (containing '/') and only evaluates role-only keys"
      what: |
        Tests that legacy org-scoped keys in ROLE_APP_IDS (keys containing "/" like
        "org-name/agent") are filtered out by mintcore.RoleOnlyAppIDs before the guard
        evaluates the map. Only role-only keys (without "/") should trigger the guard.
      why: |
        During migration from org-scoped to role-only ROLE_APP_IDS, legacy keys may
        still exist. The guard should not produce false positives when only legacy
        keys are present, as these do not indicate active role enrollments.
      acceptance_criteria:
        - "Guard does not fire when ROLE_APP_IDS has only legacy org/role keys"
        - "Guard fires when ROLE_APP_IDS has mix of legacy and role-only keys"

    variables:
      closure_scope:
        - name: "fake"
          type: "*fakeGCFClient"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Fake with legacy org/role keys in ROLE_APP_IDS"
        - name: "p"
          type: "*Provisioner"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Provisioner under test"

    test_structure:
      type: "table-driven"
      function_name: "TestEnsureOrgInMint_LegacyKeys_Filtering"
      package: "gcf"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fakeGCFClient with empty ALLOWED_ORGS and legacy-only ROLE_APP_IDS"
          command: |
            fake.trafficEnvVars = map[string]string{
              "ALLOWED_ORGS": "",
              "ROLE_APP_IDS": `{"org1/agent":"app-1","org2/reviewer":"app-2"}`,
            }
          validation: "Only legacy keys present (all contain '/')"
      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureOrgInMint — expect success (legacy keys filtered out)"
          command: "p.EnsureOrgInMint(context.Background(), expectedURL, \"new-org\")"
          validation: "Returns nil error — guard not triggered"
        - step_id: "TEST-02"
          action: "Reconfigure with mix of legacy and role-only keys, call again"
          command: |
            fake.trafficEnvVars["ROLE_APP_IDS"] = `{"org1/agent":"app-1","reviewer":"app-2"}`
            p.EnsureOrgInMint(context.Background(), expectedURL, "new-org")
          validation: "Returns error — role-only key 'reviewer' triggers guard"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Legacy-only keys do not trigger guard"
        condition: "err == nil for legacy-only ROLE_APP_IDS"
        failure_impact: "False positive blocks enrollment for orgs with only legacy keys"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Mixed keys with role-only entries trigger guard"
        condition: "err != nil and contains 'data inconsistency'"
        failure_impact: "Guard misses data inconsistency when legacy keys are present"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  - scenario_id: 5
    test_id: "TS-GH-2433-005"
    test_type: "unit"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2433"
    coverage_status: "NEW"

    test_objective:
      title: "Verify error contains role count, project ID, and suggested mint status command"
      what: |
        Tests that the error message produced by the data consistency guard contains
        sufficient diagnostic information: the number of role-only entries found,
        the project ID, and the suggested command ('fullsend mint status --project=')
        for the operator to investigate.
      why: |
        Operators encountering this error need actionable information to diagnose
        and resolve the issue without escalation. The error message is the primary
        communication channel for this guard.
      acceptance_criteria:
        - "Error message contains count of role-only entries"
        - "Error message contains project ID"
        - "Error message contains 'fullsend mint status --project='"

    variables:
      closure_scope:
        - name: "fake"
          type: "*fakeGCFClient"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Fake triggering the guard"
        - name: "p"
          type: "*Provisioner"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Provisioner with ProjectID 'proj1'"

    test_structure:
      type: "single"
      function_name: "TestEnsureOrgInMint_DataInconsistencyGuard_ErrorMessageContent"
      package: "gcf"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fakeGCFClient triggering guard with 2 role-only entries"
          command: |
            fake.trafficEnvVars = map[string]string{
              "ALLOWED_ORGS": "",
              "ROLE_APP_IDS": `{"agent":"app-1","reviewer":"app-2"}`,
            }
          validation: "Guard will fire with 2 role-only entries"
        - step_id: "SETUP-02"
          action: "Create Provisioner with ProjectID 'proj1'"
          command: "&Provisioner{gcpAPI: fake, cfg: ProvisionConfig{ProjectID: \"proj1\"}}"
          validation: "ProjectID set"
      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureOrgInMint and capture error"
          command: "err := p.EnsureOrgInMint(context.Background(), expectedURL, \"new-org\")"
          validation: "Error returned"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Error contains role count"
        condition: "assert.Contains(t, err.Error(), \"2 configured roles\")"
        failure_impact: "Operator cannot determine scope of data inconsistency"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Error contains project ID"
        condition: "assert.Contains(t, err.Error(), \"proj1\")"
        failure_impact: "Operator cannot identify which project is affected"
      - assertion_id: "ASSERT-03"
        priority: "P1"
        description: "Error contains suggested command"
        condition: "assert.Contains(t, err.Error(), \"fullsend mint status --project=\")"
        failure_impact: "Operator has no guidance on next steps"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  - scenario_id: 6
    test_id: "TS-GH-2433-006"
    test_type: "unit"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2433"
    coverage_status: "NEW"

    test_objective:
      title: "Verify guard does not trigger on malformed JSON, nil map, or missing ROLE_APP_IDS key"
      what: |
        Tests edge cases where ROLE_APP_IDS is malformed (invalid JSON), nil (key
        absent from env vars), or the key is missing entirely. In all these cases,
        the guard should silently skip (not trigger), allowing enrollment to proceed.
        This is by design to avoid blocking enrollment on unrelated data corruption.
      why: |
        The guard must be resilient to edge cases. Blocking enrollment due to
        unrelated ROLE_APP_IDS corruption would cause more harm than the data
        inconsistency it prevents. The guard targets a specific failure mode
        (stale read), not general data corruption.
      acceptance_criteria:
        - "Malformed JSON in ROLE_APP_IDS does not trigger guard"
        - "Missing ROLE_APP_IDS key does not trigger guard"
        - "Nil trafficEnvVars map for ROLE_APP_IDS does not trigger guard"

    variables:
      closure_scope:
        - name: "fake"
          type: "*fakeGCFClient"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Fake with edge-case ROLE_APP_IDS values"
        - name: "p"
          type: "*Provisioner"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Provisioner under test"

    test_structure:
      type: "table-driven"
      function_name: "TestEnsureOrgInMint_RoleAppIDs_EdgeCases"
      package: "gcf"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Define table of edge cases"
          command: |
            testCases := []struct{
              name string
              roleAppIDs string
            }{
              {"malformed JSON", "{not-valid-json}"},
              {"empty string", ""},
              {"missing key (not in map)", "<key absent>"},
              {"empty object", "{}"},
            }
          validation: "Table covers all edge cases"
      test_execution:
        - step_id: "TEST-01"
          action: "For each case, set trafficEnvVars and call EnsureOrgInMint"
          command: "p.EnsureOrgInMint(context.Background(), expectedURL, \"new-org\")"
          validation: "Each case returns nil error"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Malformed JSON does not trigger guard"
        condition: "err == nil for malformed JSON case"
        failure_impact: "Unrelated JSON corruption blocks enrollment"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Missing ROLE_APP_IDS key does not trigger guard"
        condition: "err == nil for missing key case"
        failure_impact: "First-time deployment without ROLE_APP_IDS blocks enrollment"
      - assertion_id: "ASSERT-03"
        priority: "P1"
        description: "Empty object does not trigger guard"
        condition: "err == nil for '{}' case"
        failure_impact: "Empty but valid ROLE_APP_IDS blocks enrollment"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  - scenario_id: 7
    test_id: "TS-GH-2433-007"
    test_type: "unit"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2433"
    coverage_status: "NEW"

    test_objective:
      title: "Verify enrollment proceeds when ROLE_APP_IDS is '{}' (empty object, no roles configured)"
      what: |
        Tests that when ROLE_APP_IDS contains a valid but empty JSON object "{}",
        the guard does not fire. An empty object means no roles are configured,
        which is semantically equivalent to the first-enrollment case.
      why: |
        Distinguishes between "no roles configured" (empty object) and "roles
        configured but orgs lost" (populated object). The guard should only fire
        in the latter case.
      acceptance_criteria:
        - "EnsureOrgInMint returns nil error"
        - "Enrollment proceeds normally"

    variables:
      closure_scope:
        - name: "fake"
          type: "*fakeGCFClient"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Fake with empty JSON object ROLE_APP_IDS"
        - name: "p"
          type: "*Provisioner"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Provisioner under test"

    test_structure:
      type: "single"
      function_name: "TestEnsureOrgInMint_EmptyRoleAppIDsObject_Proceeds"
      package: "gcf"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fakeGCFClient with empty ALLOWED_ORGS and empty ROLE_APP_IDS object"
          command: |
            fake.trafficEnvVars = map[string]string{
              "ALLOWED_ORGS": "",
              "ROLE_APP_IDS": "{}",
            }
          validation: "ROLE_APP_IDS is valid but empty JSON object"
      test_execution:
        - step_id: "TEST-01"
          action: "Call EnsureOrgInMint"
          command: "p.EnsureOrgInMint(context.Background(), expectedURL, \"new-org\")"
          validation: "Returns nil error"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "No error returned"
        condition: "err == nil"
        failure_impact: "Empty ROLE_APP_IDS incorrectly treated as data inconsistency"

    dependencies:
      kubernetes_resources: []
      external_tools: []
      scenario_specific_rbac: []

  - scenario_id: 8
    test_id: "TS-GH-2433-008"
    test_type: "unit"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2433"
    coverage_status: "NEW"

    test_objective:
      title: "Verify provisionWithExistingMint and provisionSelfManaged call EnsureOrgInMint and propagate guard errors"
      what: |
        Tests that both provisioning flows (provisionWithExistingMint and
        provisionSelfManaged) invoke EnsureOrgInMint for each configured org,
        and that guard errors are properly propagated to the caller rather
        than being silently swallowed.
      why: |
        The guard is useless if the provisioning flows don't call it or
        swallow its errors. Both flows must propagate guard errors so that
        the CLI can surface them to the operator.
      acceptance_criteria:
        - "provisionWithExistingMint calls EnsureOrgInMint for each org"
        - "provisionSelfManaged calls EnsureOrgInMint for each org"
        - "Guard errors from EnsureOrgInMint propagate to the provision caller"

    variables:
      closure_scope:
        - name: "fake"
          type: "*fakeGCFClient"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Fake configured to trigger guard"
        - name: "p"
          type: "*Provisioner"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Provisioner with multi-org config"

    test_structure:
      type: "table-driven"
      function_name: "TestProvisionFlows_PropagateGuardError"
      package: "gcf"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fakeGCFClient that triggers the data inconsistency guard"
          command: |
            fake.trafficEnvVars = map[string]string{
              "ALLOWED_ORGS": "",
              "ROLE_APP_IDS": `{"agent":"app-1"}`,
