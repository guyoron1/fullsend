      type: env_var_json
      yaml: '{"coder": "app-id-123"}

        '
  test_steps:
    setup:
    - step_id: SETUP-01
      action: Create fakeGCFClient with empty ALLOWED_ORGS, role-only ROLE_APP_IDS, and write tracking
      command: 'client = newFakeGCFClient(envVars{allowedOrgs: "", roleAppIDs: ''{"coder":"id1"}''})'
      validation: Client created with zero write count
    test_execution:
    - step_id: TEST-01
      action: Call EnsureOrgInMint
      command: err = EnsureOrgInMint(ctx, client, "new-org", "project-id")
      validation: Function returns error
    cleanup: []
  assertions:
  - assertion_id: ASSERT-01
    priority: P0
    description: No env var update calls were made
    condition: client.updateEnvVarsCalls == 0
    failure_impact: Data loss — existing orgs silently unenrolled
  - assertion_id: ASSERT-02
    priority: P0
    description: ALLOWED_ORGS unchanged
    condition: client.envVars[ALLOWED_ORGS] == ""
    failure_impact: Guard failed to prevent data corruption
