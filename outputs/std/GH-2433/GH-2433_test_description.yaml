  - scenario_id: 10
    test_id: "TS-GH-2433-010"
    test_type: "functional"
    priority: "P2"
    mvp: false
    requirement_id: "GH-2433"
    coverage_status: "NEW"

    test_objective:
      title: "Verify guard fires correctly when concurrent enrollments encounter stale ALLOWED_ORGS"
      what: |
        Tests the guard behavior under concurrent enrollment scenarios. When multiple
        goroutines call EnsureOrgInMint simultaneously and one encounters a stale read
        with empty ALLOWED_ORGS (while ROLE_APP_IDS has entries), the guard should
        fire for that goroutine independently of others.
      why: |
        The EnsureOrgInMint read-modify-write pattern has documented concurrency
        limitations. The guard should still detect data inconsistency correctly
        even when concurrent enrollments are happening, preventing at least the
        "complete wipe" scenario.
      acceptance_criteria:
        - "Guard fires independently per goroutine when stale data is encountered"
        - "Non-stale goroutines proceed normally"

    variables:
      closure_scope:
        - name: "fake"
          type: "*fakeGCFClient"
          initialized_in: "test function"
          used_in: ["test function"]
          comment: "Fake simulating concurrent access with stale reads"

    test_structure:
      type: "single"
      function_name: "TestEnsureOrgInMint_ConcurrentEnrollment_GuardPerGoroutine"
      package: "gcf"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create fakeGCFClient that returns stale (empty) ALLOWED_ORGS for some calls"
          command: "Configure fake with conditional trafficEnvVars responses"
          validation: "Fake simulates stale read scenario"
      test_execution:
        - step_id: "TEST-01"
          action: "Launch concurrent EnsureOrgInMint calls"
          command: "Use sync.WaitGroup with multiple goroutines calling EnsureOrgInMint"
          validation: "Goroutines with stale data return error; others succeed"
      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "Stale-read goroutine receives guard error"
        condition: "Error from stale goroutine contains 'data inconsistency'"
        failure_impact: "Guard fails under concurrency; race condition masks data loss"
      - assertion_id: "ASSERT-02"
        priority: "P2"
        description: "Non-stale goroutines succeed"
        condition: "err == nil for goroutines with populated ALLOWED_ORGS"
        failure_impact: "Guard causes false positives under concurrency"

