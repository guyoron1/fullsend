  test_objective:
    title: Verify no env var write occurs on data inconsistency
    what: 'Tests that when the data consistency guard triggers, EnsureOrgInMint

      does not write any env vars. The function must return the error before

      reaching the ALLOWED_ORGS write path.

      '
    why: 'If the guard detects data inconsistency but still writes ALLOWED_ORGS

      with only the new org, it would silently unenroll all existing orgs.

      The guard must prevent any writes.

      '
    acceptance_criteria:
    - No UpdateEnvVars call made on the GCF client
    - ALLOWED_ORGS remains empty after the call
  classification:
    test_type: Tier 1
    scope: Single-component
