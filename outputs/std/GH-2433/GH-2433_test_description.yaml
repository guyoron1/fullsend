  test_structure:
    type: single
    function_name: TestEnsureOrgInMint_DataInconsistency_ReturnsError
    subtest: false
  test_objective:
    title: Verify guard returns error when ALLOWED_ORGS empty with role-only entries
    what: 'Tests that EnsureOrgInMint returns an error when ALLOWED_ORGS is empty

      but ROLE_APP_IDS contains role-only entries, indicating the mint has been

      bootstrapped and the empty ALLOWED_ORGS represents data loss.

      '
    why: 'This is the core guard logic. Without this check, a stale Cloud Run revision

      read could silently clobber ALLOWED_ORGS, unenrolling all existing orgs.

      This was the original bug in GH-1842 that was accidentally regressed by PR #2331.

      '
    acceptance_criteria:
    - EnsureOrgInMint returns a non-nil error
    - Error message indicates data inconsistency
    - No env var writes occur (ALLOWED_ORGS not modified)
