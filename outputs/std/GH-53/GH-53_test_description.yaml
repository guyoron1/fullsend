      title: "OutputPipeline in run.go continues to function after security package changes"
      what: |
        Regression test validating that the existing OutputPipeline usage in
        run.go continues to work correctly after the security package changes
        introduced by this fix. OutputPipeline is a stateless factory so no
        behavioral changes are expected.
      why: |
        Although OutputPipeline() is stateless, any refactoring of the security
        package could inadvertently break existing consumers. This regression
        test verifies the run.go consumer is unaffected.
