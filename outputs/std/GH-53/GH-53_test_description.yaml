  - scenario_id: "001"
    test_id: "TS-GH-53-001"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "REQ-001"

    test_objective:
      title: "Review body containing a GitHub PAT (ghp_*) is redacted"
      what: |
        Validates that when a review body contains a GitHub Personal Access Token
        (matching the ghp_* pattern), the OutputPipeline.Scan() function detects
        and redacts the secret before the body is posted to the forge API.
      why: |
        Leaked secrets in PR review comments are a critical security vulnerability.
        The OutputPipeline must intercept and redact any token patterns before
        content reaches the GitHub API to prevent credential exposure.
      acceptance_criteria:
        - "Review body with ghp_* token is passed through OutputPipeline.Scan()"
        - "The returned body contains a redaction marker instead of the raw token"
        - "No ghp_* pattern remains in the sanitized output"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go unit test with testify"

    variables:
      closure_scope:
        - name: "t"
          type: "*testing.T"
          initialized_in: "test function parameter"
          used_in: ["assert", "require"]
          comment: "Test context"
        - name: "pipeline"
          type: "security.Pipeline"
          initialized_in: "test body"
          used_in: ["Scan call"]
          comment: "OutputPipeline instance"
        - name: "result"
          type: "string"
          initialized_in: "test body"
          used_in: ["assertion"]
          comment: "Sanitized review body"

    test_structure:
      type: "single"
      function_name: "TestSanitizeReviewResult_RedactsGitHubPAT"
      subtest: false

    code_structure: |
      func TestSanitizeReviewResult_RedactsGitHubPAT(t *testing.T) {
        // Arrange: create review result with ghp_ token in body
        // Act: call sanitizeReviewResult
        // Assert: body no longer contains ghp_ token
      }

    specific_preconditions: []

    test_data:
      inputs:
        - name: "review_body_with_pat"
          value: "Found issue: token ghp_ABCDEFghijklmnop1234567890abcdef12345678 was exposed"
      expected:
        - name: "redacted_body"
          condition: "Must not contain any ghp_* pattern"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create a ReviewResult with a GitHub PAT embedded in the body"
          command: "Construct ReviewResult struct with Body containing ghp_* token"
          validation: "ReviewResult.Body contains the raw token"

      test_execution:
        - step_id: "TEST-01"
          action: "Call sanitizeReviewResult on the ReviewResult"
          command: "sanitizeReviewResult(&reviewResult)"
          validation: "Function returns without error"

        - step_id: "TEST-02"
          action: "Inspect the sanitized body"
          command: "Check reviewResult.Body"
          validation: "Body does not contain ghp_* pattern"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "GitHub PAT (ghp_*) is redacted from review body"
        condition: "strings.Contains(result.Body, 'ghp_') == false"
        failure_impact: "Secret token would be posted to GitHub PR review, causing credential leak"

