  - scenario_id: "020"
    test_id: "TS-GH-53-020"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "REQ-001"

    test_objective:
      title: "OutputPipeline.Scan() error prevents review from being posted to forge"
      what: |
        Validates that when OutputPipeline.Scan() returns an error, the review
        is NOT posted to the forge API. The error must propagate up and halt
        the review submission flow.
      why: |
        If the sanitization pipeline fails, posting the review could expose
        unsanitized secrets. Fail-closed behavior is essential — a pipeline
        error must block the forge API call entirely.
      acceptance_criteria:
        - "Scan() error causes sanitizeReviewResult to return error"
        - "Review is not submitted to forge when Scan() fails"
        - "Error message is propagated to caller"

    classification:
