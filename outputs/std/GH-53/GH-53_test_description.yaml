  - scenario_id: "006"
    test_id: "TS-GH-53-006"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "REQ-004"

    test_objective:
      title: "Secret obfuscated with zero-width Unicode chars is detected and redacted"
      what: |
        Validates that the UnicodeNormalizer stage of the OutputPipeline strips
        zero-width Unicode characters (U+200B, U+200C, U+200D, U+FEFF) before
        the SecretRedactor stage runs pattern matching. This prevents attackers
        from bypassing secret detection by inserting invisible characters.
      why: |
        Zero-width character insertion is a known obfuscation technique to bypass
        regex-based secret scanning. The pipeline must normalize Unicode first,
        then scan for secrets, to close this evasion vector.
      acceptance_criteria:
        - "Token with zero-width chars inserted between characters is still detected"
        - "Zero-width characters are stripped before pattern matching"
        - "Obfuscated token is redacted in output"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go unit test with testify"

    variables:
      closure_scope:
        - name: "t"
          type: "*testing.T"
          initialized_in: "test function parameter"
          used_in: ["assert", "require"]
          comment: "Test context"

    test_structure:
      type: "single"
      function_name: "TestSanitizeReviewResult_ZeroWidthObfuscatedSecret"
      subtest: false

    code_structure: |
      func TestSanitizeReviewResult_ZeroWidthObfuscatedSecret(t *testing.T) {
        // Arrange: create review body with ghp_ token containing zero-width chars
        // Act: call sanitizeReviewResult
        // Assert: obfuscated token is detected and redacted
      }

    specific_preconditions: []

    test_data:
      inputs:
        - name: "obfuscated_token"
          value: "Token: g\u200Bh\u200Bp\u200B_ABCDEFghijklmnop1234567890abcdef12345678"
          note: "Zero-width spaces (U+200B) inserted between ghp_ prefix characters"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create ReviewResult with zero-width obfuscated token in body"
          command: "Construct body with ghp_ token containing U+200B between characters"
          validation: "Body contains obfuscated token"

      test_execution:
        - step_id: "TEST-01"
          action: "Call sanitizeReviewResult"
          command: "sanitizeReviewResult(&reviewResult)"
          validation: "No error"

        - step_id: "TEST-02"
          action: "Verify obfuscated token is redacted"
          command: "assert.NotContains(t, reviewResult.Body, 'ghp_')"
          validation: "Neither the raw nor obfuscated token pattern appears"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Zero-width obfuscated secret is detected and redacted"
        condition: "!strings.Contains(result.Body, 'ghp_') && !strings.Contains(result.Body, '\\u200B')"
        failure_impact: "Attackers could bypass secret detection with zero-width character insertion"

