            #!/bin/bash
            STATE_FILE="$TMPDIR/openshell_create_count"
            if [[ "$1" == "provider" && "$2" == "create" ]]; then
              COUNT=$(cat "$STATE_FILE" 2>/dev/null || echo 0)
              if [ "$COUNT" -gt 0 ]; then
                echo "Error: AlreadyExists" >&2
                exit 1
              fi
              echo $((COUNT + 1)) > "$STATE_FILE"
              exit 0
            elif [[ "$1" == "provider" && "$2" == "delete" ]]; then
              echo 0 > "$STATE_FILE"
              exit 0
            fi

