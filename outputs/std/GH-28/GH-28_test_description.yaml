            if [[ "$1" == "provider" && "$2" == "create" ]]; then
              if [ ! -f "$STATE_FILE" ]; then
                touch "$STATE_FILE"
                echo "Error: AlreadyExists: provider already exists" >&2
                exit 1
              else
                exit 0
              fi
            elif [[ "$1" == "provider" && "$2" == "delete" ]]; then
