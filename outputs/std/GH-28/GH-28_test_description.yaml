          yaml: |
            #!/bin/bash
            if [[ "$1" == "provider" && "$2" == "create" ]]; then
              if [ -f "$TMPDIR/first_call" ]; then
                echo "$@" > "$TMPDIR/recreate_args"
                exit 0
              else
                touch "$TMPDIR/first_call"
                echo "Error: AlreadyExists"
                exit 1
              fi
            elif [[ "$1" == "provider" && "$2" == "delete" ]]; then
              exit 0
            fi

