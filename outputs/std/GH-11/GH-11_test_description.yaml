scenarios:
  - scenario_id: 1
    test_id: "TS-GH-11-001"
    title: "GetProjectNumber succeeds without quota project header"
    tier: "Tier 1"
    priority: "P0"
    requirement_id: "GH-11"
    mvp: true

    patterns:
      primary: "unit-test-mock-server"
      helpers_required:
        - "httptest"
        - "testify"

    variables:
      closure_scope: []

    test_structure:
      style: "func TestX(t *testing.T)"
      subtest: false

    code_structure:
      template: "func TestGetProjectNumber_SuccessWithoutQuotaHeader(t *testing.T) { ... }"

    test_objective:
      what: |
        Verify that GetProjectNumber successfully retrieves a project number from the
        GCP Cloud Resource Manager API when the quota project header is omitted. The
        method should create a copy of the gcp.Client with QuotaProject cleared to
        avoid requiring the cloudresourcemanager API to be enabled on the target project.
      why: |
        This is the core behavioral change of GH-11. Customers deploying FullSend with
        self-managed GCP infrastructure should not need to enable the Cloud Resource
        Manager API on their target project.
      acceptance_criteria:
        - "GetProjectNumber returns the correct project number string"
        - "The request to CRM API does not include x-goog-user-project header"
        - "No error is returned for a valid project ID"

    classification:
      test_type: "Functional API Test"
      layer: "Layer 3 - Specification by Example"
      methodology: "Example-Based Testing"
      scope: "Single-component"
      automation_approach: "Go test with httptest"

    preconditions:
      specific:
        - name: "Mock CRM API server"
          requirement: "httptest server returning 200 with valid projectNumber JSON"
          validation: "Server responds to GET /v1/projects/{projectID}"

    test_data:
      mock_crm_response:
        status_code: 200
        body:
          projectNumber: "123456789"
      test_project_id: "my-project"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server that returns 200 with projectNumber JSON and captures request headers"
          command: "httptest.NewServer with handler returning {\"projectNumber\": \"123456789\"}"
          validation: "Server is listening"

        - step_id: "SETUP-02"
          action: "Create test LiveGCFClient routed to mock server"
          command: "newTestClient(srv)"
          validation: "Client created successfully"

      test_execution:
        - step_id: "TEST-01"
          action: "Call GetProjectNumber with valid project ID"
          command: "client.GetProjectNumber(ctx, \"my-project\")"
          store_as: "project_number"
          validation: "No error returned"

        - step_id: "TEST-02"
          action: "Assert returned project number matches expected value"
          command: "assert.Equal(t, \"123456789\", project_number)"
          validation: "Project number equals \"123456789\""

        - step_id: "TEST-03"
          action: "Assert request did not include x-goog-user-project header"
          command: "assert.Empty(t, capturedHeaders.Get(\"x-goog-user-project\"))"
          validation: "Header is absent from the request"

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close mock server"
          command: "srv.Close()"

    assertions:
      - assertion_id: "ASSERT-001-01"
        priority: "P0"
        category: "Feature Behavior"
        description: "GetProjectNumber returns correct project number without error"
        condition: "err == nil && projectNumber == \"123456789\""
        failure_message: "GetProjectNumber failed or returned incorrect project number"
        failure_impact: "Core functionality of quota project removal is broken"

      - assertion_id: "ASSERT-001-02"
        priority: "P0"
        category: "API Request"
        description: "Request to CRM API omits x-goog-user-project header"
        condition: "request.Header.Get(\"x-goog-user-project\") == \"\""
        failure_message: "Quota project header was sent despite being cleared"
        failure_impact: "Fix is ineffective — cloudresourcemanager API still required on target project"

    edge_cases:
      - case_id: "EDGE-001-01"
        scenario: "Project ID contains special characters requiring URL escaping"
        expected_behavior: "Project ID is URL-escaped in the request path"
        test_coverage: "Separate test case recommended"

    traceability:
      stp_reference:
