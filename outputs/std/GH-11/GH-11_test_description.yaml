  - scenario_id: 7
    test_id: "TS-GH-11-007"
    title: "Client value copy does not share mutable QuotaProject state"
    tier: "Tier 1"
    priority: "P1"
    requirement_id: "GH-11"
    mvp: false

    patterns:
      primary: "unit-test-mock-server"
      helpers_required:
        - "httptest"
        - "testify"
        - "sync"

    variables:
      closure_scope: []

    test_structure:
      style: "func TestX(t *testing.T)"
      subtest: false

    code_structure:
      template: "func TestGetProjectNumber_ConcurrentClientIsolation(t *testing.T) { ... }"

    test_objective:
      what: |
        Verify that the value copy of gcp.Client used in GetProjectNumber creates an
        independent copy of the QuotaProject field, and that concurrent calls to
        GetProjectNumber with isolated clients do not interfere with each other.
      why: |
        The value copy mechanism (`noQuotaClient := *c.Client`) must correctly isolate
        the QuotaProject field. While the shared *http.Client pointer is acceptable
        (read-only usage), the QuotaProject string must be fully independent.
      acceptance_criteria:
        - "Concurrent GetProjectNumber calls succeed without races"
        - "Each call uses an independent client copy"
        - "Original client state unchanged after concurrent calls"

    classification:
