          file: "internal/dispatch/gcf/gcp_test.go"
          test_function: "TestLiveGCFClient_GetProjectNumber/success"
          coverage: "Basic success path without header verification"

  - scenario_id: 2
    test_id: "TS-GH-11-002"
    title: "Original gcp.Client is not mutated after GetProjectNumber call"
    tier: "Tier 1"
    priority: "P0"
    requirement_id: "GH-11"
    mvp: true

    patterns:
      primary: "unit-test-mock-server"
      helpers_required:
        - "httptest"
        - "testify"

    variables:
      closure_scope: []

    test_structure:
      style: "func TestX(t *testing.T)"
      subtest: false

    code_structure:
      template: "func TestGetProjectNumber_OriginalClientNotMutated(t *testing.T) { ... }"

    test_objective:
      what: |
        Verify that the original gcp.Client instance is not modified after calling
        GetProjectNumber. The method creates a value copy of *c.Client and clears
        QuotaProject on the copy only.
      why: |
        Client isolation is critical to prevent side effects. If the original client
        is mutated, subsequent API calls from the same client could behave unexpectedly,
        potentially breaking other GCP operations in the provisioning workflow.
      acceptance_criteria:
        - "Original client QuotaProject field is unchanged after GetProjectNumber call"
        - "Original client httpClient pointer is unchanged"
        - "Original client tokenFunc is unchanged"

    classification:
      test_type: "Functional API Test"
      layer: "Layer 3 - Specification by Example"
      methodology: "Example-Based Testing"
      scope: "Single-component"
      automation_approach: "Go test with httptest"

    preconditions:
      specific:
        - name: "LiveGCFClient with known QuotaProject value"
          requirement: "Client with QuotaProject set to a non-empty value"
          validation: "client.Client.QuotaProject != \"\""

    test_data:
      original_quota_project: "original-project-id"
      mock_crm_response:
        status_code: 200
        body:
          projectNumber: "123456789"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create httptest server returning valid project number"
          command: "httptest.NewServer returning 200 with projectNumber"
          validation: "Server is listening"

        - step_id: "SETUP-02"
          action: "Create LiveGCFClient with QuotaProject set to known value"
          command: "client := newTestClient(srv); client.Client.QuotaProject = \"original-project-id\""
          validation: "QuotaProject equals \"original-project-id\""

      test_execution:
        - step_id: "TEST-01"
          action: "Call GetProjectNumber on the client"
          command: "client.GetProjectNumber(ctx, \"test-project\")"
          validation: "Call completes without error"

        - step_id: "TEST-02"
          action: "Assert original client QuotaProject is unchanged"
          command: "assert.Equal(t, \"original-project-id\", client.Client.QuotaProject)"
          validation: "QuotaProject field matches original value"

      cleanup:
        - step_id: "CLEANUP-01"
          action: "Close mock server"
          command: "srv.Close()"

    assertions:
      - assertion_id: "ASSERT-002-01"
        priority: "P0"
        category: "State Validation"
        description: "Original client QuotaProject unchanged after GetProjectNumber"
        condition: "client.Client.QuotaProject == \"original-project-id\""
        failure_message: "GetProjectNumber mutated the original client's QuotaProject field"
        failure_impact: "Client state corruption could affect subsequent GCP API calls"

    edge_cases:
      - case_id: "EDGE-002-01"
        scenario: "Multiple sequential GetProjectNumber calls from same client"
        expected_behavior: "Original client remains unmodified after each call"
        test_coverage: "Covered in TS-GH-11-007"

    traceability:
      stp_reference:
        document: "GH-11 Software Test Plan v1"
        section: "III. Requirements-to-Tests Mapping"
        rows: [2]
        scenario: "Verify original client unmodified after lookup"
      requirements:
        - requirement_id: "GH-11"
          requirement_type: "Bug Fix"
          url: "https://github.com/guyoron1/fullsend/pull/11"
          title: "Client copy isolation ensures no mutation of original client state"

