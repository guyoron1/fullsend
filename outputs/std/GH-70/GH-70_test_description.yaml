    test_objective:
      title: "Verify reframe instruction and prohibition against asserting unverified contents"
      what: |
        Validates that the self-check gate includes a reframe instruction for when
        files are unreadable — telling the reviewer to reframe the finding to state
        contents could not be verified, and not to assert unverified contents as fact.
      why: |
        The reframe instruction handles the edge case where a file genuinely cannot
        be read (e.g., in another repo). Without it, the reviewer might still assert
        unverified contents after failing the self-check.
