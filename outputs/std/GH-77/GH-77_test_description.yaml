    code_structure:
      template: "func TestXxx(t *testing.T) { t.Run(name, func(t *testing.T) { ... }) }"

    test_objective:
      title: "Verify no blob or PR created for encoding-only differences"
      what: |
        Tests that when the only difference between remote and expected content
