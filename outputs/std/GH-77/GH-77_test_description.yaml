        behavior_tested: "Tests extract_managed_content behavior, but does not explicitly verify fallback is NOT triggered when sentinel exists"
    test_objective:
      title: "Verify fallback does not trigger when sentinel exists"
      what: |
        Validates that when the remote shim content contains the sentinel line,
        the extract_managed_content function returns non-empty content and the
        fallback full-content comparison path is NOT taken. The comparison uses
        only the managed section (after sentinel) instead of the full file.
      why: |
        If the fallback path were incorrectly triggered for sentinel-containing shims,
        it would compare the full file (including user headers) instead of just the
        managed section, potentially producing false drift for any header changes.
      acceptance_criteria:
        - "extract_managed_content returns non-empty for sentinel-containing input"
        - "Comparison uses managed section only, not full content"
        - "User header changes above sentinel do not trigger drift when sentinel is present"
    classification:
