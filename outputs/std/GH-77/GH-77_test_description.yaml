          initialized_in: "setup"
          used_in: ["test_execution"]
        - name: "stdout"
          type: "bytes.Buffer"
          initialized_in: "test_execution"
          used_in: ["test_execution"]
    test_structure:
      framework: "testing"
      structure: "TestFunction -> t.Run subtests"
    code_structure:
      template: "func TestXxx(t *testing.T) { t.Run(name, func(t *testing.T) { ... }) }"

    test_objective:
      title: "Verify identical content with different trailing newlines not flagged as stale"
      what: |
        Tests that the drift detection logic correctly identifies shim content
        as up-to-date when the remote and expected content are logically identical
        but differ only in trailing newlines (e.g., one trailing \n vs two from
        the GitHub Content API). This is the core regression scenario for issue #2247.
      why: |
        The old managed_content_b64() comparison re-encoded content to base64,
        amplifying trivial trailing newline differences into mismatched base64 strings.
        This caused false-positive "stale" detection, triggering unnecessary update PRs
        for repos that were actually up-to-date.
      acceptance_criteria:
        - "Script stdout contains 'already enrolled (shim up to date)'"
        - "Script stdout does NOT contain 'shim is stale'"
        - "No blob is created (no blob-input JSON file produced)"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test wrapper invoking bash script with mock gh CLI"

    specific_preconditions:
      - name: "Remote shim with extra trailing newline"
        requirement: "Mock gh API returns shim content with an extra trailing newline appended to the template"
        validation: "Decoded remote content equals template content plus one extra newline"

    test_data:
      resource_definitions:
        - name: "shim_template"
          type: "file"
          yaml: |
            # --- fullsend managed below - do not edit ---
            fresh shim template
        - name: "remote_content"
          type: "mock_api_response"
          description: "Same template content but with extra trailing newline, base64-encoded"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create temp directory with config.yaml listing a single enabled repo"
          command: "mktemp -d && create config.yaml with repos.test-repo.enabled=true"
          validation: "Config directory exists with config.yaml"
        - step_id: "SETUP-02"
          action: "Create shim template file with sentinel line"
          command: "Write templates/shim-workflow-call.yaml with sentinel + template content"
          validation: "Template file contains sentinel line"
        - step_id: "SETUP-03"
          action: "Create mock gh binary returning remote content with extra trailing newline"
          command: "Write mock gh script; for contents endpoint, return base64(template + extra \\n)"
          validation: "Mock gh is executable and on PATH"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh with the prepared config directory"
          command: "bash reconcile-repos.sh $CONFIG_DIR"
          validation: "Script exits successfully (exit code 0)"
        - step_id: "TEST-02"
          action: "Check stdout for 'already enrolled' message"
          command: "grep 'already enrolled (shim up to date)' stdout.log"
          validation: "Message found in stdout"
        - step_id: "TEST-03"
          action: "Verify no 'stale' message in stdout"
          command: "! grep 'shim is stale' stdout.log"
          validation: "No stale message present"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary directory"
          command: "rm -rf $TMPDIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Identical content with different trailing newlines is NOT flagged as stale"
        condition: "stdout does not contain 'shim is stale'"
        failure_impact: "False-positive drift detection — the core bug from #2247"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Shim is recognized as up-to-date"
        condition: "stdout contains 'already enrolled (shim up to date)'"
        failure_impact: "Script fails to recognize current shims, may create unnecessary PRs"
      - assertion_id: "ASSERT-03"
        priority: "P0"
        description: "No blob is created for encoding-only differences"
        condition: "No blob-input JSON file exists after script execution"
        failure_impact: "Unnecessary GitHub API calls, wasted resources"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "bash 5.x"
        - "base64 (coreutils)"
        - "jq 1.6+"
      scenario_specific_rbac: []

