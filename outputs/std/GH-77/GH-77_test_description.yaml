    coverage_status: "NEW"
    test_objective:
      title: "Verify mixed line endings handled correctly"
      what: |
        Validates that content with mixed line endings (some lines with CRLF, some with
        LF only) is correctly normalized before comparison. The tr -d '\r' step strips
        all carriage returns regardless of their position, so mixed-ending content that
        is otherwise identical should not trigger false drift.
      why: |
        Real-world Git repositories may have mixed line endings due to editor differences,
        .gitattributes settings, or cross-platform commits. The comparison must handle
        this without false positives.
      acceptance_criteria:
        - "Content with mixed CRLF/LF endings compared against LF-only content reports up-to-date"
        - "Content with mixed endings and genuinely different text is still detected as stale"
