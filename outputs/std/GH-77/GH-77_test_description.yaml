  # Requirement Group 1: Identical content despite encoding differences
  # ============================================================
  - scenario_id: 1
    test_id: "TS-GH77-001"
    test_type: "functional"
    tier: "functional"
    priority: "P0"
    mvp: true
    requirement_id: "GH-77"
    coverage_status: "NEW"
    patterns:
      primary: "drift-detection"
