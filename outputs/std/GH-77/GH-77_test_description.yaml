      scope: "Single-component"
      automation_approach: "Go testing + testify"
    specific_preconditions: []
    test_data:
      resource_definitions: []
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create test environment with mocked gh CLI"
          command: "newReconcileEnv(t)"
          validation: "Environment created with mock binaries"
      test_execution:
        - step_id: "TEST-01"
          action: "Call extract_managed_content with input containing sentinel"
          command: "echo 'header\\n{SENTINEL}\\nmanaged content' | extract_managed_content"
          validation: "Returns non-empty string starting with sentinel"
          source_constant_ref: "SENTINEL"
        - step_id: "TEST-02"
          action: "Set remote content with sentinel + matching managed section but different header"
          command: "env.setRemoteContent(differentHeaderSameManaged)"
          validation: "Remote content set successfully"
        - step_id: "TEST-03"
          action: "Run reconcile script"
          command: "env.run()"
          validation: "Script reports 'already enrolled (shim up to date)'"
      cleanup: []
    assertions:
