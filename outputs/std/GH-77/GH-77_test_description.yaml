    test_objective:
      title: "Verify non-comment YAML above sentinel rejected"
      what: |
        Tests that the content-injection guard rejects non-comment YAML content
        (e.g., 'name: injected-workflow') placed above the sentinel line. The
        guard must strip such content and emit a warning, preventing injection of
        arbitrary YAML keys into the workflow file.
      why: |
        Without the injection guard, an attacker could add YAML keys above the
        sentinel that would be preserved during updates, potentially hijacking
        the workflow. The guard ensures only YAML comments are kept above the sentinel.
      acceptance_criteria:
        - "Injected YAML not present in the updated blob"
        - "Warning log emitted: 'non-comment content above sentinel was rejected'"
        - "Blob still contains sentinel and fresh template"

