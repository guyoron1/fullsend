      structure: "TestFunction -> t.Run subtests"
    code_structure:
      template: "func TestXxx(t *testing.T) { t.Run(name, func(t *testing.T) { ... }) }"

    test_objective:
      title: "Verify stale shim triggers update PR creation"
      what: |
        Tests that when the remote shim's managed content genuinely differs from
        the current template (not just encoding differences), the script correctly
        detects the drift and creates an update PR with the fresh template content.
      why: |
        The fix must not break legitimate stale detection. Repos with outdated
        shim templates must still receive update PRs to stay in sync with the
        current enrollment configuration.
      acceptance_criteria:
        - "stdout contains 'shim is stale'"
        - "A blob is created with the updated template content"
        - "A PR is created (or existing PR is updated)"
        - "UPDATED counter is incremented"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test wrapper invoking bash script with mock gh CLI"

    specific_preconditions:
      - name: "Remote shim with genuinely different managed content"
        requirement: "Mock gh returns shim with 'stale shim template' in managed section instead of 'fresh shim template'"
        validation: "Decoded managed content differs from current template"

    test_data:
      resource_definitions:
        - name: "stale_remote_content"
          type: "mock_api_response"
          description: "Content with sentinel + 'stale shim template' (differs from current 'fresh shim template')"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh returning stale shim content with user header"
          command: "Return content with header + sentinel + 'stale shim template'"
          validation: "Mock configured with stale content"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash reconcile-repos.sh $CONFIG_DIR"
          validation: "Script executes (may exit 0 or non-zero depending on PR creation)"
        - step_id: "TEST-02"
          action: "Verify stale detection"
          command: "grep 'shim is stale' stdout.log"
          validation: "Stale message found"
        - step_id: "TEST-03"
          action: "Verify blob created with fresh content"
          command: "Check blob-input JSON; decode base64 content; verify 'fresh shim template' present"
          validation: "Blob contains updated template"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary directory"
          command: "rm -rf $TMPDIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Genuinely stale shim is detected"
        condition: "stdout contains 'shim is stale'"
        failure_impact: "Stale shims would go undetected, repos would run outdated workflows"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Blob is created with updated template content"
        condition: "blob-input JSON exists and decoded content contains 'fresh shim template'"
        failure_impact: "Update PR would have wrong content"
      - assertion_id: "ASSERT-03"
        priority: "P1"
        description: "User header is preserved in updated blob"
        condition: "Decoded blob content starts with user license header lines"
        failure_impact: "User-owned content above sentinel would be lost on update"

