      what: |
        Tests that YAML comment lines (e.g., license headers like '# Copyright 2026'
        and '# SPDX-License-Identifier: Apache-2.0') placed above the sentinel
        are preserved during a shim update. Only non-comment YAML should be rejected.
      why: |
        Many repos add license headers or documentation comments above the sentinel.
        These must be preserved during updates to maintain compliance and avoid
        unnecessary churn.
      acceptance_criteria:
        - "User comment header present in updated blob"
        - "License and SPDX lines preserved"
        - "Sentinel and fresh template present after header"

