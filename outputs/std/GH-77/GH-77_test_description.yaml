        description: "extract_managed_content returns non-empty for sentinel input"
        condition: "output is not empty and contains sentinel line"
        failure_impact: "Fallback would be incorrectly triggered, comparing full content instead of managed section"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Different header with same managed content is not flagged stale"
        condition: "script output contains 'already enrolled (shim up to date)'"
        failure_impact: "Header-only changes would incorrectly trigger update PRs"
    variables:
