      what: |
        Tests that after the shim template is updated (e.g., new version of the
        workflow call template), repos with the old template are correctly flagged
        as stale even when the sentinel line matches.
      why: |
        Template updates are the primary driver of legitimate shim drift. The managed
        content comparison must catch any change in the template body, not just the
        sentinel presence.
      acceptance_criteria:
        - "Script detects drift when template body differs but sentinel is present"
        - "Update PR is created with new template content"

