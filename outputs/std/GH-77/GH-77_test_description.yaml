    code_structure:
      template: "func TestXxx(t *testing.T) { t.Run(name, func(t *testing.T) { ... }) }"

    test_objective:
      title: "Verify pre-sentinel shim compares full decoded content"
      what: |
        Tests that when the remote shim has no sentinel line (pre-sentinel shim
        from before the header-preservation feature), the script falls back to
        comparing full decoded content instead of extracting managed sections.
      why: |
        Pre-sentinel shims predate the sentinel-based header/managed split. The
        fallback ensures these older shims are still correctly compared and updated
        when the template changes.
      acceptance_criteria:
        - "Pre-sentinel shim with different content is flagged as stale"
        - "Blob created contains sentinel + fresh template (migration to new format)"
        - "Old content is NOT duplicated in the blob"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test wrapper invoking bash script with mock gh CLI"

    specific_preconditions:
      - name: "Remote shim without sentinel line"
        requirement: "Mock returns content without '# --- fullsend managed below - do not edit ---'"
        validation: "Decoded remote content has no sentinel line"

    test_data:
      resource_definitions:
        - name: "pre_sentinel_remote"
          type: "mock_api_response"
          description: "base64('stale shim template\\n') — no sentinel line present"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create mock gh returning pre-sentinel shim content"
          command: "base64 encode 'stale shim template'; configure mock"
          validation: "Mock returns content without sentinel"
      test_execution:
        - step_id: "TEST-01"
          action: "Run reconcile-repos.sh"
          command: "bash reconcile-repos.sh $CONFIG_DIR"
          validation: "Script runs to completion"
        - step_id: "TEST-02"
          action: "Verify stale detection via full content comparison"
          command: "grep 'shim is stale' stdout.log"
          validation: "Stale message found"
        - step_id: "TEST-03"
          action: "Verify blob content has sentinel (migration)"
          command: "Decode blob; grep for sentinel line"
          validation: "Sentinel line present in new blob"
        - step_id: "TEST-04"
          action: "Verify old content not duplicated"
          command: "! grep 'stale shim template' decoded_blob"
          validation: "Old content absent from new blob"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove temporary directory"
          command: "rm -rf $TMPDIR"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Pre-sentinel shim with different content is detected as stale"
        condition: "stdout contains 'shim is stale'"
        failure_impact: "Pre-sentinel shims would never be updated"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Updated blob includes sentinel (migration to new format)"
        condition: "Decoded blob contains '# --- fullsend managed below - do not edit ---'"
        failure_impact: "Migrated shim would lack sentinel, breaking future comparisons"
      - assertion_id: "ASSERT-03"
        priority: "P1"
        description: "Old content not duplicated"
        condition: "Decoded blob does NOT contain 'stale shim template'"
        failure_impact: "Content duplication would produce invalid workflow YAML"

    dependencies:
      kubernetes_resources: []
      external_tools:
        - "bash 5.x"
      scenario_specific_rbac: []

