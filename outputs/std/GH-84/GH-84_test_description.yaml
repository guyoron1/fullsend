  - scenario_id: 8
    test_id: "TS-GH84-008"
    test_type: "functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-84"
    coverage_status: "NEW"

    test_objective:
      title: "Verify error output does not allow GitHub Actions command injection"
      what: |
        When the workflow file blocking logic outputs error messages containing
        file paths from untrusted input (agent commits), those messages must not
        contain unescaped GitHub Actions workflow commands (e.g., ::set-output,
        ::set-env, ::add-path). A malicious agent could craft file paths containing
        workflow commands to escalate privileges via the error output.
      why: |
        GitHub Actions interprets lines matching ::command:: patterns as workflow
        commands. If file paths from agent commits are echoed to stdout/stderr
        without sanitization, an attacker could inject commands like
        ::set-env name=GH_TOKEN::malicious-token to override environment variables
        in the runner context.
      acceptance_criteria:
        - "File paths containing :: sequences are sanitized in error output"
        - "No raw :: workflow command patterns appear in stderr from blocked file paths"
        - "Sanitization uses percent-encoding (%3A%3A) or equivalent escaping"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with shell execution"

    specific_preconditions:
      - name: "Post-code script section 2c reachable"
        requirement: "Workflow file blocking code path with error output"
        validation: "post-code.sh contains section 2c with sed sanitization"

    test_data:
      resource_definitions:
        - name: "malicious_file_path"
          type: "string"
          yaml: |
            changed_files: ".github/workflows/::set-env name=GH_TOKEN::evil"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Prepare changed files input with crafted :: injection payload"
          command: "changedFiles := \".github/workflows/::set-env name=GH_TOKEN::evil\""
          validation: "Input contains :: workflow command injection attempt"

      test_execution:
        - step_id: "TEST-01"
          action: "Execute workflow file detection with malicious file path"
          command: "Run the blocking code path with the crafted input"
          validation: "Block is triggered (file matches .github/workflows/* pattern)"

        - step_id: "TEST-02"
          action: "Capture and inspect stderr output for raw :: sequences"
          command: "Parse stderr output for unescaped :: patterns"
          validation: "No raw :: sequences appear in the error output"

        - step_id: "TEST-03"
          action: "Verify sanitization is applied"
          command: "Check that :: is replaced with %3A%3A or equivalent"
          validation: "Output contains sanitized version of the file path"

      cleanup: []

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Error output does not contain raw :: workflow command patterns"
        condition: "stderr output has no unescaped :: sequences from file paths"
        failure_impact: "Workflow command injection is possible via crafted file paths"

      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "File path is sanitized with percent-encoding"
        condition: "stderr output replaces :: with %3A%3A in file paths"
        failure_impact: "Sanitization method is missing or uses a weaker approach"

    dependencies:
