  - scenario_id: 7
    test_id: "TS-GH84-007"
    test_type: "functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-84"
    coverage_status: "NEW"

    test_objective:
      title: "Verify blocked output includes file path and blocking reason"
      what: |
        When a workflow file is detected in the changed files list, the error
        output must include both the specific file path that triggered the block
        and a human-readable reason explaining why the change was rejected. This
        ensures operators can quickly identify which file caused the failure and
        understand the security rationale.
      why: |
        Clear error messages reduce incident response time. Without the file path,
        operators would need to manually diff the commit to find the offending file.
        Without the reason, they might mistake the block for a transient failure
        and retry instead of investigating the security concern.
      acceptance_criteria:
        - "Error output contains the blocked file path (e.g., .github/workflows/ci.yml)"
        - "Error output contains a blocking reason referencing workflow file restriction"
        - "Error output is written to stderr (not stdout)"

    classification:
      test_type: "Functional"
      scope: "Single-component"
      automation_approach: "Go test with shell execution"

    specific_preconditions:
      - name: "detect_workflow_files function available"
        requirement: "Function extracted from post-code.sh for isolated testing"
        validation: "Function source loaded in test setup"

    test_data:
      resource_definitions:
        - name: "workflow_file_input"
          type: "string"
          yaml: |
            changed_files: ".github/workflows/ci.yml"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Prepare changed files input containing a workflow file path"
          command: "changedFiles := \".github/workflows/ci.yml\""
          validation: "Input string is non-empty"

      test_execution:
        - step_id: "TEST-01"
          action: "Execute detect_workflow_files with workflow file in input"
          command: "Run detect_workflow_files shell function with the input"
          validation: "Function returns blocked:workflow status"

        - step_id: "TEST-02"
          action: "Inspect the error output from post-code.sh blocking logic"
          command: "Capture stderr output from the blocking code path"
          validation: "Stderr contains the file path .github/workflows/ci.yml"

        - step_id: "TEST-03"
          action: "Verify blocking reason is present in error output"
          command: "Check stderr for workflow file restriction message"
          validation: "Stderr contains 'BLOCKED' and 'workflows' in the message"

      cleanup: []

    assertions:
