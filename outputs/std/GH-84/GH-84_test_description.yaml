  - scenario_id: 9
    test_id: "TS-GH84-009"
    test_type: "functional"
    priority: "P1"
    mvp: false
    requirement_id: "GH-84"
    coverage_status: "NEW"

    test_objective:
      title: "Verify code-agent.env comments describe the coder role's actual write permissions"
      what: |
        The code-agent.env file contains comments documenting the GH_TOKEN
        permissions granted to the code agent inside the sandbox. These comments
        must accurately describe the coder role's actual permissions (contents:write,
        issues:write, pull_requests:write) instead of incorrectly stating the token
        is read-only.
      why: |
        Misleading documentation about token permissions can lead to incorrect
        security assumptions. If operators believe the sandbox token is read-only,
        they may not implement additional safeguards against agent privilege abuse.
      acceptance_criteria:
        - "code-agent.env comments reference write permissions (contents:write, issues:write, pull_requests:write)"
        - "Comments do not describe the token as read-only"
        - "Comments accurately reflect the coder GitHub App role permissions"

    classification:
