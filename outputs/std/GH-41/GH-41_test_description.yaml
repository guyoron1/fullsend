        description: "should post as file-level comment with Line=0"
        test_id_format: "[test_id:TS-GH-41-001]"
    test_objective:
      title: "Verify out-of-hunk finding posted as file-level comment"
      what: |
        Tests that when a finding references a file present in the PR diff but
        at a line number outside any diff hunk range, findingsToReviewComments
        creates a ReviewComment with Line=0 (file-level) instead of dropping it.
      why: |
        This is the core behavioral change in GH-41. Previously, out-of-hunk
        findings were silently dropped, causing reviewers to miss important
        findings. File-level fallback ensures visibility.
      acceptance_criteria:
        - "ReviewComment is created (not filtered out)"
        - "ReviewComment.Line equals 0"
        - "ReviewComment.Path matches the finding's file path"
