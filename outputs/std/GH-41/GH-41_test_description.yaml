      test_type: "Unit"
      scope: "Single-function"
      automation_approach: "Go/Ginkgo with gomega"
    specific_preconditions: []
    test_data:
      resource_definitions:
        - name: "out_of_hunk_finding"
          type: "Finding"
          yaml: |
            file: "main.go"
            line: 150
            severity: "high"
            description: "Potential nil dereference"
        - name: "diff_hunks_map"
          type: "map[string][]DiffHunk"
          yaml: |
            main.go:
              - start: 10
                end: 30
              - start: 50
                end: 70
    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create a finding referencing line 150 in main.go"
          command: "Construct Finding struct"
          validation: "Finding has file=main.go, line=150"
        - step_id: "SETUP-02"
          action: "Create diffHunks map with main.go having hunks [10-30, 50-70]"
          command: "Construct map[string][]DiffHunk"
          validation: "Line 150 is outside all hunks"
      test_execution:
        - step_id: "TEST-01"
          action: "Call findingsToReviewComments with the finding and diffHunks"
          command: "result = findingsToReviewComments(findings, diffHunks)"
          validation: "Function returns without error"
        - step_id: "TEST-02"
          action: "Assert result contains one ReviewComment with Line=0"
          command: "Expect(result[0].Line).To(Equal(0))"
          validation: "Line is 0 (file-level)"
      cleanup: []
    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Finding is not dropped"
        condition: "Expect(result).To(HaveLen(1))"
        failure_impact: "Out-of-hunk findings would be silently lost"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Comment is file-level (Line=0)"
        condition: "Expect(result[0].Line).To(Equal(0))"
        failure_impact: "Comment would be posted at wrong line or rejected by API"
