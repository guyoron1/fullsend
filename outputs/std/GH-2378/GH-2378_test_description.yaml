          action: "Call build_error_comment function"
          command: "commentBody=$(build_error_comment)"
          validation: "Comment is generated"
        - step_id: "TEST-02"
          action: "Check comment contains exit code value"
          command: "echo $commentBody | grep '1'"
          validation: "Comment contains the exit code '1'"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Unset test environment variables"
          command: "unset AGENT_ERROR_EXIT AGENT_EXIT_CODE"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Error comment contains numeric exit code"
        condition: "commentBody contains AGENT_EXIT_CODE value"
        failure_impact: "Users lack diagnostic info about failure cause"

    dependencies:
      external_tools:
        - "bash 5.x+"
      scenario_specific_rbac: []

