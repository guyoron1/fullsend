    code_structure: "Describe -> Context -> It (Ginkgo v2)"

    variables:
      closure_scope:
        - name: "exitCode"
          type: "string"
          initialized_in: "test setup"
          used_in: ["test execution"]
          comment: "Agent exit code set to 0 (success)"
        - name: "result"
          type: "string"
          initialized_in: "test execution"
          used_in: ["assertions"]
          comment: "detect_noop function return value"

    test_structure:
      type: "table-driven"
      describe:
        description: "detect_noop preserves noop behavior"
      context:
        description: "when agent exits 0 with no commits"
      it:
        description: "should return noop (not agent_error)"
        test_id_format: "[test_id:TS-GH-2378-003]"

    test_objective:
      title: "Verify post-script exits cleanly when agent exits 0 with no commits (both branch and files paths)"
      what: |
        Tests that the detect_noop function correctly returns 'noop' (not 'agent_error')
        when the agent exits with code 0 but produces no commits. This covers both the
        no-branch path and the no-changed-files path when exit code is 0.
      why: |
        Intentional no-ops are a valid agent outcome (e.g., agent determines no changes
        are needed). These must continue to be reported as successful completions, not
        errors. This test prevents regression of the noop path.
      acceptance_criteria:
        - "detect_noop returns 'noop' when AGENT_EXIT_CODE == 0 and no branch exists"
        - "detect_noop returns 'noop' when AGENT_EXIT_CODE == 0 and branch exists but no changed files"
        - "AGENT_ERROR_EXIT is NOT set to 'true' in either case"

    specific_preconditions:
      - name: "Agent exit code is 0"
        requirement: "AGENT_EXIT_CODE=0 or unset"
        validation: "echo $AGENT_EXIT_CODE"

    test_data:
      environment_setup:
        - variable: "AGENT_EXIT_CODE"
          value: "0"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Set AGENT_EXIT_CODE to 0"
          command: "export AGENT_EXIT_CODE=0"
          validation: "Variable is set to 0"
      test_execution:
        - step_id: "TEST-01"
          action: "Call detect_noop with no branch existing"
          command: "result=$(detect_noop)"
          validation: "Function returns 'noop'"
        - step_id: "TEST-02"
          action: "Call detect_noop with branch existing but no changed files"
          command: "result=$(detect_noop)"
          validation: "Function returns 'noop'"
        - step_id: "TEST-03"
          action: "Verify AGENT_ERROR_EXIT is not set"
          command: "echo ${AGENT_ERROR_EXIT:-unset}"
          validation: "AGENT_ERROR_EXIT is unset or not 'true'"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Unset test environment variables"
          command: "unset AGENT_EXIT_CODE AGENT_ERROR_EXIT"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "No-branch path returns noop when exit code is 0"
        condition: "result == 'noop' (no branch path)"
        failure_impact: "Successful no-ops would be falsely reported as errors"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "No-files path returns noop when exit code is 0"
        condition: "result == 'noop' (no files path)"
        failure_impact: "Successful no-ops would be falsely reported as errors"
      - assertion_id: "ASSERT-03"
        priority: "P0"
        description: "AGENT_ERROR_EXIT is not set for successful no-ops"
        condition: "AGENT_ERROR_EXIT is unset or != 'true'"
        failure_impact: "Error comment would be posted for successful runs"

    dependencies:
      external_tools:
        - "bash 5.x+"
      scenario_specific_rbac: []

  - scenario_id: "004"
    test_id: "TS-GH-2378-004"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2378"

    patterns:
      primary_pattern: "shell-function-unit"
      helpers_required:
        - "bash-mock-functions"
