      external_tools:
        - "bash 5.x+"
      scenario_specific_rbac: []

  - scenario_id: "007"
    test_id: "TS-GH-2378-007"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2378"

    patterns:
      primary_pattern: "unit-test-env-propagation"
      helpers_required:
        - "go-exec-mock"
      decorators: []

    code_structure: "Describe -> Context -> It (Ginkgo v2)"

    variables:
      closure_scope:
        - name: "lastExitCode"
          type: "int"
          initialized_in: "runAgent"
          used_in: ["defer closure", "post-script env"]
          comment: "Agent exit code captured before defer statements"
        - name: "envVars"
          type: "[]string"
          initialized_in: "test execution"
          used_in: ["assertions"]
          comment: "Environment variables passed to post-script command"

    test_structure:
      type: "single"
      describe:
        description: "AGENT_EXIT_CODE propagation from Go harness"
      context:
        description: "when runAgent completes with non-zero exit code"
      it:
        description: "should pass AGENT_EXIT_CODE to post-script environment"
        test_id_format: "[test_id:TS-GH-2378-007]"

    test_objective:
      title: "Verify lastExitCode is declared before defer closures and AGENT_EXIT_CODE env var is appended to post-script command environment"
      what: |
        Tests the Go code in run.go to verify that lastExitCode is declared before
        the defer closures (status comment defer and post-script defer) so both
        closures can read it. Also verifies that AGENT_EXIT_CODE is included in the
        environment variables passed to the post-script command.
      why: |
        The root cause of GH-2378 was that lastExitCode was declared after the
        defer closures, so neither could access the agent's actual exit code. This
        test ensures the variable scoping fix is correct and the env var propagation
        works end-to-end within the Go harness.
      acceptance_criteria:
        - "lastExitCode is declared before any defer statements that reference it"
        - "AGENT_EXIT_CODE is included in the post-script command's environment"
        - "AGENT_EXIT_CODE value matches the agent's actual exit code"

    specific_preconditions:
      - name: "Go test harness available"
        requirement: "run_test.go can test runAgent function"
        validation: "go test -run TestAgentExitCode ./..."

    test_data:
      go_test_setup:
        - description: "Mock agent that exits with code 1"
          exit_code: 1

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Create test fixture with mock agent returning non-zero exit"
          command: "mockAgent := exec.Command(\"false\"); // or use a test helper that returns exit code 1"
          validation: "Mock agent command is configured to exit with code 1"
      test_execution:
        - step_id: "TEST-01"
          action: "Call runAgent with the mock agent command"
          command: "err := runAgent(ctx, mockConfig)"
          validation: "runAgent returns without panic; err may be non-nil (expected for non-zero exit)"
        - step_id: "TEST-02"
          action: "Inspect cmd.Env slice for AGENT_EXIT_CODE entry"
          command: "envVars := capturedCmd.Env; Expect(envVars).To(ContainElement(\"AGENT_EXIT_CODE=1\"))"
          validation: "AGENT_EXIT_CODE=1 is present in cmd.Env slice"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Clean up test fixtures via Go defer / t.Cleanup"
          command: "// Handled by GinkgoT().Cleanup() or AfterEach block"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "AGENT_EXIT_CODE is present in post-script environment"
        condition: "cmd.Env contains 'AGENT_EXIT_CODE=1'"
        failure_impact: "Post-script cannot detect agent errors"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "AGENT_EXIT_CODE value matches agent's actual exit code"
        condition: "AGENT_EXIT_CODE value == strconv.Itoa(lastExitCode)"
        failure_impact: "Incorrect exit code reported to user"

    dependencies:
      external_tools:
        - "Go 1.23+"
        - "testify"
      scenario_specific_rbac: []

  - scenario_id: "008"
    test_id: "TS-GH-2378-008"
    tier: "Tier 1"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2378"

    patterns:
      primary_pattern: "shell-function-unit"
      helpers_required:
        - "bash-mock-functions"
      decorators: []

    code_structure: "Describe -> Context -> It (Ginkgo v2)"

    variables:
      closure_scope:
        - name: "exitCode"
          type: "string"
          initialized_in: "test setup"
          used_in: ["test execution"]
          comment: "Non-zero agent exit code"
        - name: "changedFiles"
          type: "string"
          initialized_in: "test setup"
          used_in: ["test execution"]
          comment: "Number of changed files (non-zero)"
        - name: "result"
          type: "string"
          initialized_in: "test execution"
          used_in: ["assertions"]
          comment: "detect_noop return value"

    test_structure:
      type: "single"
      describe:
        description: "detect_noop with agent error but changes present"
      context:
        description: "when agent exits non-zero but changes exist"
      it:
        description: "should continue to push/PR flow"
        test_id_format: "[test_id:TS-GH-2378-008]"

    test_objective:
      title: "Verify post-script continues to push/PR flow when agent exits non-zero but changes exist"
      what: |
        Tests that when the agent exits with a non-zero code but has produced
        actual file changes, the post-script continues with the normal push/PR
        creation flow instead of treating it as a noop or agent error.
      why: |
        An agent may partially succeed - producing some changes before encountering
        an error. In this case, the produced changes should still be pushed and
        a PR created, since the partial work may be valuable.
      acceptance_criteria:
        - "detect_noop returns 'continue' (not 'noop' or 'agent_error') when changes exist"
        - "Post-script proceeds to push/PR flow"

    specific_preconditions:
      - name: "Changes exist on feature branch"
        requirement: "git diff returns non-empty"
        validation: "git diff --name-only returns files"

    test_data:
      environment_setup:
        - variable: "AGENT_EXIT_CODE"
          value: "1"
        - variable: "BRANCH_EXISTS"
          value: "true"
        - variable: "CHANGED_FILES"
          value: "3"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Set AGENT_EXIT_CODE to non-zero and mock git diff to report changed files"
          command: "export AGENT_EXIT_CODE=1; git() { if [ \"$1\" = \"diff\" ] && [ \"$2\" = \"--name-only\" ]; then echo 'file1.go\nfile2.go\nfile3.go'; fi; command git \"$@\"; }"
          validation: "AGENT_EXIT_CODE=1, git diff --name-only returns 3 files"
      test_execution:
        - step_id: "TEST-01"
          action: "Call detect_noop function"
          command: "result=$(detect_noop)"
          validation: "Function returns 'continue'"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Unset test environment variables"
          command: "unset AGENT_EXIT_CODE"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "detect_noop returns continue when changes exist despite non-zero exit"
        condition: "result == 'continue'"
        failure_impact: "Partial agent work would be discarded instead of pushed"

    dependencies:
      external_tools:
        - "bash 5.x+"
      scenario_specific_rbac: []

  - scenario_id: "009"
    test_id: "TS-GH-2378-009"
    tier: "Tier 1"
    priority: "P2"
    mvp: false
    requirement_id: "GH-2378"

    patterns:
      primary_pattern: "shell-function-unit"
      helpers_required:
        - "bash-mock-functions"
      decorators: []

    code_structure: "Describe -> Context -> It (Ginkgo v2)"

    variables:
      closure_scope:
        - name: "exitCode"
          type: "string"
          initialized_in: "test setup"
          used_in: ["test execution"]
          comment: "Non-zero agent exit code"
        - name: "headState"
          type: "string"
          initialized_in: "test setup"
          used_in: ["test execution"]
          comment: "Detached HEAD state indicator"
        - name: "result"
          type: "string"
          initialized_in: "test execution"
          used_in: ["assertions"]
          comment: "detect_noop return value"

    test_structure:
      type: "single"
      describe:
        description: "detect_noop on detached HEAD with agent error"
      context:
        description: "when on detached HEAD with non-zero exit code"
      it:
        description: "should return agent_error not noop"
        test_id_format: "[test_id:TS-GH-2378-009]"

    test_objective:
      title: "Verify post-script exits with agent error (not noop) when on detached HEAD with non-zero exit code"
      what: |
        Tests the edge case where git is in a detached HEAD state and the agent
        exits with a non-zero code. The detect_noop function should correctly
        identify this as an agent error rather than a normal noop.
      why: |
        Detached HEAD is an unusual but possible state in CI environments. The
        agent error detection must work correctly regardless of git HEAD state
        to prevent false-success reporting.
      acceptance_criteria:
        - "detect_noop returns 'agent_error' when on detached HEAD with non-zero exit code"
        - "AGENT_ERROR_EXIT is set to 'true'"

    specific_preconditions:
      - name: "Git in detached HEAD state"
        requirement: "HEAD is detached (not on any branch)"
        validation: "git symbolic-ref HEAD fails"

    test_data:
      environment_setup:
        - variable: "AGENT_EXIT_CODE"
          value: "1"
        - variable: "HEAD_STATE"
          value: "detached"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Set AGENT_EXIT_CODE to non-zero and mock git symbolic-ref to fail (detached HEAD)"
          command: "export AGENT_EXIT_CODE=1; git() { if [ \"$1\" = \"symbolic-ref\" ] && [ \"$2\" = \"HEAD\" ]; then return 1; fi; command git \"$@\"; }"
          validation: "AGENT_EXIT_CODE=1, git symbolic-ref HEAD returns non-zero"
      test_execution:
        - step_id: "TEST-01"
          action: "Call detect_noop function"
          command: "result=$(detect_noop)"
          validation: "Function returns 'agent_error'"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Unset test environment variables"
          command: "unset AGENT_EXIT_CODE"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P2"
        description: "Detached HEAD with non-zero exit returns agent_error"
        condition: "result == 'agent_error'"
        failure_impact: "Detached HEAD agent failures silently reported as noop"

    dependencies:
      external_tools:
        - "bash 5.x+"
      scenario_specific_rbac: []

  - scenario_id: "010"
    test_id: "TS-GH-2378-010"
    tier: "Tier 1"
    priority: "P1"
    mvp: false
    requirement_id: "GH-2378"

    patterns:
      primary_pattern: "functional-integration"
      helpers_required:
        - "bash-mock-functions"
        - "gh-cli-mock"
      decorators: []

    code_structure: "Describe -> Context -> It (Ginkgo v2)"

    variables:
      closure_scope:
        - name: "issueComment"
          type: "string"
          initialized_in: "test execution"
          used_in: ["assertions"]
          comment: "The issue comment posted by the post-script"
        - name: "exitCode"
          type: "int"
          initialized_in: "test setup"
          used_in: ["test execution"]
          comment: "Simulated agent exit code"

    test_structure:
      type: "single"
      describe:
        description: "End-to-end agent failure status comment"
      context:
        description: "when agent fails with non-zero exit and no commits"
      it:
        description: "should post issue comment with 'Code agent failed' and exit code"
        test_id_format: "[test_id:TS-GH-2378-010]"

    test_objective:
      title: "Verify that a simulated agent failure (non-zero exit, no commits) results in an issue comment containing 'Code agent failed' with exit code and workflow run link"
      what: |
        End-to-end test that simulates a complete agent failure scenario by running
        post-code.sh with a non-zero AGENT_EXIT_CODE and no commits. Validates that
        the resulting issue comment contains the correct failure message, the numeric
        exit code, and a link to the workflow run for debugging.
      why: |
        This end-to-end test validates the complete error reporting pipeline from
        agent exit code propagation through to the user-facing issue comment. It
        catches integration issues that unit tests on individual functions might miss.
      acceptance_criteria:
        - "Issue comment contains 'Code agent failed'"
        - "Issue comment contains the numeric exit code"
        - "Issue comment contains a link to the workflow run"
        - "Issue comment does NOT say 'Success' or 'Finished Code, Success'"

    specific_preconditions:
      - name: "post-code.sh script available"
        requirement: "Script is executable and all dependencies available"
        validation: "test -x post-code.sh"
      - name: "GitHub API access (or mock)"
        requirement: "gh CLI available for comment posting (or mocked)"
        validation: "gh --version"

    test_data:
      environment_setup:
        - variable: "AGENT_EXIT_CODE"
          value: "1"
        - variable: "PUSH_TOKEN"
          value: "mock-token"
        - variable: "REPO_FULL_NAME"
          value: "fullsend-ai/fullsend"
        - variable: "ISSUE_NUMBER"
          value: "2378"
        - variable: "GITHUB_RUN_ID"
          value: "123456789"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Set up environment with agent failure conditions"
          command: "Export all required environment variables with non-zero exit code"
          validation: "All variables set"
        - step_id: "SETUP-02"
          action: "Create mock gh binary that captures comment body to a temp file"
          command: "mkdir -p \"$MOCK_BIN_DIR\"; printf '#!/bin/bash\\nif [ \"$1\" = \"issue\" ] && [ \"$2\" = \"comment\" ]; then\\n  echo \"$4\" > \"$CAPTURED_COMMENT_FILE\"\\nfi\\n' > \"$MOCK_BIN_DIR/gh\"; chmod +x \"$MOCK_BIN_DIR/gh\"; export PATH=\"$MOCK_BIN_DIR:$PATH\""
          validation: "Mock gh binary exists at $MOCK_BIN_DIR/gh and is executable"
      test_execution:
        - step_id: "TEST-01"
          action: "Run post-code.sh"
          command: "bash post-code.sh"
          validation: "Script exits with expected non-zero code; capture exit code for assertion"
        - step_id: "TEST-02"
          action: "Read the captured comment body from mock output file"
          command: "issueComment=$(cat \"$CAPTURED_COMMENT_FILE\")"
          validation: "issueComment variable contains non-empty string"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Remove mock binary directory and clean up environment"
          command: "rm -rf \"$MOCK_BIN_DIR\"; rm -f \"$CAPTURED_COMMENT_FILE\"; unset AGENT_EXIT_CODE PUSH_TOKEN REPO_FULL_NAME ISSUE_NUMBER GITHUB_RUN_ID"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P1"
        description: "Comment contains 'Code agent failed'"
        condition: "issueComment contains 'Code agent failed'"
        failure_impact: "Users see misleading success message"
      - assertion_id: "ASSERT-02"
        priority: "P1"
        description: "Comment contains numeric exit code"
        condition: "issueComment contains '1' (exit code)"
        failure_impact: "Users lack diagnostic information"
      - assertion_id: "ASSERT-03"
        priority: "P1"
        description: "Comment contains workflow run link"
        condition: "issueComment contains URL with GITHUB_RUN_ID"
        failure_impact: "Users cannot navigate to logs for debugging"
      - assertion_id: "ASSERT-04"
        priority: "P1"
        description: "Comment does NOT contain false success message"
        condition: "issueComment does NOT contain 'Finished Code, Success'"
        failure_impact: "Original bug not fixed"

    dependencies:
      external_tools:
        - "bash 5.x+"
        - "gh CLI"
      scenario_specific_rbac: []
