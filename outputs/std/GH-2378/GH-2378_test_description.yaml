      what: |
        Tests that the error comment generated by build_error_comment includes the
        actual numeric exit code from AGENT_EXIT_CODE. This gives users actionable
        diagnostic information about the failure.
      why: |
        The numeric exit code helps engineers diagnose the root cause of agent
        failures. For example, exit code 1 vs 2 may indicate different failure
