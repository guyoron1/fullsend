scenarios:
  - scenario_id: "001"
    test_id: "TS-GH-2378-001"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2378"

    patterns:
      primary_pattern: "shell-function-unit"
      helpers_required:
        - "bash-mock-functions"
      decorators: []

    code_structure: "Describe -> Context -> It (Ginkgo v2)"

    variables:
      closure_scope:
        - name: "exitCode"
          type: "string"
          initialized_in: "test setup"
          used_in: ["test execution"]
          comment: "Simulated agent exit code"
        - name: "branchExists"
          type: "bool"
          initialized_in: "test setup"
          used_in: ["test execution"]
          comment: "Whether feature branch exists"
        - name: "result"
          type: "string"
          initialized_in: "test execution"
          used_in: ["assertions"]
          comment: "detect_noop function return value"

    test_structure:
      type: "table-driven"
      describe:
        description: "detect_noop with agent error at branch check"
      context:
        description: "when agent exits non-zero and no feature branch exists"
      it:
        description: "should return agent_error instead of noop"
        test_id_format: "[test_id:TS-GH-2378-001]"

    test_objective:
      title: "Verify post-script exits with error when agent exits non-zero and no feature branch exists"
      what: |
        Tests the detect_noop function in post-code.sh when AGENT_EXIT_CODE is non-zero
        and no feature branch has been created. The function should detect this as an
        agent error (not a normal noop) and set AGENT_ERROR_EXIT=true.
      why: |
        This is the primary fix for GH-2378. Previously, when the agent failed with a
        non-zero exit code but produced no branch, the post-script incorrectly reported
        "Success". This test ensures the agent error is correctly detected at the first
        checkpoint (branch existence).
      acceptance_criteria:
        - "detect_noop returns 'agent_error' when AGENT_EXIT_CODE != 0 and no branch exists"
        - "AGENT_ERROR_EXIT is set to 'true' in this scenario"
        - "Function does NOT return 'noop' for agent error cases"

    specific_preconditions:
      - name: "post-code.sh sourced for function testing"
        requirement: "detect_noop function is accessible"
        validation: "type detect_noop"

    test_data:
      environment_setup:
        - variable: "AGENT_EXIT_CODE"
          value: "1"
        - variable: "BRANCH_EXISTS"
          value: "false"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Set AGENT_EXIT_CODE to non-zero value (e.g., 1)"
          command: "export AGENT_EXIT_CODE=1"
          validation: "Variable is set"
        - step_id: "SETUP-02"
          action: "Mock branch check to return false (no feature branch)"
          command: "git() { if [ \"$1\" = \"rev-parse\" ] && [ \"$2\" = \"--verify\" ]; then return 1; fi; command git \"$@\"; }"
          validation: "git rev-parse --verify returns non-zero"
      test_execution:
        - step_id: "TEST-01"
          action: "Call detect_noop function"
          command: "result=$(detect_noop)"
          validation: "Function returns 'agent_error'"
        - step_id: "TEST-02"
          action: "Verify AGENT_ERROR_EXIT flag is set"
          command: "echo $AGENT_ERROR_EXIT"
          validation: "AGENT_ERROR_EXIT equals 'true'"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Unset test environment variables"
          command: "unset AGENT_EXIT_CODE AGENT_ERROR_EXIT"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "detect_noop returns agent_error for non-zero exit with no branch"
        condition: "result == 'agent_error'"
        failure_impact: "Agent failures would be silently reported as success"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "AGENT_ERROR_EXIT flag is set to true"
        condition: "AGENT_ERROR_EXIT == 'true'"
        failure_impact: "Error comment template would not be selected"

    dependencies:
      external_tools:
        - "bash 5.x+"
      scenario_specific_rbac: []

  - scenario_id: "002"
    test_id: "TS-GH-2378-002"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2378"

    patterns:
      primary_pattern: "shell-function-unit"
      helpers_required:
        - "bash-mock-functions"
      decorators: []

    code_structure: "Describe -> Context -> It (Ginkgo v2)"

    variables:
      closure_scope:
        - name: "exitCode"
          type: "string"
          initialized_in: "test setup"
          used_in: ["test execution"]
          comment: "Simulated agent exit code"
        - name: "changedFiles"
          type: "string"
          initialized_in: "test setup"
          used_in: ["test execution"]
          comment: "Simulated changed files count"
        - name: "result"
          type: "string"
          initialized_in: "test execution"
          used_in: ["assertions"]
          comment: "detect_noop function return value"

    test_structure:
      type: "table-driven"
      describe:
        description: "detect_noop with agent error at changed-files check"
      context:
        description: "when agent exits non-zero on feature branch with no changed files"
      it:
        description: "should return agent_error instead of noop"
        test_id_format: "[test_id:TS-GH-2378-002]"

    test_objective:
      title: "Verify post-script exits with error when agent exits non-zero on feature branch with no changed files"
      what: |
        Tests the detect_noop function when the agent has created a feature branch
        but exited with a non-zero code and produced no changed files. This is the
        second checkpoint where agent errors must be detected.
      why: |
        An agent may create a branch (e.g., via initial git operations) but then
        fail during code generation. The changed-files check is the second point
        where false-success reporting can occur if agent errors are not detected.
      acceptance_criteria:
        - "detect_noop returns 'agent_error' when AGENT_EXIT_CODE != 0 and no changed files exist on feature branch"
        - "AGENT_ERROR_EXIT is set to 'true'"
        - "Function does NOT return 'noop' for agent error cases at this checkpoint"

    specific_preconditions:
      - name: "Feature branch exists but has no changed files"
        requirement: "git diff returns empty"
        validation: "git diff --name-only returns empty"

    test_data:
      environment_setup:
        - variable: "AGENT_EXIT_CODE"
          value: "2"
        - variable: "BRANCH_EXISTS"
          value: "true"
        - variable: "CHANGED_FILES"
          value: "0"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Set AGENT_EXIT_CODE to non-zero value (e.g., 2)"
          command: "export AGENT_EXIT_CODE=2"
          validation: "Variable is set"
        - step_id: "SETUP-02"
          action: "Mock branch check to return true with zero changed files"
          command: "git() { if [ \"$1\" = \"rev-parse\" ] && [ \"$2\" = \"--verify\" ]; then return 0; elif [ \"$1\" = \"diff\" ] && [ \"$2\" = \"--name-only\" ]; then echo ''; fi; command git \"$@\"; }"
          validation: "git rev-parse --verify returns 0, git diff --name-only returns empty"
      test_execution:
        - step_id: "TEST-01"
          action: "Call detect_noop function"
          command: "result=$(detect_noop)"
          validation: "Function returns 'agent_error'"
        - step_id: "TEST-02"
          action: "Verify AGENT_ERROR_EXIT flag is set"
          command: "echo $AGENT_ERROR_EXIT"
          validation: "AGENT_ERROR_EXIT equals 'true'"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Unset test environment variables"
          command: "unset AGENT_EXIT_CODE AGENT_ERROR_EXIT"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "detect_noop returns agent_error at changed-files checkpoint"
        condition: "result == 'agent_error'"
        failure_impact: "Agent failures on existing branch would be reported as noop"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "AGENT_ERROR_EXIT flag is set to true"
        condition: "AGENT_ERROR_EXIT == 'true'"
        failure_impact: "Incorrect error comment template selected"

    dependencies:
      external_tools:
        - "bash 5.x+"
      scenario_specific_rbac: []

  - scenario_id: "003"
    test_id: "TS-GH-2378-003"
    tier: "Tier 1"
    priority: "P0"
    mvp: true
    requirement_id: "GH-2378"

    patterns:
      primary_pattern: "shell-function-unit"
      helpers_required:
        - "bash-mock-functions"
