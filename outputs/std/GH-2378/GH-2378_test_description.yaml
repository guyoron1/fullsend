    code_structure: "Describe -> Context -> It (Ginkgo v2)"

    variables:
      closure_scope:
        - name: "agentErrorExit"
          type: "string"
          initialized_in: "test setup"
          used_in: ["test execution"]
          comment: "Flag indicating agent error vs post-script error"
        - name: "commentBody"
          type: "string"
          initialized_in: "test execution"
          used_in: ["assertions"]
          comment: "Generated error comment content"

    test_structure:
      type: "table-driven"
      describe:
        description: "build_error_comment with agent error flag"
      context:
        description: "when AGENT_ERROR_EXIT is true"
      it:
        description: "should produce comment saying 'Code agent failed'"
        test_id_format: "[test_id:TS-GH-2378-004]"

    test_objective:
      title: "Verify error comment says 'Code agent failed' (not 'Post-code script failed') when AGENT_ERROR_EXIT is true"
      what: |
        Tests the build_error_comment function to ensure it produces a comment with
        "Code agent failed" when the AGENT_ERROR_EXIT flag is set to true. This
        distinguishes agent errors from post-script errors in user-facing comments.
      why: |
        Users need to know whether the failure was in the agent itself (e.g., API
        rate limiting) or in the post-processing script. Different failure sources
        require different troubleshooting approaches.
      acceptance_criteria:
        - "Error comment contains 'Code agent failed' when AGENT_ERROR_EXIT is true"
        - "Error comment does NOT contain 'Post-code script failed' when AGENT_ERROR_EXIT is true"

    specific_preconditions:
      - name: "AGENT_ERROR_EXIT flag set"
        requirement: "AGENT_ERROR_EXIT=true"
        validation: "echo $AGENT_ERROR_EXIT"

    test_data:
      environment_setup:
        - variable: "AGENT_ERROR_EXIT"
          value: "true"
        - variable: "AGENT_EXIT_CODE"
          value: "1"

    test_steps:
      setup:
        - step_id: "SETUP-01"
          action: "Set AGENT_ERROR_EXIT to true"
          command: "export AGENT_ERROR_EXIT=true"
          validation: "Variable is set"
      test_execution:
        - step_id: "TEST-01"
          action: "Call build_error_comment function"
          command: "commentBody=$(build_error_comment)"
          validation: "Function returns comment string"
        - step_id: "TEST-02"
          action: "Check comment body content"
          command: "echo $commentBody | grep 'Code agent failed'"
          validation: "Comment contains 'Code agent failed'"
      cleanup:
        - step_id: "CLEANUP-01"
          action: "Unset test environment variables"
          command: "unset AGENT_ERROR_EXIT AGENT_EXIT_CODE"

    assertions:
      - assertion_id: "ASSERT-01"
        priority: "P0"
        description: "Comment contains 'Code agent failed' for agent errors"
        condition: "commentBody contains 'Code agent failed'"
        failure_impact: "Users cannot distinguish agent errors from post-script errors"
      - assertion_id: "ASSERT-02"
        priority: "P0"
        description: "Comment does NOT contain 'Post-code script failed' for agent errors"
        condition: "commentBody does NOT contain 'Post-code script failed'"
        failure_impact: "Misleading error attribution"

    dependencies:
      external_tools:
        - "bash 5.x+"
