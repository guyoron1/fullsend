# Reusable code agent workflow. Called by thin callers in .fullsend repos
# via workflow_call. Runs in the caller's repo context (secrets, checkout).
name: Code Agent

on:
  workflow_call:
    inputs:
      event_type:
        required: true
        type: string
      source_repo:
        required: true
        type: string
      event_payload:
        required: true
        type: string
      mint_url:
        required: true
        type: string
      gcp_region:
        required: true
        type: string
      fullsend_version:
        required: false
        type: string
        default: "latest"
      install_mode:
        required: false
        type: string
        default: "per-org"
      fullsend_ai_ref:
        description: Ref of fullsend-ai/fullsend to load actions from. Must match the ref used in the `uses:` line that calls this workflow.
        type: string
        required: false
        default: v0
      costwise_routing:
        description: "Enable Costwise routing (true) or passthrough tracking only (false)"
        required: false
        type: string
        default: "false"
    secrets:
      FULLSEND_GCP_WIF_PROVIDER:
        required: true
      FULLSEND_GCP_PROJECT_ID:
        required: true

jobs:
  code:
    name: Code
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      id-token: write
      issues: write
      packages: read
      pull-requests: write

    steps:
      - name: Checkout config repository
        uses: actions/checkout@v6

      - name: Checkout upstream defaults
        uses: actions/checkout@v6
        with:
          repository: fullsend-ai/fullsend
          ref: ${{ inputs.fullsend_ai_ref }}
          path: .defaults
          fetch-depth: 1
          sparse-checkout: |
            .github/actions/
            .github/scripts/
            internal/scaffold/fullsend-repo/
            action.yml

      - name: Prepare workspace (upstream defaults + org/repo overrides)
        env:
          INSTALL_MODE: ${{ inputs.install_mode }}
        run: |
          set -euo pipefail
          if [[ "${INSTALL_MODE}" != "per-org" && "${INSTALL_MODE}" != "per-repo" ]]; then
            echo "::error::Invalid install_mode '${INSTALL_MODE}': must be 'per-org' or 'per-repo'"
            exit 1
          fi
          SRC=".defaults/internal/scaffold/fullsend-repo"
          LAYERED_DIRS="agents skills schemas harness plugins policies scripts env"
          for dir in ${LAYERED_DIRS}; do
            if [[ -d "${SRC}/${dir}" ]]; then
              mkdir -p "${dir}"
              cp -r "${SRC}/${dir}/." "${dir}/"
            fi
          done
          CUSTOM_BASE="customized"
          if [[ "${INSTALL_MODE}" == "per-repo" ]]; then
            CUSTOM_BASE=".fullsend/customized"
          fi
          for dir in ${LAYERED_DIRS}; do
            if [[ -d "${CUSTOM_BASE}/${dir}" ]]; then
              find "${CUSTOM_BASE}/${dir}" -type f ! -name '.gitkeep' -print0 \
                | while IFS= read -r -d '' f; do
                    rel="${f#"${CUSTOM_BASE}"/}"
                    mkdir -p "$(dirname "${rel}")"
                    cp "${f}" "${rel}"
                  done
            fi
          done
          mkdir -p .github/scripts
          cp "${SRC}/.github/scripts/setup-agent-env.sh" .github/scripts/setup-agent-env.sh

      - name: Validate enrollment and extract repo metadata
        id: repo-parts
        uses: ./.defaults/.github/actions/validate-enrollment
        with:
          source_repo: ${{ inputs.source_repo }}
          install_mode: ${{ inputs.install_mode }}

      - name: Mint coder token
        id: app-token
        uses: ./.defaults/.github/actions/mint-token
        with:
          role: coder
          repos: ${{ steps.repo-parts.outputs.name }}
          mint_url: ${{ inputs.mint_url }}

      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target-repo
          fetch-depth: 0
          persist-credentials: false

      - name: Validate inputs
        env:
          ISSUE_NUMBER: ${{ fromJSON(inputs.event_payload).issue.number }}
          REPO_FULL_NAME: ${{ inputs.source_repo }}
          GITHUB_ISSUE_URL: ${{ fromJSON(inputs.event_payload).issue.html_url }}
          COMMENT_BODY: ${{ fromJSON(inputs.event_payload).comment.body }}
        run: bash scripts/pre-code.sh

      - name: Setup GCP and prepare credentials
        uses: ./.defaults/.github/actions/setup-gcp
        with:
          gcp_wif_provider: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
          gcp_project_id: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}

      - name: Install Costwise proxy
        run: |
          set -euo pipefail
          WHEEL=$(ls vendor/costwise-*.whl) && pip install --quiet "${WHEEL}[proxy,vertex]"
          costwise --version

      - name: Start Costwise proxy
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          CLOUD_ML_REGION: ${{ inputs.gcp_region }}
          COSTWISE_ROUTING: ${{ inputs.costwise_routing }}
        run: |
          set -euo pipefail

          if [[ "${COSTWISE_ROUTING}" == "true" ]]; then
            ROUTING_ENABLED="true"
          else
            ROUTING_ENABLED="false"
          fi

          COSTWISE_DB="${RUNNER_TEMP}/costwise/costwise.db"
          mkdir -p "$(dirname "${COSTWISE_DB}")"

          cat > costwise.toml << TOML
          [costwise.proxy]
          host = "0.0.0.0"
          port = 8788

          [costwise.proxy.vertex]
          enabled = true
          project_id = "${ANTHROPIC_VERTEX_PROJECT_ID}"
          region = "us-east5"

          [costwise.routing]
          enabled = ${ROUTING_ENABLED}
          enabled_providers = ["anthropic"]
          simple_threshold = 0.35
          complex_threshold = 0.85

          [costwise.tracking]
          db_path = "${COSTWISE_DB}"

          [costwise.graph]
          enabled = false

          [costwise.feedback]
          enabled = true

          [costwise.integrations]
          headroom_enabled = false
          rtk_enabled = false
          ponytail_enabled = false
          TOML

          RUNNER_GCP_CREDS=$(ls "${GITHUB_WORKSPACE}"/gha-creds-*.json 2>/dev/null | head -1)
          if [[ -z "${RUNNER_GCP_CREDS}" ]]; then
            echo "::error::Original GCP credential file not found"
            exit 1
          fi

          GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_GCP_CREDS}" \
            costwise proxy --host 0.0.0.0 --port 8788 > "${RUNNER_TEMP}/costwise-proxy.log" 2>&1 &
          COSTWISE_PID=$!
          echo "COSTWISE_PID=${COSTWISE_PID}" >> "${GITHUB_ENV}"
          echo "COSTWISE_DB=${COSTWISE_DB}" >> "${GITHUB_ENV}"

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8788/ready >/dev/null 2>&1; then
              echo "Costwise proxy ready (PID ${COSTWISE_PID})"
              break
            fi
            if ! kill -0 "${COSTWISE_PID}" 2>/dev/null; then
              echo "::error::Costwise proxy died during startup"
              cat "${RUNNER_TEMP}/costwise-proxy.log"
              exit 1
            fi
            sleep 1
          done

          if ! curl -sf http://127.0.0.1:8788/ready >/dev/null 2>&1; then
            echo "::error::Costwise proxy failed to become ready in 30s"
            cat "${RUNNER_TEMP}/costwise-proxy.log"
            exit 1
          fi

          HOST_IP=$(hostname -I | awk '{print $1}')
          COSTWISE_PROXY_URL="http://${HOST_IP}:8788"
          echo "COSTWISE_PROXY_URL=${COSTWISE_PROXY_URL}" >> "${GITHUB_ENV}"
          echo "::notice::Costwise proxy URL for sandbox: ${COSTWISE_PROXY_URL}"

          cat >> env/gcp-vertex.env << ENVEOF
          export CLAUDE_CODE_USE_VERTEX=0
          export ANTHROPIC_BASE_URL=${COSTWISE_PROXY_URL}
          export ANTHROPIC_API_KEY=sk-ant-api03-costwise-proxy-passthrough
          ENVEOF
          echo "::notice::Appended costwise overrides to env/gcp-vertex.env (ANTHROPIC_BASE_URL=${COSTWISE_PROXY_URL})"

          for policy_file in policies/*.yaml; do
            if ! grep -q 'costwise_proxy' "${policy_file}" 2>/dev/null; then
              cat >> "${policy_file}" << POLICYEOF

            costwise_proxy:
              name: costwise-proxy
              endpoints:
                - host: "${HOST_IP}"
                  port: 8788
                  protocol: rest
                  enforcement: enforce
                  access: read-write
              binaries:
                - path: "**/claude"
                - path: "**/node"
          POLICYEOF
              echo "::notice::Added costwise_proxy network policy to ${policy_file}"
            fi
          done

      - name: Resolve bot identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          read -r BOT_LOGIN BOT_USER_ID < <(
            gh api graphql -f query='{ viewer { login databaseId } }' \
              | jq -r '.data.viewer | "\(.login) \(.databaseId)"'
          )
          GIT_BOT_EMAIL="${BOT_USER_ID}+${BOT_LOGIN}@users.noreply.github.com"
          echo "Resolved bot identity: ${BOT_LOGIN} (${BOT_USER_ID})"
          echo "GIT_BOT_EMAIL=${GIT_BOT_EMAIL}" >> "${GITHUB_ENV}"

      - name: Setup agent environment
        env:
          AGENT_PREFIX: CODE_
          CODE_GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CODE_TARGET_REPO_DIR: target-repo
          CODE_ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
          CODE_CLOUD_ML_REGION: ${{ inputs.gcp_region }}
          CODE_ISSUE_NUMBER: ${{ fromJSON(inputs.event_payload).issue.number }}
        run: bash .github/scripts/setup-agent-env.sh

      - name: Run code agent
        uses: ./.defaults/
        env:
          GITHUB_ISSUE_URL: ${{ fromJSON(inputs.event_payload).issue.html_url }}
          ISSUE_NUMBER: ${{ fromJSON(inputs.event_payload).issue.number }}
          REPO_FULL_NAME: ${{ inputs.source_repo }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUSH_TOKEN_SOURCE: github-app
          TARGET_BRANCH: main
        with:
          agent: code
          version: ${{ inputs.fullsend_version }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          status-repo: ${{ inputs.source_repo }}
          status-number: ${{ fromJSON(inputs.event_payload).issue.number }}
          status-token: ${{ steps.app-token.outputs.token }}

      - name: Stop Costwise proxy and collect results
        if: always()
        run: |
          set -euo pipefail

          if [[ -n "${COSTWISE_PID:-}" ]]; then
            kill "${COSTWISE_PID}" 2>/dev/null || true
            wait "${COSTWISE_PID}" 2>/dev/null || true
          fi

          mkdir -p "${GITHUB_WORKSPACE}/output/costwise"

          cp "${RUNNER_TEMP}/costwise-proxy.log" \
             "${GITHUB_WORKSPACE}/output/costwise/" 2>/dev/null || true

          if [[ -f "${COSTWISE_DB:-}" ]]; then
            cp "${COSTWISE_DB}" "${GITHUB_WORKSPACE}/output/costwise/"
          else
            echo "::warning::Costwise DB not found"
            exit 0
          fi

          echo "=== Costwise Eval ==="
          costwise eval --json-output > "${GITHUB_WORKSPACE}/output/costwise/eval.json" 2>&1 || true
          costwise eval || true

          echo "=== Costwise Gain ==="
          costwise gain > "${GITHUB_WORKSPACE}/output/costwise/gain.txt" 2>&1 || true

          cat > "${GITHUB_WORKSPACE}/output/costwise/metadata.json" << EOF
          {
            "agent": "code",
            "routing_enabled": "${COSTWISE_ROUTING:-false}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF

      - name: Upload Costwise artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: costwise-${{ github.job }}
          path: output/costwise/
          if-no-files-found: warn
          retention-days: 30
