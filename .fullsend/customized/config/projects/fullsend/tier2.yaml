enabled: true
language: "python"
framework: "pytest"
min_python_version: "3.10"

imports:
  standard:
    - "pytest"
    - "subprocess"
    - "os"
    - "json"
    - "pathlib"
    - "time"

test_patterns:
  file_prefix: "test_"
  class_prefix: "Test"
  function_prefix: "test_"

fixtures:
  scope_default: "function"
  conftest_location: "root"
