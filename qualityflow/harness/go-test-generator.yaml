# harness/go-test-generator.yaml — Generate working Go/Ginkgo tier 1 tests.
#
# Needs GitHub (gh CLI) for repo file fetches and Go registries for imports.
agent: agents/go-test-generator.md
model: opus
image: images/qf-code
policy: policies/qf-codegen.yaml
agent_input: config

host_files:
  - src: env/gcp-vertex.env
    dest: /tmp/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: env/qf-credentials.env
    dest: /tmp/workspace/.env.d/qf-credentials.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/workspace/.gcp-credentials.json
  # Source code repo for LSP analysis (set SOURCE_REPO_PATH on host).
  - src: ${SOURCE_REPO_PATH}
    dest: /tmp/workspace/source-repo
  # gopls binary (cross-compiled for linux/arm64).
  - src: ${GOPLS_BINARY_PATH}
    dest: /tmp/workspace/gopls

skills:
  - skills/project-resolver
  - skills/go-test-generator
  - skills/pipeline-state
  - skills/lsp-tracer
  - skills/feature-finder

validation_loop:
  script: scripts/validate-go-tests.sh
  max_iterations: 2

plugins:
  - name: gopls-lsp

timeout_minutes: 20
