# harness/std-reviewer.yaml — Review STD YAML and test stubs for quality.
#
# File-only: reads STD and STP locally, no external API calls needed.
agent: agents/std-reviewer.md
model: opus
image: images/qf-code
policy: policies/qf-vertex.yaml
agent_input: config

host_files:
  - src: env/gcp-vertex.env
    dest: /tmp/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: env/qf-credentials.env
    dest: /tmp/workspace/.env.d/qf-credentials.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/workspace/.gcp-credentials.json

skills:
  - skills/project-resolver
  - skills/review-rules-extractor
  - skills/std-reviewer
  - skills/output-validator

validation_loop:
  script: scripts/validate-std-review.sh
  max_iterations: 2

timeout_minutes: 15
