# harness/std-refiner.yaml — Iteratively review and fix an STD until APPROVED.
#
# File-only: reads STD and review locally, no external API calls needed.
agent: agents/std-refiner.md
model: opus
image: ghcr.io/fullsend-ai/fullsend-code:latest
policy: policies/qf-vertex.yaml
agent_input: config

host_files:
  - src: env/gcp-vertex.env
    dest: /tmp/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: env/qf-credentials.env
    dest: /tmp/workspace/.env.d/qf-credentials.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/workspace/.gcp-credentials.json

skills:
  - skills/project-resolver
  - skills/review-rules-extractor
  - skills/std-reviewer
  - skills/output-validator

validation_loop:
  script: scripts/validate-std-review.sh
  max_iterations: 3

timeout_minutes: 25
